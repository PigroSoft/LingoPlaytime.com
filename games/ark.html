<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noah's Ark</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:dark;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;--sky:#3aa0ff}
html,body{height:100%;margin:0}
body{background:#8fc3dd;color:#4a3213;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));gap:8px}
.top{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;padding:0 112px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s;color:#fff8ec;text-shadow:0 3px 0 #7a3d12,0 6px 12px #0005;background:none;box-shadow:none;border:0}
#bubble.bump{transform:scale(1.08)}
.tools{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:8px;z-index:5}
.tool{width:52px;height:52px;border-radius:50%;border:2px dashed #b8401f88;background:#f6ead0;box-shadow:0 3px 0 #0003,0 6px 10px #0003;color:#4a3213;font-size:26px;display:grid;place-items:center;cursor:pointer;padding:0}
.tool[aria-pressed="true"]{background:#ffd84a;border-color:#b8401f;box-shadow:0 0 22px #ffd84a99,0 3px 0 #0003}
.tool:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

/* the ark and the sea */
.sea{position:relative;flex:0 0 clamp(170px,38%,340px);border-radius:26px;overflow:hidden;background:#9cc9e0 url(../felt/ark-bg.webp) center bottom/cover no-repeat;container-type:size;box-shadow:0 6px 0 #0003,0 12px 18px #0003}
.sea .deck{position:absolute;left:8%;right:8%;top:4%;bottom:41%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:2px clamp(4px,1.4vw,14px);align-items:end;z-index:2}
.sea .deck::before{content:"";position:absolute;left:-3%;right:-3%;top:50%;height:5px;border-radius:3px;background:#b96a3c;box-shadow:0 2px 0 #8a4724;z-index:-1}
@media (max-width:560px){.top{padding:0 100px}.tool{width:44px;height:44px;font-size:22px}#bubble{font-size:20px}}
.slot{position:relative;display:flex;align-items:flex-end;justify-content:center;min-width:0;min-height:0;height:100%;overflow:visible}
.slot .pair{display:flex;width:100%;height:100%;justify-content:center;align-items:flex-end;min-height:0}
.slot .pi{display:block;flex:0 1 56%;margin:0 -3%;min-width:0;height:100%;max-height:100%;object-fit:contain;object-position:50% 100%;opacity:.14;filter:grayscale(1) brightness(2);transform:scale(.8);transition:opacity .3s,transform .4s cubic-bezier(.3,1.7,.5,1),filter .3s}
.slot.on .pi{opacity:1;filter:none;transform:none}
.slot.on .pi+.pi{transition-delay:.12s}
.hull{position:absolute;left:3%;right:3%;bottom:8cqh;height:38cqh;z-index:3;border:solid transparent;border-width:0 calc(38cqh*.401);border-image:url(../felt/ark-hull2.webp) 0 144 0 144 fill/0 calc(38cqh*.401)/0 round;filter:drop-shadow(0 6px 8px #0005)}
.hull i{position:absolute;top:54%;width:calc(38cqh*.2);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#f8e9c4,#e6cf9b);border:calc(38cqh*.035) solid #4a2c14;box-shadow:inset 0 2px 3px #0004}
.deck::before{display:none}
.sea.rock .hull,.sea.rock .deck{animation:rock 3s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg) translateY(-2px)}}
.waves{display:none}
.waves svg{width:200%;height:100%;display:block;animation:drift 9s linear infinite}
@keyframes drift{to{transform:translateX(-50%)}}
.rainbow{position:absolute;inset:4% 4% 20% 4%;z-index:1;opacity:0;transition:opacity 1s;pointer-events:none}
.rainbow img{width:100%;height:100%;object-fit:contain;object-position:50% 100%}
.sea.done .rainbow{opacity:1}
#rain{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;display:none}
.sea.wet::after{content:"";position:absolute;inset:0;background:#3a4f78;mix-blend-mode:multiply;opacity:.65;z-index:4;pointer-events:none}
.sun{display:none}

/* the animals to tap */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:clamp(8px,1.8vw,18px);container-type:size}
@media (max-aspect-ratio:1/1){.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}}
.card{position:relative;display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;min-height:0;border:2px dashed #b8401f88;border-radius:18px;background:#f6ead0;box-shadow:0 4px 0 #0003,0 8px 14px #0003;padding:6px 4px 8px;cursor:pointer;color:#4a3213;font:inherit}
.card:focus-visible{outline:5px solid var(--sky);outline-offset:3px}
.card .art{position:relative;width:100%;height:100%;min-height:0}
.card .art .pi{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 3px #0003)}
.card.pop .art .pi{animation:hop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{0%{transform:scale(1)}25%{transform:translateY(-14%) scale(1.14) rotate(-5deg)}55%{transform:scale(.96)}100%{transform:scale(1)}}
.card .nm{font-family:var(--display);font-weight:600;font-size:clamp(14px,2.4vw,24px);line-height:1.1;text-align:center;min-height:1.1em;padding-top:2px}
.badge{position:absolute;top:-8px;right:-6px;min-width:34px;height:34px;border-radius:50%;background:#c8402f;color:#fff8ec;font:700 16px var(--display);display:grid;place-items:center;border:2px dashed #fff8ec;box-shadow:0 2px 0 #0004,0 4px 8px #0004}
.card.aboard{background:#e0efc4;border-color:#5f8f3a}
.card.aboard .badge{background:#5f8f3a;color:#fff}
.flyer{position:fixed;left:0;top:0;z-index:20;pointer-events:none;filter:drop-shadow(0 6px 8px #0006)}
.flyer .pi{width:100%;height:100%;display:block;object-fit:contain}
.k-eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.sea.rock .hull,.sea.rock .deck,.card.pop .art .pi,.k-eyes{animation:none}.slot .pi{transition:none}}
</style>
</head>
<body>
<script>window.LP_GAME="ark"</script><script src="voice.js"></script><script src="learn.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="sounds.js"></script><script src="look.js"></script>
<div class="app" id="app">
  <div class="top"><div id="bubble" class="k-bubble" aria-live="polite"></div>
  <div class="tools">
    <button type="button" class="tool" id="rainBtn" aria-pressed="false" aria-label="Rain" data-tap>🌧️</button>
    <button type="button" class="tool" id="musicBtn" aria-pressed="false" aria-label="Music" data-tap>🎵</button>
  </div>
  </div>
  <div class="sea" id="sea">
    <div class="sun"></div>
    <div class="rainbow" aria-hidden="true"><img src="../felt/ark-rainbow.webp" alt=""></div>
    <div class="deck" id="deck"></div>
    <div class="hull" aria-hidden="true"><i style="left:21%"></i><i style="left:35.5%"></i><i style="left:50%"></i><i style="left:64.5%"></i><i style="left:79%"></i></div>
    <div class="waves" aria-hidden="true"><svg viewBox="0 0 800 60" preserveAspectRatio="none"><path d="M0 22q50-22 100 0t100 0 100 0 100 0 100 0 100 0 100 0 100 0V60H0Z" fill="#3d8fd6" opacity=".9"/><path d="M0 34q50-16 100 0t100 0 100 0 100 0 100 0 100 0 100 0 100 0V60H0Z" fill="#2573c2"/></svg></div>
    <canvas id="rain"></canvas>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
/* Every word and line this game can say. tools/phrases.js reads DATA to record them. */
const DATA={
 words:[
  {id:"unicorn",art:"unicorn",snd:"unicorn",en:"the unicorn",nl:"de eenhoorn",pl:"jednorożec",sv:"enhörningen",el:"ο μονόκερος",zh:"独角兽",ar:"حصان وحيد القرن",ja:"ユニコーン",ko:"유니콘",ru:"единорог",tr:"tek boynuzlu at",hi:"यूनिकॉर्न",de:"das Einhorn",es:"el unicornio",fr:"la licorne",it:"il liocorno",pt:"o unicórnio"},
  {id:"cat",s:{en:"Meow!",nl:"Miauw!",pl:"Miau!",sv:"Mjau!",el:"Νιάου!",zh:"喵！",ar:"مياو!",ja:"ニャー！",ko:"야옹!",ru:"Мяу!",tr:"Miyav!",hi:"म्याऊँ!",de:"Miau!",es:"¡Miau!",fr:"Miaou !",it:"Miao!",pt:"Miau!"},art:"cat",snd:"cat",en:"the cat",nl:"de kat",pl:"kot",sv:"katten",el:"η γάτα",zh:"猫",ar:"القطة",ja:"ねこ",ko:"고양이",ru:"кошка",tr:"kedi",hi:"बिल्ली",de:"die Katze",es:"el gato",fr:"le chat",it:"il gatto",pt:"o gato"},
  {id:"mouse",s:{en:"Squeak!",nl:"Piep!",pl:"Pi pi!",sv:"Pip pip!",el:"Ιι ιι!",zh:"吱吱！",ar:"صيصي!",ja:"チュー！",ko:"찍찍!",ru:"Пи-пи!",tr:"Çik çik!",hi:"चीं चीं!",de:"Piep piep!",es:"¡Ii ii!",fr:"Couic !",it:"Squit!",pt:"Quic quic!"},art:"mouse",snd:"mouse",en:"the mouse",nl:"de muis",pl:"mysz",sv:"musen",el:"το ποντίκι",zh:"老鼠",ar:"الفأرة",ja:"ねずみ",ko:"쥐",ru:"мышь",tr:"fare",hi:"चूहा",de:"die Maus",es:"el ratón",fr:"la souris",it:"il topo",pt:"o rato"},
  {id:"elephant",s:{en:"Toot toot!",nl:"Toeter toeter!",pl:"Tru tu tu!",sv:"Tut tut!",el:"Τουτ τουτ!",zh:"呜呜！",ar:"بوووق!",ja:"パオーン！",ko:"뿌우!",ru:"Ту-ту!",tr:"Tuu tuu!",hi:"पों पों!",de:"Töröö!",es:"¡Prrr!",fr:"Pouet !",it:"Prrr!",pt:"Prruu!"},art:"elephant",snd:"elephant",en:"the elephant",nl:"de olifant",pl:"słoń",sv:"elefanten",el:"ο ελέφαντας",zh:"大象",ar:"الفيل",ja:"ぞう",ko:"코끼리",ru:"слон",tr:"fil",hi:"हाथी",de:"der Elefant",es:"el elefante",fr:"l'éléphant",it:"l'elefante",pt:"o elefante"},
  {id:"crocodile",s:{en:"Snap!",nl:"Hap!",pl:"Chap!",sv:"Snap!",el:"Χαπ!",zh:"咔嚓！",ar:"طَق!",ja:"ガブッ！",ko:"덥석!",ru:"Щёлк!",tr:"Çat!",hi:"चट!",de:"Schnapp!",es:"¡Ñam!",fr:"Clac !",it:"Boh!",pt:"Nhac!"},art:"crocodile",snd:"croc",en:"the crocodile",nl:"de krokodil",pl:"krokodyl",sv:"krokodilen",el:"ο κροκόδειλος",zh:"鳄鱼",ar:"التمساح",ja:"ワニ",ko:"악어",ru:"крокодил",tr:"timsah",hi:"मगरमच्छ",de:"das Krokodil",es:"el cocodrilo",fr:"le crocodile",it:"il coccodrillo",pt:"o crocodilo"},
  {id:"penguin",s:{en:"Honk honk!",nl:"Kwa kwa!",pl:"Kwa kwa!",sv:"Kvack kvack!",el:"Κουάκ κουάκ!",zh:"嘎嘎！",ar:"بط بط!",ja:"ガーガー！",ko:"꽥꽥!",ru:"Кря-кря!",tr:"Vak vak!",hi:"क्वैक क्वैक!",de:"Quak quak!",es:"¡Cuac cuac!",fr:"Coin coin !",it:"Qua qua!",pt:"Quá quá!"},art:"penguin",snd:"penguin",en:"the penguin",nl:"de pinguïn",pl:"pingwin",sv:"pingvinen",el:"ο πιγκουίνος",zh:"企鹅",ar:"البطريق",ja:"ペンギン",ko:"펭귄",ru:"пингвин",tr:"penguen",hi:"पेंगुइन",de:"der Pinguin",es:"el pingüino",fr:"le pingouin",it:"il pinguino",pt:"o pinguim"},
  {id:"snake",s:{en:"Sss!",nl:"Sss!",pl:"Sss!",sv:"Sss!",el:"Σσσ!",zh:"嘶嘶！",ar:"سسس!",ja:"シャー！",ko:"쉬익!",ru:"Ш-ш-ш!",tr:"Sss!",hi:"सस्स!",de:"Sss!",es:"¡Sss!",fr:"Sss !",it:"Sss!",pt:"Sss!"},art:"snake",snd:"snake",en:"the snake",nl:"de slang",pl:"wąż",sv:"ormen",el:"το φίδι",zh:"蛇",ar:"الثعبان",ja:"へび",ko:"뱀",ru:"змея",tr:"yılan",hi:"साँप",de:"die Schlange",es:"la serpiente",fr:"le serpent",it:"il serpente",pt:"a cobra"},
  {id:"lion",s:{en:"Roar!",nl:"Brul!",pl:"Ryk!",sv:"Ryyt!",el:"Γκρρρ!",zh:"吼！",ar:"زئير!",ja:"ガオー！",ko:"어흥!",ru:"Р-р-р!",tr:"Kükre!",hi:"दहाड़!",de:"Rrroar!",es:"¡Grrr!",fr:"Grrr !",it:"Roar!",pt:"Rugido!"},art:"lion",snd:"lion",en:"the lion",nl:"de leeuw",pl:"lew",sv:"lejonet",el:"το λιοντάρι",zh:"狮子",ar:"الأسد",ja:"ライオン",ko:"사자",ru:"лев",tr:"aslan",hi:"शेर",de:"der Löwe",es:"el león",fr:"le lion",it:"il leone",pt:"o leão"},
  {id:"turtle",art:"turtle",snd:"turtle",en:"the turtle",nl:"de schildpad",pl:"żółw",sv:"sköldpaddan",el:"η χελώνα",zh:"乌龟",ar:"السلحفاة",ja:"かめ",ko:"거북이",ru:"черепаха",tr:"kaplumbağa",hi:"कछुआ",de:"die Schildkröte",es:"la tortuga",fr:"la tortue",it:"la tartaruga",pt:"a tartaruga"},
  {id:"parrot",s:{en:"Squawk!",nl:"Krijs!",pl:"Kra kra!",sv:"Kra kra!",el:"Κρα κρα!",zh:"嘎！",ar:"كاك كاك!",ja:"ギャー！",ko:"꽥!",ru:"Кар-кар!",tr:"Vak vak!",hi:"टें टें!",de:"Krah krah!",es:"¡Cra cra!",fr:"Coco !",it:"Cra cra!",pt:"Crá crá!"},art:"parrot",snd:"parrot",en:"the parrot",nl:"de papegaai",pl:"papuga",sv:"papegojan",el:"ο παπαγάλος",zh:"鹦鹉",ar:"الببغاء",ja:"オウム",ko:"앵무새",ru:"попугай",tr:"papağan",hi:"तोता",de:"der Papagei",es:"el loro",fr:"le perroquet",it:"il pappagallo",pt:"o papagaio"}
 ],
 lines:{
  en:{title:"Noah's Ark",one:"one",two:"two",all:"All aboard!",rain:"rain",rainbow:"the rainbow"},nl:{title:"De ark van Noach",one:"één",two:"twee",all:"Allemaal instappen!",rain:"regen",rainbow:"de regenboog"},pl:{title:"Arka Noego",one:"jeden",two:"dwa",all:"Wszyscy na pokład!",rain:"deszcz",rainbow:"tęcza"},sv:{title:"Noaks ark",one:"ett",two:"två",all:"Alla ombord!",rain:"regn",rainbow:"regnbågen"},el:{title:"Η Κιβωτός του Νώε",one:"ένα",two:"δύο",all:"Όλοι μέσα!",rain:"βροχή",rainbow:"το ουράνιο τόξο"},zh:{title:"诺亚方舟",one:"一",two:"二",all:"大家上船！",rain:"雨",rainbow:"彩虹"},ar:{title:"سفينة نوح",one:"واحد",two:"اثنان",all:"الجميع على متن السفينة!",rain:"مطر",rainbow:"قوس قزح"},ja:{title:"ノアのはこぶね",one:"いち",two:"に",all:"みんなのって！",rain:"あめ",rainbow:"にじ"},ko:{title:"노아의 방주",one:"하나",two:"둘",all:"모두 타세요!",rain:"비",rainbow:"무지개"},ru:{title:"Ноев ковчег",one:"один",two:"два",all:"Все на борт!",rain:"дождь",rainbow:"радуга"},tr:{title:"Nuh'un Gemisi",one:"bir",two:"iki",all:"Herkes gemiye!",rain:"yağmur",rainbow:"gökkuşağı"},hi:{title:"नूह की नाव",one:"एक",two:"दो",all:"सब सवार हो जाओ!",rain:"बारिश",rainbow:"इंद्रधनुष"},
  de:{title:"Die Arche Noah",one:"eins",two:"zwei",all:"Alle an Bord!",rain:"Regen",rainbow:"der Regenbogen"},
  es:{title:"El arca de Noé",one:"uno",two:"dos",all:"¡Todos a bordo!",rain:"lluvia",rainbow:"el arcoíris"},
  fr:{title:"L'arche de Noé",one:"un",two:"deux",all:"Tout le monde à bord !",rain:"la pluie",rainbow:"l'arc-en-ciel"},
  it:{title:"L'Arca di Noè",one:"uno",two:"due",all:"Tutti a bordo!",rain:"la pioggia",rainbow:"l'arcobaleno",boh:"Boh!"},
  pt:{title:"A arca de Noé",one:"um",two:"dois",all:"Todos a bordo!",rain:"a chuva",rainbow:"o arco-íris"}
 }
};
const PICS={unicorn:"fw-unicorn",cat:"sky-cat",mouse:"peek-mouse",elephant:"sky-elephant",crocodile:"ark-croc",penguin:"fw-penguin",snake:"ark-snake",lion:"ark-lion",turtle:"sky-turtle",parrot:"ark-parrot"};
const pic=a=>`<img class="pi" src="../felt/${PICS[a]}.webp" alt="" draggable="false">`;
const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const word=id=>W[id][LP.lang]||W[id].en;
const snd=id=>(W[id].s&&(W[id].s[LP.lang]||W[id].s.en))||"";
function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}

const aboard=new Set();let finishing=false,raining=false,musicOn=false;

function build(){
 $("grid").innerHTML=DATA.words.map(w=>`<button type="button" class="card" data-id="${w.id}" data-tap aria-label="${word(w.id)}"><span class="badge">×2</span><span class="art">${pic(w.art)}</span><span class="nm">${word(w.id)}</span></button>`).join("");
 $("deck").innerHTML=DATA.words.map(w=>`<div class="slot" data-slot="${w.id}"><div class="pair">${pic(w.art)}${pic(w.art)}</div></div>`).join("");
 aboard.forEach(id=>{document.querySelector(`[data-slot="${id}"]`).classList.add("on");document.querySelector(`[data-id="${id}"]`).classList.add("aboard")});
}
function relabel(){document.querySelectorAll(".card").forEach(c=>{const t=word(c.dataset.id);c.setAttribute("aria-label",t);c.querySelector(".nm").textContent=t})}

/* real recordings win (LP.sample looks in sounds.js); otherwise a simple synthesized call */
function animalSound(id){
 const w=W[id];if(w.snd==="croc"&&L().boh){LP.say(L().boh);return}
 if(LP.sample(w.snd,1.6))return;
 const T=LP.tone;
 switch(w.snd){
  case"unicorn":[523,659,784,1047,1319].forEach((f,i)=>T(f,.4,"sine",.11,i*.08));break;
  case"cat":T(620,.5,"triangle",.18,0,880);T(880,.4,"triangle",.14,.3,520);break;
  case"mouse":T(2200,.07,"sine",.1,0,2800);T(2600,.07,"sine",.09,.1,2000);T(2400,.07,"sine",.09,.2,2900);break;
  case"elephant":T(150,.7,"sawtooth",.16,0,350);T(153,.7,"square",.08,0,355);break;
  case"croc":T(80,.4,"sawtooth",.24,0,60);T(200,.15,"square",.2,.05,40);break;
  case"penguin":T(600,.18,"square",.12,0,450);T(600,.18,"square",.12,.2,450);break;
  case"snake":LP.noise(.5,.16,"highpass",4000,1,0,8000);break;
  case"lion":T(100,.9,"sawtooth",.2,0,55);T(105,.9,"sawtooth",.15,0,58);T(50,.9,"square",.1,0,30);break;
  case"turtle":T(120,.9,"sine",.14,0,110);T(240,.9,"sine",.04);break;
  case"parrot":[1200,1600,1400,1800,1500,2000].forEach((f,i)=>T(f,.08,"triangle",.14,i*.06,f*1.1));break;
 }
}

/* two of the animal hop from their card up to the deck */
function fly(card,id){
 const slot=document.querySelector(`[data-slot="${id}"]`),svgs=[...slot.querySelectorAll(".pi")];
 const from=card.querySelector(".art .pi").getBoundingClientRect();
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 let left=svgs.length;
 svgs.forEach((dst,i)=>{
  const to=dst.getBoundingClientRect(),size=Math.max(28,Math.min(to.width,to.height)*1.1),f=document.createElement("div");
  f.className="flyer";f.style.width=f.style.height=size+"px";f.innerHTML=card.querySelector(".art .pi").outerHTML;document.body.appendChild(f);
  const x0=from.left+from.width/2-size/2,y0=from.top+from.height/2-size/2,x1=to.left+to.width/2-size/2,y1=to.top+to.height/2-size/2;
  const dur=reduce?1:700+i*160,mid=Math.min(y0,y1)-60;
  const a=f.animate([{transform:`translate(${x0}px,${y0}px) scale(${from.height/size})`},{transform:`translate(${(x0+x1)/2}px,${mid}px) scale(1.1)`,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(1)`}],{duration:dur,easing:"cubic-bezier(.4,0,.3,1)",fill:"forwards"});
  a.onfinish=()=>{f.remove();if(--left===0){slot.classList.add("on");LP.sfx.pop()}};
 });
}

function tap(id,card){
 if(finishing)return;
 card=card||document.querySelector(`[data-id="${id}"]`);
 const first=!aboard.has(id);
 card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");
 animalSound(id);
 const r=card.getBoundingClientRect();LP.burst(r.left+r.width/2,r.top+r.height/2,first?16:8);
 bubble(word(id)+(snd(id)?"  "+snd(id):""));LP.say(word(id),id==="crocodile"&&!!L().boh);LPLearn.heard(id,LP.lang);
 if(snd(id)&&!(id==="crocodile"&&L().boh))setTimeout(()=>LP.say(snd(id),true),1500);
 if(first){
  aboard.add(id);card.classList.add("aboard");fly(card,id);
  LP.say(L().two,true);
  if(aboard.size===DATA.words.length)setTimeout(allAboard,1800);
 }
}
function allAboard(){
 finishing=true;stopRain();
 const sea=$("sea");sea.classList.add("done","rock");
 LP.celebrate();bubble(L().all);LP.say(L().all);LP.say(L().rainbow,true);
 const r=sea.getBoundingClientRect();[.25,.5,.75].forEach((p,i)=>setTimeout(()=>LP.burst(r.left+r.width*p,r.top+r.height*.4,22),i*400));
 setTimeout(()=>{aboard.clear();finishing=false;sea.classList.remove("done");document.querySelectorAll(".slot.on").forEach(s=>s.classList.remove("on"));document.querySelectorAll(".card.aboard").forEach(c=>c.classList.remove("aboard"));bubble(L().title)},7500);
}

/* rain */
const rc=$("rain"),rg=rc.getContext("2d");let drops=[],rafId=0,rainTimer=0;
function sizeRain(){const r=$("sea").getBoundingClientRect();rc.width=r.width;rc.height=r.height}
function frame(){
 rg.clearRect(0,0,rc.width,rc.height);
 for(let i=0;i<3;i++)drops.push({x:Math.random()*rc.width,y:-10,v:6+Math.random()*7,l:12+Math.random()*16,a:.3+Math.random()*.4});
 drops=drops.filter(d=>(d.y+=d.v)<rc.height+20);
 rg.lineCap="round";rg.lineWidth=2;
 drops.forEach(d=>{rg.beginPath();rg.moveTo(d.x,d.y);rg.lineTo(d.x+1,d.y+d.l);rg.strokeStyle=`rgba(210,230,255,${d.a})`;rg.stroke()});
 rafId=requestAnimationFrame(frame);
}
function rainSound(){if(!raining)return;LP.noise(2,.05,"bandpass",3000,.5);rainTimer=setTimeout(rainSound,1900)}
function startRain(){
 raining=true;$("rainBtn").setAttribute("aria-pressed","true");$("sea").classList.add("wet");rc.style.display="block";sizeRain();
 if(!matchMedia("(prefers-reduced-motion: reduce)").matches)frame();
 rainSound();bubble(L().rain);LP.say(L().rain);
}
function stopRain(){
 raining=false;$("rainBtn").setAttribute("aria-pressed","false");$("sea").classList.remove("wet");rc.style.display="none";cancelAnimationFrame(rafId);clearTimeout(rainTimer);drops=[];
}
$("rainBtn").addEventListener("click",e=>{e.stopPropagation();raining?stopRain():startRain()});
addEventListener("resize",()=>{if(raining)sizeRain()});

/* a gentle original tune */
const TUNE=[[262,.25],[330,.25],[392,.25],[523,.5],[494,.25],[440,.25],[392,.5],[0,.25],[349,.25],[440,.25],[392,.25],[349,.25],[330,.5],[294,.25],[262,.5],[0,.5]];
let tuneTimer=0;
function playTune(){
 if(!musicOn)return;let t=0;
 TUNE.forEach(([f,d])=>{if(f)LP.tone(f,d+.05,"triangle",.1,t);t+=d});
 tuneTimer=setTimeout(playTune,t*1000+100);
}
$("musicBtn").addEventListener("click",e=>{
 e.stopPropagation();musicOn=!musicOn;$("musicBtn").setAttribute("aria-pressed",String(musicOn));
 clearTimeout(tuneTimer);if(musicOn)playTune();
});

LP.init({langs:ALLLANGS,
 onLang:()=>{document.title=L().title;relabel();bubble(L().title)},
 onAge:()=>{}});
document.title=L().title;

document.querySelector("body").insertAdjacentHTML("afterbegin",'<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>');
build();bubble(L().title);$("sea").classList.add("rock");
LP.start(L().title,()=>{LP.say(L().title)});
let lastPt=null,lastPtAt=0;
LP.mash((e)=>{
 if(e.target.closest&&e.target.closest(".tool"))return;
 let el=e.target.closest&&e.target.closest("[data-id]");
 let id=el?el.dataset.id:null;
 const again=id&&id===lastPt&&Date.now()-lastPtAt<8000;lastPt=id;lastPtAt=Date.now();
 if(!id&&LP.age>=2){const c=LP.next("arkhint",DATA.words.filter(w=>!aboard.has(w.id))).id,cd=document.querySelector(`[data-id="${c}"]`);if(cd){cd.classList.remove("pop");void cd.offsetWidth;cd.classList.add("pop")}return} // big kids aim at an animal
 if(!id||again){ // a tap anywhere, or any key, picks an animal that isn't aboard yet
  const left=DATA.words.filter(w=>!aboard.has(w.id));
  const pool0=left.length?left:DATA.words,pool=pool0.filter(w=>w.id!==lastPt);id=LP.next("ark",pool.length?pool:pool0).id;el=null;
 }
 tap(id,el);
});
</script>
