<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street sounds</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:light;--ink:#18264A;--paper:#FFFDF8;--sky:#3B8BD4;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#2f6fe8;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#clouds{position:fixed;inset:0 0 40% 0;overflow:hidden;pointer-events:none}
.cloud{position:absolute;filter:drop-shadow(0 8px 10px #12345a1f)}
.cloud .puff{position:absolute;background:radial-gradient(circle at 35% 30%,#ffffff,#eef6fc 75%);border-radius:50%}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;min-height:60px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s}
#bubble.bump{transform:scale(1.08)}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end}
svg#street{width:100%;height:100%;overflow:visible}
/* layer 1: the miniature town fills the screen, softly out of focus */
.app{background:#7fb6ea url(../felt/street-bg.webp) center 72%/cover no-repeat}
.thing{cursor:pointer}
.thing .hit{fill:#0000}
.thing:focus{outline:none}.thing:focus-visible .hit{stroke:#F6C033;stroke-width:5;fill:#F6C03322}
.thing.go>.art{animation:drive .9s ease-in-out}
.thing.hop>.art{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.art{transform-box:fill-box;transform-origin:center bottom}
@keyframes drive{0%,100%{transform:none}15%{transform:translateY(-4px)}50%{transform:translateX(40px)}}
@keyframes hop{40%{transform:translateY(-22px) scale(1.06)}}
.thing.glow .hit{stroke:#F6C033;stroke-width:6;fill:#F6C03333}
.blue{animation:flash .3s steps(2) 6}
@keyframes flash{50%{fill:#9fd3ff}}
@media (prefers-reduced-motion:reduce){.thing.go>.art,.thing.hop>.art,.blue{animation:none}}
</style>
</head>
<body>
<script>window.LP_GAME="street"</script><script src="voice.js"></script><script src="learn.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="look.js"></script><script src="sounds.js"></script>

    </svg>

<script>

const DATA={

  {id:"bike",en:{w:"the bike",s:"Ring ring!"},nl:{w:"de fiets",s:"Ring ring!"},pl:{w:"rower",s:"Dzyń dzyń!"},sv:{w:"cykeln",s:"Pling pling!"},el:{w:"το ποδήλατο",s:"Ντριν ντριν!"},zh:{w:"自行车",s:"叮铃铃！"},ar:{w:"الدراجة",s:"رن رن!"},ja:{w:"じてんしゃ",s:"チリンチリン！"},ko:{w:"자전거",s:"따르릉!"},ru:{w:"велосипед",s:"Дзинь-дзинь!"},tr:{w:"bisiklet",s:"Ring ring!"},hi:{w:"साइकिल",s:"ट्रिन ट्रिन!"},de:{w:"das Fahrrad",s:"Kling kling!"},es:{w:"la bicicleta",s:"¡Ring ring!"},fr:{w:"le vélo",s:"Dring dring !"},it:{w:"la bicicletta",s:"Drin drin!"},pt:{w:"a bicicleta",s:"Trim trim!"}},
  {id:"car",en:{w:"the car",s:"Beep beep!"},nl:{w:"de auto",s:"Toet toet!"},pl:{w:"samochód",s:"Bip bip!"},sv:{w:"bilen",s:"Tut tut!"},el:{w:"το αυτοκίνητο",s:"Μπιπ μπιπ!"},zh:{w:"汽车",s:"滴滴！"},ar:{w:"السيارة",s:"بيب بيب!"},ja:{w:"くるま",s:"ピーピー！"},ko:{w:"자동차",s:"빵빵!"},ru:{w:"машина",s:"Би-бип!"},tr:{w:"araba",s:"Bip bip!"},hi:{w:"गाड़ी",s:"पीं पीं!"},de:{w:"das Auto",s:"Tut tut!"},es:{w:"el coche",s:"¡Pi pi!"},fr:{w:"la voiture",s:"Pouet pouet !"},it:{w:"la macchina",s:"Bip bip!"},pt:{w:"o carro",s:"Pi pi!"}},
  {id:"dog",en:{w:"the dog",s:"Woof woof!"},nl:{w:"de hond",s:"Woef woef!"},pl:{w:"pies",s:"Hau hau!"},sv:{w:"hunden",s:"Voff voff!"},el:{w:"ο σκύλος",s:"Γάβ γάβ!"},zh:{w:"狗",s:"汪汪！"},ar:{w:"الكلب",s:"هاو هاو!"},ja:{w:"いぬ",s:"ワンワン！"},ko:{w:"강아지",s:"멍멍!"},ru:{w:"собака",s:"Гав-гав!"},tr:{w:"köpek",s:"Hav hav!"},hi:{w:"कुत्ता",s:"भौं भौं!"},de:{w:"der Hund",s:"Wau wau!"},es:{w:"el perro",s:"¡Guau guau!"},fr:{w:"le chien",s:"Ouaf ouaf !"},it:{w:"il cane",s:"Bau bau!"},pt:{w:"o cão",s:"Ão ão!"}},
  {id:"plane",en:{w:"the plane",s:"Whoosh!"},nl:{w:"het vliegtuig",s:"Zoef!"},pl:{w:"samolot",s:"Wrrr!"},sv:{w:"flygplanet",s:"Svisch!"},el:{w:"το αεροπλάνο",s:"Βούουουμ!"},zh:{w:"飞机",s:"嗖！"},ar:{w:"الطائرة",s:"شششش!"},ja:{w:"ひこうき",s:"ヒューン！"},ko:{w:"비행기",s:"쌩!"},ru:{w:"самолёт",s:"Ж-ж-ж!"},tr:{w:"uçak",s:"Vızzz!"},hi:{w:"हवाई जहाज़",s:"सूं!"},de:{w:"das Flugzeug",s:"Wuusch!"},es:{w:"el avión",s:"¡Fiuuu!"},fr:{w:"l'avion",s:"Vroum !"},it:{w:"l'aereo",s:"Fiuuu!"},pt:{w:"o avião",s:"Vuuum!"}},
  {id:"heli",en:{w:"the helicopter",s:"Whop whop!"},nl:{w:"de helikopter",s:"Wap wap!"},pl:{w:"helikopter",s:"Łup łup!"},sv:{w:"helikoptern",s:"Vopp vopp!"},el:{w:"το ελικόπτερο",s:"Ουπ ουπ!"},zh:{w:"直升机",s:"突突！"},ar:{w:"الهليكوبتر",s:"ثب ثب!"},ja:{w:"ヘリコプター",s:"バラバラ！"},ko:{w:"헬리콥터",s:"두두두!"},ru:{w:"вертолёт",s:"Тр-р-р!"},tr:{w:"helikopter",s:"Pat pat!"},hi:{w:"हेलीकॉप्टर",s:"धप धप!"},de:{w:"der Hubschrauber",s:"Wumm wumm!"},es:{w:"el helicóptero",s:"¡Chop chop!"},fr:{w:"l'hélicoptère",s:"Flap flap !"},it:{w:"l'elicottero",s:"Whop whop!"},pt:{w:"o helicóptero",s:"Pá pá pá!"}},
  {id:"bird",en:{w:"the bird",s:"Tweet tweet!"},nl:{w:"de vogel",s:"Tjilp tjilp!"},pl:{w:"ptak",s:"Ćwir ćwir!"},sv:{w:"fågeln",s:"Pip pip!"},el:{w:"το πουλί",s:"Τσίου τσίου!"},zh:{w:"小鸟",s:"叽叽！"},ar:{w:"الطائر",s:"زقزق!"},ja:{w:"とり",s:"チュンチュン！"},ko:{w:"새",s:"짹짹!"},ru:{w:"птица",s:"Чик-чирик!"},tr:{w:"kuş",s:"Cik cik!"},hi:{w:"चिड़िया",s:"चीं चीं!"},de:{w:"der Vogel",s:"Piep piep!"},es:{w:"el pájaro",s:"¡Pío pío!"},fr:{w:"l'oiseau",s:"Cui cui !"},it:{w:"l'uccellino",s:"Cip cip!"},pt:{w:"o pássaro",s:"Piu piu!"}}
 ],
 lines:{
  en:{title:"Street sounds",where:"Where is {w}?",found:"There's {w}!"},nl:{title:"Straatgeluiden",where:"Waar is {w}?",found:"Daar is {w}!"},pl:{title:"Odgłosy ulicy",where:"Gdzie jest {w}?",found:"Oto {w}!"},sv:{title:"Gatuljud",where:"Var är {w}?",found:"Där är {w}!"},el:{title:"Ήχοι του δρόμου",where:"Πού είναι {w};",found:"Να {w}!"},zh:{title:"街道的声音",where:"{w}在哪里？",found:"{w}在这里！"},ar:{title:"أصوات الشارع",where:"أين {w}؟",found:"هذا {w}!"},ja:{title:"まちの おと",where:"{w}はどこ？",found:"{w}だ！"},ko:{title:"거리의 소리",where:"{w} 어디 있어?",found:"{w} 여기 있다!"},ru:{title:"Звуки улицы",where:"Где {w}?",found:"Вот {w}!"},tr:{title:"Sokak sesleri",where:"{w} nerede?",found:"İşte {w}!"},hi:{title:"सड़क की आवाज़ें",where:"{w} कहाँ है?",found:"यह रहा {w}!"},
  de:{title:"Auf der Straße",where:"Wo ist {w}?",found:"Da ist {w}!"},
  es:{title:"En la calle",where:"¿Dónde está {w}?",found:"¡Aquí está {w}!"},
  fr:{title:"Dans la rue",where:"Où est {w} ?",found:"Voilà {w} !"},
  it:{title:"Per strada",where:"Dov'è {w}?",found:"Ecco {w}!"},
  pt:{title:"Na rua",where:"Onde está {w}?",found:"Aqui está {w}!"}
 }
};
const T=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const w=id=>T[id][LP.lang]||T[id].en;
let want=null,misses=0,lastTap=0,last=null,lastId=null,lastPoint=null,playedAt=0;


/* real CC0 recordings (sounds.js); the synthesized versions below are a fallback */
const SYN={
 bus(){LP.tone(55,1.1,"sawtooth",.12,0,48);LP.tone(82,1.1,"sawtooth",.06);LP.noise(.5,.12,"highpass",3000,1,1)},
 fire(){[0,1,2,3].forEach(i=>LP.tone(i%2?587:440,.42,"triangle",.14,i*.45))},
 police(){[0,1,2,3].forEach(i=>LP.tone(i%2?523:392,.42,"triangle",.14,i*.45))},
 tram(){[0,.4].forEach(t=>{LP.tone(1180,.9,"triangle",.14,t);LP.tone(2360,.5,"sine",.04,t)});LP.tone(60,1,"sawtooth",.06)},
 bike(){[0,.28].forEach(t=>{LP.tone(2900,.6,"sine",.1,t);LP.tone(4100,.4,"sine",.05,t);LP.tone(3500,.5,"triangle",.04,t)})},
 car(){[0,.3].forEach(t=>{LP.tone(350,.2,"square",.07,t);LP.tone(440,.2,"square",.07,t)})},
 dog(){[0,.3].forEach(t=>{LP.noise(.12,.25,"bandpass",900,2,t);LP.tone(420,.14,"square",.12,t,200)})},
 plane(){LP.noise(1.8,.22,"bandpass",300,1.2,0,1800);LP.tone(110,1.6,"sawtooth",.05,0,260)},
 heli(){for(let i=0;i<12;i++)LP.noise(.08,.28,"lowpass",260,1,i*.1);LP.tone(75,1.3,"sawtooth",.05)},
 bird(){[0,.18,.36].forEach(t=>LP.tone(3000,.12,"sine",.08,t,4600))}
};

function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function label(){document.querySelectorAll("[data-thing]").forEach(g=>g.setAttribute("aria-label",w(g.dataset.thing).w))}
const fill=(tpl,id)=>tpl.replace("{w}",w(id).w);

const SND=new Proxy({},{get:(_,id)=>()=>{if(!LP.sample(id,2.4))SYN[id]()}});
function play(id){
 const now=Date.now();if(now-lastTap<150)return;lastTap=now;playedAt=now;lastId=id;
 const g=document.querySelector(`[data-thing="${id}"]`);
 const anim=["dog","bird","bike","heli"].includes(id)?"hop":"go";
 g.classList.remove("go","hop");void g.getBBox();g.classList.add(anim);
 g.querySelectorAll(".blue").forEach(b=>{b.classList.remove("blue");void b.getBBox();b.classList.add("blue")});
 document.querySelectorAll(".glow").forEach(x=>x.classList.remove("glow"));
 SND[id]();
 const r=g.getBoundingClientRect();
 if(want){
  if(id===want){LPLearn.asked(id,LP.lang,true);want=null;misses=0;LP.sfx.chime();LP.burst(r.left+r.width/2,r.top,20);const t=fill(L().found,id);bubble(t);setTimeout(()=>LP.say(t),900);setTimeout(ask,4000);return}
  LPLearn.asked(want,LP.lang,false);misses++;
 }
 bubble(w(id).w+"  "+w(id).s);LPLearn.heard(id,LP.lang);
 setTimeout(()=>{LP.say(w(id).w);LP.say(w(id).s,true)},({fire:2300,police:2300,bus:2000,plane:1900,heli:1900,bird:1900,dog:1800,tram:1500,bike:1200,car:1000})[id]||1000);
 if(want)setTimeout(()=>{if(want){bubble(fill(L().where,want));LP.say(fill(L().where,want))}},3600);
}
function ask(){
 if(LP.age<1&&LPLearn.summary(LP.lang).met<8){want=null;bubble(L().title);return}
 const ids=DATA.words.map(x=>x.id).filter(i=>i!==last);want=LPLearn.pick(ids,x=>x,1,LP.lang)[0];last=want;misses=0;
 const t=fill(L().where,want);bubble(t);LP.say(t);
}

LP.init({langs:ALLLANGS,onLang:()=>{label();document.title=L().title;bubble(want?fill(L().where,want):L().title)},onAge:()=>{want=null;bubble(L().title)}});
label();document.title=L().title;bubble(L().title);
LP.start(L().title,()=>setTimeout(ask,500));
LP.mash((e)=>{
 const g=e.target.closest&&e.target.closest("[data-thing]");
 const all=DATA.words.map(x=>x.id);
 const pointed=g?g.dataset.thing:null,again=pointed&&pointed===lastPoint&&Date.now()-playedAt<8000;lastPoint=pointed;
 if(g&&(want||!again)){play(g.dataset.thing);return} // pointing at a thing plays that thing
 if(want&&LP.age<2){play(want);return} // little ones: a stray tap finds the answer
 play(LP.next("street",all.filter(i=>i!==lastId))); // empty space, or the same thing again: on to the next sound
});
</script>
</body>
