<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street sounds</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:light;--ink:#18264A;--paper:#FFFDF8;--sky:#3B8BD4;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#2f6fe8;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;min-height:60px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s}
#bubble.bump{transform:scale(1.08)}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end}
svg#street{width:100%;height:100%;overflow:visible}
/* layer 1: the miniature town fills the screen, softly out of focus */
.app{background:#4f9be6 no-repeat}
svg#street.swap{animation:swap .6s steps(3,jump-none)}@keyframes swap{from{opacity:0;transform:translateY(24px)}}
.pick{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:1100px){.pick{top:max(72px,calc(env(safe-area-inset-top,0px) + 64px))}}
.pick button{border:0;background:#fffdf6;box-shadow:0 3px 8px #0006;outline:2px dashed #b8401f99;outline-offset:-5px;cursor:pointer;font-weight:700;font-size:17px;line-height:1;font-family:inherit;color:#2b3a42;display:flex;align-items:center;gap:8px}
.pick .cur{height:48px;padding:6px 14px 6px 8px;border-radius:24px;min-width:150px}
.pick .cur img{width:36px;height:36px;object-fit:contain;pointer-events:none}
.pick .cur .nm{flex:1;text-align:left;white-space:nowrap}
.pick .cur .car{font-size:13px;transition:transform .15s}
.pick.open .cur .car{transform:rotate(180deg)}
.pick .list{display:none;flex-direction:column;gap:5px;max-height:calc(100vh - 170px);overflow:auto;padding:4px}
.pick.open .list{display:flex}
.pick .list button{height:40px;flex:none;padding:5px 14px 5px 8px;border-radius:23px;width:100%;min-width:190px}
.pick .list button img{width:34px;height:34px;object-fit:contain;pointer-events:none}
.pick .list button.on{box-shadow:0 0 0 4px #F6C033,0 3px 8px #0006}
.top,.stage{position:relative;z-index:1}
.thing{cursor:pointer}
.thing .hit{fill:#0000}
.thing:focus{outline:none}.thing:focus-visible .hit{stroke:#F6C033;stroke-width:5;fill:#F6C03322}
.thing.go>.art{animation:drive 1s steps(3,jump-none)}
.thing.hop>.art{animation:hop .66s steps(2,jump-none)}
.art{transform-box:fill-box;transform-origin:center bottom}
@keyframes drive{0%,100%{transform:none}20%{transform:translateY(-4px) rotate(-1deg)}55%{transform:translateX(40px) rotate(.6deg)}80%{transform:translateX(14px)}}
/* stop motion: a tapped thing moves in a few held frames, like a hand-moved model */
@keyframes hop{40%{transform:translateY(-22px) scale(1.06)}}
.thing.glow .hit{stroke:#F6C033;stroke-width:6;fill:#F6C03333}
.blue{animation:flash .3s steps(2) 6}
@keyframes flash{50%{fill:#9fd3ff}}
@media (prefers-reduced-motion:reduce){.thing.go>.art,.thing.hop>.art,.blue}
</style>
</head>

  const Am=[220,261.6,329.6],Ee=[207.7,246.9,329.6];

   [1,2,4,5].forEach(k=>CH[m].forEach((f,i)=>pl(t+k*E+i*.01,f,.07,.1,1800)));

  const M=[440,523.3,659.3,523.3,440,523.3, 493.9,587.3,659.3,587.3,493.9,415.3, 440,523.3,659.3,880,659.3,523.3, 493.9,415.3,329.6,415.3,440,0];
  M.forEach((f,i)=>{if(f)mando(t0+i*E,f)});

 },
 /* the little Paris car's radio: an accordion musette waltz in D minor (3/4, four bars): detuned reeds sing the tune over an oom-pah-pah of bass and chords */

  const a=LP.ac();if(!a)return;

  const comp=a.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=5;out.connect(comp).connect(a.destination);
  const env=(g,t,v,at,d)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+at+d)};
  const reed=(t,f,len,v)=>{const lfo=a.createOscillator(),lg=a.createGain(),lp=a.createBiquadFilter(),g=a.createGain();lfo.frequency.value=6;lg.gain.value=v*.25;lfo.connect(lg).connect(g.gain);
   lp.type="lowpass";lp.frequency.value=2300;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.04);g.gain.setValueAtTime(v,t+len*.75);g.gain.exponentialRampToValueAtTime(.0001,t+len);
   [[f,"sawtooth"],[f*1.007,"square"],[f*.993,"sawtooth"]].forEach(([ff,ty])=>{const o=a.createOscillator();o.type=ty;o.frequency.value=ff;o.connect(lp);o.start(t);o.stop(t+len+.02)});
   lp.connect(g).connect(out);lfo.start(t);lfo.stop(t+len+.02)};
  const bass=(t,f)=>{const o=a.createOscillator(),lp=a.createBiquadFilter(),g=a.createGain();o.type="triangle";o.frequency.value=f;lp.type="lowpass";lp.frequency.value=600;env(g,t,.42,.008,.32);o.connect(lp).connect(g).connect(out);o.start(t);o.stop(t+.38)};
  const Dm=[174.6,220,293.7],A7=[277.2,329.6,392],Gm=[233.1,293.7,392];
  const CH=[Dm,A7,Gm,A7],BS=[146.8,110,98,110];
  for(let m=0;m<4;m++){const t=t0+m*3*B;bass(t,BS[m]);[1,2].forEach(k=>CH[m].forEach(f=>reed(t+k*B,f,B*.7,.018)))}
  const M=[[349.2,B],[440,B],[587.3,B],[659.3,B],[587.3,B],[554.4,B],[466.2,B],[440,B],[392,B],[440,3*B]];

 },

function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function label(){document.querySelectorAll("[data-thing]").forEach(g=>{const i=g.dataset.thing;g.setAttribute("aria-label",i.startsWith("hello_")?HELLO[i.slice(6)]:w(i).w)})}
const fill=(tpl,id)=>tpl.replace("{w}",w(id).w);

let paris2cv=false;
const SND=new Proxy({},{get:(_,id)=>()=>{const k=(id==='truck'&&sceneId==='austin')?'countrycar':(id==='tuktuk'&&sceneId==='sicily')?'italiancar':(id==='car'&&sceneId==='paris'&&paris2cv)?'frenchcar':id;if(k==='darkcar'||k==='countrycar'||k==='italiancar'||k==='frenchcar'||!LP.sample(id==='rat'?'mouse':id,id==='subway'?3.4:2.4))SYN[k]()}});
function play(id,el){
 const now=Date.now();if(now-lastTap<150)return;lastTap=now;
 if(id.startsWith("hello_")){ // a person: the greeting is in the place's own language, whatever the child is learning
  const g=el||document.querySelector(`[data-thing="${id}"]`);g.classList.remove("go","hop");void g.getBBox();g.classList.add("hop");
  if(!LP.sample(id,2.6))LP.say(HELLO[id.slice(6)],true);bubble(HELLO[id.slice(6)]);return}
 playedAt=now;lastId=id;
 const g=el||document.querySelector(`[data-thing="${id}"]`);plays++;
 const anim=["dog","bird","bike","heli","cow","sheep","pig","duck","chicken","rat","parrot","scooter","cargobike","horse","escooter","skateboard","balloon"].includes(id)?"hop":"go";
 g.classList.remove("go","hop");void g.getBBox();g.classList.add(anim);
 g.querySelectorAll(".blue").forEach(b=>{b.classList.remove("blue");void b.getBBox();b.classList.add("blue")});
 document.querySelectorAll(".glow").forEach(x=>x.classList.remove("glow"));
 paris2cv=!!g.querySelector('image[href*="2cv"]');SND[id]();paris2cv=false;
 if(id==="chariot")setTimeout(()=>LP.sample("hello_soldier",2.6),300); // the soldier calls out in Italian, whatever language is being learned
 const r=g.getBoundingClientRect();
 if(want){
  if(id===want){LPLearn.asked(id,LP.lang,true);want=null;misses=0;LP.sfx.win();LP.burst(r.left+r.width/2,r.top,20);const t=fill(L().found,id);bubble(t);setTimeout(()=>LP.say(t),900);setTimeout(ask,4000);return}
  LPLearn.asked(want,LP.lang,false);misses++;
  // a wrong tap: no name, just "not quite", then the thing to find is asked for again
  bubble(LP.notQuite());setTimeout(()=>LP.say(LP.notQuite()),700);
  setTimeout(()=>{if(want){bubble(fill(L().where,want));LP.say(fill(L().where,want),true)}},2300);
  return;
 }
 bubble(w(id).w);LPLearn.heard(id,LP.lang);
 setTimeout(()=>{LP.say(w(id).w)},((id==="car"&&sceneId==="paris"&&g.querySelector('image[href*="2cv"]'))||(id==="truck"&&sceneId==="austin")||(id==="tuktuk"&&sceneId==="sicily")?5000:({fire:2300,police:2300,bus:2000,plane:1900,heli:1900,bird:1900,crow:1800,seagull:1800,cat:1300,dog:1800,tram:1500,bike:1200,car:1000,truck:1800,taxi:1100,boat:1800,scooter:1500,motorcycle:1700,cargobike:1500,horse:1800,darkcar:4300,subway:1600,escooter:1300,skateboard:1500,camper:1300,chariot:1900,tuktuk:1300,balloon:1900,tractor:1900,cow:1600,sheep:1400,pig:1500,duck:1200,rat:1200,parrot:1700,chicken:1300,digger:2000,dumptruck:1900,mixer:2000,crane:1700,roller:2000})[id])||1000);
 if(want)setTimeout(()=>{if(want){bubble(fill(L().where,want));LP.say(fill(L().where,want))}},3600);
 else if(plays>=8&&!swapping){swapping=1;setTimeout(()=>{nextScene();swapping=0},4600)}
}
function ask(){
 if(plays>=8){nextScene();return}
 if(LP.age<1&&LPLearn.summary(LP.lang).met<8){want=null;bubble(L().title);return}
 const pool=ids().filter(i=>i!==last);want=LPLearn.pick(pool,x=>x,1,LP.lang)[0];last=want;misses=0;
 const t=fill(L().where,want);bubble(t);LP.say(t);
}

LP.init({langs:ALLLANGS,onLang:()=>{label();document.title=L().title;bubble(want?fill(L().where,want):L().title)},onAge:()=>{want=null;bubble(L().title)}});
/* layer 1: the town plate. Its pavement line (88% down the picture) is lined up with the felt curb,
   and it is scaled so the sky reaches the top of the screen; felt clouds drift in the sky above the roofs. */
const sky=LPClouds.add($("app"),{count:5});
function placeTown(){
 const svg=$("street"),m=svg.getScreenCTM();if(!m)return;
 const curb=m.f+m.d*352, top=$("app").getBoundingClientRect().top, y=curb-top;
 const W=innerWidth, s=Math.max(W/1536, y/(864*.86), 0.2);
 $("app").style.backgroundSize=(1536*s)+"px "+(864*s)+"px";
 $("app").style.backgroundPosition=((W-1536*s)/2)+"px "+(y-864*.86*s)+"px";
 /* things pinned to the background picture follow it as it scales */
 const bb=$("app").getBoundingClientRect(),oy=curb-864*.86*s,ox=bb.left+(W-1536*s)/2;
 svg.querySelectorAll("[data-bg]").forEach(g=>{
  const [bx,by,bw,bh]=g.dataset.bg.split(",").map(Number),im=g.querySelector("image"),hit=g.querySelector(".hit");
  const x=(ox+bx*s-m.e)/m.a,y=(oy+by*s-m.f)/m.d,w=bw*s/m.a,h=bh*s/m.d;
  im.setAttribute("x",x);im.setAttribute("y",y);im.setAttribute("width",w);im.setAttribute("height",h);
  hit.setAttribute("x",x-6);hit.setAttribute("y",y-6);hit.setAttribute("width",w+12);hit.setAttribute("height",h+12);
 });
 sky.style.height=Math.max(60,y-864*.86*s+864*.33*s)+"px"; // the open sky above the chimneys
}
addEventListener("resize",placeTown);requestAnimationFrame(placeTown);setTimeout(placeTown,300);
function setScene(n){
 sceneId=n;const S=SCENES[n];plays=0;want=null;misses=0;last=null;lastId=null;lastPoint=null;
 const app=$("app");app.style.backgroundImage=`url(../felt/${S.bg})`;app.style.backgroundColor=S.sky;
 const sv=$("street");sv.innerHTML=S.svg;sv.setAttribute("aria-label",S.label);sv.classList.remove("swap");void sv.getBBox();sv.classList.add("swap");
 document.querySelectorAll(".pick .list button").forEach(b=>b.classList.toggle("on",b.dataset.s===n));
 $("pcur").innerHTML=`<img src="../felt/street-${S.icon}.webp" alt=""><span class="nm">${S.label}</span><span class="car">▼</span>`;$("pick").classList.remove("open");$("pcur").setAttribute("aria-expanded","false");
 label();bubble(L().title);placeTown();
 const nx=SCENES[ORDER[(ORDER.indexOf(n)+1)%ORDER.length]];(new Image).src="../felt/"+nx.bg;
}
function nextScene(){setScene(ORDER[(ORDER.indexOf(sceneId)+1)%ORDER.length]);if(LP.age>=1&&LPLearn.summary(LP.lang).met>=8)setTimeout(ask,900)}
$("pick").innerHTML=`<button type="button" class="cur" id="pcur" aria-haspopup="true" aria-expanded="false" aria-label="Choose a place"></button><div class="list" id="plist">`+ORDER.map(n=>`<button type="button" data-s="${n}"><img src="../felt/street-${SCENES[n].icon}.webp" alt=""><span class="nm">${SCENES[n].label}</span></button>`).join("")+`</div>`;
$("pick").addEventListener("click",e=>{
 if(e.target.closest("#pcur")){const o=$("pick").classList.toggle("open");$("pcur").setAttribute("aria-expanded",o);return}
 const b=e.target.closest(".list button");if(b){if(b.dataset.s!==sceneId){swapping=0;setScene(b.dataset.s)}else $("pick").classList.remove("open")}});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".pick"))$("pick").classList.remove("open")});
setScene("town");document.title=L().title;
LP.start(L().title,()=>setTimeout(ask,500));
LP.mash((e)=>{
 if(e.target.closest&&e.target.closest(".pick"))return;
 const g=e.target.closest&&e.target.closest("[data-thing]");
 const all=ids();
 const pointed=g?g.dataset.thing:null,again=pointed&&pointed===lastPoint&&Date.now()-playedAt<8000;lastPoint=pointed;
 if(g&&(want||!again)){play(g.dataset.thing,g);return} // pointing at a thing plays that thing
 if(want&&LP.age<2){play(want);return} // little ones: a stray tap finds the answer
 play(LP.next("street",all.filter(i=>i!==lastId))); // empty space, or the same thing again: on to the next sound
});
