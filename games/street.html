<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street sounds</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:light;--ink:#18264A;--paper:#FFFDF8;--sky:#3B8BD4;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#2f6fe8;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;min-height:60px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s}
#bubble.bump{transform:scale(1.08)}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end}
svg#street{width:100%;height:100%;overflow:visible}
/* layer 1: the miniature town fills the screen, softly out of focus */
.app{background:#4f9be6 no-repeat}
svg#street.swap{animation:swap .6s steps(3,jump-none)}@keyframes swap{from{opacity:0;transform:translateY(24px)}}
.pick{flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px);position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:3;display:flex;gap:5px}
.pick button{width:46px;height:46px;padding:6px;border:0;border-radius:50%;background:#fffdf6;box-shadow:0 3px 8px #0006;outline:2px dashed #b8401f99;outline-offset:-5px;cursor:pointer;display:grid;place-items:center}
.pick button img{width:100%;height:100%;object-fit:contain;pointer-events:none}
@media (max-width:1100px){.pick{top:max(72px,calc(env(safe-area-inset-top,0px) + 64px))}}
@media (max-width:700px){.pick{gap:6px}.pick button{width:40px;height:40px;padding:5px}.pick{top:max(72px,calc(env(safe-area-inset-top,0px) + 64px))}}
.pick button.on{box-shadow:0 0 0 4px #F6C033,0 3px 8px #0006}
.top,.stage{position:relative;z-index:1}
.thing{cursor:pointer}
.thing .hit{fill:#0000}
.thing:focus{outline:none}.thing:focus-visible .hit{stroke:#F6C033;stroke-width:5;fill:#F6C03322}
.thing.go>.art{animation:drive 1s steps(3,jump-none)}
.thing.hop>.art{animation:hop .66s steps(2,jump-none)}
.art{transform-box:fill-box;transform-origin:center bottom}
@keyframes drive{0%,100%{transform:none}20%{transform:translateY(-4px) rotate(-1deg)}55%{transform:translateX(40px) rotate(.6deg)}80%{transform:translateX(14px)}}
/* stop motion: a tapped thing moves in a few held frames, like a hand-moved model */
@keyframes hop{40%{transform:translateY(-22px) scale(1.06)}}
.thing.glow .hit{stroke:#F6C033;stroke-width:6;fill:#F6C03333}
.blue{animation:flash .3s steps(2) 6}
@keyframes flash{50%{fill:#9fd3ff}}
@media (prefers-reduced-motion:reduce){.thing.go>.art,.thing.hop>.art,.blue}
</style>
</head>

 SND[id]();
 const r=g.getBoundingClientRect();
 if(want){

  LPLearn.asked(want,LP.lang,false);misses++;
 }

 else if(plays>=8&&!swapping){swapping=1;setTimeout(()=>{nextScene();swapping=0},4600)}
}
function ask(){
 if(plays>=8){nextScene();return}
 if(LP.age<1&&LPLearn.summary(LP.lang).met<8){want=null;bubble(L().title);return}
 const pool=ids().filter(i=>i!==last);want=LPLearn.pick(pool,x=>x,1,LP.lang)[0];last=want;misses=0;

}

function placeTown(){
 const svg=$("street"),m=svg.getScreenCTM();if(!m)return;
 const curb=m.f+m.d*352, top=$("app").getBoundingClientRect().top, y=curb-top;
 const W=innerWidth, s=Math.max(W/1536, y/(864*.86), 0.2);
 $("app").style.backgroundSize=(1536*s)+"px "+(864*s)+"px";
 $("app").style.backgroundPosition=((W-1536*s)/2)+"px "+(y-864*.86*s)+"px";
 sky.style.height=Math.max(60,y-864*.86*s+864*.33*s)+"px"; // the open sky above the chimneys
}
addEventListener("resize",placeTown);requestAnimationFrame(placeTown);setTimeout(placeTown,300);

 const sv=$("street");sv.innerHTML=S.svg;sv.setAttribute("aria-label",S.label);sv.classList.remove("swap");void sv.getBBox();sv.classList.add("swap");
 document.querySelectorAll(".pick button").forEach(b=>b.classList.toggle("on",b.dataset.s===n));
 label();bubble(L().title);placeTown();
 const nx=SCENES[ORDER[(ORDER.indexOf(n)+1)%ORDER.length]];(new Image).src="../felt/"+nx.bg;
}
function nextScene(){setScene(ORDER[(ORDER.indexOf(sceneId)+1)%ORDER.length]);if(LP.age>=1&&LPLearn.summary(LP.lang).met>=8)setTimeout(ask,900)}
$("pick").innerHTML=ORDER.map(n=>`<button type="button" data-s="${n}" aria-label="${SCENES[n].label}"><img src="../felt/street-${SCENES[n].icon}.webp" alt=""></button>`).join("");
$("pick").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.s!==sceneId){swapping=0;setScene(b.dataset.s)}});
setScene("town");document.title=L().title;
LP.start(L().title,()=>setTimeout(ask,500));
LP.mash((e)=>{
 if(e.target.closest&&e.target.closest(".pick"))return;
 const g=e.target.closest&&e.target.closest("[data-thing]");
 const all=ids();
 const pointed=g?g.dataset.thing:null,again=pointed&&pointed===lastPoint&&Date.now()-playedAt<8000;lastPoint=pointed;
 if(g&&(want||!again)){play(g.dataset.thing,g);return} // pointing at a thing plays that thing
 if(want&&LP.age<2){play(want);return} // little ones: a stray tap finds the answer
 play(LP.next("street",all.filter(i=>i!==lastId))); // empty space, or the same thing again: on to the next sound
});
