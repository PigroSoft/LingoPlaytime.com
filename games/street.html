<style>
:root{color-scheme:light;--ink:#18264A;--paper:#FFFDF8;--sky:#3B8BD4;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#2f6fe8;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#clouds{position:fixed;inset:0 0 40% 0;overflow:hidden;pointer-events:none}
.cloud{position:absolute;filter:drop-shadow(0 8px 10px #12345a1f)}
.cloud .puff{position:absolute;background:radial-gradient(circle at 35% 30%,#ffffff,#eef6fc 75%);border-radius:50%}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;min-height:60px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s}
#bubble.bump{transform:scale(1.08)}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end}
svg#street{width:100%;height:100%}
.thing{cursor:pointer}
.thing .hit{fill:#0000}
.thing:focus{outline:none}.thing:focus-visible .hit{stroke:#F6C033;stroke-width:5;fill:#F6C03322}
.thing.go>.art{animation:drive .9s ease-in-out}
.thing.hop>.art{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.art{transform-box:fill-box;transform-origin:center bottom}
@keyframes drive{0%,100%{transform:none}15%{transform:translateY(-4px)}50%{transform:translateX(40px)}}
@keyframes hop{40%{transform:translateY(-22px) scale(1.06)}}
.thing.glow .hit{stroke:#F6C033;stroke-width:6;fill:#F6C03333}
.blue{animation:flash .3s steps(2) 6}
@keyframes flash{50%{fill:#9fd3ff}}
@media (prefers-reduced-motion:reduce){.thing.go>.art,.thing.hop>.art,.blue{animation:none}}
</style>
</head>

};
const T=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const w=id=>T[id][LP.lang]||T[id].en;
let want=null,misses=0,lastTap=0,last=null,lastId=null,lastPoint=null,playedAt=0;


/* real CC0 recordings (sounds.js); the synthesized versions below are a fallback */
const SYN={
 bus(){LP.tone(55,1.1,"sawtooth",.12,0,48);LP.tone(82,1.1,"sawtooth",.06);LP.noise(.5,.12,"highpass",3000,1,1)},
 fire(){[0,1,2,3].forEach(i=>LP.tone(i%2?587:440,.42,"triangle",.14,i*.45))},
 police(){[0,1,2,3].forEach(i=>LP.tone(i%2?523:392,.42,"triangle",.14,i*.45))},
 tram(){[0,.4].forEach(t=>{LP.tone(1180,.9,"triangle",.14,t);LP.tone(2360,.5,"sine",.04,t)});LP.tone(60,1,"sawtooth",.06)},
 bike(){[0,.28].forEach(t=>{LP.tone(2900,.6,"sine",.1,t);LP.tone(4100,.4,"sine",.05,t);LP.tone(3500,.5,"triangle",.04,t)})},
 car(){[0,.3].forEach(t=>{LP.tone(350,.2,"square",.07,t);LP.tone(440,.2,"square",.07,t)})},
 dog(){[0,.3].forEach(t=>{LP.noise(.12,.25,"bandpass",900,2,t);LP.tone(420,.14,"square",.12,t,200)})},
 plane(){LP.noise(1.8,.22,"bandpass",300,1.2,0,1800);LP.tone(110,1.6,"sawtooth",.05,0,260)},
 heli(){for(let i=0;i<12;i++)LP.noise(.08,.28,"lowpass",260,1,i*.1);LP.tone(75,1.3,"sawtooth",.05)},
 bird(){[0,.18,.36].forEach(t=>LP.tone(3000,.12,"sine",.08,t,4600))}
};

function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function label(){document.querySelectorAll("[data-thing]").forEach(g=>g.setAttribute("aria-label",w(g.dataset.thing).w))}
const fill=(tpl,id)=>tpl.replace("{w}",w(id).w);

const SND=new Proxy({},{get:(_,id)=>()=>{if(!LP.sample(id,2.4))SYN[id]()}});
function play(id){
 const now=Date.now();if(now-lastTap<150)return;lastTap=now;playedAt=now;lastId=id;
 const g=document.querySelector(`[data-thing="${id}"]`);
 const anim=["dog","bird","bike","heli"].includes(id)?"hop":"go";
 g.classList.remove("go","hop");void g.getBBox();g.classList.add(anim);
 g.querySelectorAll(".blue").forEach(b=>{b.classList.remove("blue");void b.getBBox();b.classList.add("blue")});
 document.querySelectorAll(".glow").forEach(x=>x.classList.remove("glow"));
 SND[id]();
 const r=g.getBoundingClientRect();
 if(want){
  if(id===want){want=null;misses=0;LP.sfx.chime();LP.burst(r.left+r.width/2,r.top,20);const t=fill(L().found,id);bubble(t);setTimeout(()=>LP.say(t),900);setTimeout(ask,4000);return}
  misses++;if(misses>=2)document.querySelector(`[data-thing="${want}"]`).classList.add("glow");
 }
 bubble(w(id).w+"  "+w(id).s);
 setTimeout(()=>{LP.say(w(id).w);LP.say(w(id).s,true)},({fire:2300,police:2300,bus:2000,plane:1900,heli:1900,bird:1900,dog:1800,tram:1500,bike:1200,car:1000})[id]||1000);
 if(want)setTimeout(()=>{if(want){bubble(fill(L().where,want));LP.say(fill(L().where,want))}},3600);
}
function ask(){
 if(LP.age<1){want=null;bubble(L().title);return}
 const ids=DATA.words.map(x=>x.id).filter(i=>i!==last);want=ids[Math.floor(Math.random()*ids.length)];last=want;misses=0;
 const t=fill(L().where,want);bubble(t);LP.say(t);
}

LP.init({langs:ALLLANGS,onLang:()=>{label();document.title=L().title;bubble(want?fill(L().where,want):L().title)},onAge:()=>{want=null;bubble(L().title)}});
LPLook.sky(document.getElementById("app"),{mode:"day",hills:false});
label();document.title=L().title;bubble(L().title);
LP.start(L().title,()=>setTimeout(ask,500));
LP.mash((e)=>{
 const g=e.target.closest&&e.target.closest("[data-thing]");
 const all=DATA.words.map(x=>x.id);
 const pointed=g?g.dataset.thing:null,again=pointed&&pointed===lastPoint&&Date.now()-playedAt<8000;lastPoint=pointed;
 if(g&&(want||!again)){play(g.dataset.thing);return} // pointing at a thing plays that thing
 if(want&&LP.age<2){play(want);return} // little ones: a stray tap finds the answer
 play(LP.next("street",all.filter(i=>i!==lastId))); // empty space, or the same thing again: on to the next sound
});
</script>
</body>
</html>
