<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Munch munch</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:light;--ink:#18264A;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#4a9bf5;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;min-height:60px;position:relative;z-index:2}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s;text-align:center}
#bubble.bump{transform:scale(1.08)}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end;position:relative;z-index:1}
svg#scene{width:100%;height:100%}
.food{transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .3s;cursor:pointer}
.food .hit{fill:#0000}
.food.bob{animation:bob 2.4s ease-in-out infinite}
.food.no{animation:nope .4s}
.food.glow .hit{stroke:#F6C033;stroke-width:5;fill:#F6C03333}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.wobble{transform-box:fill-box;transform-origin:50% 0;animation:wob 1s ease-in-out infinite}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .35s ease-in-out infinite}
@keyframes bob{50%{translate:0 -8px}}
@keyframes nope{25%{translate:-8px 0}75%{translate:8px 0}}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes flap{50%{transform:scaleX(.45)}}
@media (prefers-reduced-motion:reduce){.food,.food.bob,.pop,.wobble,.flap{animation:none!important;transition:none}}
</style>
</head>
<body>
<script>window.LP_GAME="munch"</script><script src="voice.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="look.js"></script><script src="sounds.js"></script>
<div class="app" id="app">
  <div class="top"><div id="bubble" class="k-bubble" aria-live="polite"></div></div>
  <div class="stage">
    <svg id="scene" viewBox="0 0 900 560" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A caterpillar eating fruit and vegetables">
      <path d="M0 470c150-40 330-50 500-20s280 10 400-20V560H0Z" fill="#4fc777"/><path d="M0 520c200-30 520-30 900 0V560H0Z" fill="#68dc87"/>
      <g id="stalk"></g>
      <g id="foods"></g>
      <g id="cat"></g>
      <g id="cocoon" opacity="0"></g>
      <g id="fly" opacity="0"></g>
    </svg>
  </div>
</div>
<script>
/* Every word and line this game can say. tools/phrases.js reads DATA to record them. */
const DATA={
 words:[
  {id:"leaf",en:"the leaf",de:"das Blatt",es:"la hoja",fr:"la feuille",it:"la foglia",pt:"a folha"},
  {id:"strawberry",en:"the strawberry",de:"die Erdbeere",es:"la fresa",fr:"la fraise",it:"la fragola",pt:"o morango"},
  {id:"grapes",en:"the grapes",de:"die Trauben",es:"las uvas",fr:"les raisins",it:"l'uva",pt:"as uvas"},
  {id:"carrot",en:"the carrot",de:"die Karotte",es:"la zanahoria",fr:"la carotte",it:"la carota",pt:"a cenoura"},
  {id:"cherries",en:"the cherries",de:"die Kirschen",es:"las cerezas",fr:"les cerises",it:"le ciliegie",pt:"as cerejas"},
  {id:"watermelon",en:"the watermelon",de:"die Wassermelone",es:"la sandía",fr:"la pastèque",it:"l'anguria",pt:"a melancia"},
  {id:"tomato",en:"the tomato",de:"die Tomate",es:"el tomate",fr:"la tomate",it:"il pomodoro",pt:"o tomate"},
  {id:"blueberries",en:"the blueberries",de:"die Heidelbeeren",es:"los arándanos",fr:"les myrtilles",it:"i mirtilli",pt:"os mirtilos"}
 ],
 lines:{
  en:{title:"Munch munch!",where:"Where is {w}?",n1:"one",n2:"two",n3:"three",n4:"four",n5:"five",butterfly:"The butterfly!",bye:"Bye bye!"},
  de:{title:"Mampf mampf!",where:"Wo ist {w}?",n1:"eins",n2:"zwei",n3:"drei",n4:"vier",n5:"fünf",butterfly:"Der Schmetterling!",bye:"Tschüss!"},
  es:{title:"¡Ñam ñam!",where:"¿Dónde está {w}?",n1:"uno",n2:"dos",n3:"tres",n4:"cuatro",n5:"cinco",butterfly:"¡La mariposa!",bye:"¡Adiós!"},
  fr:{title:"Miam miam !",where:"Où est {w} ?",n1:"un",n2:"deux",n3:"trois",n4:"quatre",n5:"cinq",butterfly:"Le papillon !",bye:"Au revoir !"},
  it:{title:"Gnam gnam!",where:"Dov'è {w}?",n1:"uno",n2:"due",n3:"tre",n4:"quattro",n5:"cinque",butterfly:"La farfalla!",bye:"Ciao ciao!"},
  pt:{title:"Nham nham!",where:"Onde está {w}?",n1:"um",n2:"dois",n3:"três",n4:"quatro",n5:"cinco",butterfly:"A borboleta!",bye:"Adeus!"}
 }
};
const T=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const w=id=>T[id][LP.lang]||T[id].en;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fill=(tpl,id)=>cap(tpl.replace("{w}",w(id)));
const NS="http://www.w3.org/2000/svg";

/* the food, drawn in a 100 x 100 box */
const FOOD={
 leaf:`<path d="M12 80C8 40 40 10 88 14c4 44-18 76-62 72Z" fill="#3fbf5f"/><path d="M14 84C34 58 56 36 80 20" stroke="#2b8f45" stroke-width="5" fill="none" stroke-linecap="round"/>`,
 strawberry:`<path d="M50 90C22 72 14 48 22 34c10-10 46-10 56 0 8 14 0 38-28 56Z" fill="#ff4d5e"/><path d="M30 30l10-14 10 8 10-8 10 14Z" fill="#33a24f"/><g fill="#ffe58a"><circle cx="38" cy="46" r="3"/><circle cx="58" cy="44" r="3"/><circle cx="48" cy="58" r="3"/><circle cx="64" cy="58" r="3"/><circle cx="40" cy="70" r="3"/><circle cx="54" cy="76" r="3"/></g>`,
 grapes:`<g fill="#8b5cf6">${[[34,36],[54,36],[74,36],[44,54],[64,54],[54,72]].map(([x,y])=>`<circle cx="${x-4}" cy="${y}" r="12"/>`).join("")}</g><g fill="#ffffff55">${[[30,32],[50,32],[70,32],[40,50]].map(([x,y])=>`<circle cx="${x-4}" cy="${y}" r="3.5"/>`).join("")}</g><path d="M46 24c0-10 6-14 12-14" stroke="#33a24f" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M52 14c10-8 24-4 26 4-10 4-20 2-26-4Z" fill="#33a24f"/>`,
 carrot:`<path d="M34 28c-6 0 36 66 40 60 6-12-18-54-40-60Z" transform="rotate(-12 50 50) translate(-6 -2)" fill="#ff8a3d"/><path d="M62 24l-6-16M70 28l12-12M52 20l-12-10" stroke="#33a24f" stroke-width="7" stroke-linecap="round"/><path d="M42 44l10 4M50 60l10 4" stroke="#e2602a" stroke-width="3" stroke-linecap="round"/>`,
 cherries:`<path d="M34 62c6-26 16-44 30-52M68 64c-2-26-6-40-4-54" stroke="#33a24f" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="32" cy="72" r="16" fill="#d9132f"/><circle cx="70" cy="74" r="16" fill="#e8283f"/><circle cx="27" cy="66" r="4" fill="#ffffff66"/><circle cx="65" cy="68" r="4" fill="#ffffff66"/><path d="M64 10c8-6 20-2 22 6-10 2-18 0-22-6Z" fill="#33a24f"/>`,
 watermelon:`<path d="M8 40a42 42 0 0 0 84 0Z" fill="#33a24f"/><path d="M14 40a36 36 0 0 0 72 0Z" fill="#ff4d6a"/><path d="M14 40h72" stroke="#fff" stroke-width="3"/><g fill="#2a2350"><ellipse cx="36" cy="54" rx="3" ry="5"/><ellipse cx="50" cy="62" rx="3" ry="5"/><ellipse cx="64" cy="54" rx="3" ry="5"/></g>`,
 tomato:`<circle cx="50" cy="56" r="34" fill="#ff4d3a"/><path d="M50 22l8 10 12-4-6 12 12 6-14 2-4 12-8-10-8 10-4-12-14-2 12-6-6-12 12 4Z" fill="#33a24f"/><circle cx="36" cy="48" r="5" fill="#ffffff66"/>`,
 blueberries:`<g fill="#4467e8">${[[34,62],[62,64],[48,40],[72,40],[30,36]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="15"/>`).join("")}</g><g fill="#a7b8ff">${[[34,62],[62,64],[48,40],[72,40],[30,36]].map(([x,y])=>`<path d="M${x-4} ${y-4}l4 4 4-4-4-4Z"/>`).join("")}</g>`
};
const S=1.3;
let slots=[],want=null,misses=0,busy=false,eaten=0,goal=3,fed=0;
const lastFoods=[];

function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
const headX=()=>150+(eaten+1)*56;

/* the caterpillar: tail, a round body segment for every bite, and a yellow face */
function drawCat(popLast){
 let s="";
 for(let i=0;i<=eaten;i++){
  const x=150+i*56,col=i%2?"#9b7bff":"#ff7eb6",last=popLast&&i===eaten;
  s+=`<g${last?' class="pop"':""}><circle cx="${x}" cy="478" r="34" fill="${col}"/><circle cx="${x-8}" cy="466" r="8" fill="#ffffff44"/><path d="M${x-14} 508v14M${x+14} 508v14" stroke="#18264A" stroke-width="6" stroke-linecap="round"/></g>`;
 }
 const hx=headX();
 s+=`<g><circle cx="${hx}" cy="470" r="40" fill="#ffd23f"/><circle cx="${hx+14}" cy="458" r="9" fill="#fff"/><circle cx="${hx-10}" cy="458" r="9" fill="#fff"/><circle cx="${hx+16}" cy="459" r="4.5" fill="#18264A"/><circle cx="${hx-8}" cy="459" r="4.5" fill="#18264A"/><ellipse cx="${hx+22}" cy="480" rx="14" ry="${busy?9:6}" fill="#c1342a"/><path d="M${hx-12} 436l-8-30M${hx+14} 434l8-30" stroke="#18264A" stroke-width="5" stroke-linecap="round"/><circle cx="${hx-20}" cy="404" r="8" fill="#4a9bf5"/><circle cx="${hx+22}" cy="404" r="8" fill="#4a9bf5"/><path d="M${hx+8} 500v14" stroke="#18264A" stroke-width="6" stroke-linecap="round"/></g>`;
 $("cat").innerHTML=s;$("cat").style.opacity=1;
}
function place(slot,i,n){return {x:450+(i-(n-1)/2)*(n>4?150:175)-50*S,y:150}}
function setFoods(){
 const n=goal;$("foods").innerHTML="";slots=[];
 const ids=Object.keys(T).sort(()=>Math.random()-.5);
 const pick=ids.filter(i=>!lastFoods.includes(i)).slice(0,n);
 pick.forEach((id,i)=>addFood(id,i,n));
 lastFoods.length=0;lastFoods.push(...pick);
}
function addFood(id,i,n){
 const g=document.createElementNS(NS,"g");g.setAttribute("class","food");g.dataset.food=id;g.setAttribute("role","button");g.setAttribute("tabindex","0");g.setAttribute("aria-label",w(id));
 g.innerHTML=`<g class="bob" style="animation-delay:${(i*.4).toFixed(1)}s">${FOOD[id]}</g><rect class="hit" x="0" y="0" width="100" height="100" rx="16"/>`;
 const p=place(g,i,n);g.style.transform=`translate(${p.x}px,${p.y-260}px) scale(${S})`;g.style.opacity=0;
 $("foods").appendChild(g);const o={id,el:g,i,p};slots.push(o);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transform=`translate(${p.x}px,${p.y}px) scale(${S})`;g.style.opacity=1}));
 return o;
}
function munchSound(){[0,.16,.32].forEach(t=>{LP.noise(.09,.3,"bandpass",1400,2,t);LP.tone(180,.08,"square",.06,t,120)})}
function eat(slot){
 if(busy||!slots.includes(slot))return;busy=true;want=null;misses=0;
 document.querySelectorAll(".glow").forEach(x=>x.classList.remove("glow"));
 const id=slot.id,el=slot.el;
 el.style.transform=`translate(${headX()+22-50*.25}px,${478-50*.25}px) scale(.25)`;LP.sfx.whoosh();
 setTimeout(()=>{
  el.style.opacity=0;munchSound();eaten++;fed++;drawCat(true);
  const r=$("cat").getBoundingClientRect();LP.burst(r.right-60,r.top+40,10);
  bubble(cap(w(id))+"  "+eaten);
  LP.say(w(id));LP.say(L()["n"+eaten],true);
 },650);
 setTimeout(()=>{
  slot.el.remove();slots.splice(slots.indexOf(slot),1);
  if(eaten>=goal){metamorph();return}
  // a new food takes the empty place so there are always the same number to pick from
  const ids=Object.keys(T).filter(i=>!slots.some(s=>s.id===i));
  const nid=LP.next("munch-new",ids);const ns=addFood(nid,slot.i,goal);
  busy=false;
  if(LP.age>=2)ask();
 },1500);
}
function ask(){if(!slots.length)return;want=LP.next("munch-ask",slots.map(s=>s.id));misses=0;const t=fill(L().where,want);bubble(t);LP.say(t)}
function metamorph(){
 busy=true;
 // the caterpillar hangs up a cocoon, rests, and a butterfly flies out
 $("cat").style.transition="opacity .6s";$("cat").style.opacity=0;
 const c=$("cocoon");c.innerHTML=`<g class="wobble"><path d="M450 150v90" stroke="#8a4724" stroke-width="5"/><ellipse cx="450" cy="300" rx="44" ry="78" fill="#c9a97d"/><path d="M412 270c24 14 52 14 76 0M408 300c26 14 58 14 84 0M412 332c24 12 52 12 76 0" stroke="#a58455" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
 c.style.transition="opacity .6s";c.style.opacity=1;LP.sfx.twinkle();
 setTimeout(()=>{
  c.style.opacity=0;
  const f=$("fly");const wing=(sx,col)=>`<g transform="scale(${sx} 1)"><path d="M0 0C30-60 100-70 120-30 124 0 70 10 0 0Z" fill="${col}"/><path d="M0 0C40 10 90 30 80 70 60 90 20 50 0 0Z" fill="#ffd23f"/><circle cx="82" cy="-26" r="10" fill="#ffffff99"/></g>`;
  f.innerHTML=`<g id="bf" style="transition:transform 3.2s ease-in,opacity .4s;transform:translate(450px,330px)"><g class="flap">${wing(1,"#ff7eb6")}${wing(-1,"#ff7eb6")}</g><ellipse rx="9" ry="34" cy="14" fill="#18264A"/><path d="M-4-18l-10-18M4-18l10-18" stroke="#18264A" stroke-width="3" stroke-linecap="round"/></g>`;
  f.style.opacity=1;LP.sfx.chime();const t=L().butterfly;bubble(t);LP.say(t);
  for(let i=0;i<10;i++)setTimeout(()=>LP.burst(300+Math.random()*(innerWidth-600),innerHeight*(.2+Math.random()*.4),8),i*160);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$("bf").style.transform="translate(740px,-80px)"}));
  setTimeout(()=>LP.say(L().bye,true),1800);
 },2400);
 setTimeout(()=>{$("fly").style.opacity=0;newRound()},6800);
}
function newRound(){
 eaten=0;goal=[3,4,5][Math.min(2,LP.age)];$("cat").style.opacity=1;drawCat(false);
 setFoods();busy=false;want=null;
 const t=L().title;bubble(t);
 if(LP.age>=2)setTimeout(ask,600);
}

LP.init({langs:["en","de","es","fr","it","pt"],onLang:()=>{document.title=L().title;slots.forEach(s=>s.el.setAttribute("aria-label",w(s.id)));bubble(want?fill(L().where,want):L().title)},
 onAge:()=>{if(!busy&&eaten===0){goal=[3,4,5][Math.min(2,LP.age)];setFoods();want=null;if(LP.age>=2)ask()}}});
LPLook.sky($("app"),{mode:"day",hills:false});
document.title=L().title;bubble(L().title);
goal=[3,4,5][Math.min(2,LP.age)];drawCat(false);setFoods();
LP.start(L().title,()=>{LP.say(L().title);if(LP.age>=2)setTimeout(ask,1200)});
LP.mash((e)=>{
 if(busy||!slots.length)return;
 const g=e.target.closest&&e.target.closest("[data-food]");
 const pointed=g&&slots.find(s=>s.el===g);
 if(LP.age>=2){ // big kids: feed the one that was asked for
  if(!want){ask();return}
  if(pointed){
   if(pointed.id===want)eat(pointed);
   else{pointed.el.classList.remove("no");void pointed.el.getBoundingClientRect();pointed.el.classList.add("no");bubble(cap(w(pointed.id)));LP.say(w(pointed.id));misses++;if(misses>=2){const t=slots.find(s=>s.id===want);if(t)t.el.classList.add("glow")}setTimeout(()=>{if(want){const t=fill(L().where,want);bubble(t);LP.say(t,true)}},1800)}
  }else{misses++;if(misses>=2){const t=slots.find(s=>s.id===want);if(t)t.el.classList.add("glow")}const t=fill(L().where,want);bubble(t);LP.say(t)}
  return;
 }
 // little ones: tap a food to feed it, or tap anywhere (or press any key) and the caterpillar picks one
 eat(pointed||slots.find(s=>s.id===LP.next("munch",slots.map(x=>x.id))));
});
</script>
</body>
</html>
