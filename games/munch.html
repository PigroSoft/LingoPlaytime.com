<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Munch munch</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:light;--ink:#18264A}
html,body{height:100%;margin:0}
body{background:#e9a95a;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end;position:relative}
svg#scene{position:relative;width:100%;height:100%;display:block}
#bd{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:50% 100%}
.app::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 45%,#0000 55%,#4a1e0640 85%,#3a160470 100%);z-index:3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.card text{font-family:"Fredoka","Baloo 2",system-ui,sans-serif}
#say{cursor:pointer}
.food{transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .3s;cursor:pointer}
.food .hit{fill:#0000}
.food:focus{outline:none}.food:focus-visible .hit{stroke:#fff0c4;stroke-width:4;stroke-dasharray:8 6}
.food .rays{opacity:0;transition:opacity .3s}
.food.glow .rays{opacity:1;animation:rays 1s ease-in-out infinite}
.food.no{animation:nope .4s}
.lift{transition:transform .25s}
.food:hover .lift{transform:translateY(-6px)}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.wobble{transform-box:fill-box;transform-origin:50% 0;animation:wob 1.2s ease-in-out infinite}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .35s ease-in-out infinite}
.shake{transform-box:fill-box;transform-origin:50% 100%;animation:shk .22s ease-in-out 16}
.ring{animation:rays 1s ease-in-out infinite}
.dotpop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.cardpop{transform-box:fill-box;transform-origin:center;animation:cpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes nope{25%{translate:-8px 0}75%{translate:8px 0}}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes cpop{0%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes wob{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes flap{50%{transform:scaleX(.45)}}
@keyframes shk{25%{transform:rotate(-3deg) scale(1.03)}75%{transform:rotate(3deg) scale(1.03)}}
@keyframes rays{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.food,.pop,.wobble,.flap,.shake,.cardpop,.food.glow .rays{animation:none!important;transition:none}}
</style>
</head>
<body>
<script>window.LP_GAME="munch"</script><script src="voice.js"></script><script src="learn.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="look.js"></script><script src="sounds.js"></script>
<div class="app" id="app">
  <div class="sr" id="live" aria-live="polite"></div>
  <div class="stage">
    <img id="bd" alt="" aria-hidden="true" src="../felt/munch-bg.webp">
    <svg id="scene" viewBox="0 0 900 560" preserveAspectRatio="none" role="img" aria-label="A felt caterpillar eating fruit from a wooden shelf">
      <defs>
        <!-- Everything here is felt, cotton and cardboard made from SVG filters, no images.
             puff: fuzzy edges, a stuffed pillow shading, wool grain and a soft shadow -->
        <filter id="puff" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="3" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="4.5" xChannelSelector="R" yChannelSelector="G" result="fz"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
          <feDiffuseLighting in="b" surfaceScale="6" diffuseConstant="1.32" lighting-color="#fff" result="lit"><feDistantLight azimuth="200" elevation="42"/></feDiffuseLighting>
          <feComposite in="fz" in2="lit" operator="arithmetic" k1="1" result="sh"/>
          <feTurbulence type="fractalNoise" baseFrequency="2.6" numOctaves="2" seed="11" result="g"/>
          <feColorMatrix in="g" type="saturate" values="0" result="g1"/>
          <feComponentTransfer in="g1" result="g2"><feFuncR type="linear" slope=".9" intercept=".56"/><feFuncG type="linear" slope=".9" intercept=".56"/><feFuncB type="linear" slope=".9" intercept=".56"/></feComponentTransfer>
          <feComposite in="g2" in2="fz" operator="in" result="g3"/>
          <feBlend in="sh" in2="g3" mode="multiply" result="tex"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="sb"/><feOffset in="sb" dx="7" dy="7" result="so"/>
          <feFlood flood-color="#3a2410" flood-opacity=".32"/><feComposite in2="so" operator="in" result="shadow"/>
          <feMerge><feMergeNode in="shadow"/><feMergeNode in="tex"/></feMerge>
        </filter>
        <!-- cotton: much fluffier edges for clouds and pom-poms -->
        <filter id="cotton" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="5" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="11" xChannelSelector="R" yChannelSelector="G" result="fz"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
          <feDiffuseLighting in="b" surfaceScale="5" diffuseConstant="1.25" lighting-color="#fff" result="lit"><feDistantLight azimuth="235" elevation="50"/></feDiffuseLighting>
          <feComposite in="fz" in2="lit" operator="arithmetic" k1="1" result="tex"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="sb"/><feOffset in="sb" dy="6" result="so"/>
          <feFlood flood-color="#123a6a" flood-opacity=".22"/><feComposite in2="so" operator="in" result="shadow"/>
          <feMerge><feMergeNode in="shadow"/><feMergeNode in="tex"/></feMerge>
        </filter>
        <!-- flat felt: mottled wool for big backdrops (no displacement, so straight edges stay straight) -->
        <filter id="flat" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="2" seed="21" result="g"/>
          <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="8" result="m"/>
          <feBlend in="g" in2="m" mode="multiply" result="gm"/>
          <feColorMatrix in="gm" type="saturate" values="0" result="g1"/>
          <feComponentTransfer in="g1" result="g2"><feFuncR type="linear" slope=".7" intercept=".76"/><feFuncG type="linear" slope=".7" intercept=".76"/><feFuncB type="linear" slope=".7" intercept=".76"/></feComponentTransfer>
          <feComposite in="g2" in2="SourceGraphic" operator="in" result="g3"/>
          <feBlend in="SourceGraphic" in2="g3" mode="multiply"/>
        </filter>
        <!-- hill: flat felt with a fuzzy top edge and a soft shadow underneath -->
        <filter id="hill" x="-5%" y="-20%" width="110%" height="140%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="13" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="5" xChannelSelector="R" yChannelSelector="G" result="fz"/>
          <feTurbulence type="fractalNoise" baseFrequency="2.3" numOctaves="2" seed="17" result="g"/>
          <feColorMatrix in="g" type="saturate" values="0" result="g1"/>
          <feComponentTransfer in="g1" result="g2"><feFuncR type="linear" slope="1" intercept=".58"/><feFuncG type="linear" slope="1" intercept=".58"/><feFuncB type="linear" slope="1" intercept=".58"/></feComponentTransfer>
          <feComposite in="g2" in2="fz" operator="in" result="g3"/>
          <feBlend in="fz" in2="g3" mode="multiply" result="tex"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="sb"/><feOffset in="sb" dy="-6" result="so"/>
          <feFlood flood-color="#0b2a14" flood-opacity=".25"/><feComposite in2="so" operator="in" result="shadow"/>
          <feMerge><feMergeNode in="shadow"/><feMergeNode in="tex"/></feMerge>
        </filter>
        <!-- embroidered letters -->
        <filter id="thread" x="-5%" y="-20%" width="110%" height="150%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="2" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="fz"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
          <feDiffuseLighting in="b" surfaceScale="3" diffuseConstant="1.3" lighting-color="#fff" result="lit"><feDistantLight azimuth="235" elevation="50"/></feDiffuseLighting>
          <feComposite in="fz" in2="lit" operator="arithmetic" k1="1" result="tex"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="sb"/><feOffset in="sb" dy="2.5" result="so"/>
          <feFlood flood-color="#3a2410" flood-opacity=".3"/><feComposite in2="so" operator="in" result="shadow"/>
          <feMerge><feMergeNode in="shadow"/><feMergeNode in="tex"/></feMerge>
        </filter>
        <!-- cardboard: grain only, plus the corrugated pattern -->
        <filter id="board" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="1.4 .25" numOctaves="2" seed="31" result="g"/>
          <feColorMatrix in="g" type="saturate" values="0" result="g1"/>
          <feComponentTransfer in="g1" result="g2"><feFuncR type="linear" slope=".8" intercept=".68"/><feFuncG type="linear" slope=".8" intercept=".68"/><feFuncB type="linear" slope=".8" intercept=".68"/></feComponentTransfer>
          <feComposite in="g2" in2="SourceGraphic" operator="in" result="g3"/>
          <feBlend in="SourceGraphic" in2="g3" mode="multiply"/>
        </filter>
        <pattern id="corr" width="160" height="38" patternUnits="userSpaceOnUse"><rect width="160" height="38" fill="#9a5a2e"/><path d="M0 12c30-3 60 3 90 0s50-2 70 1M0 26c40 3 80-3 120 0s30 1 40-1" stroke="#7d4421" stroke-width="2" fill="none"/><path d="M0 19h160" stroke="#6b3818" stroke-width="2.5"/><rect x="0" width="2.5" height="38" fill="#6b3818"/><circle cx="10" cy="9" r="2.6" fill="#3a2414"/><circle cx="10" cy="29" r="2.6" fill="#3a2414"/></pattern>
        <pattern id="flute" width="220" height="16" patternUnits="userSpaceOnUse"><rect width="220" height="16" fill="#b8763f"/><path d="M0 6c50-2 110 3 220 0M0 11c70 2 140-2 220 1" stroke="#98592b" stroke-width="1.6" fill="none"/><path d="M0 1h220" stroke="#d29a5e" stroke-width="2"/></pattern>
      <filter id="dof" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
      </defs>
      <g id="shelf"></g>
      <g id="plates"></g>
            <g id="cocoon" opacity="0"></g>
      <g id="foods"></g>
      <g id="cat"></g>
      <g id="fly" opacity="0"></g>
      <g id="dots"></g>
      <g id="card" class="card"></g>
    </svg>
  </div>
</div>

const T=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const HL=()=>DATA.lines[LP.home]||DATA.lines.en;
const w=id=>T[id][LP.lang]||T[id].en;
const hw=id=>T[id][LP.home]||T[id].en;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fill=(tpl,id,wd)=>cap(tpl.replace("{w}",wd||w(id)));
const NS="http://www.w3.org/2000/svg";
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const stitch=(c,o)=>`stroke="${c}" stroke-width="2.6" stroke-dasharray="6 5" stroke-linecap="round" fill="none"${o||""}`;

const FOODIMG={leaf:"munch-leaf",strawberry:"food-strawberry",grapes:"food-grapes",carrot:"food-carrot",cherries:"food-cherries",watermelon:"food-watermelon",tomato:"food-tomato",blueberries:"munch-blueberries"};
const fimg=(f,x,y,w,h)=>`<image href="../felt/${f}.webp" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`;

const TARGET=7,S=1.3;
/* Every felt piece is drawn once into its own small SVG image (still vectors, no image files), so the browser
   rasterizes the heavy wool filters one time and then only moves pictures around. */
const DEFS=document.querySelector("#scene defs").outerHTML;
function uri(inner,x,y,w,h){return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${Math.round(w)}" height="${Math.round(h)}">${DEFS}${inner}</svg>`)}
function pic(inner,x,y,w,h,cls){return `<image${cls?` class="${cls}"`:""} href="${uri(inner,x,y,w,h)}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="none"/>`}
const ready=html=>Promise.all([...html.matchAll(/href="(data:[^"]+)"/g)].map(m=>{const i=new Image();i.src=m[1].replace(/&amp;/g,"&");return i.decode().catch(()=>{})}));
let VB={x:0,y:0,w:900,h:560};
const BACK=v=>`
      <!-- the felt backdrop, drawn far past the edges so wide and tall screens never see a border -->
      <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c977"/><stop offset=".55" stop-color="#f0b465"/><stop offset="1" stop-color="#e79a52"/></linearGradient>
      <rect x="${v.x}" y="${v.y}" width="${v.w}" height="${v.h}" fill="url(#skyg)" filter="url(#flat)"/>
      <g filter="url(#dof)">
      <g filter="url(#cotton)"><circle cx="690" cy="236" r="70" fill="#fff0c4"/></g>
      <g filter="url(#cotton)" fill="#fbe6c4">
        <path d="M30 120h170a26 26 0 0 0-30-34 34 34 0 0 0-60-10 26 26 0 0 0-50 14 22 22 0 0 0-30 30Z"/>
        <path d="M560 70h120a20 20 0 0 0-22-26 26 26 0 0 0-46-8 20 20 0 0 0-36 12 16 16 0 0 0-16 22Z"/>
        <path d="M-200 180h140a22 22 0 0 0-26-28 30 30 0 0 0-52-8 22 22 0 0 0-40 12 18 18 0 0 0-22 24Z"/>
        <path d="M960 150h150a24 24 0 0 0-28-30 30 30 0 0 0-54-8 24 24 0 0 0-42 14 18 18 0 0 0-26 24Z"/>
      </g>
      <g filter="url(#hill)"><path d="M-900 300C-500 270-200 300 60 286S360 236 540 270 800 250 1000 268 1500 262 1800 270V700H-900Z" fill="#c98a3e"/></g>
      <path d="M-200 300C100 288 330 252 540 284M-200 316C120 306 360 272 600 300M300 330C500 300 700 290 1000 292" fill="none" stroke="#a96a2a" stroke-width="2.5" stroke-dasharray="7 6" opacity=".7"/>
      <g filter="url(#puff)">
        <rect x="132" y="236" width="10" height="84" rx="4" fill="#5a3418"/><ellipse cx="137" cy="214" rx="22" ry="58" fill="#7e8c3a"/>
        <rect x="186" y="262" width="9" height="60" rx="4" fill="#5a3418"/><ellipse cx="190" cy="246" rx="17" ry="42" fill="#a0782c"/>
        <rect x="96" y="250" width="14" height="70" rx="5" fill="#5a3418"/><circle cx="100" cy="232" r="38" fill="#c4562a"/>
        <rect x="742" y="246" width="12" height="74" rx="5" fill="#5a3418"/><circle cx="748" cy="230" r="34" fill="#d9952b"/>
        <rect x="796" y="236" width="10" height="84" rx="4" fill="#5a3418"/><ellipse cx="801" cy="212" rx="21" ry="56" fill="#7e8c3a"/>
      </g>
      </g>
      <g filter="url(#hill)"><path d="M-900 410C-500 380-200 400 100 392S600 362 1000 386 1500 380 1800 390V700H-900Z" fill="#b3973c"/></g>
      <!-- the cardboard shelf the food waits on -->
      <g id="shelf">
        <rect x="40" y="318" width="820" height="16" rx="3" fill="url(#flute)" filter="url(#board)"/>
        <rect x="40" y="332" width="820" height="38" rx="2" fill="url(#corr)" filter="url(#board)"/><rect x="52" y="370" width="16" height="60" fill="#7d4421" filter="url(#board)"/><rect x="832" y="370" width="16" height="60" fill="#7d4421" filter="url(#board)"/>
        <rect x="40" y="368" width="820" height="10" rx="3" fill="#000" opacity=".12"/>
        <path d="M40 333h820" stroke="#8d5a2b" stroke-width="2" opacity=".5"/>
      </g>
${v.y<-120?`<g filter="url(#cotton)" fill="#fbe6c4"><path d="M${v.x+40} ${v.y*.45}h150a24 24 0 0 0-28-30 30 30 0 0 0-54-8 24 24 0 0 0-42 14 18 18 0 0 0-26 24Z"/><path d="M${v.x+v.w-230} ${v.y*.7}h120a20 20 0 0 0-22-26 26 26 0 0 0-46-8 20 20 0 0 0-36 12 16 16 0 0 0-16 22Z"/><path d="M${v.x+v.w*.4} ${v.y*.2}h110a20 20 0 0 0-22-26 26 26 0 0 0-46-8 20 20 0 0 0-36 12 16 16 0 0 0-6 22Z"/></g>`:""}
${flowers()}`;
function fit(){
 const r=document.querySelector(".stage").getBoundingClientRect();if(!r.width||!r.height)return;
 // show the whole 900 x 560 play area, and fill the rest of the screen with more sky or more field
 let v={x:0,y:0,w:900,h:560};if(r.height/r.width>560/900){v.w=Math.max(780,Math.min(900,560*r.width/r.height*1.6));v.x=450-v.w/2;v.h=v.w*r.height/r.width;v.y=560-v.h}else{v.w=560*r.width/r.height;v.x=450-v.w/2}
 VB=v;$("scene").setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);
 if(card.t)drawCard();
}
let fitT=0;addEventListener("resize",()=>{clearTimeout(fitT);fitT=setTimeout(fit,150)});
let stage="play",relT=0,cardBot=90;
let slots=[],want=null,misses=0,busy=false,eaten=0,goal=3,card={t:"",sub:""};
const lastFoods=[];

/* the word card: cream felt, stitched, the word in the learning language, the main language underneath, and a felt speaker button */
function say(t,sub,speak){
 card={t,sub:sub||""};drawCard();$("live").textContent=t+(sub?" ("+sub+")":"");
 if(speak!==false)LP.say(t);
}
function drawCard(){
 const g=$("card"),t=card.t,sub=(card.sub&&card.sub!==card.t)?card.sub:"";
 // first word (often the article) in blue thread, the rest in red, like an embroidered label
 let a="",b=t;const m=t.match(/^(\S+?['’]|\S+\s)(.*)$/);if(m&&m[2]){a=m[1];b=m[2]}
 g.innerHTML=`<g id="cardin"><rect id="cbg" x="0" y="0" width="10" height="10" rx="22" fill="#fffdf6" style="filter:drop-shadow(0 4px 0 #c9b583) drop-shadow(0 8px 12px #0004)"/><rect id="cst" x="0" y="0" width="10" height="10" rx="16" fill="none" stroke="#b8401f99" stroke-width="2" stroke-dasharray="8 6"/>
  <text id="ct" x="0" y="0" text-anchor="middle" font-size="34" font-weight="600" fill="#1c3f4a">${esc(t)}</text>
  ${sub?`<text id="pt" x="0" y="0" text-anchor="middle" font-size="18" font-weight="600" fill="#1c3f4a" fill-opacity=".62">${esc(sub)}</text>`:""}
  </g>`;
 const ct=$("ct");let fs=34;ct.setAttribute("font-size",fs);
 let tw=ct.getComputedTextLength();if(tw>520){fs=Math.floor(fs*520/tw);ct.setAttribute("font-size",fs);tw=ct.getComputedTextLength()}
 let pw=0;if(sub){pw=$("pt").getComputedTextLength()+44}
 const W=Math.max(tw+60,pw+44,200),H=sub?88:62,x0=450-W/2,y0=Math.max(VB.y+10,VB.y+(VB.h-560)*.12+8);
 const set=(id,o)=>{const e=$(id);for(const k in o)e.setAttribute(k,o[k])};
 set("cbg",{x:x0,y:y0,width:W,height:H});set("cst",{x:x0+6,y:y0+6,width:W-12,height:H-12});
 set("ct",{x:450,y:y0+14+fs*.82});
 if(sub){set("pt",{x:450,y:y0+H-14})}
  // tall phones get a bigger card, scaled from its top centre
 const k=Math.max(.7,Math.min(1.6,Math.max(1,(VB.h/VB.w)/1.34),(VB.w-40)/(W+40)));$("card").setAttribute("transform",`translate(450 ${y0}) scale(${k}) translate(-450 ${-y0})`);
 cardBot=y0+H*k;drawDots(false);
 const ci=$("cardin");ci.classList.remove("cardpop");void ci.getBoundingClientRect();ci.classList.add("cardpop");
}

/* seven felt dots under the card fill up with every bite */
function drawDots(pop){
 const y=cardBot+26,x0=450-(TARGET-1)*19;let s="";
 for(let i=0;i<TARGET;i++){
  const x=x0+i*38,on=i<eaten,last=pop&&i===eaten-1;
  s+=on?`<g${last?' class="dotpop"':""}>`+pic(`<circle cx="${x}" cy="${y}" r="13" fill="#c4562a" filter="url(#puff)"/><circle cx="${x}" cy="${y}" r="8" ${stitch("#f6d2b8")}/>`,x-24,y-24,48,56)+"</g>"
   :`<circle cx="${x}" cy="${y}" r="12" fill="#f6e8cc66" stroke="#fbe6c4" stroke-width="2.5" stroke-dasharray="4 4"/>`;
 }
 $("dots").innerHTML=s;
}
/* the caterpillar: a stuffed felt toy, fatter after every bite */
const rad=()=>28+eaten*2.6, step=()=>38+eaten*2.4, base=()=>110;
const headX=()=>base()+(eaten+1)*step();
const catY=()=>530-12-rad();
let catTok=0;
function drawCat(popLast){
 let s="";const r=rad(),cy=catY(),bot=cy+r+12;
 const IM=(f,x,w,ar)=>{const h=w*ar;return `<image href="../felt/${f}.webp" x="${x-w/2}" y="${bot-h}" width="${w}" height="${h}" preserveAspectRatio="none"/>`};
 const SEG=["munch-seg-orange","munch-seg-green","munch-seg-red"];
 for(let i=0;i<=eaten;i++){
  const x=base()+i*step(),last=popLast&&i===eaten;
  s+=`<g${last?' class="pop"':""}>`+IM(SEG[i%3],x,2*r*1.12,283/269)+`</g>`;
 }
 const hx=headX(),hr=r+9;
 s+=IM(busy?"munch-head-open":"munch-head",hx,2*hr*1.12,busy?365/290:328/256);
 const tok=++catTok;ready(s).then(()=>{if(tok===catTok){$("cat").innerHTML=s;$("cat").style.opacity=1}});
}

/* felt flowers in the grass, drawn once */
function flowers(){
 let s="";const F=[[40,470,"#c4562a"],[330,500,"#f3d27a"],[600,486,"#f6ead2"],[820,476,"#d9822b"],[-120,480,"#f3d27a"],[1000,490,"#c4562a"],[720,530,"#3f7f86"]];
 for(const [x,y,c] of F){s+=`<g filter="url(#puff)"><path d="M${x} ${y+8}v26" stroke="#6b6a2a" stroke-width="5" stroke-linecap="round"/>${[0,72,144,216,288].map(a=>`<circle cx="${x+Math.cos(a*Math.PI/180)*11}" cy="${y+Math.sin(a*Math.PI/180)*11}" r="9" fill="${c}"/>`).join("")}<circle cx="${x}" cy="${y}" r="7" fill="#7d4421"/></g>`}
 for(let i=0;i<9;i++){const x=-60+i*125;s+=`<path d="M${x} 556q4-22 0-34M${x+8} 556q8-16 12-26M${x-8} 556q-6-16-12-24" stroke="#8a7a2c" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#puff)"/>`}
 return s;
}

function place(i,n){const gap=n>4?150:n>3?175:200;return {x:450+(i-(n-1)/2)*gap-50*S,y:192}}
function plates(n){
 let s="";for(let i=0;i<n;i++){const c=place(i,n).x+50*S;const w=n>4?132:148,h=w*.564;s+=`<image href="../felt/soup-plate.webp" x="${c-w/2}" y="${326-h*.62}" width="${w}" height="${h}" preserveAspectRatio="none"/>`}
 $("plates").innerHTML=s;
}
function setFoods(){
 const n=goal;$("foods").innerHTML="";slots=[];plates(n);
 const ids=Object.keys(T).sort(()=>Math.random()-.5);
 const pick=ids.filter(i=>!lastFoods.includes(i)).slice(0,n);
 pick.forEach((id,i)=>addFood(id,i,n));
 lastFoods.length=0;lastFoods.push(...pick);
}
const RAYS=`<g class="rays" stroke="#ffe08a" stroke-width="8" stroke-linecap="round"><path d="M-8 10l-12-8M-10 52h-16M-6 90l-12 8M108 10l12-8M110 52h16M106 90l12 8M50-12v-14"/></g>`;
function addFood(id,i,n){
 const g=document.createElementNS(NS,"g");g.setAttribute("class","food");g.dataset.food=id;g.setAttribute("role","button");g.setAttribute("tabindex","0");g.setAttribute("aria-label",w(id));
 g.innerHTML=`${RAYS}<g class="lift">${fimg(FOODIMG[id],-8,-8,116,116)}</g><rect class="hit" x="-10" y="-10" width="120" height="120" rx="16"/>`;
 const p=place(i,n);g.style.transform=`translate(${p.x+50*S*.7}px,${p.y+100*S*.7}px) scale(${S*.3})`;g.style.opacity=0;
 $("foods").appendChild(g);const o={id,el:g,i,p};slots.push(o);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transform=`translate(${p.x}px,${p.y}px) scale(${S})`;g.style.opacity=1}));
 return o;
}
function munchSound(){[0,.16,.32].forEach(t=>{LP.noise(.09,.3,"bandpass",1400,2,t);LP.tone(180,.08,"square",.06,t,120)})}
function eat(slot){
 if(busy||!slots.includes(slot))return;busy=true;want=null;misses=0;
 document.querySelectorAll(".glow").forEach(x=>x.classList.remove("glow"));
 const id=slot.id,el=slot.el;drawCat(false);
 el.style.transform=`translate(${headX()+rad()*.4-12}px,${catY()-10}px) scale(.25)`;LP.sfx.whoosh();
 setTimeout(()=>{
  el.style.opacity=0;munchSound();eaten++;busy=true;drawCat(true);
  const r=$("cat").getBoundingClientRect();LP.burst(r.right-60,r.top+40,10);
  say(cap(w(id)),cap(hw(id)));drawDots(true);LP.say(L().thanks,true);
 },650);
 setTimeout(()=>{
  slot.el.remove();slots.splice(slots.indexOf(slot),1);
  if(eaten>=TARGET){fullBelly();return}
  // a new food takes the empty plate so there are always the same number to pick from
  const ids=Object.keys(T).filter(i=>!slots.some(s=>s.id===i));
  addFood(LP.next("munch-new",ids),slot.i,goal);
  busy=false;drawCat(false);
  ask();
 },1500);
}
function ask(){if(!slots.length)return;want=LP.next("munch-ask",slots.map(s=>s.id));misses=0;sayWhere()}
// grapes, cherries and blueberries need "where are" (Italian l'uva stays singular)
const plural=(id,lang)=>["grapes","cherries","blueberries"].includes(id)&&!(id==="grapes"&&lang==="it");
function sayWhere(speak){
 const a=L(),b=HL(),q=LP.age===2; // the youngest and the 3 to 4 year olds are asked politely, the oldest are asked where it is
 const ta=q?(plural(want,LP.lang)?a.whereP:a.where):a.please,tb=q?(plural(want,LP.home)?b.whereP:b.where):b.please;
 say(fill(ta,want),fill(tb,want,hw(want)),speak)}
function burp(t){LP.tone(150,.35,"sawtooth",.12,t,60);LP.noise(.3,.12,"lowpass",300,1,t)}
function fullBelly(){
 // after the seventh bite: a happy hum, a burp, a squeak and a yawn, with a wiggle, before the cocoon
 busy=true;want=null;$("foods").style.transition="opacity .5s";$("foods").style.opacity=0;$("plates").style.transition="opacity .5s";$("plates").style.opacity=.0;
 const c=$("cat");c.classList.add("shake");say("Mmmm...","",false);
 [0,.35,.7].forEach((t,i)=>LP.tone(220+i*60,.3,"sine",.12,t,260+i*60));
 burp(1.3);LP.tone(900,.15,"triangle",.1,2.1,1500);LP.tone(1100,.15,"triangle",.1,2.35,1800);
 LP.tone(420,.6,"sine",.1,2.9,160);
 setTimeout(()=>say("Hmpf!","",false),1300);setTimeout(()=>say("Hee hee!","",false),2100);setTimeout(()=>say("Aaah...","",false),2900);
 setTimeout(()=>{c.classList.remove("shake");metamorph()},3700);
}
function metamorph(){
 busy=true;want=null;
 // the caterpillar hangs a felt cocoon under the shelf, rests, and a butterfly flies out
 $("cat").style.transition="opacity .6s";$("cat").style.opacity=0;
 const c=$("cocoon");c.innerHTML=`<g class="wobble"><image href="../felt/munch-cocoon.webp" x="${450-47}" y="366" width="94" height="182" preserveAspectRatio="none"/></g>`;
 c.style.transition="opacity .6s";c.style.opacity=1;LP.sfx.twinkle();
 setTimeout(()=>{ // the cocoon is ready: tap it (or press any key) to help the butterfly out
  say(L().help,HL().help);stage="cocoon";
  c.insertAdjacentHTML("beforeend",`<ellipse class="ring" cx="450" cy="460" rx="62" ry="84" fill="none" stroke="#fff0c4" stroke-width="5" stroke-dasharray="9 8"/>`);
  relT=setTimeout(release,14000);
 },1600);
}
function release(){
 if(stage!=="cocoon")return;stage="play";clearTimeout(relT);
 const c=$("cocoon");LP.sfx.whoosh();c.classList.add("shake");
 setTimeout(()=>{c.classList.remove("shake");
  c.style.opacity=0;
  const f=$("fly");
  f.innerHTML=`<g id="bf" style="transition:transform 3.2s ease-in,opacity .4s;transform:translate(450px,420px)"><g class="flap"><image href="../felt/munch-butterfly.webp" x="-160" y="-128" width="320" height="255" preserveAspectRatio="none"/></g></g>`;
  f.style.opacity=1;LP.celebrate();say(L().butterfly,HL().butterfly);
  for(let i=0;i<10;i++)setTimeout(()=>LP.burst(innerWidth*(.25+Math.random()*.5),innerHeight*(.25+Math.random()*.4),8),i*160);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$("bf").style.transform="translate(760px,-60px)"}));
  setTimeout(()=>LP.say(L().bye,true),1800);
 },700);
 setTimeout(()=>{$("fly").style.opacity=0;newRound()},5100);
}
function newRound(){
 eaten=0;drawDots(false);goal=[3,4,5][Math.min(2,LP.age)];$("foods").style.opacity=1;$("plates").style.opacity=1;busy=false;drawCat(false);
 setFoods();want=null;
 say(L().title,HL().title,false);
 setTimeout(ask,600);
}

LP.init({langs:ALLLANGS,onLang:()=>{document.title=L().title;slots.forEach(s=>s.el.setAttribute("aria-label",w(s.id)));if(want)sayWhere(false);else if(stage==="cocoon")say(L().help,HL().help,false);else say(L().title,HL().title,false)},
 onAge:()=>{if(!busy&&eaten===0){goal=[3,4,5][Math.min(2,LP.age)];setFoods();want=null;ask()}}});
document.title=L().title;
const SHELF=`<rect x="40" y="318" width="820" height="16" rx="3" fill="url(#flute)" filter="url(#board)"/><rect x="40" y="332" width="820" height="38" rx="2" fill="url(#corr)" filter="url(#board)"/><rect x="52" y="370" width="16" height="60" fill="#7d4421" filter="url(#board)"/><rect x="832" y="370" width="16" height="60" fill="#7d4421" filter="url(#board)"/><rect x="40" y="368" width="820" height="10" rx="3" fill="#000" opacity=".12"/><path d="M40 333h820" stroke="#8d5a2b" stroke-width="2" opacity=".5"/>`;
$("shelf").innerHTML=`<image href="../felt/munch-table.webp" x="50" y="310" width="800" height="185" preserveAspectRatio="none"/>`;
goal=[3,4,5][Math.min(2,LP.age)];fit();drawCat(false);setFoods();
document.fonts&&document.fonts.ready.then(()=>{fit();drawCard()});
say(L().title,HL().title,false);
LP.start(L().title,()=>{LP.say(L().title);setTimeout(ask,1200)});
LP.mash((e)=>{
 if(e.target.closest&&e.target.closest("#say")){if(card.t)LP.say(card.t);return}
 if(stage==="cocoon"){release();return}
 if(busy||!slots.length)return;
 const g=e.target.closest&&e.target.closest("[data-food]");
 const pointed=g&&slots.find(s=>s.el===g);
 if(!want){ask();return}
 const asked=slots.find(s=>s.id===want);
 // 1 to 2 year olds can't get it wrong: tap a food, or anything else, or any key, and the caterpillar eats
 if(LP.age===0){eat(pointed||asked);return}
 const hint=()=>{misses++;if(misses>=(LP.age===1?1:2)&&asked)asked.el.classList.add("glow")};
 if(pointed){
  if(pointed.id===want)eat(pointed);
  else{pointed.el.classList.remove("no");void pointed.el.getBoundingClientRect();pointed.el.classList.add("no");say(LP.notQuite(),"");hint();setTimeout(()=>{if(want&&!busy)sayWhere()},1500)}
 }else{hint();sayWhere()}
});
</script>
