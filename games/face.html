.spot{position:absolute;border:0;padding:0;margin:0;border-radius:50%;background:none;cursor:pointer;font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.spot:focus-visible{outline:5px solid #ffd23f;outline-offset:3px}
.spot.glow{background:#ffd23f33;box-shadow:0 0 0 4px #ffd23f,0 0 22px #ffd23f;animation:glow .8s steps(2) infinite}
@keyframes glow{50%{background:#ffd23f77}}
.patch{position:absolute;left:0;top:0;border:4px dashed #E5553B;border-radius:50%;box-sizing:border-box;background-repeat:no-repeat;box-shadow:0 0 0 4px #FFF4DA,0 6px 10px #0007;background-clip:padding-box;pointer-events:none;z-index:900;will-change:transform}
.patch.mini{border-width:2px;box-shadow:0 0 0 2px #FFF4DA,0 2px 3px #0006;position:absolute}
#tray{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:800;display:flex;gap:calc(var(--sl)*.16);padding:calc(var(--sl)*.16) calc(var(--sl)*.28);background:#f6ead0;border:2px dashed #b8401f88;border-radius:calc(var(--sl)*.7);box-shadow:0 3px 0 #c9b583,0 6px 12px #0005}

.slot::before{content:"";position:absolute;inset:3px;border-radius:50%;border:3px dashed #b8401f55;box-sizing:border-box}
.slot.on::before{display:none}
.slot.on{animation:slotpop .5s steps(4)}
@keyframes slotpop{0%{transform:scale(.4)}45%{transform:scale(1.35) rotate(8deg)}75%{transform:scale(.92)}}

@media (prefers-reduced-motion:reduce){#idle,#rock.sway,#rock.dance,.slot.on,.spot.glow{animation:none}#kid.out,#kid.in.go{transition:none}}

const KIDS=[{"img":"peach","w":318,"h":547,"parts":{"hair":[[150,58,52]],"eyes":[[113,127,20],[200,127,20]],"ears":[[38,142,24],[275,138,24]],"nose":[[157,148,17]],"mouth":[[158,180,22]],"tummy":[[160,305,42]],"hands":[[18,385,28],[300,385,28]],"knees":[[108,455,28],[205,455,28]],"feet":[[100,525,30],[200,525,30]]}},{"img":"deep","w":328,"h":555,"parts":{"hair":[[152,55,55]],"eyes":[[112,135,20],[205,135,20]],"ears":[[54,160,24],[262,160,24]],"nose":[[162,160,17]],"mouth":[[160,190,22]],"tummy":[[160,320,42]],"hands":[[22,400,28],[312,400,28]],"knees":[[112,465,28],[202,465,28]],"feet":[[117,532,30],[212,532,30]]}},{"img":"tan","w":324,"h":546,"parts":{"hair":[[160,50,55]],"eyes":[[114,125,20],[194,127,20]],"ears":[[44,150,24],[274,150,24]],"nose":[[159,148,17]],"mouth":[[160,180,22]],"tummy":[[154,300,42]],"hands":[[17,395,28],[309,395,28]],"knees":[[109,445,26],[199,445,26]],"feet":[[129,520,28],[214,520,28]]}},{"img":"pale","w":319,"h":567,"parts":{"hair":[[150,70,52]],"eyes":[[110,138,20],[197,138,20]],"ears":[[38,185,24],[268,185,24]],"nose":[[153,168,17]],"mouth":[[158,192,22]],"tummy":[[155,335,42]],"hands":[[20,400,28],[298,400,28]],"knees":[[112,460,28],[205,460,28]],"feet":[[115,548,28],[210,548,28]]}}];
const P=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const IDS=["hair","eyes","ears","nose","mouth","hands","tummy","knees","feet"];

const w=id=>(P[id][LP.lang]||P[id].en);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

 eyes:()=>{LP.tone(1400,.07,"sine",.18);LP.tone(1750,.07,"sine",.18,.11)},

 hands:()=>{LP.noise(.07,.3,"bandpass",1800,.8,0);LP.noise(.07,.3,"bandpass",1800,.8,.17)},

function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function label(){document.querySelectorAll("[data-part]").forEach(g=>g.setAttribute("aria-label",w(g.dataset.part).w))}

/* ---------- layout: the kid is placed by image size, the tray along the floor ---------- */
function layout(){
 const W=innerWidth,H=innerHeight;
 const sl=Math.max(32,Math.min(60,Math.floor(Math.min((W-24)/10.2,H/11))));
 document.documentElement.style.setProperty("--sl",sl+"px");
 const topH=Math.max(10,0)+clampN(W*.042,22,40)*1.5+14,trayH=sl*1.32+22;
 const availH=Math.max(160,H-topH-trayH-8);
 S=Math.min(availH/kid.h,(W*.9)/kid.w);
 const kw=kid.w*S,kh=kid.h*S,el=$("kid");
 el.style.cssText+=`;left:${(W-kw)/2}px;top:${topH+(availH-kh)/2+4}px;width:${kw}px;height:${kh}px`;
 placeSpots();
}
const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
function placeSpots(){
 document.querySelectorAll(".spot").forEach(b=>{
  const [cx,cy,r]=b.dataset.reg.split(",").map(Number),k=1.3;
  b.style.left=(cx-r*k)*S+"px";b.style.top=(cy-r*k)*S+"px";b.style.width=b.style.height=(r*k*2*S)+"px";
 });
}

/* ---------- the felt kid ---------- */
function setKid(first){
 let n;do{n=Math.floor(Math.random()*KIDS.length)}while(n===kidN&&KIDS.length>1);kidN=n;kid=KIDS[n];
 $("kidimg").src="../felt/nose-kid-"+kid.img+".webp";
 document.querySelectorAll(".spot").forEach(b=>b.remove());
 const idle=$("idle");
 IDS.forEach(id=>kid.parts[id].forEach(reg=>{
  const b=document.createElement("button");b.type="button";b.className="spot";b.dataset.part=id;b.dataset.reg=reg.join(",");
  b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.stopPropagation();e.preventDefault();tapPart(id)}});
  idle.appendChild(b);
 }));
 have=new Set();want=null;misses=0;streak=0;busy=false;
 $("rock").classList.remove("sway","dance");
 buildTray();layout();label();
}
function buildTray(){
 const t=$("tray");t.innerHTML="";
 IDS.forEach(id=>{const s=document.createElement("button");s.type="button";s.className="slot";s.dataset.slot=id;
  s.addEventListener("keydown",e=>{e.stopPropagation()});
  s.addEventListener("click",()=>{if(have.has(id)&&!busy){say(id)}});t.appendChild(s)});
}
function say(id,noBubble){if(!noBubble)bubble(w(id).w);LP.say(w(id).w);LPLearn.heard(id,LP.lang);later(FX[id],220)}

/* a round felt badge showing a zoomed bit of the real kid */
function patch(reg,D,cls){
 const [cx,cy,r]=reg,inner=D-(cls==="mini"?4:8),k=inner/(r*2*1.35);
 const p=document.createElement("div");p.className="patch"+(cls?" "+cls:"");
 p.style.width=p.style.height=D+"px";
 p.style.backgroundImage=`url(../felt/nose-kid-${kid.img}.webp)`;
 p.style.backgroundSize=`${kid.w*k}px ${kid.h*k}px`;
 p.style.backgroundPosition=`${inner/2-cx*k}px ${inner/2-cy*k}px`;
 return p;
}
function stageXY(reg){ // centre of a region in page pixels
 const r=$("kid").getBoundingClientRect();return [r.left+reg[0]*S,r.top+reg[1]*S];
}
const A=(el,kf,o)=>reduce?{finished:Promise.resolve()}:el.animate(kf,Object.assign({fill:"forwards"},o));

/* the part pops out as a felt badge; the first time it is found it flies to its tray slot */
function pop(id,collect){
 const regs=kid.parts[id],D=clampN(regs[0][2]*2*S*2.3,76,150),flights=[];
 const slot=document.querySelector(`.slot[data-slot="${id}"]`),sr=slot.getBoundingClientRect(),sc=[sr.left+sr.width/2,sr.top+sr.height/2];
 regs.forEach((reg,i)=>{
  const [x,y]=stageXY(reg),p=patch(reg,D);document.body.appendChild(p);
  const mini=regs.length>1?sr.width*.6:sr.width*.84,dx=regs.length>1?(i?1:-1)*sr.width*.2:0;
  const base=`translate(${x-D/2}px,${y-D/2}px)`;
  p.style.transform=base+" scale(.2)";
  const a=A(p,[{transform:base+" scale(.2)"},{transform:base+" scale(1.25) rotate(-6deg)"},{transform:base+" scale(1) rotate(3deg)"},{transform:base+" scale(1.08) rotate(-2deg)"},{transform:base+" scale(1)"}],{duration:520,easing:"steps(5)"});
  const done=a.finished.then(()=>new Promise(r=>setTimeout(r,collect?260:120))).then(()=>{
   if(collect){
    const to=`translate(${sc[0]+dx-D/2}px,${sc[1]-D/2}px) scale(${mini/D})`;
    return A(p,[{transform:base+" scale(1)"},{transform:to}],{duration:540,easing:"steps(7)"}).finished;
   }
   return A(p,[{transform:base+" scale(1)",opacity:1},{transform:base+" scale(.2)",opacity:0}],{duration:300,easing:"steps(3)"}).finished;
  }).then(()=>p.remove());
  flights.push(done);
 });
 if(collect)Promise.all(flights).then(()=>{
  slot.innerHTML="";slot.classList.add("on");
  const D2=sr.width,m=regs.length>1?D2*.6:D2*.84;
  regs.forEach((reg,i)=>{const p=patch(reg,m,"mini");p.style.left=(regs.length>1?(i?D2*.4:0):D2*.08)+"px";p.style.top=(regs.length>1?(i?D2*.4:0):D2*.08)+"px";p.style.transform="none";p.style.zIndex=1;p.style.pointerEvents="none";slot.appendChild(p)});
  LP.sfx.twinkle();
 });
}

function glowPart(id,on){document.querySelectorAll(`[data-part="${id}"]`).forEach(b=>b.classList.toggle("glow",on))}
function boing(){const r=$("idle");r.style.transition="transform .12s";r.style.transform="scale(1.03)";setTimeout(()=>{r.style.transform="";setTimeout(()=>r.style.transition="",150)},130)}

function tapPart(id){
 if(busy){LP.sfx.pop();return}
 document.querySelectorAll(".glow").forEach(x=>x.classList.remove("glow"));
 boing();
 if(want){
  if(id===want){
   if(misses===0)LPLearn.asked(id,LP.lang,true);streak++;want=null;misses=0;
   LP.sfx.chime();pop(id,!have.has(id));have.add(id);
   const r=stageXY(kid.parts[id][0]);LP.burst(r[0],r[1],18);
   bubble(L().yes+" "+L().show);LP.say(L().yes);LP.say(L().show,true);later(()=>FX[id](),300);
   if(LP.age>=2&&streak>=3)$("rock").classList.add("sway");
   if(have.size>=IDS.length){later(finale,2600);return}
   later(ask,4000);return;
  }
  LPLearn.asked(want,LP.lang,false);misses++;streak=Math.max(0,streak-1);if(streak<3)$("rock").classList.remove("sway");
  LP.sfx.pop();pop(id,false);bubble(LP.notQuite());LP.say(LP.notQuite());
  if(misses>=2)later(()=>glowPart(want,true),900);
  later(()=>{if(want){bubble(w(want).q);LP.say(w(want).q)}},1700);
  return;
 }
 const first=!have.has(id);
 pop(id,first);have.add(id);say(id);
 if(have.size>=IDS.length&&first)later(finale,2600);
}
function ask(){
 if(busy)return;
 if(LP.age<1&&LPLearn.summary(LP.lang).met<8){want=null;bubble(L().title);return}
 const left=IDS.filter(i=>!have.has(i)),pool=(left.length?left:IDS).filter(i=>i!==lastPart);
 want=LPLearn.pick(pool.length?pool:IDS,x=>x,1,LP.lang)[0];lastPart=want;misses=0;
 bubble(w(want).q);LP.say(w(want).q);
}

/* all nine in the tray: the kid dances, every part says its word, then a new kid walks on */
function finale(){
 busy=true;want=null;timers.forEach(clearTimeout);timers=[];
 const rock=$("rock");rock.classList.remove("sway");rock.classList.add("dance");
 LP.celebrate();bubble(L().title);
 const order=["hair","eyes","ears","nose","mouth","hands","tummy","knees","feet"];
 order.forEach((id,i)=>later(()=>{
  const r=stageXY(kid.parts[id][0]);LP.burst(r[0],r[1],10);bubble(w(id).w);LP.say(w(id).w,i>0);later(FX[id],200);pop(id,false);
 },900+i*1250));
 later(()=>{rock.classList.remove("dance");LP.sfx.chime()},900+order.length*1250);
 later(()=>{const k=$("kid");k.classList.add("out")},900+order.length*1250+700);
 later(()=>{
  const k=$("kid");k.classList.remove("out");k.classList.add("in");setKid();void k.offsetWidth;k.classList.add("go");
  later(()=>{k.classList.remove("in","go");bubble(L().title);later(ask,500)},800);
 },900+order.length*1250+1500);
}

LP.init({langs:ALLLANGS,
 onLang:()=>{label();document.title=L().title;bubble(want?w(want).q:L().title)},
 onAge:()=>{want=null;$("rock").classList.remove("sway");bubble(L().title)}});
setKid();document.title=L().title;bubble(L().title);
addEventListener("resize",()=>{layout()});
LP.start(L().title,()=>later(ask,400));
LP.mash((e)=>{
 if(busy)return;
 const g=e.target.closest&&e.target.closest("[data-part]");
 if(g){tapPart(g.dataset.part);return}
 // a tap off the hotspots: little ones get a part shown, older ones are pointed to the answer
 if(want&&LP.age<2){tapPart(want);return}
 if(want){glowPart(want,true);return}
 const left=IDS.filter(i=>!have.has(i));
 tapPart(LP.next("face",left.length?left:IDS));
});
</script>
