<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuckuck</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:dark;--ink:#fff;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#241812;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;overflow:hidden}
/* the cardboard puppet theatre: a photographed felt and cardboard set, placed by script so the floor lines up with the hiding places */
#plate{position:absolute;left:0;top:0;width:100%;height:100%;background:url(../felt/peek-stage.webp) 0 0/100% 100% no-repeat}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,#0000 55%,#1a0f0a99 100%)}
.top{position:absolute;left:0;right:0;top:max(10px,env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:800;pointer-events:none;padding:0 12px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s;text-align:center;max-width:94vw}
#bubble.bump{transform:scale(1.08)}
#set{position:absolute;inset:0}
.spot{position:absolute;border:0;padding:0;margin:0;background:none;cursor:pointer;font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.spot:focus-visible{outline:5px solid #ffd23f;outline-offset:6px;border-radius:18px}
.spot .shadow{position:absolute;left:-6%;right:-6%;bottom:-5%;height:16%;background:radial-gradient(ellipse at center,#000a 0,#0000 70%);pointer-events:none}
.spot .piece{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50% 100%;transition:transform .36s steps(3);pointer-events:none;filter:drop-shadow(0 4px 5px #0006)}
/* a friend rises from behind the piece: the rise box cuts it off at the floor line */
.spot .rise{position:absolute;left:50%;bottom:0;width:calc(var(--u)*1.7);height:calc(var(--u)*3);transform:translateX(-50%);overflow:hidden;pointer-events:none}
.spot .fr{position:absolute;left:50%;bottom:0;height:calc(var(--u)*1.05);transform:translate(-50%,calc(var(--u)*1.15));transition:transform .42s steps(5)}
.spot .fr img{display:block;height:100%;width:auto;filter:drop-shadow(0 5px 6px #0007);transform-origin:50% 100%}
.spot.open .fr{transform:translate(-50%,calc(var(--h)*-.5))}
.spot.open .fr img{animation:bob .72s steps(1) infinite}
@keyframes bob{0%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-2%)}}
.spot.box.open .piece{transform:rotate(-4deg) translate(-6%,1%)}
.spot.basket.open .piece{transform:rotate(3deg) translate(6%,1%)}
.spot.bush.open .piece{transform:scale(1.07,.93)}
.spot.blanket.open .piece{transform:translateY(15%) rotate(6deg) scaleY(.9)}
.spot.mushroom.open .piece{transform:scale(.94,1.06) rotate(-3deg)}
.spot.hay.open .piece{transform:translateX(7%) rotate(3deg)}
.spot.poke .piece{animation:poke .34s steps(1)}
@keyframes poke{0%{transform:translateX(-3%) rotate(-2deg)}33%{transform:translateX(3%) rotate(2deg)}66%{transform:translateX(-2%)}}
.spot.hint .piece{animation:wiggle .6s steps(1) 3}
@keyframes wiggle{0%{transform:rotate(-5deg) translateY(-2%)}25%{transform:rotate(5deg)}50%{transform:rotate(-4deg) translateY(-3%)}75%{transform:rotate(4deg)}}
.spot.bow .fr img{animation:bow .6s steps(1) infinite}
@keyframes bow{0%{transform:rotate(0)}50%{transform:rotate(10deg) translateY(4%)}}
.traveler{position:absolute;left:0;top:0;z-index:900;pointer-events:none;transform-origin:50% 100%;display:none}
.traveler img{display:block;height:100%;width:auto;filter:drop-shadow(0 6px 6px #0007)}
#stars{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:800;display:flex;gap:6px;padding:6px 16px;background:#f6ead0;border:2px dashed #b8401f88;border-radius:26px;box-shadow:0 3px 0 #c9b583,0 6px 12px #0005;pointer-events:none}
#stars img{width:clamp(24px,4.2vw,36px);height:auto;display:block;filter:grayscale(1) brightness(.62) opacity(.5)}
#stars img.on{filter:none;animation:starpop .5s steps(4)}
@keyframes starpop{0%{transform:scale(.3) rotate(-30deg)}40%{transform:scale(1.5) rotate(12deg)}70%{transform:scale(.9)}}
#curtainbox{position:absolute;z-index:700;overflow:hidden;pointer-events:none}
#curtain{position:absolute;inset:0;background:url(../felt/peek-curtain.webp) center/100% 100% no-repeat;transform:translateY(-103%);transition:transform 1.1s steps(9)}
#curtain.down{transform:none}
.spot.jumped .fr{visibility:hidden}
@media (prefers-reduced-motion:reduce){.spot .fr,.spot .piece,#curtain{transition:none}.spot .fr img,.spot.poke .piece,.spot.hint .piece,#stars img.on{animation:none}}
</style>
</head>
<body>
<script>window.LP_GAME="peek"</script><script src="voice.js"></script><script src="learn.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="sounds.js"></script><script src="audio/sfx.peek.js"></script><script src="look.js"></script>

const DATA={
 words:[

  {id:"pig",s:{en:"Oink oink!",nl:"Knor knor!",pl:"Chrum chrum!",sv:"Nöff nöff!",el:"Γκρουν γκρουν!",zh:"哼哼！",ar:"غرغر!",ja:"ブーブー！",ko:"꿀꿀!",ru:"Хрю-хрю!",tr:"Hoh hoh!",hi:"घुर्र घुर्र!",de:"Grunz grunz!",es:"¡Oinc oinc!",fr:"Groin groin !",it:"Oink oink!",pt:"Oinc oinc!"},e:"🐷",snd:"pig",en:"the pig",nl:"het varken",pl:"świnia",sv:"grisen",el:"το γουρούνι",zh:"小猪",ar:"الخنزير",ja:"ぶた",ko:"돼지",ru:"свинья",tr:"domuz",hi:"सूअर",de:"das Schwein",es:"el cerdo",fr:"le cochon",it:"il maiale",pt:"o porco"},
  {id:"duck",s:{en:"Quack quack!",nl:"Kwak kwak!",pl:"Kwa kwa!",sv:"Kvack kvack!",el:"Κουάκ κουάκ!",zh:"嘎嘎！",ar:"بط بط!",ja:"ガーガー！",ko:"꽥꽥!",ru:"Кря-кря!",tr:"Vak vak!",hi:"क्वैक क्वैक!",de:"Quak quak!",es:"¡Cuac cuac!",fr:"Coin coin !",it:"Qua qua!",pt:"Quá quá!"},e:"🦆",snd:"duck",en:"the duck",nl:"de eend",pl:"kaczka",sv:"ankan",el:"η πάπια",zh:"鸭子",ar:"البطة",ja:"あひる",ko:"오리",ru:"утка",tr:"ördek",hi:"बत्तख",de:"die Ente",es:"el pato",fr:"le canard",it:"l'anatra",pt:"o pato"},
  {id:"sheep",s:{en:"Baa baa!",nl:"Mee mee!",pl:"Bee bee!",sv:"Bää bää!",el:"Μπεεε μπεεε!",zh:"咩咩！",ar:"ماع ماع!",ja:"メェー！",ko:"매에!",ru:"Бе-е-е!",tr:"Mee mee!",hi:"में में!",de:"Mäh mäh!",es:"¡Bee bee!",fr:"Bêê bêê !",it:"Bee bee!",pt:"Méé méé!"},e:"🐑",snd:"sheep",en:"the sheep",nl:"het schaap",pl:"owca",sv:"fåret",el:"το πρόβατο",zh:"绵羊",ar:"الخروف",ja:"ひつじ",ko:"양",ru:"овца",tr:"koyun",hi:"भेड़",de:"das Schaf",es:"la oveja",fr:"le mouton",it:"la pecora",pt:"a ovelha"},
  {id:"horse",s:{en:"Neigh!",nl:"Hihihi!",pl:"I-ha-ha!",sv:"Gnägg!",el:"Ιιιι!",zh:"嘶嘶！",ar:"صهيل!",ja:"ヒヒーン！",ko:"히잉!",ru:"И-го-го!",tr:"Ihaaa!",hi:"हिन हिन!",de:"Iiih!",es:"¡Iiiih!",fr:"Hiii !",it:"Iiih!",pt:"Iiirr!"},e:"🐴",snd:"horse",en:"the horse",nl:"het paard",pl:"koń",sv:"hästen",el:"το άλογο",zh:"马",ar:"الحصان",ja:"うま",ko:"말",ru:"лошадь",tr:"at",hi:"घोड़ा",de:"das Pferd",es:"el caballo",fr:"le cheval",it:"il cavallo",pt:"o cavalo"},
  {id:"chicken",s:{en:"Cluck cluck!",nl:"Tok tok!",pl:"Ko ko ko!",sv:"Pock pock!",el:"Κο κο κο!",zh:"咯咯！",ar:"قاق قاق!",ja:"コケコッコー！",ko:"꼬꼬댁!",ru:"Ко-ко-ко!",tr:"Gıt gıt!",hi:"कुक कुक!",de:"Gack gack!",es:"¡Co co co!",fr:"Cot cot !",it:"Coccodè!",pt:"Có có có!"},e:"🐔",snd:"chicken",en:"the chicken",nl:"de kip",pl:"kura",sv:"hönan",el:"η κότα",zh:"小鸡",ar:"الدجاجة",ja:"にわとり",ko:"닭",ru:"курица",tr:"tavuk",hi:"मुर्गी",de:"das Huhn",es:"la gallina",fr:"la poule",it:"la gallina",pt:"a galinha"},
  {id:"cat",s:{en:"Meow!",nl:"Miauw!",pl:"Miau!",sv:"Mjau!",el:"Νιάου!",zh:"喵！",ar:"مياو!",ja:"ニャー！",ko:"야옹!",ru:"Мяу!",tr:"Miyav!",hi:"म्याऊँ!",de:"Miau!",es:"¡Miau!",fr:"Miaou !",it:"Miao!",pt:"Miau!"},e:"🐱",snd:"cat",en:"the cat",nl:"de kat",pl:"kot",sv:"katten",el:"η γάτα",zh:"猫",ar:"القطة",ja:"ねこ",ko:"고양이",ru:"кошка",tr:"kedi",hi:"बिल्ली",de:"die Katze",es:"el gato",fr:"le chat",it:"il gatto",pt:"o gato"},
  {id:"dog",s:{en:"Woof woof!",nl:"Woef woef!",pl:"Hau hau!",sv:"Voff voff!",el:"Γάβ γάβ!",zh:"汪汪！",ar:"هاو هاو!",ja:"ワンワン！",ko:"멍멍!",ru:"Гав-гав!",tr:"Hav hav!",hi:"भौं भौं!",de:"Wau wau!",es:"¡Guau guau!",fr:"Ouaf ouaf !",it:"Bau bau!",pt:"Au au!"},e:"🐶",snd:"dog",en:"the dog",nl:"de hond",pl:"pies",sv:"hunden",el:"ο σκύλος",zh:"狗",ar:"الكلب",ja:"いぬ",ko:"강아지",ru:"собака",tr:"köpek",hi:"कुत्ता",de:"der Hund",es:"el perro",fr:"le chien",it:"il cane",pt:"o cão"},
  {id:"mouse",s:{en:"Squeak!",nl:"Piep!",pl:"Pi pi!",sv:"Pip pip!",el:"Ιι ιι!",zh:"吱吱！",ar:"صيصي!",ja:"チュー！",ko:"찍찍!",ru:"Пи-пи!",tr:"Çik çik!",hi:"चीं चीं!",de:"Piep piep!",es:"¡Ii ii!",fr:"Couic !",it:"Squit!",pt:"Quic quic!"},e:"🐭",snd:"mouse",en:"the mouse",nl:"de muis",pl:"mysz",sv:"musen",el:"το ποντίκι",zh:"老鼠",ar:"الفأرة",ja:"ねずみ",ko:"쥐",ru:"мышь",tr:"fare",hi:"चूहा",de:"die Maus",es:"el ratón",fr:"la souris",it:"il topo",pt:"o rato"},
  {id:"rabbit",e:"🐰",snd:"rabbit",en:"the rabbit",nl:"het konijn",pl:"królik",sv:"kaninen",el:"το κουνέλι",zh:"兔子",ar:"الأرنب",ja:"うさぎ",ko:"토끼",ru:"кролик",tr:"tavşan",hi:"खरगोश",de:"der Hase",es:"el conejo",fr:"le lapin",it:"il coniglio",pt:"o coelho"},
  {id:"frog",s:{en:"Ribbit!",nl:"Kwaak!",pl:"Rech rech!",sv:"Kvack!",el:"Κρρρ κρρρ!",zh:"呱呱！",ar:"نق نق!",ja:"ケロケロ！",ko:"개굴개굴!",ru:"Ква-ква!",tr:"Vrak vrak!",hi:"टर्र टर्र!",de:"Quak quak!",es:"¡Cua cua!",fr:"Coa coa !",it:"Gra gra!",pt:"Croac!"},e:"🐸",snd:"frog",en:"the frog",nl:"de kikker",pl:"żaba",sv:"grodan",el:"ο βάτραχος",zh:"青蛙",ar:"الضفدع",ja:"かえる",ko:"개구리",ru:"лягушка",tr:"kurbağa",hi:"मेंढक",de:"der Frosch",es:"la rana",fr:"la grenouille",it:"la rana",pt:"a rã"},
  {id:"teddy",e:"🧸",snd:"teddy",en:"the teddy",nl:"de teddybeer",pl:"miś",sv:"nallen",el:"το αρκουδάκι",zh:"泰迪熊",ar:"الدبدوب",ja:"くまのぬいぐるみ",ko:"곰인형",ru:"мишка",tr:"oyuncak ayı",hi:"टेडी",de:"der Teddy",es:"el osito",fr:"le nounours",it:"l'orsacchiotto",pt:"o ursinho"}
 ],
 lines:{
  en:{title:"Peekaboo",peek:"Peekaboo!",where:"Where is {w}?",found:"There's {w}!"},nl:{title:"Kiekeboe",peek:"Kiekeboe!",where:"Waar is {w}?",found:"Daar is {w}!"},pl:{title:"Akuku",peek:"Akuku!",where:"Gdzie jest {w}?",found:"Oto {w}!"},sv:{title:"Tittut",peek:"Tittut!",where:"Var är {w}?",found:"Där är {w}!"},el:{title:"Κου-κου",peek:"Κου-κου!",where:"Πού είναι {w};",found:"Να {w}!"},zh:{title:"躲猫猫",peek:"躲猫猫！",where:"{w}在哪里？",found:"{w}在这里！"},ar:{title:"بيك أبو",peek:"بيك أبو!",where:"أين {w}؟",found:"هذا {w}!"},ja:{title:"いないいないばあ",peek:"いないいないばあ！",where:"{w}はどこ？",found:"{w}だ！"},ko:{title:"까꿍",peek:"까꿍!",where:"{w} 어디 있어?",found:"{w} 여기 있다!"},ru:{title:"Ку-ку",peek:"Ку-ку!",where:"Где {w}?",found:"Вот {w}!"},tr:{title:"Cee",peek:"Cee!",where:"{w} nerede?",found:"İşte {w}!"},hi:{title:"छुपम छुपाई",peek:"छुपम छुपाई!",where:"{w} कहाँ है?",found:"यह रहा {w}!"},
  de:{title:"Kuckuck",peek:"Kuckuck!",where:"Wo ist {w}?",found:"Da ist {w}!"},
  es:{title:"Cucú",peek:"¡Cucú!",where:"¿Dónde está {w}?",found:"¡Aquí está {w}!"},
  fr:{title:"Coucou",peek:"Coucou !",where:"Où est {w} ?",found:"Voilà {w} !"},
  it:{title:"Cucù",peek:"Cucù!",where:"Dov'è {w}?",found:"Ecco {w}!"},
  pt:{title:"Cucu",peek:"Cucu!",where:"Onde está {w}?",found:"Aqui está {w}!"}
 }
};
const ANIMALS=DATA.words.map(w=>w.id);
const SPOTS=["box","basket","bush","blanket","mushroom","hay"];
/* a=width/height of the felt piece, k=how tall it stands next to the others */
const PIECE={box:{a:420/364,k:.9},basket:{a:420/353,k:.85},bush:{a:409/339,k:.92},blanket:{a:324/340,k:1.04},mushroom:{a:317/340,k:1},hay:{a:333/277,k:.82}};
const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const STEP=1000/12; // stop motion: puppets are moved about 12 times a second
let hidden={},open={},slotOf={},spotEl={},want=null,pinned=null,misses=0,streak=0,found=0,busy=false,gen=0,lastTap=0,G=null;

const L=()=>LP.t(DATA.lines);
const word=id=>W[id][LP.lang]||W[id].en;
const snd=id=>(W[id].s&&(W[id].s[LP.lang]||W[id].s.en))||"";
const fill=(tpl,id)=>tpl.replace("{w}",word(id));
function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function tween(ms,fn,done){const n=Math.max(2,Math.round(ms/STEP));let i=0;const iv=setInterval(()=>{i++;fn(i/n);if(i>=n){clearInterval(iv);done&&done()}},STEP)}

/* ---- the set: a cardboard puppet theatre. Wide screens place the pieces on its floor; tall phones use two columns ---- */
function geometry(){
 const Wd=innerWidth,Ht=innerHeight;
 if(Wd/Ht<1.1){
  const s=Ht/768,ox=(Wd-1376*s)/2,u=Math.min(Wd*.3,Ht*.165),slots=[];
  [.40,.63,.86].forEach(r=>[.27,.73].forEach(c=>slots.push({x:Wd*c,y:Ht*r,u})));
  return {tall:true,s,ox,oy:0,slots};
 }
 const s=Math.min(Wd/1100,Ht/630),ox=(Wd-1376*s)/2,oy=Ht/2-427*s;
 const P=(x,y,u)=>({x:ox+x*s,y:oy+y*s,u:u*s});
 return {tall:false,s,ox,oy,slots:[P(320,598,165),P(668,598,165),P(1016,598,165),P(494,692,205),P(842,692,205),P(1140,692,205)]};
}
function place(sp,dx,dy){
 dx=dx||0;dy=dy||0;
 const el=spotEl[sp],sl=G.slots[slotOf[sp]],pc=PIECE[sp],h=sl.u*pc.k,w=h*pc.a;
 el.style.cssText=`left:${sl.x-w/2+dx}px;top:${sl.y-h+dy}px;width:${w}px;height:${h}px;z-index:${Math.round(sl.y+dy)};--u:${sl.u}px;--h:${h}px`;
}
function layout(){
 G=geometry();
 const p=$("plate").style;p.left=G.ox+"px";p.top=G.oy+"px";p.width=1376*G.s+"px";p.height=768*G.s+"px";
 const c=$("curtainbox").style;
 if(G.tall){c.left="0";c.top="0";c.width="100%";c.height="100%"}
 else{c.left=G.ox+165*G.s+"px";c.top=G.oy+55*G.s+"px";c.width=1055*G.s+"px";c.height=665*G.s+"px"}
 SPOTS.forEach(sp=>place(sp));
}
function setFriend(sp,id){spotEl[sp].querySelector(".fr img").src=`../felt/peek-${id}.webp`}
function assign(sp,id){hidden[sp]=id;setFriend(sp,id)}
function build(){
 $("set").innerHTML="";
 SPOTS.forEach((sp,i)=>{
  slotOf[sp]=i;open[sp]=false;
  const b=document.createElement("button");b.type="button";b.className="spot "+sp;b.dataset.spot=sp;b.setAttribute("data-tap","");b.setAttribute("aria-label",{box:"rock",basket:"logs"}[sp]||sp);
  b.innerHTML=`<div class="shadow"></div><div class="rise"><div class="fr"><img alt="" draggable="false"></div></div><img class="piece" src="../felt/peek-${sp}.webp" alt="" draggable="false">`;
  $("set").appendChild(b);spotEl[sp]=b;
 });
 const tv=document.createElement("div");tv.className="traveler";tv.innerHTML='<img alt="" draggable="false">';$("set").appendChild(tv);
 $("stars").innerHTML=Array(6).fill('<img src="../felt/sky-star.webp" alt="">').join("");
 layout();
 [...ANIMALS.map(a=>"peek-"+a),...SPOTS.map(s=>"peek-"+s)].forEach(n=>{new Image().src=`../felt/${n}.webp`});
}
addEventListener("resize",()=>G&&layout());

/* ---- friends and sounds ---- */
function shuffleFriends(){const ids=LPLearn.pick(ANIMALS,x=>x,SPOTS.length,LP.lang);SPOTS.forEach((s,i)=>assign(s,ids[i]))}
function animalSound(id){
 const w=W[id];if(LP.sample(w.snd,1.5))return;
 const T=LP.tone;
 if(id==="cat"){T(620,.5,"triangle",.18,0,880);T(880,.4,"triangle",.14,.3,520)}
 else if(id==="dog"){LP.noise(.12,.25,"bandpass",900,2);T(420,.14,"square",.14,0,200);LP.noise(.12,.25,"bandpass",900,2,.22);T(420,.14,"square",.14,.22,200)}
 else if(id==="mouse"){T(2200,.07,"sine",.1,0,2800);T(2600,.07,"sine",.09,.1,2000)}
 else if(id==="frog"){T(180,.09,"square",.12);T(160,.12,"square",.12,.13)}
 else if(id==="rabbit"){LP.sfx.boing()}
 else LP.sfx.twinkle();
}
function burstAt(spot,n){const r=spotEl[spot].getBoundingClientRect();LP.burst(r.left+r.width/2,r.top+r.height*.1,n)}
function poke(spot){const el=spotEl[spot];el.classList.remove("poke");void el.offsetWidth;el.classList.add("poke");setTimeout(()=>el.classList.remove("poke"),380)}

/* ---- progress: six felt stars, then the curtain call ---- */
function paintStars(){[...$("stars").children].forEach((x,i)=>x.className=i<found?"on":"")}
function addStar(){found=Math.min(6,found+1);paintStars();const im=$("stars").children[found-1];if(im){im.classList.remove("on");void im.offsetWidth;im.classList.add("on")}}

function openSpot(spot){
 const el=spotEl[spot],id=hidden[spot];
 el.classList.add("open");el.classList.remove("hint","jumped");open[spot]=true;el.setAttribute("aria-label",word(id));
}
function closeSpot(spot){
 const el=spotEl[spot];if(!el)return;
 el.classList.remove("open","bow");el.setAttribute("aria-label",spot);open[spot]=false;
 // a new friend sneaks in while it is closed, unless it is the one we are hunting
 setTimeout(()=>{
  if(open[spot]||hidden[spot]===want||hidden[spot]===pinned)return;
  const used=new Set(Object.values(hidden)),free=ANIMALS.filter(i=>!used.has(i));
  if(free.length)assign(spot,LPLearn.pick(free,x=>x,1,LP.lang)[0]);
 },520);
}
function closeAll(){SPOTS.forEach(s=>open[s]&&closeSpot(s))}

function say(id){bubble(word(id)+(snd(id)?"  "+snd(id):""));LP.say(word(id));LPLearn.heard(id,LP.lang);setTimeout(()=>animalSound(id),180);if(snd(id))setTimeout(()=>LP.say(snd(id),true),1700)}

function reveal(spot){
 if(open[spot]){ // tapping a friend that is already out: it does its noise again
  if(Date.now()-lastTap>350){lastTap=Date.now();animalSound(hidden[spot]);const el=spotEl[spot];el.classList.remove("bow");void el.offsetWidth;el.classList.add("bow");setTimeout(()=>el.classList.remove("bow"),700)}
  return;
 }
 const id=hidden[spot];
 poke(spot);openSpot(spot);
 if(want&&id===want){celebrate(spot);return}
 LP.sfx.whoosh();burstAt(spot,8);
 bubble(L().peek+" "+word(id)+(snd(id)?"  "+snd(id):""));
 LP.say(L().peek);LP.say(word(id),true);LPLearn.heard(id,LP.lang);setTimeout(()=>animalSound(id),180);
 if(snd(id))setTimeout(()=>LP.say(snd(id),true),1700);
 setTimeout(()=>closeSpot(spot),3000);
 if(LP.age<1&&!busy){addStar();if(found>=6){busy=true;setTimeout(curtainCall,2800)}}
 if(!busy&&!want&&SPOTS.every(s=>open[s]))everybodyOut();
}
function everybodyOut(){
 LP.celebrate();
 SPOTS.forEach(s=>spotEl[s].classList.add("bow"));
 setTimeout(()=>SPOTS.forEach(s=>spotEl[s].classList.remove("bow")),2200);
}

/* ---- the find game (ages 1+): watch where the friend goes, then find it ---- */
function celebrate(spot){
 const id=hidden[spot],g=gen;want=null;busy=true;
 LP.sfx.chime();animalSound(id);burstAt(spot,22);
 if(misses===0){LPLearn.asked(id,LP.lang,true);streak++}else streak=Math.max(0,streak-1);
 const t=fill(L().found,id);bubble(t+(snd(id)?"  "+snd(id):""));
 setTimeout(()=>LP.say(t),350);if(snd(id))setTimeout(()=>LP.say(snd(id),true),1900);
 addStar();
 setTimeout(()=>{
  if(g!==gen)return;pinned=null;
  if(found>=6){curtainCall();return}
  closeAll();busy=false;setTimeout(()=>{if(g===gen)act()},1300);
 },2600);
}
function giveHint(){if(!want)return;const s=SPOTS.find(x=>hidden[x]===want);if(s){const el=spotEl[s];el.classList.remove("hint");void el.offsetWidth;el.classList.add("hint")}}

function act(){
 const g=gen;
 if(LP.age<1){want=null;return}
 if(busy)return;
 const closed=SPOTS.filter(s=>!open[s]);
 if(closed.length<2){setTimeout(()=>g===gen&&act(),800);return}
 const tid=LPLearn.pick(closed.map(s=>hidden[s]),x=>x,1,LP.lang)[0],S=closed.find(s=>hidden[s]===tid);
 const lvl=LP.age>=2?(streak>=4?2:streak>=2?1:0):0; // the game gets trickier as they get it right
 want=null;pinned=tid;misses=0;
 // 1. the friend pops out of its hiding place and says its name
 openSpot(S);LP.sfx.whoosh();burstAt(S,10);say(tid);
 // 2. it ducks back in, or hops to another hiding place
 setTimeout(()=>{
  if(g!==gen)return;
  if(lvl>=1)hop(S,tid,g,()=>after(lvl,tid,g));
  else{closeSpot(S);setTimeout(()=>after(lvl,tid,g),700)}
 },2300);
}
function hop(S,tid,g,done){
 const cand=SPOTS.filter(s=>s!==S&&!open[s]);
 if(!cand.length){closeSpot(S);setTimeout(done,700);return}
 const T=cand[Math.floor(Math.random()*cand.length)],a=G.slots[slotOf[S]],b=G.slots[slotOf[T]];
 const old=hidden[T];hidden[T]=tid;hidden[S]=old;setFriend(T,tid);
 const tv=document.querySelector(".traveler"),img=tv.querySelector("img");img.src=`../felt/peek-${tid}.webp`;
 const fh=a.u*1.05,ratio=(img.naturalWidth||260)/(img.naturalHeight||340),fw=fh*ratio;
 tv.style.height=fh+"px";tv.style.width=fw+"px";tv.style.display="block";
 const ya=a.y-.5*a.u*PIECE[S].k,yb=b.y-.5*b.u*PIECE[T].k;
 spotEl[S].classList.add("jumped");spotEl[S].classList.remove("open");open[S]=false;spotEl[S].setAttribute("aria-label",S);
 LP.sfx.boing();
 tween(950,t=>{
  const arc=Math.sin(Math.PI*t)*a.u*1.3,x=a.x+(b.x-a.x)*t,y=ya+(yb-ya)*t-arc;
  let sc=1,sink=0,op=1;if(t>.8){const k=(t-.8)/.2;sc=1-.45*k;sink=k*fh*.45;op=1-k}
  tv.style.opacity=op;
  tv.style.transform=`translate(${x-fw/2}px,${y-fh+sink}px) rotate(${Math.round(Math.sin(t*Math.PI*2)*14)}deg) scale(${sc})`;
 },()=>{
  tv.style.display="none";poke(T);LP.sfx.pop();
  setFriend(S,old);spotEl[S].classList.remove("jumped");
  setTimeout(done,500);
 });
}
function swapSlots(A,B,done){
 const sa=slotOf[A],sb=slotOf[B],pa=G.slots[sa],pb=G.slots[sb],dx=pb.x-pa.x,dy=pb.y-pa.y;
 LP.sfx.whoosh();
 tween(800,t=>{const arc=Math.sin(Math.PI*t)*pa.u*.45;place(A,dx*t,dy*t-arc);place(B,-dx*t,-dy*t+arc*.6)},()=>{slotOf[A]=sb;slotOf[B]=sa;place(A);place(B);done&&done()});
}
function after(lvl,tid,g){
 if(g!==gen)return;
 const T=SPOTS.find(s=>hidden[s]===tid);
 if(lvl>=2&&T){ // the shell game: the pieces change places
  const others=SPOTS.filter(s=>s!==T&&!open[s]).sort(()=>Math.random()-.5);
  if(others.length>1){swapSlots(T,others[0],()=>setTimeout(()=>g===gen&&swapSlots(T,others[1],()=>ask(tid,g)),150));return}
 }
 setTimeout(()=>ask(tid,g),300);
}
function ask(tid,g){if(g!==gen)return;want=tid;misses=0;const t=fill(L().where,tid);bubble(t);LP.say(t)}

/* ---- curtain call: every star earned, the curtain falls and all six friends take a bow ---- */
function curtainCall(){
 const g=gen;busy=true;want=null;pinned=null;
 $("curtain").classList.add("down");LP.sfx.whoosh();
 setTimeout(()=>{
  if(g!==gen)return;
  closeAll();
  const ids=LPLearn.pick(ANIMALS,x=>x,SPOTS.length,LP.lang);
  SPOTS.forEach((s,i)=>{assign(s,ids[i]);spotEl[s].classList.add("open","bow");open[s]=true});
  $("curtain").classList.remove("down");LP.sfx.chime();
  SPOTS.forEach((s,i)=>setTimeout(()=>{if(g!==gen)return;say(hidden[s]);burstAt(s,12);poke(s)},1400+i*1500));
  setTimeout(()=>{
   if(g!==gen)return;
   $("curtain").classList.add("down");LP.sfx.whoosh();
   setTimeout(()=>{
    if(g!==gen)return;
    SPOTS.forEach(s=>{spotEl[s].classList.remove("open","bow");open[s]=false});
    shuffleFriends();found=0;paintStars();streak=Math.min(streak,2);
    $("curtain").classList.remove("down");busy=false;bubble(L().title);
    setTimeout(()=>g===gen&&act(),1500);
   },1300);
  },1400+SPOTS.length*1500+900);
 },1300);
}

let hintTimer=0;
LP.init({langs:ALLLANGS,
 onLang:()=>{document.title=L().title;if(want){bubble(fill(L().where,want))}else bubble(L().title)},
 onAge:()=>{gen++;want=null;pinned=null;busy=false;found=0;streak=0;paintStars();closeAll();$("curtain").classList.remove("down");setTimeout(act,900)}});
document.title=L().title;
build();shuffleFriends();paintStars();bubble(L().title);
LP.start(L().title,()=>{
 LP.say(L().peek);
 setTimeout(()=>$("curtain").classList.remove("down"),500);
 setTimeout(act,2400);
});
LP.mash((e)=>{
 const el=e.target.closest&&e.target.closest("[data-spot]");
 let spot=el?el.dataset.spot:null;
 if(!spot){ // a tap anywhere opens a closed spot; when hunting, the youngest players' stray taps find the friend
  const closed=SPOTS.filter(s=>!open[s]);if(!closed.length)return;
  spot=want&&LP.age<2?(SPOTS.find(s=>hidden[s]===want)||closed[0]):LP.next("peek",closed);
 }
 if(want&&!open[spot]){
  if(hidden[spot]!==want){misses++;if(misses===1)LPLearn.asked(want,LP.lang,false);if(misses>=2)giveHint()}
 }
 reveal(spot);
});
</script>
