<title>Old MacDonald's Farm</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  :root {
    --sky-top: #74C2DE;
    --sky: #B4E2EE;
    --hill-back: #A6D06A;
    --grass: #7FBE4B;
    --grass-deep: #5A9A34;
    --barn: #C8322B;
    --barn-deep: #8E221D;
    --wood: #8A5A33;
    --cream: #FFF6DC;
    --ink: #2B2A33;
    --sun: #F2A81D;
    --blue: #2F7FC1;
    --pink: #E66A92;
    --lilac: #8B6FC9;
    --display: "Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: linear-gradient(var(--sky-top), var(--sky) 55%);
  }

  /* clouds */
  .cloud {
    position: absolute; z-index: 0;
    width: 110px; height: 34px; border-radius: 40px;
    background: #fff; opacity: .85;
    animation: drift 70s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud::before { width: 50px; height: 50px; left: 18px; top: -24px; }
  .cloud::after { width: 38px; height: 38px; left: 56px; top: -16px; }
  .cloud.c1 { top: 9%; left: -130px; }
  .cloud.c2 { top: 24%; left: -130px; transform: scale(.7); animation-duration: 95s; animation-delay: -50s; }
  @keyframes drift { to { translate: calc(100vw + 260px) 0; } }

  /* header */
  header {
    position: relative; z-index: 2;
    padding: 12px 16px 0;
    display: grid; gap: 8px;
  }
  .top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 {
    margin: 0;
    font-family: var(--display); font-weight: 600;
    font-size: clamp(15px, 1.6vh + 8px, 22px);
    line-height: 1.1;
    text-wrap: balance;
  }
  .eio {
    display: flex; gap: .06em;
    font-family: var(--display); font-weight: 800;
    font-size: clamp(40px, 9vh, 88px);
    line-height: 1;
    margin-top: 2px;
  }
  .eio span {
    display: inline-block;
    color: var(--c);
    text-shadow: 0 .06em 0 rgba(43, 42, 51, .22);
    transition: transform .14s ease-out;
  }
  .eio span.lit { transform: translateY(-.16em) scale(1.28) rotate(-7deg); }
  .barn-mark {
    width: clamp(58px, 11vh, 100px); flex: none;
    padding: 0; border: none; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease-out;
  }
  .barn-mark svg { width: 100%; height: 100%; display: block; }
  .barn-mark:hover { transform: scale(1.06); }
  .barn-mark:active { transform: scale(.94); }

  .ribbon {
    display: flex; align-items: center; gap: 10px;
    background: var(--cream);
    border-radius: 16px;
    padding: 8px 14px;
    box-shadow: 0 3px 0 rgba(43, 42, 51, .14);
  }
  #lyric {
    flex: 1; margin: 0;
    font-family: var(--display); font-weight: 600;
    font-size: clamp(16px, 1.8vh + 8px, 28px);
    line-height: 1.25;
    min-height: 1.25em;
    text-wrap: balance;
  }
  #lyric b { color: var(--barn); font-weight: 800; }
  #lyric .tok { opacity: .4; transition: opacity .1s; }
  #lyric .tok.done { opacity: 1; }
  #lyric .tok.on { opacity: 1; color: var(--barn); }
  #lyric .tok.snd { font-weight: 800; }
  .stars { display: flex; gap: 2px; flex: none; }
  .stars svg { width: clamp(18px, 2.6vh, 28px); height: auto; fill: #E6DCC2; transition: fill .2s, transform .3s; }
  .stars svg.got { fill: var(--sun); transform: scale(1.15) rotate(12deg); }

  /* field */
  main {
    flex: 1; min-height: 0;
    position: relative; z-index: 1;
    container-type: size;
    display: grid; place-items: center;
    padding-block: 12px 4px;
    padding-inline: 16px;
  }
  .hill-back, .hill-front { position: absolute; pointer-events: none; }
  .hill-back {
    right: -25%; width: 95%; top: 4%; bottom: 0;
    background: var(--hill-back);
    border-radius: 50% 50% 0 0 / 80px 80px 0 0;
  }
  .hill-front {
    left: -30%; right: -30%; top: 16%; bottom: 0;
    background: var(--grass);
    border-radius: 50% 50% 0 0 / 110px 110px 0 0;
  }
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(6px, 2.5cqw, 26px) clamp(6px, 3cqw, 30px);
    width: min(100%, 132cqh, 760px);
  }
  @container (min-aspect-ratio: 5/2) {
    .grid { grid-template-columns: repeat(6, 1fr); width: min(100%, 520cqh, 1100px); }
  }
  .animal {
    position: relative;
    aspect-ratio: 1;
    width: 100%;
    border: 0; padding: 0; margin: 0;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
    border-radius: 24px;
    transition: opacity .3s, filter .3s;
  }
  .animal::after {
    content: ""; position: absolute;
    left: 20%; right: 20%; bottom: -1%; height: 10%;
    background: rgba(40, 70, 20, .28);
    border-radius: 50%;
  }
  .animal svg {
    position: relative; z-index: 1;
    display: block; width: 100%; height: 100%;
    transform-origin: 50% 90%;
    filter: drop-shadow(0 4px 0 rgba(43, 42, 51, .16));
  }
  .animal:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
  .animal.boing svg { animation: boing .6s cubic-bezier(.3, 1.5, .5, 1); }
  .animal.wiggle svg { animation: wiggle .5s ease-in-out; }
  .animal.dance svg { animation: dance .68s ease-in-out infinite; }
  .animal.dim { opacity: .5; filter: saturate(.5); }
  @keyframes boing {
    0% { transform: none; }
    18% { transform: scale(1.14, .82); }
    48% { transform: translateY(-16%) scale(.92, 1.1); }
    78% { transform: scale(1.05, .95); }
    100% { transform: none; }
  }
  @keyframes wiggle {
    20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); }
    60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); }
  }
  @keyframes dance {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg) translateY(-5%); }
  }
  .eye { transform-box: view-box; animation: blink 5.5s infinite; animation-delay: var(--bd, 0s); }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  .bubble {
    position: absolute; left: 50%; top: 0; z-index: 3;
    transform: translate(-50%, -30%) scale(0);
    background: #fff; color: var(--ink);
    font-family: var(--display); font-weight: 800;
    font-size: clamp(16px, 5.5cqh, 36px);
    padding: .15em .6em;
    border-radius: 1em;
    box-shadow: 0 3px 0 rgba(43, 42, 51, .2);
    white-space: nowrap;
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .bubble.pop { animation: pop 1.1s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(-50%, -20%) scale(0); opacity: 1; }
    16% { transform: translate(-50%, -60%) scale(1.15); }
    26% { transform: translate(-50%, -60%) scale(1); }
    78% { opacity: 1; transform: translate(-50%, -72%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -95%) scale(.9); }
  }

  /* controls */
  nav {
    position: relative; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    padding-block: 10px 14px;
    padding-inline: 16px;
    background: var(--grass);
  }
  .langs {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    flex-basis: 100%;
    padding-bottom: 2px;
  }
  .flag {
    display: inline-block; flex: none;
    height: 1em; line-height: 0;
    border-radius: 3px; overflow: hidden;
    box-shadow: 0 0 0 1.5px rgba(43, 42, 51, .18);
  }
  .flag svg { height: 100%; width: auto; display: block; }
  .lang[aria-checked="true"] .flag { box-shadow: 0 0 0 2px #fff; }
  .lang {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--display); font-weight: 800;
    font-size: clamp(14px, .8vh + 9px, 18px);
    color: var(--ink);
    background: var(--cream);
    border: 3px solid var(--cream);
    border-radius: 1.1em 1.1em 1.1em .25em;
    padding: 5px 14px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 3px 0 rgba(43, 42, 51, .18);
    transition: background-color .2s, color .2s, transform .2s;
  }
  .lang:nth-child(even) { border-radius: 1.1em 1.1em .25em 1.1em; }
  .lang[aria-checked="true"] { background: var(--c); color: #fff; transform: rotate(-4deg) scale(1.08); }
  .lang.hop { animation: hop .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes hop { 40% { transform: translateY(-8px) rotate(4deg) scale(1.12); } }
  .lang:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--display); font-weight: 800;
    font-size: clamp(15px, 1.2vh + 9px, 22px);
    color: var(--ink);
    background: var(--cream);
    border: 0; border-radius: 999px;
    padding: 10px 16px;
    box-shadow: 0 5px 0 var(--wood);
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood); }
  .btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
  .btn[aria-pressed="true"] { background: var(--sun); }
  .btn svg { width: 1.1em; height: 1.1em; fill: currentColor; }

  /* barn doors */
  #doors {
    position: fixed; inset: 0; z-index: 10;
    display: flex;
    perspective: 1600px;
    background: #3B2A1E;
    transition: background-color .9s;
  }
  .leaf {
    flex: 1;
    border: clamp(10px, 2.4vw, 20px) solid var(--cream);
    background:
      linear-gradient(to top right, transparent calc(50% - 7px), var(--cream) calc(50% - 7px), var(--cream) calc(50% + 7px), transparent calc(50% + 7px)),
      linear-gradient(to top left, transparent calc(50% - 7px), var(--cream) calc(50% - 7px), var(--cream) calc(50% + 7px), transparent calc(50% + 7px)),
      repeating-linear-gradient(90deg, rgba(0, 0, 0, .12) 0 3px, transparent 3px 46px),
      var(--barn);
    transition: transform 1s cubic-bezier(.55, 0, .3, 1);
    backface-visibility: hidden;
  }
  .leaf.l { transform-origin: left center; }
  .leaf.r { transform-origin: right center; }
  #doors.open { background-color: transparent; pointer-events: none; }
  #doors.open .leaf.l { transform: rotateY(-108deg); }
  #doors.open .leaf.r { transform: rotateY(108deg); }
  .open-btn {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: grid; justify-items: center; gap: 4px;
    font-family: var(--display); font-weight: 800;
    font-size: clamp(20px, 4vw, 30px);
    color: var(--ink);
    background: var(--sun);
    border: 6px solid var(--cream);
    border-radius: 999px;
    padding: 18px 30px;
    box-shadow: 0 8px 0 var(--barn-deep);
    cursor: pointer;
    transition: opacity .3s;
    animation: nudge 2.2s ease-in-out infinite;
  }
  .open-btn small { font-family: var(--body); font-weight: 700; font-size: 13px; letter-spacing: .04em; }
  .open-btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
  .open-btn { opacity: 0; pointer-events: none; }
  #doors.named .open-btn { opacity: 1; pointer-events: auto; }
  #doors.open .open-btn { opacity: 0; pointer-events: none; }
  @keyframes nudge { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -50%) scale(1.06); } }

  .name-gate {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: grid; justify-items: center; gap: 14px;
    background: var(--cream);
    border: 6px solid var(--sun);
    border-radius: 28px;
    padding: 26px 30px;
    box-shadow: 0 8px 0 var(--barn-deep);
    width: min(84vw, 320px);
    text-align: center;
  }
  .name-gate p {
    margin: 0; font-family: var(--display); font-weight: 800; color: var(--ink);
    font-size: clamp(17px, 4vw, 22px);
  }
  .name-gate input {
    width: 100%; box-sizing: border-box;
    font-family: var(--body); font-weight: 700; font-size: 20px;
    text-align: center;
    color: var(--ink);
    background: #fff;
    border: 3px solid var(--wood);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .name-gate input:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
  .name-gate-row { display: flex; gap: 10px; }
  .name-go {
    font-family: var(--display); font-weight: 800; font-size: 17px;
    color: var(--ink); background: var(--sun);
    border: 3px solid var(--cream); border-radius: 999px;
    padding: 9px 22px; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 4px 0 var(--barn-deep);
  }
  .name-go:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--barn-deep); }
  .name-skip {
    font-family: var(--body); font-weight: 700; font-size: 13px;
    color: var(--ink); opacity: .65;
    background: none; border: 0; text-decoration: underline;
    cursor: pointer; padding: 4px;
  }
  #doors.named .name-gate, #doors.open .name-gate { display: none; }

  #fx { position: fixed; inset: 0; z-index: 5; pointer-events: none; width: 100%; height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .eye, .open-btn { animation: none; }
    .animal.boing svg, .animal.wiggle svg, .animal.dance svg { animation: none; }
    .leaf { transition: opacity .4s; }
    #doors.open .leaf { transform: none; opacity: 0; }
  }

      </button>
      <button class="lang" type="button" role="radio" data-lang="de" lang="de" aria-label="Deutsch" style="--c: var(--barn)">
        <span class="flag"><svg viewBox="0 0 5 3" aria-hidden="true"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg></span>Hallo!

  const buffers = {};
  let samplesLoading = false;
  function loadSamples() {
    if (samplesLoading || !ctx) return;
    samplesLoading = true;
    Object.entries(SAMPLES).forEach(([id, b64]) => {
      try {
        const bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const ok = buf => {
          buffers[id] = buf;
          const a = ANIMALS.find(x => x.id === id);
          if (a) a.len = Math.min(buf.duration, 1.6);
        };
        const p = ctx.decodeAudioData(bytes.buffer, ok, () => {});
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* fall back to the synth voice */ }
    });

  const voiceBuffers = {};
  let voiceLoading = false;
  function loadVoiceClips() {
    if (voiceLoading || !ctx) return;
    voiceLoading = true;
    Object.entries(VOICE_CLIPS).forEach(([lg, clips]) => Object.entries(clips).forEach(([text, b64]) => {
      try {
        const bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const p = ctx.decodeAudioData(bytes.buffer, buf => { voiceBuffers[lg + '|' + text] = buf; }, () => {});
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* falls back to the device voice */ }
    }));
  }
  function playVoiceClip(text, fin) {
    const buf = ctx && voiceBuffers[lang + '|' + text];
    if (!buf) return false;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(bus || master);
    src.start(ctx.currentTime + .02);
    setTimeout(fin, buf.duration * 1000 + 80);
    return true;
  }

  // plays the real recording when there is one, otherwise the synth voice
  // k = 1 is the full sound; smaller k is a short snippet for the song
  function animalSound(a, t, k, d) {
    const buf = buffers[a.id];
    if (!buf || !d) return SOUNDS[a.id](t, k, d);
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf;
    const len = k < 1 ? Math.max(.14, k) : Math.min(buf.duration, 1.6);
    g.gain.setValueAtTime(1, t);
    g.gain.setValueAtTime(1, t + len - .05);
    g.gain.linearRampToValueAtTime(0, t + len);
    src.connect(g).connect(d);
    src.start(t);
    src.stop(t + len + .02);
  }

  const N = { D4: 293.66, E4: 329.63, G4: 392, A4: 440, B4: 493.88 };

  /* ---------- speech ---------- */
  const voiceCache = {};
  function pickVoice(code) {
    if (voiceCache[code]) return voiceCache[code];
    try {
      const pre = code.slice(0, 2).toLowerCase();
      const norm = v => (v.lang || '').replace('_', '-').toLowerCase();
      const vs = speechSynthesis.getVoices().filter(v => norm(v).startsWith(pre));
      // English: a male British voice, so it sounds clearly different from German and Italian
      const favourite = {
        'en-GB': /daniel|arthur|oliver|george|ryan|thomas|uk english male|british.*male/i
      }[code];
      const nice = /kate|serena|samantha|karen|moira|anna|petra|helena|alice|federica|paola|elsa|female|google/i;
      voiceCache[code] = (favourite && (vs.find(v => norm(v) === code.toLowerCase() && favourite.test(v.name)) || vs.find(v => favourite.test(v.name))))
        || vs.find(v => norm(v) === code.toLowerCase() && nice.test(v.name))
        || vs.find(v => norm(v) === code.toLowerCase())
        || vs.find(v => nice.test(v.name)) || vs[0] || null;
    } catch (e) { return null; }
    return voiceCache[code];
  }
  function say(text, cb) {
    const id = run;
    let done = false;
    const fin = () => { if (done) return; done = true; if (id === run && cb) cb(); };
    try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    if (playVoiceClip(text, fin)) return;
    try {
      const s = window.speechSynthesis;
      if (!s) { setTimeout(fin, 500); return; }
      voicesReady(() => {
        if (id !== run) return;
        const u = new SpeechSynthesisUtterance(text);
        u.rate = .9;
        u.pitch = T().pitch;
        u.lang = T().code;
        const v = pickVoice(T().code); if (v) u.voice = v;
        u.onend = fin; u.onerror = fin;
        setTimeout(fin, 900 + text.length * 85);
        s.speak(u);
      });
    } catch (e) { setTimeout(fin, 500); }
  }
  // browsers fill the voice list a moment after the page opens; speaking before that
  // lets the browser pick its own voice, so wait for the list (at most a second)
  function voicesReady(cb) {
    let done = false;
    const go = () => { if (done) return; done = true; cb(); };
    try {
      if (speechSynthesis.getVoices().length) return go();
      speechSynthesis.addEventListener('voiceschanged', go, { once: true });
    } catch (e) { return go(); }
    setTimeout(go, 1000);
  }


  /* ---------- run control ---------- */
  let run = 0, timers = [];
  const later = (ms, fn) => { const id = run; timers.push(setTimeout(() => { if (id === run) fn(); }, Math.max(0, ms))); };
  function begin() {
    run++;
    timers.forEach(clearTimeout); timers = [];
    try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  }
  const now = () => (ctx ? ctx.currentTime : 0);

  /* ---------- ui ---------- */
  const grid = $('#grid'), lyric = $('#lyric'), starsEl = $('#stars');
  const letters = [...document.querySelectorAll('.eio span')];
  const els = {};
  ANIMALS.forEach((a, i) => {
    const b = document.createElement('button');
    b.className = 'animal'; b.type = 'button';
    b.setAttribute('aria-label', a.name);
    b.innerHTML = (window.LPLook && LPLook.has(a.id) ? LPLook.animal(a.id) : `<svg viewBox="0 0 120 120" aria-hidden="true">${ART[a.id]}</svg>`) + `<span class="bubble"></span>`;
    b.querySelectorAll('.eye').forEach(e => e.style.animationDelay = `${(i * .9 + Math.random() * 2).toFixed(2)}s`);
    b.addEventListener('pointerdown', e => { e.preventDefault(); tapAnimal(a); });
    b.addEventListener('click', e => { if (e.detail === 0) tapAnimal(a); });
    b.addEventListener('contextmenu', e => e.preventDefault());
    grid.appendChild(b);
    els[a.id] = b;
  });
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>';
  starsEl.innerHTML = STAR.repeat(5);

  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function boing(a) { restart(els[a.id], 'boing'); }
  function wiggle(a) { restart(els[a.id], 'wiggle'); }
  function bubble(a, text) { const b = els[a.id].querySelector('.bubble'); b.textContent = /[!?]$/.test(text) ? text : text + '!'; restart(b, 'pop'); }
  function light(i) { const s = letters[i]; if (!s) return; s.classList.add('lit'); setTimeout(() => s.classList.remove('lit'), 240); }
  function setLyric(html) { lyric.innerHTML = html; }
  function renderStars(n) { [...starsEl.children].forEach((s, i) => s.classList.toggle('got', i < n)); }

  function jingle(t, d) {
    if (!ctx) return 1;
    const seq = [['B4', .17], ['B4', .17], ['A4', .17], ['A4', .17], ['G4', .45]];
    let x = t;
    seq.forEach(([n, len], i) => {
      note(N[n], x, len, d);
      later((x - now()) * 1000, () => light(i));
      x += len + .03;
    });
    return x - t;
  }

  /* ---------- modes ---------- */
  let mode = 'play', target = null, found = 0, singing = false, songNext = 0;
  const singBtn = $('#singBtn'), findBtn = $('#findBtn');
  const B = w => `<b>${w}</b>`;

  function tapAnimal(a) {
    if (!audio()) { boing(a); bubble(a, a.word); return; }
    if (singing) endSong(false);
    if (mode === 'find') return findTap(a);
    begin();
    const d = freshBus();
    animalSound(a, now() + .02, 1, d);
    boing(a); bubble(a, a.word);
    songNext = ANIMALS.indexOf(a);
    setLyric(T().says(a, B(a.word)));
    later(a.len * 1000 + 60, () => say(T().call(a), () => jingle(now() + .05, d)));
  }

  /* ---------- language switcher ---------- */
  const langBtns = [...document.querySelectorAll('.lang')];
  function applyLang() {
    const L = T();
    localizeAnimals();
    document.documentElement.lang = lang;
    $('#title').textContent = L.title;
    letters.forEach((s, i) => { s.textContent = L.eio[i]; });
    $('#openTxt').textContent = L.open;
    $('#soundTxt').textContent = L.sound;
    const nq = $('#nameGateQ'); if (nq) nq.textContent = NAME_Q[lang] || NAME_Q.en;
    singBtn.querySelector('span').textContent = singing ? L.stop : L.sing;
    findBtn.querySelector('span').textContent = mode === 'find' ? L.free : L.find;
    ANIMALS.forEach(a => els[a.id].setAttribute('aria-label', a.name));
    langBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.lang === lang)));
  }
  function chooseLang(next, btn) {
    lang = next;
    try { localStorage.setItem('farm-lang', next); } catch (e) { /* ignore */ }
    if (singing) endSong(false);
    applyLang();
    restart(btn, 'hop');
    audio();
    begin(); freshBus();
    if (mode === 'find') { target = null; nextFind(); return; }
    setLyric(withName(T().tap));
    ANIMALS.forEach((a, i) => later(i * 110, () => { boing(a); bubble(a, T().hello); }));
    say(withName(T().hello));
  }
  langBtns.forEach(b => b.addEventListener('click', () => chooseLang(b.dataset.lang, b)));

  function setMode(m) {
    begin(); freshBus();
    if (singing) endSong(false);
    mode = m;
    const finding = m === 'find';
    findBtn.setAttribute('aria-pressed', String(finding));
    findBtn.querySelector('span').textContent = finding ? T().free : T().find;
    starsEl.hidden = !finding;
    if (finding) { found = 0; target = null; renderStars(0); nextFind(); }
    else { target = null; setLyric(withName(T().tap)); }
  }

  function hint() {
    later(7000, () => {
      if (!target) return;
      wiggle(target);
      animalSound(target, now() + .05, 1, freshBus());
      hint();
    });
  }
  function nextFind() {
    begin();
    const pool = ANIMALS.filter(a => a !== target);
    target = pool[Math.floor(Math.random() * pool.length)];
    setLyric(withName(T().who(B(target.word))));
    const d = freshBus();
    say(withName(T().who(target.word)), () => { animalSound(target, now() + .05, 1, d); hint(); });
  }
  function findTap(a) {
    if (!target) return;
    begin();
    const d = freshBus();
    animalSound(a, now() + .02, 1, d);
    bubble(a, a.word);
    if (a === target) {
      boing(a); burst(els[a.id], 28);
      found++; renderStars(found);
      const all = found >= 5;
      setLyric(all ? withName(T().all) : T().yes(a, B(a.word)));
      later(a.len * 1000 + 60, () => say(all ? withName(T().all) : T().yes(a, a.word), () => {
        const len = jingle(now() + .05, d);
        if (all) {
          ANIMALS.forEach((x, i) => setTimeout(() => { burst(els[x.id], 16); restart(els[x.id], 'boing'); }, i * 120));
          found = 0;
          later(len * 1000 + 1800, () => { renderStars(0); nextFind(); });
        } else {
          later(len * 1000 + 700, nextFind);
        }
      }));
    } else {
      wiggle(a);
      later(a.len * 1000 + 500, () => { animalSound(target, now() + .05, 1, freshBus()); hint(); });
    }
  }

  /* ---------- the song ---------- */
  const verse = a => T().verse(a, T());
  function renderLine(line) {
    lyric.innerHTML = line.map(x => `<span class="tok${x.s ? ' snd' : ''}">${x.t}</span>`).join('');
  }
  function mark(i) {
    [...lyric.children].forEach((s, j) => { s.classList.toggle('on', j === i); s.classList.toggle('done', j < i); });
  }
  function sing() {
    if (singing) { begin(); freshBus(); endSong(false); return; }
    if (!audio()) return;
    if (mode === 'find') setMode('play');
    begin();
    const a = ANIMALS[songNext % ANIMALS.length];
    const d = freshBus();
    singing = true;
    singBtn.querySelector('span').textContent = T().stop;
    ANIMALS.forEach(x => els[x.id].classList.toggle('dim', x !== a));
    els[a.id].classList.add('dance');
    const beat = .34;
    let t = now() + .3;
    verse(a).forEach(line => {
      line.forEach((x, i) => {
        const at = t;
        if (x.s) { animalSound(a, at, x.b * .3, d); note(N[x.n], at, x.b * beat, d, .08); }
        else note(N[x.n], at, x.b * beat, d);
        later((at - now()) * 1000, () => {
          if (i === 0) renderLine(line);
          mark(i);
          if (x.e != null) light(x.e);
          if (x.s) bubble(a, a.word);
        });
        t += x.b * beat;
      });
    });
    later((t - now()) * 1000 + 250, () => {
      mark(999);
      songNext = (ANIMALS.indexOf(a) + 1) % ANIMALS.length;
      endSong(true);
    });
  }
  function endSong() {
    singing = false;
    singBtn.querySelector('span').textContent = T().sing;
    ANIMALS.forEach(x => els[x.id].classList.remove('dim', 'dance'));
  }

  singBtn.addEventListener('click', sing);
  findBtn.addEventListener('click', () => { audio(); setMode(mode === 'find' ? 'play' : 'find'); });

  /* ---------- barn doors ---------- */
  const doors = $('#doors');
  const nameGate = $('#nameGate'), nameInput = $('#nameInput');
  if (childName) { nameInput.value = childName; doors.classList.add('named'); }
  function commitName(raw) {
    childName = sanitizeChildName(raw);
    try { localStorage.setItem('farm-child-name', childName); } catch (e) { /* ignore */ }
    doors.classList.add('named');
    applyLang();
    setLyric(withName(T().tap));
  }
  nameGate.addEventListener('submit', (e) => { e.preventDefault(); commitName(nameInput.value); });
  $('#nameSkip').addEventListener('click', () => commitName(''));
  $('#openBtn').addEventListener('click', () => {
    audio();
    try { window.speechSynthesis && speechSynthesis.getVoices(); } catch (e) { /* ignore */ }
    doors.classList.add('open');
    const d = freshBus();
    if (ctx) later(350, () => jingle(now() + .02, d));
    setTimeout(() => { doors.hidden = true; }, 1100);
  });
  $('#barnHome').addEventListener('click', () => {
    audio();
    if (singing) endSong();
    begin();
    doors.hidden = false;
    doors.classList.remove('open', 'named');
    if (nameInput) nameInput.value = childName;
    setLyric(withName(T().tap));
  });
  try { window.speechSynthesis && speechSynthesis.addEventListener('voiceschanged', () => { Object.keys(voiceCache).forEach(k => delete voiceCache[k]); }); } catch (e) { /* ignore */ }
  try { window.speechSynthesis && speechSynthesis.getVoices(); } catch (e) { /* ignore */ }
  applyLang();
  setLyric(withName(T().tap));

  /* ---------- confetti ---------- */
  const cv = $('#fx'), g = cv.getContext('2d');
  const COLORS = ['#C8322B', '#F2A81D', '#2F7FC1', '#E66A92', '#5A9A34', '#FFF6DC'];
  let parts = [], raf = 0;
  function size() {
    const r = window.devicePixelRatio || 1;
    cv.width = innerWidth * r; cv.height = innerHeight * r;
    g.setTransform(r, 0, 0, r, 0, 0);
  }
  size(); addEventListener('resize', size);
  function burst(el, n) {
    if (reduce) n = Math.min(n, 6);
    const b = el.getBoundingClientRect();
    const x = b.left + b.width / 2, y = b.top + b.height / 3;
    for (let i = 0; i < n; i++) {
      parts.push({ x, y, vx: (Math.random() - .5) * 10, vy: -Math.random() * 9 - 3, r: Math.random() * 6 + 5, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: COLORS[i % COLORS.length], life: 80 + Math.random() * 40 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function star(x, y, r, a) {
    g.save(); g.translate(x, y); g.rotate(a); g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * .45 : r, t = i * Math.PI / 5 - Math.PI / 2;
      g.lineTo(Math.cos(t) * rr, Math.sin(t) * rr);
    }
    g.closePath(); g.fill(); g.restore();
  }
  function tick() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => --p.life > 0 && p.y < innerHeight + 40);
    parts.forEach(p => {
      p.vy += .3; p.x += p.vx; p.y += p.vy; p.a += p.va;
      g.fillStyle = p.c; g.globalAlpha = Math.min(1, p.life / 30);
      star(p.x, p.y, p.r, p.a);
    });
    g.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
})();
</script>
