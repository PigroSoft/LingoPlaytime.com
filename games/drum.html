<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drum Parade</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:light;--ink:#18264A;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;
 --felt-red:url(../felt/btn-red.webp);--felt-blue:url(../felt/btn-blue.webp);--felt-beige:url(../felt/btn-beige.webp)}
html,body{height:100%;margin:0}
body{background:#1f6f73 url(../felt/drum-bg.webp) center bottom/cover no-repeat;color:#fff;font-family:var(--display);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top,0px)) 0 0 0}
.app>*{position:relative}
.top{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding:0 16px}
#bubble{font-size:clamp(20px,3.4vw,32px);min-height:1.2em;transition:transform .15s;text-align:center;max-width:94vw;color:#fff3d6;text-shadow:0 3px 0 #3a1d0a,0 0 14px #0006}
#bubble.bump{transform:scale(1.06)}
#word{font:800 clamp(44px,10vw,100px)/1.1 var(--display);min-height:1.1em;text-align:center;color:#fff3d6;text-shadow:0 5px 0 #7a3d12,0 10px 18px #0007;transition:transform .12s;max-width:96vw}
.fb{--felt:var(--felt-beige);--fh:38px;position:relative;isolation:isolate;box-sizing:border-box;height:var(--fh);border:0;background:none;box-shadow:none;border-radius:0;color:#4a3213;text-shadow:0 1px 0 #fff8;padding:0 20px;font:800 16px/1 var(--display);display:inline-grid;align-items:center;cursor:pointer;white-space:nowrap}
.fb::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border:solid transparent;border-width:calc(var(--fh)*.5);border-image:var(--felt) 157 fill/calc(var(--fh)*.58)/calc(var(--fh)*.0926) round;filter:drop-shadow(0 3px 2px #1b0d0566)}
.fb.red{--felt:var(--felt-red);color:#fff8ec;text-shadow:0 1px 0 #6a1a10}
.fb.blue{--felt:var(--felt-blue);color:#fff;text-shadow:0 1px 0 #06415e}
.fb:active{transform:translateY(2px)}
.fb:focus-visible{outline:4px solid #ffd84a;outline-offset:3px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;padding:6px 12px max(12px,env(safe-area-inset-bottom,0px));min-height:40px;position:absolute;left:0;right:0;bottom:0}
.ctl .fb[hidden],#bListen[hidden]{display:none}
#bListen{--fh:60px;position:absolute;top:10px;right:10px;z-index:5;padding:0 30px;font-size:24px}
#menu{position:fixed;z-index:30;display:flex;flex-direction:column;gap:4px;padding:8px;background:#fff4dc;border:2px dashed #b8401f99;border-radius:20px;box-shadow:0 10px 30px #0008;min-width:210px;max-width:92vw;max-height:62vh;overflow:auto}
#menu[hidden]{display:none}
#menu button{font:700 17px/1.1 var(--display);color:#2b3a42;background:#fffdf6;border:0;border-radius:16px;padding:10px 14px;text-align:left;cursor:pointer}
#menu button.on{box-shadow:0 0 0 3px #F6C033}
#menu button:focus-visible{outline:3px solid #3B8BD4}
#menu .sep{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#8a6a40;padding:6px 8px 0}
.stage{flex:1.1;min-height:90px;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#strip{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:18px;padding:0 18px 12px;max-width:min(980px,100%);margin:0 auto}
#strip .d{width:12px;height:12px;border-radius:50%;background:var(--c);opacity:.4;transition:transform .12s,opacity .12s;box-shadow:0 0 0 2px #fff6}
#strip .d.ok{opacity:1}
#strip .d.now{opacity:1;transform:scale(1.7);box-shadow:0 0 0 2px #fff}
.kit{display:grid;gap:clamp(8px,2vw,24px);width:min(920px,calc(100% - 24px));margin:0 auto;height:clamp(150px,31vh,300px);touch-action:none}
.under{flex:.8;min-height:64px}
.pad{position:relative;border:0;background:none;padding:0;margin:0;display:grid;place-items:end center;height:100%;min-width:0;cursor:pointer;transition:transform .08s;transform-origin:50% 90%;touch-action:none}
.pad img{width:100%;height:calc(100% - 4px);object-fit:contain;object-position:50% 100%;pointer-events:none;filter:drop-shadow(0 10px 8px #0005)}
.pad.hit{transform:translateY(6px) scale(.93,.9)}
.pad.show{animation:wob .45s}
@keyframes wob{0%{transform:scale(1.14) rotate(-4deg);filter:brightness(1.4)}50%{transform:scale(.96) rotate(3deg)}100%{transform:none;filter:none}}
.pad.tgt{animation:tg .7s steps(2) infinite}
@keyframes tg{50%{transform:scale(1.07);filter:brightness(1.3) drop-shadow(0 0 16px #ffd84a)}}
.pad.sel img{filter:drop-shadow(0 0 14px #ffd84a) drop-shadow(0 0 6px #ffd84a)}
.pad .ltr{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);min-width:min(52px,44%);height:min(52px,22%);padding:0 10px;box-sizing:border-box;display:grid;place-items:center;border-radius:14px;background:var(--c) url(../felt/key-cream.webp) center/120px;background-blend-mode:multiply;color:#fff;font:700 clamp(18px,3.2vw,32px) var(--display);text-shadow:0 2px 0 #0007;box-shadow:inset 0 -4px 0 #0003,0 0 0 2px #fff7;pointer-events:none}
.pad .ltr[hidden]{display:none}
.puff{position:fixed;width:44px;pointer-events:none;z-index:6;animation:up 1.1s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-110px) rotate(var(--r));opacity:0}}
.conf{position:fixed;width:46px;pointer-events:none;z-index:7;animation:fall 1.4s ease-in forwards}
.conf img{width:100%;display:block}
@keyframes fall{to{transform:translateY(60vh) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.puff,.conf,.pad.show,.pad.tgt{animation:none}}
@media (max-width:560px){.fb{--fh:34px;padding:0 14px;font-size:14px}#bListen{--fh:44px;top:0;right:0;padding:0 20px;font-size:18px}}
html .lp-cursor{width:84px;height:84px;background:url(../felt/drum-stick.webp) center/contain no-repeat;margin:0;transform:translate(-88%,-8%);filter:drop-shadow(0 4px 3px #0005)}
html .lp-cursor.over{transform:translate(-88%,-8%) rotate(8deg) scale(1.1)}
html .lp-cursor.tap{transform:translate(-88%,-2%) rotate(-22deg) scale(.95)}
</style>
</head>

let ac=null,bus=null;const buf={};
function audio(){
 if(ac&&bus)return ac;const a=LP.ac();if(!a)return null;ac=a;
 bus=a.createGain();bus.gain.value=.95;const c=a.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=4;bus.connect(c);c.connect(a.destination);
 const S=window.LP_SAMPLES||{};
 Object.keys(S).forEach(k=>{try{const s=atob(S[k]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);const ok=b=>{buf[k]=b},r=a.decodeAudioData(u.buffer.slice(0),ok,()=>{});if(r&&r.then)r.then(ok).catch(()=>{})}catch(e){}});

}
function noiseBuf(a){if(!noiseBuf.b){const b=a.createBuffer(1,a.sampleRate,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noiseBuf.b=b}return noiseBuf.b}
function burst(a,t,f,q,dur,vol,type){const n=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();n.buffer=noiseBuf(a);fl.type=type||"bandpass";fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(fl);fl.connect(g);g.connect(bus);n.start(t,Math.random());n.stop(t+dur+.02)}
function ping(a,t,f,dur,vol,type){const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.02)}
function drumSound(id,vel,at){
 const a=audio();if(!a)return;const p=PADS[id],t=a.currentTime+(at||0);vel=vel||1;
 if(p.s&&buf[p.s]){
  const src=a.createBufferSource(),g=a.createGain();src.buffer=buf[p.s];src.playbackRate.value=p.r;
  g.gain.setValueAtTime(vel,t);g.gain.setValueAtTime(vel,t+p.len-.08);g.gain.linearRampToValueAtTime(0,t+p.len);
  let node=src;if(p.hp){const f=a.createBiquadFilter();f.type="highpass";f.frequency.value=p.hp;src.connect(f);node=f}
  node.connect(g);g.connect(bus);src.start(t);src.stop(t+p.len+.02);return;
 }
 if(p.syn==="tamb"){for(let k=0;k<3;k++)burst(a,t+k*.028,7000+k*600,1.2,.13,.3*vel,"highpass");ping(a,t,3200,.18,.05*vel,"triangle")}
 else if(p.syn==="bell"){ping(a,t,562,.5,.22*vel,"square");ping(a,t,845,.4,.16*vel,"square");burst(a,t,2600,2,.05,.18*vel)}
 else if(p.syn==="block"){ping(a,t,1250,.09,.5*vel,"sine");ping(a,t,2100,.05,.2*vel,"triangle");burst(a,t,3000,1.5,.03,.25*vel)}

}

}

/* ---- hits ---- */
function hit(i,user,vel){
 if(!audio())return;

 if(!user)return;
 if(mode==="free"||demoing||!song&&mode!=="copy"){speakHit(i);return}

}

 if(i===n.pad){if(song.tune)mel(n.s);pos++;wrong=0;setStrip();if(pos>=song.pn.length)finishSong()}

}

const cv=$("cv"),cx=cv.getContext("2d");let CW=0,CH=0;

function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function laneX(i){const c=cv.getBoundingClientRect(),p=pads[i].getBoundingClientRect();return{x:p.left+p.width/2-c.left,w:Math.min(p.width*.5,70)}}

 cx.fillStyle="#ffd84acc";cx.fillRect(CW*.04,line,CW*.92,4);
 const codes=codesFor(kitI);
 R.notes.forEach(n=>{
  const ln=laneX(n.pad),y0=line-(n.T-now)*sp,h=Math.max(34,n.d*sp),top=y0-h;if(top>CH||y0<-4)return;
  const w=ln.w,x=ln.x-w/2;cx.globalAlpha=n.st===2?.28:(n.st===1?.35:1);
  cx.fillStyle=n.st===1?"#ffd84a":PADS[kit()[n.pad]].c;rr(x,top,w,h,Math.min(14,w/3));cx.fill();cx.lineWidth=3;cx.strokeStyle="#fff";cx.stroke();
  if(keysMode==="letters"){cx.fillStyle="#fff";cx.font="700 "+Math.max(14,Math.min(26,w*.4))+"px Fredoka,system-ui,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.shadowColor="#0008";cx.shadowBlur=3;cx.fillText(label(codes[n.pad]),x+w/2,y0-Math.min(h/2,22));cx.shadowBlur=0}
  cx.globalAlpha=1;
 });
}
function startRhythm(){
 const a=audio();if(!a||!song)return;const spb=60/(song.bpm*TEMPO()),FT=2.6,t0=a.currentTime+FT*.9;
 R={spb,FT,t0,hits:0,win:[.38,.3,.24][Math.min(2,age())],notes:song.pn.map(n=>({pad:n.pad,s:n.s,T:t0+n.t*spb,d:Math.max(.14,n.b*spb*.9),st:0}))};

}

 R.notes.forEach(n=>{if(n.st===0&&now>n.T+R.win){n.st=2;drumSound(kit()[n.pad],.35);if(song.tune)mel(n.s,0,n.d);flash(n.pad,"show")}});
 if(now>R.end){const f=R.hits/R.total,stars=f>=.8?3:f>=.5?2:1;R=null;drawLanes(0);finishSong(stars);return}

}

});
addEventListener("keyup",e=>{delete held["k:"+e.code]});
function down(id,i){if(locked&&mode!=="free")return;held[id]=i;hit(i,true)}
$("kit").addEventListener("pointerdown",e=>{
 const b=e.target.closest(".pad");if(!b)return;e.preventDefault();const i=+b.dataset.i;
 if(remap>=0){selPad(i);return}
 down("p:"+e.pointerId,i);
});

/* choose letters: the glowing drum waits for a key, then the next one glows */
function selPad(i){remap=i;pads.forEach((p,k)=>p.classList.toggle("sel",k===i));bubble(U().remap)}
function startRemap(){selPad(0);setTarget(null)}
function endRemap(){remap=-1;pads.forEach(p=>p.classList.remove("sel"));bubble(song?ttl(song.id):U().bangHint);saveMap()}
function assignKey(e){
 const codes=codesFor(kitI),i=remap;if(!e.code)return;
 const j=codes.indexOf(e.code);if(j>=0&&j!==i)codes[j]=codes[i];
 codes[i]=e.code;if(e.key&&e.key.length===1&&e.key!==" ")learned[e.code]=e.key.toUpperCase();
 labels();if(i+1<codes.length)selPad(i+1);else endRemap();
}

/* ---- controls and menus ---- */
let menuFor=null;
function closeMenu(){$("menu").hidden=true;menuFor=null}
function openMenu(btn,items){
 if(menuFor===btn){closeMenu();return}
 const m=$("menu");m.innerHTML="";
 items.forEach(it=>{
  if(it.sep){const d=document.createElement("div");d.className="sep";d.textContent=it.sep;m.appendChild(d);return}
  const b=document.createElement("button");b.type="button";b.setAttribute("role","menuitem");b.textContent=it.t;if(it.on)b.classList.add("on");b.onclick=()=>{closeMenu();it.fn()};m.appendChild(b);
 });
 m.hidden=false;menuFor=btn;const r=btn.getBoundingClientRect();
 m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.left))+"px";m.style.top=Math.max(8,r.top-6-m.offsetHeight)+"px";
}
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#menu")&&!e.target.closest(".ctl"))closeMenu()},true);
function refreshCtl(){
 const u=U();
 $("bPlay").textContent="🥁 "+(mode==="copy"?u.copy:song?ttl(song.id):u.bang)+" ▾";
 $("bHow").hidden=!song;$("bHow").textContent=u[curHow()]+" ▾";
 $("bListen").hidden=!song||mode==="rhythm";$("bListen").textContent="▶ "+u.listen;
 $("bKit").textContent=u.kit+": "+u.kits[kitI]+" ▾";
 $("bKeys").textContent=u.keys+": "+(keysMode==="letters"?u.letters:u.any)+" ▾";
 $("bWords").textContent=u.wordsL+": "+(wordsMode==="always"?u.always:wordsMode==="some"?u.some:u.off)+" ▾";
 $("bKbd").textContent="⌨ "+(layout==="auto"?u.auto+" ("+LAYNAME[guessLayout()]+")":LAYNAME[layout])+" ▾";
}
$("bPlay").onclick=()=>{const u=U();openMenu($("bPlay"),[{t:"🥁 "+u.bang,on:mode==="free"&&!song,fn:freePlay},{t:"👂 "+u.copy,on:mode==="copy",fn:startCopy},{sep:u.songs}].concat(SONGS.map(s=>({t:ttl(s.id),on:song&&song.id===s.id,fn:()=>startSong(s.id)}))))};
$("bHow").onclick=()=>{const u=U();openMenu($("bHow"),["mash","follow","rhythm"].map(h=>({t:u[h],on:curHow()===h,fn:()=>{how=h;if(song)startSong(song.id,true);else refreshCtl()}})))};
$("bListen").onclick=()=>{if(song){stopAll();pos=0;listen()}};
$("bKit").onclick=()=>{const u=U();openMenu($("bKit"),u.kits.map((n,k)=>({t:n,on:kitI===k,fn:()=>setKit(k,true)})))};
$("bKeys").onclick=()=>{const u=U();openMenu($("bKeys"),[{t:u.any,on:keysMode==="any",fn:()=>setKeys("any")},{t:u.letters,on:keysMode==="letters",fn:()=>setKeys("letters")},{t:"✎ "+u.change,fn:()=>{setKeys("letters");startRemap()}}])};
$("bWords").onclick=()=>{const u=U();openMenu($("bWords"),[["always",u.always],["some",u.some],["off",u.off]].map(p=>({t:p[1],on:wordsMode===p[0],fn:()=>{wordsMode=p[0];store.set("words",p[0]);refreshCtl()}})))};
$("bKbd").onclick=()=>{const u=U();openMenu($("bKbd"),[{t:u.auto,on:layout==="auto",fn:()=>{layout="auto";store.set("layout","auto");labels()}}].concat(Object.keys(LAYNAME).map(n=>({t:LAYNAME[n],on:layout===n,fn:()=>{layout=n;store.set("layout",n);labels()}}))))};
function setKeys(k){keysMode=k;keysSet=true;store.set("keys",k);labels()}
function setKit(k,user){
 if(user){kitSet=true;store.set("kit",""+k)}
 if(k===kitI&&pads.length)return;kitI=k;remap=-1;
 const s=song,m=mode;buildKit();
 if(s)startSong(s.id,true);else if(m==="copy")startCopy();else refreshCtl();
}

LP.init({langs:ALLLANGS,
 onLang:()=>{document.title="Drum Parade";buildKit();if(song)bubble(ttl(song.id));else if(mode==="free")bubble(U().bangHint)},
 onAge:()=>{if(!kitSet&&dKit()!==kitI)setKit(dKit());if(!keysSet&&dKeys()!==keysMode){keysMode=dKeys();labels()}refreshCtl()}});
LP.start("Drum Parade",()=>{
 if(!kitSet)kitI=dKit();if(!keysSet)keysMode=dKeys();
 buildKit();fit();ready=true;
 if(age()>=2)startSong("march",true,true);else if(age()>=1)startCopy();else freePlay();
});
</script>
</body>
