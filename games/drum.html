<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.LP_GAME="drum"</script><script src="voice.js"></script><script src="bridge.js"></script><script src="look.js"></script><script src="audio/sfx.drum.js"></script><script src="sfx.js"></script>
<title>Drum Parade</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:light;--stage:#2b1d4a;--stage2:#452c6e;--ink:#fff8ec;--gold:#ffc94a;--red:#ff5d5d;--blue:#4ab8ff;--green:#5fd98a;--pink:#ff8fd1}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--stage2),var(--stage) 70%);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;overflow:hidden;cursor:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-block:16px;padding-inline:16px;box-sizing:border-box;gap:12px}
header{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
h1{margin:0;font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:.5px;text-wrap:balance;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button.chip{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:999px;padding:6px 16px;background:#ffffff22;color:var(--ink);cursor:none}
button.chip.on{background:var(--gold);color:var(--stage)}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#word{font-size:clamp(48px,11vw,110px);font-weight:800;min-height:1.2em;line-height:1.1;text-align:center;color:var(--gold);text-shadow:0 6px 0 #0004;transition:transform .12s}
#hint{font-size:20px;opacity:.85;min-height:1.4em;text-align:center}
.lights{display:flex;gap:14px;min-height:30px}
.lights span{width:26px;height:26px;border-radius:50%;background:#ffffff22;transition:background .1s,transform .1s}
.lights span.lit{background:var(--gold);transform:scale(1.25)}
.lights span.ok{background:var(--green)}
.kit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,3vw,28px);width:min(720px,100%);flex:1;max-height:60vh}
@media(min-width:700px){.kit{grid-template-columns:repeat(4,1fr);max-height:40vh}}
.pad{position:relative;border:0;border-radius:50%;aspect-ratio:1;max-width:100%;margin:auto;width:100%;max-height:100%;cursor:none;font:inherit;color:var(--stage);background:radial-gradient(circle at 40% 35%,#fff,var(--c) 55%,color-mix(in srgb,var(--c),#000 30%));box-shadow:0 12px 0 color-mix(in srgb,var(--c),#000 45%),inset 0 0 0 10px #ffffff55;transition:transform .07s,box-shadow .07s;display:grid;place-items:center}
.pad b{font-size:clamp(38px,8vw,64px);pointer-events:none}
.pad.hit{transform:translateY(8px) scale(.96);box-shadow:0 4px 0 color-mix(in srgb,var(--c),#000 45%),inset 0 0 0 10px #fff9}
.pad.show{animation:glow .45s}
@keyframes glow{0%{filter:brightness(1.7) drop-shadow(0 0 30px #fff)}100%{filter:none}}
.ring{position:absolute;inset:0;border-radius:50%;border:6px solid var(--c);pointer-events:none;animation:ring .5s forwards}
@keyframes ring{to{transform:scale(1.5);opacity:0}}
#cursor{position:fixed;left:0;top:0;font-size:56px;pointer-events:none;z-index:9;transform:translate(-30%,-10%);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 3px #fff);transition:transform .1s}
#cursor.over{transform:translate(-30%,-10%) scale(1.2) rotate(-10deg)}
#cursor.down{transform:translate(-30%,-10%) scale(.85)}
@media (hover:none){#cursor{display:none}body,button,.pad{cursor:auto}}
.conf{position:fixed;font-size:34px;pointer-events:none;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(60vh) rotate(360deg);opacity:0}}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#1a1030ee;z-index:5}
#start button{font:inherit;font-weight:800;font-size:40px;padding:20px 48px;border:0;border-radius:999px;background:var(--gold);color:var(--stage);box-shadow:0 10px 0 #b8861a;cursor:none}
@media (prefers-reduced-motion:reduce){.ring,.conf,.pad.show{animation:none}}

/* LingoPlaytime look */

:root{--stage:#140f3a;--stage2:#3a2a86;--gold:#ffd23f;--red:#ff4d5e;--blue:#3aa0ff;--green:#58d26b;--pink:#ff4f8b}
body{background:radial-gradient(70% 50% at 50% 0%,#5240b866,transparent 70%),radial-gradient(120% 90% at 50% 0%,#3a2a86 0%,#241c63 45%,#140f3a 100%);font-family:"Fredoka","Baloo 2",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:conic-gradient(from 160deg at 20% -10%,transparent 0 10deg,#ffd23f14 10deg 22deg,transparent 22deg),conic-gradient(from 180deg at 80% -10%,transparent 0 12deg,#20c9b014 12deg 24deg,transparent 24deg)}
.pad{background:radial-gradient(circle at 36% 30%,#ffffffcc 0 8%,transparent 30%),radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c),#fff 25%),var(--c) 55%,color-mix(in srgb,var(--c),#000 30%));box-shadow:0 14px 0 color-mix(in srgb,var(--c),#000 45%),0 20px 40px #0006,inset 0 0 0 10px #ffffff33}
.pad.hit{box-shadow:0 5px 0 color-mix(in srgb,var(--c),#000 45%),0 0 50px var(--c),inset 0 0 0 10px #fff7}
.pad b{display:none}
#word{color:#ffd23f;text-shadow:0 0 30px #ffd23f66,0 6px 0 #0004}
#start{background:#140f3acc}
#start button{background:linear-gradient(#ffe27a,#ffc23d);color:#1a1440;box-shadow:0 10px 0 #c98a12,0 0 60px #ffd23f66}
</style>

<div class="wrap">
  <header>
    <h1 id="title">Drum Parade</h1>
  </header>
  <div class="bar" id="langs" aria-label="Language"></div>
  <div class="bar">
    <button class="chip on" id="mFree">🥁 Bang!</button>
    <button class="chip" id="mCopy">👂 Copy me</button>
  </div>
  <div id="word" aria-live="polite"></div>
  <div class="lights" id="lights"></div>
  <div id="hint"></div>
  <div class="kit" id="kit"></div>
</div>
<div id="start"><button id="go">🥁 Play!</button></div>
<div id="cursor">👆</div>

<script>
const params=new URLSearchParams(location.search);
const kid=params.get('name')||'';
const L={
 en:{name:'English',v:'en-US',drums:['Big drum','Snare','Bongo','Cymbal'],nums:['One','Two','Three','Four','Five'],yay:'Yay!',your:'Your turn!',listen:'Listen!'},
 de:{name:'Deutsch',v:'de-DE',drums:['Große Trommel','Kleine Trommel','Bongo','Becken'],nums:['Eins','Zwei','Drei','Vier','Fünf'],yay:'Super!',your:'Du bist dran!',listen:'Hör zu!'},
 es:{name:'Español',v:'es-ES',drums:['Bombo','Tambor','Bongó','Platillo'],nums:['Uno','Dos','Tres','Cuatro','Cinco'],yay:'¡Bravo!',your:'¡Te toca!',listen:'¡Escucha!'},
 it:{name:'Italiano',v:'it-IT',drums:['Grancassa','Rullante','Bongo','Piatto'],nums:['Uno','Due','Tre','Quattro','Cinque'],yay:'Bravo!',your:'Tocca a te!',listen:'Ascolta!'},
 fr:{name:'Français',v:'fr-FR',drums:['Grosse caisse','Caisse claire','Bongo','Cymbale'],nums:['Un','Deux','Trois','Quatre','Cinq'],yay:'Bravo !',your:'À toi !',listen:'Écoute !'},
 pt:{name:'Português',v:'pt-PT',drums:['Bombo','Caixa','Bongô','Prato'],nums:['Um','Dois','Três','Quatro','Cinco'],yay:'Bravo!',your:'É a tua vez!',listen:'Ouve!'},
 nl:{name:"Nederlands",v:"nl-NL",drums:["Grote trom","Snaredrum","Bongo","Bekken"],nums:["Een","Twee","Drie","Vier","Vijf"],yay:"Hoera!",your:"Jouw beurt!",listen:"Luister!"},
 pl:{name:"Polski",v:"pl-PL",drums:["Duży bęben","Werbel","Bongosy","Talerz"],nums:["Jeden","Dwa","Trzy","Cztery","Pięć"],yay:"Hura!",your:"Twoja kolej!",listen:"Posłuchaj!"},
 sv:{name:"Svenska",v:"sv-SE",drums:["Stortrumma","Virveltrumma","Bongo","Cymbal"],nums:["Ett","Två","Tre","Fyra","Fem"],yay:"Hurra!",your:"Din tur!",listen:"Lyssna!"},
 el:{name:"Ελληνικά",v:"el-GR",drums:["Μεγάλο τύμπανο","Ταμπούρο","Μπόγκο","Κύμβαλο"],nums:["Ένα","Δύο","Τρία","Τέσσερα","Πέντε"],yay:"Γιούπι!",your:"Η σειρά σου!",listen:"Άκου!"},
 zh:{name:"中文",v:"zh-CN",drums:["大鼓","小鼓","邦戈鼓","镲"],nums:["一","二","三","四","五"],yay:"耶！",your:"轮到你了！",listen:"听！"},
 ar:{name:"العربية",v:"ar-SA",drums:["طبل كبير","طبل صغير","بونغو","صنج"],nums:["واحد","اثنان","ثلاثة","أربعة","خمسة"],yay:"هيه!",your:"دورك!",listen:"استمع!"},
 ja:{name:"日本語",v:"ja-JP",drums:["おおだいこ","スネア","ボンゴ","シンバル"],nums:["いち","に","さん","よん","ご"],yay:"やったー！",your:"きみのばん！",listen:"きいてね！"},
 ko:{name:"한국어",v:"ko-KR",drums:["큰북","작은북","봉고","심벌즈"],nums:["하나","둘","셋","넷","다섯"],yay:"야호!",your:"네 차례야!",listen:"들어 봐!"},
 ru:{name:"Русский",v:"ru-RU",drums:["Большой барабан","Малый барабан","Бонго","Тарелка"],nums:["Один","Два","Три","Четыре","Пять"],yay:"Ура!",your:"Твоя очередь!",listen:"Слушай!"},
 tr:{name:"Türkçe",v:"tr-TR",drums:["Büyük davul","Trampet","Bongo","Zil"],nums:["Bir","İki","Üç","Dört","Beş"],yay:"Yaşasın!",your:"Sıra sende!",listen:"Dinle!"},
 hi:{name:"हिन्दी",v:"hi-IN",drums:["बड़ा ढोल","छोटा ढोल","बोंगो","झाँझ"],nums:["एक","दो","तीन","चार","पाँच"],yay:"हुर्रे!",your:"तुम्हारी बारी!",listen:"सुनो!"}
};
let lang='en',mode='free';
const drums=[{e:'🥁',c:'#ff5d5d'},{e:'🪘',c:'#4ab8ff'},{e:'🎵',c:'#5fd98a'},{e:'✨',c:'#ffc94a'}];
if(kid) document.getElementById('title').textContent=`${kid}'s Drum Parade`;

// audio
let ac;
function tone(i){
 if(window.LPS&&LPS.play(ac,["bigdrum","snare","bongo","cymbal"][i],i===3?1.8:1.2))return;
 const t=ac.currentTime,g=ac.createGain();g.connect(ac.destination);
 if(i===0){const o=ac.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.4);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);o.start(t);o.stop(t+.5)}
 else if(i===2){const o=ac.createOscillator();o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(200,t+.15);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);o.start(t);o.stop(t+.3)}
 else{const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;n.buffer=b;
  const f=ac.createBiquadFilter();f.type=i===1?'bandpass':'highpass';f.frequency.value=i===1?1800:6000;
  const len=i===1?.2:.9;g.gain.setValueAtTime(i===1?.9:.45,t);g.gain.exponentialRampToValueAtTime(.001,t+len);n.connect(f);f.connect(g);n.start(t);n.stop(t+len);
  if(i===1){const o=ac.createOscillator(),g2=ac.createGain();o.frequency.value=190;g2.gain.setValueAtTime(.5,t);g2.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g2);g2.connect(ac.destination);o.start(t);o.stop(t+.15)}}
}
let voices=[];const loadV=()=>voices=speechSynthesis.getVoices();try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function say(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=L[lang].v;u.rate=.85;u.pitch=1.2;const v=voices.find(v=>v.lang.replace('_','-').startsWith(L[lang].v.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const word=document.getElementById('word'),hint=document.getElementById('hint'),lights=document.getElementById('lights');
function show(t){word.textContent=t;word.style.transform='scale(1.15)';setTimeout(()=>word.style.transform='',120)}

// pads
const kit=document.getElementById('kit');
const pads=drums.map((d,i)=>{const b=document.createElement('button');b.className='pad';b.style.setProperty('--c',d.c);b.innerHTML=`<b>${d.e}</b>`;b.setAttribute('aria-label',L.en.drums[i]);
 b.addEventListener('pointerdown',ev=>{ev.preventDefault();hit(i,true)});kit.appendChild(b);return b});
function flash(i,cls){const p=pads[i];p.classList.add(cls);const r=document.createElement('span');r.className='ring';p.appendChild(r);setTimeout(()=>{p.classList.remove(cls);r.remove()},cls==='hit'?110:450)}
let count=0,lastHit=0;
function hit(i,user){
 if(!ac)return;tone(i);flash(i,user?'hit':'show');
 if(!user)return;
 if(mode==='free'){
  const now=Date.now();count=(now-lastHit>1500)?1:count%5+1;lastHit=now;
  if(count===1){show(L[lang].drums[i]);say(L[lang].drums[i])}else{show(L[lang].nums[count-1]);say(L[lang].nums[count-1])}
 }else if(state==='wait'){
  // any drum counts: toddlers keep the beat, not the colour
  got++;const s=lights.children[got-1];if(s)s.className='ok';show(L[lang].nums[got-1]);say(L[lang].nums[got-1]);
  if(got>=pattern.length){state='done';setTimeout(win,500)}
 }
}
// copy mode
let pattern=[],got=0,state='idle',level=((window.LP_SETTINGS||{}).age||0)>=2?3:2;
function renderLights(n){lights.innerHTML='';for(let k=0;k<n;k++)lights.appendChild(document.createElement('span'))}
function round(){
 if(mode!=='copy')return;state='play';got=0;
 pattern=Array.from({length:level},()=>Math.floor(Math.random()*4));renderLights(level);
 show(L[lang].listen);say(L[lang].listen);hint.textContent='👂';
 pattern.forEach((d,k)=>setTimeout(()=>{if(mode!=='copy')return;hit(d,false);lights.children[k]&&(lights.children[k].className='lit');show(L[lang].nums[k])},1300+k*650));
 setTimeout(()=>{if(mode!=='copy')return;[...lights.children].forEach(s=>s.className='');state='wait';show(L[lang].your);say(L[lang].your+(kid?' '+kid:''));hint.textContent=`🥁 × ${level}`},1300+level*650+300);
}
function win(){
 show(L[lang].yay);say(L[lang].yay+(kid?' '+kid:''));
 for(let k=0;k<18;k++){const c=document.createElement('div');c.className='conf';c.textContent=['🎉','⭐','🥁','🎊'][k%4];c.style.left=Math.random()*100+'vw';c.style.top=Math.random()*20+'vh';document.body.appendChild(c);setTimeout(()=>c.remove(),1500)}
 level=level>=5?SL:level+1;setTimeout(round,2200);
}
const SL=((window.LP_SETTINGS||{}).age||0)>=2?3:2;
const START=((window.LP_SETTINGS||{}).age||0)>=1?'copy':'free';
function setMode(m){mode=m;document.getElementById('mFree').classList.toggle('on',m==='free');document.getElementById('mCopy').classList.toggle('on',m==='copy');
 lights.innerHTML='';hint.textContent='';word.textContent='';
 if(m==='copy'){level=SL;round()}else{hint.textContent='🥁 🥁 🥁'}}
document.getElementById('mFree').onclick=()=>setMode('free');
document.getElementById('mCopy').onclick=()=>setMode('copy');

// languages
const lb=document.getElementById('langs');
Object.keys(L).forEach(k=>{const b=document.createElement('button');b.className='chip'+(k===lang?' on':'');b.textContent=L[k].name;b.onclick=()=>{lang=k;[...lb.children].forEach(c=>c.classList.toggle('on',c===b));show(L[k].drums[0]);say(L[k].drums[0])};lb.appendChild(b)});

// keyboard mashing: every key hits a drum
addEventListener('keydown',e=>{if(e.repeat||!ac)return;if(e.key==='Tab')return;e.preventDefault();hit((e.key.charCodeAt(0)||0)%4,true)});

// start
document.getElementById('go').onclick=()=>{ac=new (window.AudioContext||window.webkitAudioContext)();if(window.LPS)LPS.warm(ac);document.getElementById('start').hidden=true;hint.textContent='🥁 🥁 🥁';say(kid?`${kid}!`:L[lang].drums[0]);if(START==='copy')setTimeout(()=>setMode('copy'),1800)};

// cursor
const cur=document.getElementById('cursor');
addEventListener('pointermove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';cur.classList.toggle('over',!!e.target.closest('button'))});
addEventListener('pointerdown',()=>cur.classList.add('down'));addEventListener('pointerup',()=>cur.classList.remove('down'));
</script>

</body></html>
