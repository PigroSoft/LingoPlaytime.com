<style>

html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar select,#bar button{font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;cursor:pointer}

#score{margin-left:auto;font-weight:800;font-size:22px;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:0 14px;font-variant-numeric:tabular-nums}
#word{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.6);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:6px 26px;text-align:center;pointer-events:none;max-width:calc(100% - 32px)}
#word.show{opacity:1;transform:translateX(-50%) scale(1)}
#word b{display:block;font-size:clamp(34px,8vw,64px);line-height:1.1}
#word span{display:block;font-size:clamp(16px,3.4vw,24px);opacity:.75;font-weight:700;margin-top:2px}
#word:after{content:"";position:absolute;top:8px;right:10px;font-size:15px}

#intro{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
#intro div{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:22px 28px;text-align:center;max-width:420px}
#intro h1{margin:0;font-size:44px;line-height:1;text-wrap:balance}

#bar select,#bar button{font-family:"Fredoka","Baloo 2",system-ui,sans-serif;border-radius:999px}
#word{font-family:"Fredoka","Baloo 2",system-ui,sans-serif}

const sel=document.getElementById("lang"),sel2=document.getElementById("lang2");
for(const k of KEYS){sel.appendChild(new Option(LANGS[k].n,k));sel2.appendChild(new Option(LANGS[k].n,k))}
function markVoices(){
 if(!voiceCache.length)return;
 for(const s of[sel,sel2])for(const o of s.options){
  const has=!!bestVoice(o.value);
  o.textContent=LANGS[o.value].n+(has?"":" (no voice here)");
 }
}
let lang="en";try{lang=localStorage.getItem("fw-lang")||lang}catch(e){}
if(!LANGS[lang])lang="en";sel.value=lang;
let lang2="de";try{lang2=localStorage.getItem("fw-lang2")||lang2}catch(e){}
if(!LANGS[lang2])lang2="de";sel2.value=lang2;
sel.onchange=()=>{lang=sel.value;try{localStorage.setItem("fw-lang",lang)}catch(e){};sel.blur()};
sel2.onchange=()=>{lang2=sel2.value;try{localStorage.setItem("fw-lang2",lang2)}catch(e){};sel2.blur()};
const CHARS={
 bird:{n:"🐦 Bird",body:"#ff6f91",trim:"#ffd1dc"},
 plane:{n:"✈️ Plane",body:"#5aa9e6",trim:"#e8f4ff"},
 rocket:{n:"🚀 Rocket",body:"#e63946",trim:"#f1faee"},
 balloon:{n:"🎈 Balloon",body:"#9b5de5",trim:"#f0e6ff"},
 bee:{n:"🐝 Bee",body:"#ffca3a",trim:"#2b2118"}};
const charSel=document.getElementById("char");
for(const k in CHARS){const o=document.createElement("option");o.value=k;o.textContent=CHARS[k].n;charSel.appendChild(o)}
let charKey="bird";try{charKey=localStorage.getItem("fw-char")||charKey}catch(e){}
if(!CHARS[charKey])charKey="bird";charSel.value=charKey;

const modeBtn=document.getElementById("mode");let toddler=((window.LP_SETTINGS||{}).age||0)<2;modeBtn.setAttribute("aria-pressed",toddler);modeBtn.textContent=toddler?"🧸 Toddler":"🎯 Big Kids";
modeBtn.onclick=()=>{toddler=!toddler;modeBtn.setAttribute("aria-pressed",toddler);modeBtn.textContent=toddler?"🧸 Toddler":"🎯 Big Kids";modeBtn.blur();bag=[];reset()};
function words(){return toddler?W:HARD}

let voiceCache=[],voicesReady=false;
function loadVoices(){try{const v=speechSynthesis.getVoices();if(v&&v.length){voiceCache=v;voicesReady=true;markVoices()}}catch(e){}}
if(window.speechSynthesis){
 loadVoices();
 speechSynthesis.addEventListener("voiceschanged",loadVoices);
 // Some browsers (mobile Safari, some Android webviews) never fire voiceschanged
 // and only populate the list a moment after the first getVoices() call, so poll briefly too.
 let tries=0;const poll=setInterval(()=>{loadVoices();if(voicesReady||++tries>20)clearInterval(poll)},250);
}
function bestVoice(code){
 const want=LANGS[code].v.toLowerCase(),prefix=want.slice(0,2);
 return voiceCache.find(v=>v.lang.toLowerCase().replace("_","-")===want)
   || voiceCache.find(v=>v.lang.toLowerCase().startsWith(prefix))
   || null;
}
function noVoiceHint(){wordEl.classList.add("mute");clearTimeout(muteT);muteT=setTimeout(()=>wordEl.classList.remove("mute"),1500)}
let muteT;
function say(t,code,queue,tries){
 tries=tries||0;
 try{
  const s=window.speechSynthesis;if(!s)return noVoiceHint();
  loadVoices();
  const v=bestVoice(code);
  if(!v&&!voicesReady&&tries<6){setTimeout(()=>say(t,code,queue,tries+1),300);return} // voices still loading, retry briefly
  if(!queue)s.cancel(); // starting a fresh pair: clear anything mid-speech; the second call in a pair queues after the first instead
  const u=new SpeechSynthesisUtterance(t);
  u.lang=v?v.lang:LANGS[code].v;u.rate=.8;u.pitch=1.2;
  if(v)u.voice=v;else if(!(window.LP_CLIPS&&LP_CLIPS[code])){noVoiceHint();return} // no matching voice on this device: skip rather than mispronounce in the wrong language
  s.speak(u);
 }catch(e){noVoiceHint()}
}
function sayBoth(t1,c1,t2,c2){say(t1,c1,false);if(c2!==c1||t2!==t1)say(t2,c2,true)}
let actx;function blip(f,d=.12,type="triangle"){try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,actx.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.6,actx.currentTime+d);g.gain.setValueAtTime(.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

const cv=document.getElementById("c"),cx=cv.getContext("2d");let Wd,Ht,dpr;
function size(){dpr=Math.min(2,devicePixelRatio||1);Wd=innerWidth;Ht=innerHeight;cv.width=Wd*dpr;cv.height=Ht*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",size);size();

const wordEl=document.getElementById("word"),wText=document.getElementById("wText"),wSub=document.getElementById("wSub"),scoreEl=document.getElementById("score"),intro=document.getElementById("intro");
let bird,pipes,score,started,over,t0,spawnT,bag=[],clouds=[],hideT,shake=0,parts=[];
for(let i=0;i<6;i++)clouds.push({x:Math.random()*2000,y:Math.random()*.5,s:.6+Math.random(),v:.2+Math.random()*.4});
function nextWord(){if(!bag.length)bag=words().map((_,i)=>i).sort(()=>Math.random()-.5);return bag.pop()}
function reset(){bird={x:Math.min(Wd*.28,220),y:Ht*.45,vy:0,r:Math.max(18,Math.min(Wd,Ht)*.035),rot:0};pipes=[];score=0;over=false;spawnT=0;scoreEl.textContent=0}
reset();
function flap(){if(!started){started=true;intro.hidden=true}
 if(over){reset();return}
 bird.vy=-Math.max(6.2,Ht*.0115);blip(420+Math.random()*80)}
addEventListener("keydown",e=>{const onSel=e.target===sel||e.target===sel2||e.target===charSel;if(onSel&&!e.key.match(/^[ a-z0-9]$/i))return;if(e.metaKey||e.ctrlKey)return;if(onSel)e.target.blur();e.preventDefault();flap()});
cv.addEventListener("pointerdown",flap);intro.addEventListener("pointerdown",flap);wordEl.style.pointerEvents="none";

function speed(){return (toddler?2.4:3.1+Math.min(score*.08,2.2))*Math.max(1,Wd/900)}
function gapSize(){return toddler?Math.max(210,Ht*.42):Math.max(150,Ht*.3-Math.min(score*2,40))}
function spawn(){const g=gapSize(),m=70,y=m+g/2+Math.random()*(Ht-2*m-g);pipes.push({x:Wd+60,gy:y,g,w:Math.max(64,Wd*.07),w_i:nextWord(),got:false,hue:[120,200,30,330][Math.floor(Math.random()*4)]})}
function show(i){
 const e=words()[i],k1=KEYS.indexOf(lang)+1,k2=KEYS.indexOf(lang2)+1;

 wordEl.classList.add("show");clearTimeout(hideT);hideT=setTimeout(()=>wordEl.classList.remove("show"),2800);
 sayBoth(e[k1],lang,e[k2],lang2);
}
function burst(x,y){for(let i=0;i<18;i++){const a=Math.random()*6.28,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:40,c:["#ffc93c","#ff6f91","#fff","#4caf6a"][i%4]})}}

function step(){
 const g=Math.max(.34,Ht*.00062);
 if(started&&!over){
  bird.vy=Math.min(bird.vy+g,12);bird.y+=bird.vy;
  if(bird.y<bird.r){bird.y=bird.r;bird.vy=0}
  const floor=Ht-40;
  if(bird.y>floor-bird.r){if(toddler){bird.y=floor-bird.r;bird.vy=-Math.max(5,Ht*.009)}else crash()}
  spawnT-=speed();if(spawnT<=0){spawn();spawnT=toddler?Math.max(340,Wd*.45):Math.max(280,Wd*.36)}
  for(const p of pipes){p.x-=speed();
   const inX=bird.x+bird.r*.8>p.x&&bird.x-bird.r*.8<p.x+p.w;
   if(inX){const top=p.gy-p.g/2,bot=p.gy+p.g/2;
    if(bird.y-bird.r*.8<top||bird.y+bird.r*.8>bot){if(toddler){bird.y+=(p.gy-bird.y)*.25;bird.vy*=.3}else crash()}}
   if(!p.got&&bird.x>p.x+p.w/2){p.got=true;score++;scoreEl.textContent=score;show(p.w_i);burst(p.x+p.w/2,p.gy);blip(660,.25,"sine")}}
  pipes=pipes.filter(p=>p.x>-p.w-20);
 }else if(!started){bird.y=Ht*.45+Math.sin(performance.now()/300)*14}
 bird.rot+=((Math.max(-.5,Math.min(1.1,bird.vy*.08)))-bird.rot)*.2;
 for(const c of clouds){c.x-=c.v*(started&&!over?1:.3);if(c.x<-200)c.x=Wd+100+Math.random()*200}
 for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.15;q.l--}parts=parts.filter(q=>q.l>0);
 if(shake>0)shake*=.9;
}
function crash(){over=true;shake=12;blip(160,.4,"sawtooth");wText.textContent="💥 "+score;wText.dir="ltr";wSub.textContent="press any key";wordEl.classList.add("show");clearTimeout(hideT)}

function draw(){
 cx.save();if(shake>.5)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const sk=cx.createLinearGradient(0,0,0,Ht);const TD=SKYT[(()=>{const h=new Date().getHours();return h>=6&&h<10?"morning":h>=10&&h<17?"day":h>=17&&h<20?"evening":"night"})()];sk.addColorStop(0,TD[0]);sk.addColorStop(.5,TD[1]);sk.addColorStop(1,TD[2]);cx.fillStyle=sk;cx.fillRect(-20,-20,Wd+40,Ht+40);
 {const gl=cx.createRadialGradient(Wd-90,110,10,Wd-90,110,140);gl.addColorStop(0,"rgba(255,230,120,.7)");gl.addColorStop(1,"rgba(255,210,63,0)");cx.fillStyle=gl;cx.fillRect(Wd-240,-40,300,300);const sg=cx.createRadialGradient(Wd-104,96,4,Wd-90,110,46);sg.addColorStop(0,"#fffbe6");sg.addColorStop(.5,"#ffe066");sg.addColorStop(1,"#ffb000");cx.fillStyle=sg;cx.beginPath();cx.arc(Wd-90,110,46,0,7);cx.fill();}
 cx.fillStyle="#fff";for(const c of clouds){const x=c.x,y=c.y*Ht+60,s=c.s*30;cx.beginPath();cx.arc(x,y,s,0,7);cx.arc(x+s,y-s*.5,s*1.2,0,7);cx.arc(x+s*2.1,y,s,0,7);cx.fill()}
 for(const p of pipes){const top=p.gy-p.g/2,bot=p.gy+p.g/2,col=`hsl(${p.hue} 78% 60%)`,dk=`hsl(${p.hue} 70% 42%)`;
  cx.fillStyle=col;cx.strokeStyle="rgba(0,0,0,0)";cx.lineWidth=4;
