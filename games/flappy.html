function say(t,code,queue,tries){

function show(i){
 const e=words()[i],k1=KEYS.indexOf(lang)+1,k2=KEYS.indexOf(lang2)+1;
 wText.textContent="";const pi=pic(e[0]);if(ok(pi)){const im=document.createElement("img");im.src=pi.src;im.alt="";im.style.cssText="height:1.05em;width:auto;vertical-align:-.12em;margin-right:.25em";wText.appendChild(im)}else wText.appendChild(document.createTextNode(e[0]+" "));wText.appendChild(document.createTextNode(e[k1]));wText.dir=lang==="ar"?"rtl":"ltr";
 wSub.textContent=lang2===lang?"":e[k2];wSub.dir=lang2==="ar"?"rtl":"ltr";
 wordEl.classList.add("show");clearTimeout(hideT);hideT=setTimeout(()=>wordEl.classList.remove("show"),2800);
 sayBoth(e[k1],lang,e[k2],lang2);
}
function burst(x,y){for(let i=0;i<18;i++){const a=Math.random()*6.28,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:40,c:["#f2b134","#e0584a","#fbf3df","#6aa84f"][i%4]})}}

function step(){
 const g=Math.max(.34,Ht*.00062);
 if(started&&!over){
  bird.vy=Math.min(bird.vy+g,12);bird.y+=bird.vy;
  if(bird.y<bird.r){bird.y=bird.r;bird.vy=0}
  const floor=Ht-groundH()+10;
  if(bird.y>floor-bird.r){if(toddler){bird.y=floor-bird.r;bird.vy=-Math.max(5,Ht*.009)}else crash()}
  gscroll+=speed();spawnT-=speed();if(spawnT<=0){spawn();spawnT=toddler?Math.max(340,Wd*.45):Math.max(280,Wd*.36)}
  for(const p of pipes){p.x-=speed();
   const inX=bird.x+bird.r*.8>p.x&&bird.x-bird.r*.8<p.x+p.w;
   if(inX){const top=p.gy-p.g/2,bot=p.gy+p.g/2;
    if(bird.y-bird.r*.8<top||bird.y+bird.r*.8>bot){if(toddler){bird.y+=(p.gy-bird.y)*.25;bird.vy*=.3}else crash()}}
   if(!p.got&&bird.x>p.x+p.w/2){p.got=true;score++;scoreEl.textContent=score;show(p.w_i);LPLearn.heard(words()[p.w_i][1],window.LP_LANG);burst(p.x+p.w/2,p.gy);blip(660,.25,"sine")}}
  pipes=pipes.filter(p=>p.x>-p.w-20);
 }else if(!started){bird.y=Ht*.45+Math.sin(performance.now()/300)*14}
 bird.rot+=((Math.max(-.5,Math.min(1.1,bird.vy*.08)))-bird.rot)*.2;
 for(const c of clouds){c.x-=c.v*(started&&!over?1:.3);if(c.x<-c.w-20)c.x=Wd+60+Math.random()*200}
 for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.15;q.l--}parts=parts.filter(q=>q.l>0);
 if(shake>0)shake*=.9;
}
function crash(){over=true;shake=12;blip(160,.4,"sawtooth");wText.textContent="💥 "+score;wText.dir="ltr";wSub.textContent="press any key";wordEl.classList.add("show");clearTimeout(hideT)}

const F="../felt/",IMG={};
function img(n){let i=IMG[n];if(!i){i=new Image();i.src=F+n;IMG[n]=i}return i}
const ok=i=>i&&i.complete&&i.naturalWidth>0;
const strip=e=>e.replace(/️/g,"");
const PIC={};
for(const [e,n] of [["🐶","peek-dog"],["🐱","sky-cat"],["🍎","food-apple"],["🍌","food-banana"],["⚽","sky-ball"],["🚗","night-car"],["🐟","sky-fish"],["🌙","sky-moon"],["⭐","sky-star"],["🐘","sky-elephant"],["🦆","sky-duck"],["🌸","train-flower"],["🍓","food-strawberry"],["🚂","train-steam"],["🐻","peek-teddy"],["☀️","sky-sun"],["🐸","peek-frog"],["🍪","train-cookie"],["🐮","peek-cow"],["🚀","fw-rocket"],
 ["🌈","sky-rainbow"],["🦋","sky-butterfly"],["🦕","fw-dino"],["⛰️","fw-mountain"],["☂️","sky-umbrella"],["🚲","fw-bicycle"],["🌋","fw-volcano"],["🕷️","sky-spider"],["🏰","fw-castle"],["🐉","fw-dragon"],["🤖","fw-robot"],["🏝️","fw-island"],["🌲","fw-forest"],["⚡","fw-storm"],["🪐","fw-planet"],["🏴‍☠️","fw-pirate"],["🦄","fw-unicorn"],["🏞️","fw-waterfall"],["🐧","fw-penguin"],["👨‍🚀","fw-astronaut"]])PIC[strip(e)]=n+".webp";
function pic(e){const n=PIC[strip(e)];return n?img(n):null}
// flyers: [file, frames, width in r, frame width, frame height]
const FLY={bird:["sky-bird.webp",4,3.7,141,150],plane:["sky-biplane.webp",1,4.5,218,142],rocket:["fw-rocket.webp",1,4.5,420,263],balloon:["fw-hotair.webp",1,3,238,391],bee:["fw-bee.webp",1,3.8,345,318]};
const PIPE={CW:128,capH:57,SL:120,bw:95,capW:124,bx:16};
const TINT={morning:"#ffd9b8",day:null,evening:"#ff9c7a",night:"#3c4a96"};
const tod=()=>{const h=new Date().getHours();return h>=6&&h<10?"morning":h>=10&&h<17?"day":h>=17&&h<20?"evening":"night"};
let gscroll=0;
function groundH(){return Math.max(54,Ht*.115)}
function tint(y,h,a){const c=TINT[tod()];a=tod()==='night'?a*.72:a;if(!c)return;cx.save();cx.globalCompositeOperation="multiply";cx.globalAlpha=a;cx.fillStyle=c;cx.fillRect(-20,y,Wd+40,h);cx.restore()}
function drawBackdrop(){
 const gH=groundH(),skyH=Ht-gH+8,sk=img("flappy-sky.webp"),gr=img("flappy-grass.webp");
 if(ok(sk)){const s=Math.max(Wd/sk.naturalWidth,skyH/sk.naturalHeight),dw=sk.naturalWidth*s,dh=sk.naturalHeight*s;cx.drawImage(sk,(Wd-dw)/2,skyH-dh,dw,dh)}
 else{cx.fillStyle="#bcd9e4";cx.fillRect(-20,-20,Wd+40,Ht+40)}
 tint(-20,skyH+20,.75);
 // sun or moon, wobbling a few degrees in stop-motion steps
 const t=tod(),sm=img(t==="night"?"sky-moon.webp":"sky-sun.webp");
 if(ok(sm)){const z=Math.max(70,Math.min(110,Wd*.09)),w=sm.naturalWidth/sm.naturalHeight*z;cx.save();cx.translate(Wd-z*1.1,z*1.5);cx.rotate((Math.floor(performance.now()/380)%2?.05:-.05));cx.globalAlpha=t==="evening"?.9:1;cx.drawImage(sm,-w/2,-z/2,w,z);cx.restore()}
 cx.save();cx.globalAlpha=t==="night"?.6:.96;
 for(const c of clouds){const im=img("cloud-"+c.k+".webp");if(!ok(im))continue;const w=c.w,h=w*im.naturalHeight/im.naturalWidth;cx.drawImage(im,c.x,c.y*Ht*.7+30,w,h)}
 cx.restore();
 if(ok(gr)){const gs=gH/gr.naturalHeight,tw=gr.naturalWidth*gs,off=gscroll%tw;for(let x=-off;x<Wd;x+=tw)cx.drawImage(gr,x,Ht-gH,tw+1,gH)}
 else{cx.fillStyle="#6cbf3a";cx.fillRect(-20,Ht-gH,Wd+40,gH+20)}
 tint(Ht-gH,gH+20,.75);
}
// one pipe half: cap at y=0 then felt body tiled down to len
function pipeHalf(im,col,x,w,len){
 const P=PIPE,s=w/P.capW,sx=col*P.CW,ch=P.capH*s,bw=P.bw*s,bx=x+w/2-bw/2;
 for(let y=ch-1;y<len;y+=P.SL*s-1)cx.drawImage(im,sx+P.bx,P.capH,P.bw,P.SL,bx,y,bw,P.SL*s);
 cx.drawImage(im,sx,0,P.CW,P.capH,x+w/2-P.CW*s/2,0,P.CW*s,ch);
}
function drawPipe(p,top,bot,im){
 cx.save();cx.translate(0,bot);cx.beginPath();cx.rect(0,0,Wd+40,Ht);cx.clip();pipeHalf(im,p.col,p.x,p.w,Ht-bot);cx.restore();
 cx.save();cx.translate(0,top);cx.scale(1,-1);pipeHalf(im,p.col,p.x,p.w,top+20);cx.restore();
}
function drawWordPic(p){
 const e=words()[p.w_i][0],bob=Math.sin(performance.now()/250+p.x*.01)*6,z=Math.min(p.g*.6,150),im=pic(e);
 if(ok(im)){const a=im.naturalWidth/im.naturalHeight,w=a>1?z:z*a,h=a>1?z/a:z;cx.save();cx.shadowColor="#0005";cx.shadowBlur=8;cx.shadowOffsetY=4;cx.drawImage(im,p.x+p.w/2-w/2,p.gy+bob-h/2,w,h);cx.restore();return}
 const lk=window.LPLook&&LPLook.image(e);
 if(lk&&lk.complete&&lk.naturalWidth){const q=z*.9;cx.drawImage(lk,p.x+p.w/2-q/2,p.gy+bob-q/2,q,q)}
 else{cx.font=`${z*.6}px serif`;cx.textAlign="center";cx.textBaseline="middle";cx.fillText(e,p.x+p.w/2,p.gy+bob)}
}
function drawFlyer(b){
 const f=FLY[charKey]||FLY.bird,im=img(f[0]);if(!ok(im))return;
 const w=b.r*f[2],h=w*f[4]/f[3],now=performance.now();
 let fr=0;if(f[1]>1){const step=b.vy<0?70:170;fr=Math.floor(now/step)%f[1]}
 cx.save();cx.translate(b.x,b.y);cx.rotate(charKey==="balloon"?b.rot*.35:b.rot);
 cx.shadowColor="#0004";cx.shadowBlur=6;cx.shadowOffsetY=4;
 if(charKey==='bird')cx.scale(-1,1); // the bird art faces left
 cx.drawImage(im,fr*f[3],0,f[3],f[4],-w/2,-h/2,w,h);
 cx.restore();
}
function draw(){
 cx.save();if(shake>.5)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 drawBackdrop();
 const pim=img("flappy-pipes.webp");
 for(const p of pipes){const top=p.gy-p.g/2,bot=p.gy+p.g/2;if(ok(pim))drawPipe(p,top,bot,pim);if(!p.got)drawWordPic(p)}
 for(const q of parts){cx.globalAlpha=q.l/40;cx.fillStyle=q.c;cx.beginPath();cx.arc(q.x,q.y,5,0,7);cx.fill()}cx.globalAlpha=1;
 drawFlyer(bird);
 cx.restore();
}
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(100,n-last);last=n;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
for(const w of[...W,...HARD])pic(w[0]);for(const k in FLY)img(FLY[k][0]);for(const n of['flappy-sky.webp','flappy-grass.webp','flappy-pipes.webp','cloud-1.webp','cloud-2.webp','cloud-3.webp','sky-sun.webp','sky-moon.webp'])img(n);
requestAnimationFrame(loop);
if(window.speechSynthesis)speechSynthesis.getVoices();
</script>

</body></html>
