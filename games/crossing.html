}

let gen=0,cur=-1,paused=false,started=false,done=false,timers=[];

const CLEAN=()=>{
 gen++;timers.forEach(clearTimeout);timers=[];
 try{speechSynthesis.cancel()}catch(e){}
 stopLull();
 document.querySelectorAll("#zebra rect").forEach(r=>r.classList.remove("on"));
 ALL.forEach(id=>show(id,false));["bus","car"].forEach(id=>{A[id].m.classList.remove("drive");A[id].m.style.transform="";show(id,false)});

/* ---- narration: one line per scene, the next scene begins when the voice stops ---- */
const dots=$("dots");dots.innerHTML=SC.map(()=>"<i></i>").join("");
function mark(i){[...dots.children].forEach((d,k)=>{d.className=k===i?"on":k<i?"past":""})}
function line(i){const k="s"+(i+1);return L()[k]||DATA.lines.en[k]}
function speak(i,done_){
 const text=line(i),g=gen;let over=false;
 const finish=()=>{if(over||g!==gen)return;over=true;done_()};
 const wait=Math.max(7000,text.length*140);
 timers.push(setTimeout(finish,wait+4000));
 try{
  const u=new SpeechSynthesisUtterance(text);u.lang=TAGS[LP.lang]||LP.lang;u.rate=.72;
  u.onend=finish;u.onerror=()=>setTimeout(finish,wait);
  speechSynthesis.speak(u);
 }catch(e){setTimeout(finish,wait)}
}
function goto(i){
 CLEAN();cur=Math.max(0,Math.min(SC.length-1,i));done=false;
 mark(cur);$("bubble").textContent=line(cur);
 SC[cur]();
 $("ppi").innerHTML=paused?PLAY:PAUSE;
 if(paused)return;
 const g=gen;
 at(3000,()=>speak(cur,()=>{
  if(cur<SC.length-1)at(5000,()=>goto(cur+1));
  else at(3500,lullaby);
 }));
}
function setPaused(p){paused=p;$("ppi").innerHTML=p?PLAY:PAUSE;$("pp").setAttribute("aria-label",p?"Play":"Pause");
 if(p){gen++;timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}stopLull()}else goto(cur<0?0:cur)}

function lullaby(){
 done=true;
 const T=TUNES[tuneIx++%TUNES.length],spb=60/T.bpm,notes=T.t.split(" ").map(x=>x.split(":")),total=notes.reduce((a,x)=>a+ +x[1],0);
 let t=.8,beat=0;
 for(let b=0;b<total;b+=4){const v=.034*(1-b/total*.7);lull.push(LP.tone(130.8,spb*4.6,"sine",v,.8+b*spb),LP.tone(196,spb*4.6,"sine",v*.5,.8+b*spb))}
 notes.forEach((x,i)=>{const f=freq(x[0]);const b=+x[1],left=notes.length-i,slow=left<=3?1+(4-left)*.12:1,fade=1-beat/total*.55,len=b*spb*slow;
  lull.push(LP.tone(f,Math.max(1.6,len*1.7),"sine",.062*fade,t),LP.tone(f*1.004,Math.max(1.6,len*1.7),"sine",.03*fade,t),LP.tone(f*2,.7,"sine",.012*fade,t));t+=len;beat+=b});
 $("dark").style.opacity=".78";
}

/* ---- screen off: the story keeps going on a black screen, for the dark ---- */
let wl=null;
async function listenOn(){$("listen").classList.add("on");try{if(navigator.wakeLock)wl=await navigator.wakeLock.request("screen")}catch(e){}}
function listenOff(){$("listen").classList.remove("on");try{wl&&wl.release()}catch(e){}wl=null}
$("lis").addEventListener("click",listenOn);$("listen").addEventListener("click",listenOff);
addEventListener("keydown",e=>{if(e.key==="Escape")listenOff()});

$("prev").addEventListener("click",()=>{paused=false;goto(cur<=0?0:cur-1)});
$("next").addEventListener("click",()=>{paused=false;goto(cur>=SC.length-1?0:cur+1)});
$("pp").addEventListener("click",()=>setPaused(!paused));
$("go").addEventListener("click",()=>{if(started)return;started=true;$("intro").classList.add("gone");LP.ac();goto(0)});

LP.init({langs:ALLLANGS,onLang:()=>{document.title=L().title;$("ititle").textContent=L().title;if(started&&!paused)goto(Math.max(0,cur))}});
document.title=L().title;$("ititle").textContent=L().title;
LP.start(L().title,()=>{});
</script>
