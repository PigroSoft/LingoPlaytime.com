 {e:"🚲",en:"bicycle",de:"das Fahrrad",es:"la bicicleta",fr:"le vélo",it:"la bicicletta",pt:"a bicicleta",nl:"de fiets",pl:"rower",sv:"cykeln",el:"το ποδήλατο",zh:"自行车",ar:"دراجة",ja:"じてんしゃ",ko:"자전거",ru:"велосипед",tr:"bisikleti",hi:"साइकिल"},
 {e:"🐢",en:"turtle",de:"die Schildkröte",es:"la tortuga",fr:"la tortue",it:"la tartaruga",pt:"a tartaruga",nl:"de schildpad",pl:"żółwia",sv:"sköldpaddan",el:"η χελώνα",zh:"乌龟",ar:"سلحفاة",ja:"かめ",ko:"거북이",ru:"черепаху",tr:"kaplumbağayı",hi:"कछुआ"},
 {e:"🐰",en:"rabbit",de:"der Hase",es:"el conejo",fr:"le lapin",it:"il coniglio",pt:"o coelho",nl:"het konijn",pl:"królika",sv:"kaninen",el:"το κουνέλι",zh:"兔子",ar:"أرنب",ja:"うさぎ",ko:"토끼",ru:"кролика",tr:"tavşanı",hi:"खरगोश"},

 {e:"🕐",en:"clock",de:"die Uhr",es:"el reloj",fr:"l'horloge",it:"l'orologio",pt:"o relógio",nl:"de klok",pl:"zegar",sv:"klockan",el:"το ρολόι",zh:"时钟",ar:"ساعة",ja:"とけい",ko:"시계",ru:"часы",tr:"saati",hi:"घड़ी"},
 {e:"🪁",en:"kite",de:"der Drachen",es:"la cometa",fr:"le cerf-volant",it:"l'aquilone",pt:"a pipa",nl:"de vlieger",pl:"latawiec",sv:"draken",el:"ο χαρταετός",zh:"风筝",ar:"طائرة ورقية",ja:"たこ",ko:"연",ru:"воздушного змея",tr:"uçurtmayı",hi:"पतंग"}
];
const LEVELS={
 easy:{label:"Easy",words:WORDS_EASY,planes:3,speedMul:1,textMode:false},
 hard:{label:"Hard",words:WORDS_HARD,planes:3,speedMul:1,textMode:false},
 big:{label:"Big Kids",words:WORDS_HARD,planes:4,speedMul:1.5,textMode:true}
};
const COLORS=["#ff4f8b","#3aa0ff","#ffc23d"];
const STAR=`<img class="st" src="../felt/sky-star.webp" alt="">`;
/* felt cutouts for every word, by its English name */
const FELT_SHARED={apple:"food-apple",banana:"food-banana",dog:"street-dog",car:"street-car",tree:"street-tree",bicycle:"street-bike"};
const feltSrc=w=>"../felt/"+(FELT_SHARED[w.en]||("sky-"+w.en))+".webp";
const feltImg=w=>`<img src="${feltSrc(w)}" alt="" draggable="false">`;
[...WORDS_EASY,...WORDS_HARD].forEach(w=>{const i=new Image();i.src=feltSrc(w)}); // warm the cache so banners never pop in late
/* biplane, blimp, jet, repeat; the blimp sits in the middle row */
function planeSvg(c,i){
 const k=i%3;
 if(k===1)return `<img class="body blimp" src="../felt/sky-blimp.webp" alt="" draggable="false">`;
 return k?`<img class="body jet" src="../felt/street-plane.webp" alt="" draggable="false">`:`<img class="body" src="../felt/sky-biplane.webp" alt="" draggable="false">`}

let lang="en",level="easy",score=0,target=null,planes=[],ac=null,running=false;
try{lang=localStorage.getItem("skyLang")||"en"}catch(e){}
try{level=localStorage.getItem("skyLevel")||"easy"}catch(e){}
const sky=document.getElementById("sky");

// language buttons
const lw=document.getElementById("langs");
Object.entries(LANGS).forEach(([k,v])=>{const b=document.createElement("button");b.textContent=v.name;b.id="lang-"+k;b.onclick=()=>{lang=k;try{localStorage.setItem("skyLang",k)}catch(e){};paintLangs();applyDir();if(running)newRound()};lw.appendChild(b)});
function paintLangs(){Object.keys(LANGS).forEach(k=>document.getElementById("lang-"+k).classList.toggle("on",k===lang))}
function applyDir(){document.body.dir=LANGS[lang].rtl?"rtl":"ltr"}
paintLangs();applyDir();

// level buttons
const lvw=document.getElementById("levels");
Object.entries(LEVELS).forEach(([k,v])=>{const b=document.createElement("button");b.textContent=v.label;b.id="lvl-"+k;b.onclick=()=>{level=k;try{localStorage.setItem("skyLevel",k)}catch(e){};paintLevels();if(running)newRound()};lvw.appendChild(b)});
function paintLevels(){Object.keys(LEVELS).forEach(k=>document.getElementById("lvl-"+k).classList.toggle("on",k===level))}
paintLevels();

// clouds — each built from overlapping soft puffs so they read as fluffy, not blocky
function makeCloud(){
 const w=90+Math.random()*130,h=w*.5;
 const c=document.createElement("div");c.className="cloud";
 Object.assign(c.style,{width:w+"px",height:h+"px",top:(10+Math.random()*68)+"%",left:(Math.random()*100)+"%",opacity:.75+Math.random()*.2});
 const puffs=[[0,.35,.62,.62],[.18,0,.55,.85],[.42,.1,.62,.8],[.66,.3,.48,.6],[.3,.5,.5,.5]];
 puffs.forEach(([x,y,pw,ph])=>{const p=document.createElement("div");p.className="puff";Object.assign(p.style,{left:x*w+"px",top:y*h+"px",width:pw*w+"px",height:ph*h+"px"});c.appendChild(p)});
 c.dataset.v=.08+Math.random()*.22;
 sky.appendChild(c);
}
/* felt clouds only in the open sky, above the hills */
const cloudLayer=LPClouds.add(document.body,{count:4});
/* the hills plate fills the width; on tall phone screens it stays at the bottom instead of zooming in */
function placeSky(){const W=innerWidth,H=innerHeight,sc=Math.max(W/1376,H*.3/(768*.41)),horizon=H-768*sc*(1-.585);
 const h=document.getElementById("dio-hills");h.style.backgroundSize=Math.ceil(1376*sc)+"px "+Math.ceil(768*sc)+"px";
 cloudLayer.style.height=Math.max(80,horizon*.72)+"px"}
addEventListener("resize",placeSky);placeSky();

// speech
function say(t,rate=.85){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[lang].code;u.rate=rate;const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").startsWith(LANGS[lang].code.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}

// engine sounds (Web Audio): filtered noise for jet roar, sawtooth for propeller drone
function noiseBuf(){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}return b}
let NB;
function flyby(dur=2.5){const t=ac.currentTime,src=ac.createBufferSource();src.buffer=NB;src.loop=true;const f=ac.createBiquadFilter();f.type="bandpass";f.Q.value=.7;f.frequency.setValueAtTime(300,t);f.frequency.linearRampToValueAtTime(1400,t+dur*.5);f.frequency.linearRampToValueAtTime(250,t+dur);const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+dur*.5);g.gain.linearRampToValueAtTime(0,t+dur);const p=ac.createStereoPanner();p.pan.setValueAtTime(-1,t);p.pan.linearRampToValueAtTime(1,t+dur);src.connect(f).connect(g).connect(p).connect(ac.destination);src.start(t);src.stop(t+dur)}
let drone;
function startDrone(){const o=ac.createOscillator(),lfo=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter(),g=ac.createGain();o.type="sawtooth";o.frequency.value=58;lfo.frequency.value=22;lg.gain.value=.5;lfo.connect(lg).connect(g.gain);f.type="lowpass";f.frequency.value=260;g.gain.value=.5;const m=ac.createGain();m.gain.value=.06;o.connect(f).connect(g).connect(m).connect(ac.destination);o.start();lfo.start();drone=m}
function chime(){const t=ac.currentTime;[523,659,784,1047].forEach((fr,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=fr;g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.25,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.5);o.connect(g).connect(ac.destination);o.start(t+i*.09);o.stop(t+i*.09+.6)})}
function boop(){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(140,t+.3);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.4)}

function sentence(){return LANGS[lang].ask+" "+target[lang]+(LANGS[lang].end||"?")}
function newRound(){
 planes.forEach(p=>p.el.remove());planes=[];
 const cfg=LEVELS[level];
 const n=cfg.planes||3;
 const pool=LPLearn.pick(cfg.words,w=>w.en,n,lang);
 target=LPLearn.pick(pool,w=>w.en,1,lang)[0];
 document.getElementById("ask").textContent=LANGS[lang].ask;
 document.getElementById("target").innerHTML=`<span class="q">?</span>`;
 document.getElementById("word").hidden=!!cfg.textMode;
 document.getElementById("word").textContent=target[lang];
 const H=innerHeight;
 const topClear=180,bottomClear=90;
 const band=Math.max(H-topClear-bottomClear,120);
 pool.forEach((w,i)=>{
  const el=document.createElement("button");el.className="plane"+(cfg.textMode?" textbanner":"");el.setAttribute("aria-label",w.en);
  el.innerHTML=`<span class="banner">${cfg.textMode?w[lang]:`<span class="pic">${feltImg(w)}</span>`}</span>`+planeSvg(COLORS[i%3],i);
  sky.appendChild(el);
  const drift=i%3===1?.45:1; // the blimp drifts at under half speed
  const p={el,w,x:drift<1?-340:-260-i*260,y:topClear+band*(n>1?i/(n-1):0),speed:(1.3+Math.random()*.6)*(cfg.speedMul||1)*(((window.LP_SETTINGS||{}).age||0)===0?.6:1)*drift,bob:Math.random()*6,done:false};
  el.onclick=()=>hit(p);planes.push(p);
 });
 setTimeout(()=>say(sentence()),300);
}
function hit(p){
 if(p.done)return;
 if(p.w===target){
  p.done=true;p.el.classList.add("right");score++;LPLearn.asked(target.en,lang,true);
  const sc=document.getElementById("score");sc.innerHTML=STAR+score;sc.classList.remove("pop");void sc.offsetWidth;sc.classList.add("pop");
  document.getElementById("target").innerHTML=feltImg(target);
  chime();flyby(1.6);
  const y=LANGS[lang].yes;say(y[Math.floor(Math.random()*y.length)]+" "+target[lang]+"!");
  p.speed=9;setTimeout(newRound,2600);
 }else{LPLearn.asked(target.en,lang,false);boop();say(LANGS[lang].no+". "+sentence())}
}
let lastFly=0,lastDraw=0;
const STEP=1000/12; // stop motion: the world is redrawn about 12 times a second, like hand-moved puppets
function loop(ts){
 const W=innerWidth,draw=ts-lastDraw>=STEP;if(draw)lastDraw=ts;
 planes.forEach(p=>{p.x+=p.speed;if(p.x>W+40&&!p.done){p.x=-300}if(!draw)return;const y=p.y+Math.sin(ts/400+p.bob)*8;p.el.style.transform=`translate(${Math.round(p.x)}px,${Math.round(y)}px) rotate(${(Math.cos(ts/400+p.bob)*2.5).toFixed(1)}deg)`});
 document.querySelectorAll(".cloud").forEach(c=>{let l=parseFloat(c.style.left);l-=c.dataset.v*.05;if(l<-20)l=105;c.style.left=l+"%"});
 if(ts-lastFly>7000){lastFly=ts;flyby(3)}
 requestAnimationFrame(loop);
}
document.getElementById("go").onclick=()=>{
 ac=new (window.AudioContext||window.webkitAudioContext)();NB=noiseBuf();startDrone();flyby(3);
 document.getElementById("start").hidden=true;running=true;newRound();requestAnimationFrame(loop);
};
document.getElementById("again").onclick=()=>target&&say(sentence());

// keyboard bird: any key flaps, arrows steer
const birdEl=document.getElementById("bird"),birdSvg=birdEl.querySelector(".birdsprite");let birdDraw=0;
const bird={x:innerWidth*.3,y:innerHeight*.55,vx:1.2,vy:0,face:1};
function chirp(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();const b=1800+Math.random()*900;o.type="sine";o.frequency.setValueAtTime(b,t);o.frequency.exponentialRampToValueAtTime(b*1.6,t+.06);o.frequency.exponentialRampToValueAtTime(b*.9,t+.12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.16)}
const NOTES=["sky-star"];
function sparkle(){const n=document.createElement("div");n.className="note";n.innerHTML=`<img src="../felt/${NOTES[Math.floor(Math.random()*NOTES.length)]}.webp" alt="">`;n.style.left=(bird.x+20)+"px";n.style.top=(bird.y-10)+"px";document.body.appendChild(n);setTimeout(()=>n.remove(),1100)}
function flap(){birdEl.classList.remove("flap");void birdEl.offsetWidth;birdEl.classList.add("flap");chirp();sparkle()}
let hintGone=false;
addEventListener("keydown",e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 e.preventDefault();
 if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
 if(!running){document.getElementById("go").click()}
 if(e.repeat&&Math.random()<.6)return;
 const k=e.key;
 if(k==="ArrowLeft"){bird.vx=-4;bird.face=-1}
 else if(k==="ArrowRight"){bird.vx=4;bird.face=1}
 else if(k==="ArrowDown"){bird.vy=4}
 else{bird.vy=-6.5;bird.vx=bird.face*(2+Math.random()*2)}
 flap();
 if(!hintGone){hintGone=true;const h=document.getElementById("keyhint");h.style.opacity=0;setTimeout(()=>h.remove(),700)}
});
function moveBird(ts){
 const W=innerWidth,H=innerHeight;
 bird.vy+=.12;bird.vy=Math.min(bird.vy,2.2);bird.vx*=.985;
 const perched=bird.y>=innerHeight-81;
 if(!perched&&Math.abs(bird.vx)<1)bird.vx=bird.face*1;
 if(perched)bird.vx*=.85;
 bird.x+=bird.vx;bird.y+=bird.vy;
 if(bird.x>W+20)bird.x=-90;if(bird.x<-100)bird.x=W;
 const top=120,bottom=H-80;
 if(bird.y<top){bird.y=top;bird.vy=1}
 if(bird.y>bottom){bird.y=bottom;bird.vy=0}
 if(!ts||ts-birdDraw>=STEP){birdDraw=ts||0;
 birdEl.style.transform=`translate(${Math.round(bird.x)}px,${Math.round(bird.y)}px)`;
 birdSvg.style.scale=bird.face>0?"-1 1":"1 1"; /* the felt bird art faces left, so flip it when flying right */
 birdSvg.style.rotate=`${Math.round(Math.max(-20,Math.min(20,bird.vy*4))*bird.face)}deg`;}
 requestAnimationFrame(moveBird);
}
requestAnimationFrame(moveBird);
const bc=document.getElementById("bigcursor");
addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;bc.hidden=false;bc.style.left=e.clientX+"px";bc.style.top=e.clientY+"px";bc.classList.toggle("over",!!e.target.closest(".plane,button"))});
addEventListener("pointerdown",()=>{bc.classList.add("tap");setTimeout(()=>bc.classList.remove("tap"),150)});
document.addEventListener("mouseleave",()=>bc.hidden=true);
</script>

<script>
/* LingoPlaytime: tap anywhere in the sky. The youngest kids hit the right plane wherever they tap;
   older ones get a generous area around each plane, so a palm near a plane still counts. */
(function(){
 addEventListener("pointerdown",function(e){
  if(!running||!planes.length)return;
  if(e.target.closest("header,#prompt,#start,.plane"))return;
  var age=(window.LP_SETTINGS||{}).age||0;
  var live=planes.filter(function(p){return !p.done});
  if(!live.length)return;
  if(age===0){var t=live.find(function(p){return p.w===target});if(t)hit(t);return}
  var best=null,d=1e9;
  live.forEach(function(p){var r=p.el.getBoundingClientRect();var cx=Math.max(r.left,Math.min(e.clientX,r.right)),cy=Math.max(r.top,Math.min(e.clientY,r.bottom));var dd=Math.hypot(e.clientX-cx,e.clientY-cy);if(dd<d){d=dd;best=p}});
  if(best&&d<160)hit(best);
 });
})();
</script>
