<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.LP_GAME="train"</script><script src="voice.js"></script><script src="learn.js"></script><script src="bridge.js"></script><script src="look.js"></script><script src="audio/sfx.train.js"></script><script src="sfx.js"></script><script src="clouds.js"></script>
<title>Word Train</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--ink:#3b2a14;--paper:#fff3d6;--gh:clamp(150px,27vh,260px);--u:min(clamp(92px,15.5vw,190px),calc((100vw - 40px)/5.6));--felt-red:url(../felt/btn-red.webp);--felt-blue:url(../felt/btn-blue.webp);--felt-beige:url(../felt/btn-beige.webp);color-scheme:light}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#7fb3dc;color:var(--ink);font-family:"Fredoka","Baloo 2",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:none}
button{font:inherit;color:var(--ink);cursor:none}
.bigcursor{position:fixed;top:0;left:0;width:52px;height:65px;font-size:0;background:url(../felt/cursor-hand.svg) center/contain no-repeat;line-height:1;z-index:99;pointer-events:none;transform:translate(-23px,-2px) rotate(0deg) scale(1);filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px #fff);transition:transform .12s cubic-bezier(.34,1.6,.64,1);will-change:transform}
.bigcursor.hover{transform:translate(-23px,-2px) rotate(-14deg) scale(1.28)}
.bigcursor.down{transform:translate(-23px,-2px) rotate(-14deg) scale(.85)}
@media (hover:none){.bigcursor{display:none}body,button{cursor:auto}}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column}
/* felt pill buttons: the same photographed wool pill as the rest of the site */
.fpill{--fh:46px;--felt:var(--felt-beige);position:relative;isolation:isolate;height:var(--fh);border:0;background:none;padding:0 18px;color:#4a3213;text-shadow:0 1px 0 #fff8;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.fpill::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border:solid transparent;border-width:calc(var(--fh)*.5);border-image:var(--felt) 157 fill/calc(var(--fh)*.58)/calc(var(--fh)*.0926) round;filter:drop-shadow(0 3px 2px #3a1d0a66)}
.fpill:active{transform:translateY(2px) scale(.985)}
.fpill[aria-pressed="true"]{--felt:var(--felt-blue);color:#fff;text-shadow:0 1px 0 #06415e}
.top{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:20;display:flex;gap:8px;align-items:center}
.top h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
.ctl{display:flex;gap:10px}
.ctl button{padding:0 14px}
.ctl button img{height:30px;width:auto;display:block;filter:drop-shadow(0 1px 1px #0005)}
.langsel{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:var(--paper)}
[dir="rtl"] .top{flex-direction:row-reverse}
.scene{position:relative;flex:1;overflow:hidden}
.dio{position:absolute;inset:0;pointer-events:none;background-repeat:no-repeat;background-size:cover;background-position:center bottom}
#dio-bg{background-image:url(../felt/sky-plate.webp);filter:blur(2px) saturate(1.05);transform:scale(1.03)}
#dio-hills{background-image:url(../felt/sky-hills.webp);inset:0 0 calc(var(--gh)*.42) 0;background-position:center bottom}
.lp-clouds{position:absolute!important;z-index:1!important}
.layer{position:absolute;left:0;right:0;background-repeat:repeat-x}
.clouds,.hills{display:none}
.trees{bottom:calc(var(--gh)*.5);height:clamp(90px,24vh,190px);background-image:url(../felt/train-trees.webp);background-size:auto 100%;background-position:0 100%;z-index:1;filter:drop-shadow(0 3px 3px #0003)}
.ground{position:absolute;left:0;right:0;bottom:0;height:var(--gh);background:url(../felt/train-ground.webp) repeat-x 0 100%/auto 100%;z-index:2;filter:drop-shadow(0 -2px 4px #0003)}
/* scenes: each trip (and each tunnel) swaps the whole felt backdrop */
#dio-bg,#dio-hills,.trees,.ground{transition:opacity .28s}
.scene.swap #dio-bg,.scene.swap #dio-hills,.scene.swap .trees,.scene.swap .ground{opacity:0}
.scene[data-sc=sea] #dio-bg{background-image:url(../felt/train-sea-sky.webp)}
.scene[data-sc=sea] #dio-hills{background-image:url(../felt/train-sea-hills.webp)}
.scene[data-sc=sea] .trees{background-image:url(../felt/train-sea-trees.webp)}
.scene[data-sc=sea] .ground{background-image:url(../felt/train-sea-ground.webp)}
.scene[data-sc=snow] #dio-bg{background-image:url(../felt/train-snow-sky.webp)}
.scene[data-sc=snow] #dio-hills{background-image:url(../felt/train-snow-hills.webp)}
.scene[data-sc=snow] .trees{background-image:url(../felt/train-snow-trees.webp)}
.scene[data-sc=snow] .ground{background-image:url(../felt/train-snow-ground.webp)}
.scene[data-sc=desert] #dio-bg{background-image:url(../felt/train-desert-sky.webp)}
.scene[data-sc=desert] #dio-hills{background-image:url(../felt/train-desert-hills.webp)}
.scene[data-sc=desert] .trees{background-image:url(../felt/train-desert-trees.webp)}
.scene[data-sc=desert] .ground{background-image:url(../felt/train-desert-ground.webp)}
/* tunnel: a felt mountain stands in front of the train, which shows through the stone window over a dark inside */
.tunback{position:absolute;z-index:2;display:none;pointer-events:none;background:radial-gradient(ellipse at 50% 130%,#6b4a1c 0,#1d1209 55%,#0a0604 100%);box-shadow:inset 0 0 24px #000}
.tunfront{position:absolute;z-index:4;display:none;max-width:none;height:auto;pointer-events:none;filter:drop-shadow(0 6px 8px #0006)}
.choices.dark button:not(.yes){color:transparent;text-shadow:0 0 0 #2a1a0a}
.choices.dark button:not(.yes) img{filter:brightness(0) drop-shadow(0 0 7px #ffd86a)}
.track{display:none}
.station{position:absolute;bottom:calc(var(--gh)*.40);width:clamp(240px,34vw,420px);z-index:2;display:none}
.station>img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px #0005)}
/* the word hangs from the station roof on two strings, on a stitched felt sign */
.station .sign,.tsign{position:absolute;left:50%;bottom:calc(100% - 14px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 16px 6px 22px;white-space:nowrap;font-size:clamp(24px,4.4vw,40px);font-weight:700;color:#4a3213;background:#fff3d6 url(../felt/paper.webp);background-blend-mode:multiply;border:3px dashed #b8401f99;outline:5px solid #fff3d6;outline-offset:-2px;border-radius:26px;box-shadow:0 6px 0 #c9b583,0 12px 18px #0006;text-shadow:0 1px 0 #fff9}
.tsign{bottom:auto;top:8px;z-index:5;display:none}
.station .sign::before,.station .sign::after{content:"";position:absolute;bottom:-18px;width:3px;height:22px;background:#c9a064}
.station .sign::before{left:24%}.station .sign::after{right:24%}
.say{border:none;background:none;font-size:.8em;padding:0 2px}
.train{position:absolute;bottom:calc(var(--gh)*.27);left:16px;display:flex;align-items:flex-end;z-index:3}
.car{position:relative;width:var(--u);margin-left:calc(var(--u)*-.03)}
.car>img.body{display:block;width:100%;height:auto;position:relative;z-index:0;filter:drop-shadow(0 5px 4px #0005)}
/* the wagon is an open box: the front wall is drawn again over the cargo, from the rim down, so things drop inside */
.car>img.front{position:absolute;left:0;top:0;width:100%;height:auto;z-index:3;clip-path:inset(22.5% 0 0 0);filter:none;pointer-events:none}
.car .win{position:absolute;left:12%;right:12%;bottom:42%;height:100%;z-index:1;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.car .win span{display:block;height:100%;width:100%;animation:board .6s steps(6)}
.car .win img{display:block;height:100%;width:100%;object-fit:contain;object-position:50% 100%}
@keyframes board{0%{transform:translateY(-120px) scale(1.8)}70%{transform:translateY(4px)}100%{transform:none}}
.car.engine{width:calc(var(--u)*var(--ew,1.15))}
.car.engine>img.body{filter:drop-shadow(0 5px 4px #0005)}
.puff{position:absolute;width:40px;height:36px;background:url(../felt/cotton-puff.webp) center/contain no-repeat;filter:drop-shadow(0 2px 2px #0003);z-index:4;pointer-events:none;animation:puff 1.6s steps(8) forwards}
@keyframes puff{to{transform:translate(-80px,-120px) scale(3);opacity:0}}
.choices{position:absolute;top:62px;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-start;gap:clamp(10px,3vw,28px);padding-inline:12px;z-index:5;pointer-events:none}
.choices button{pointer-events:auto;flex:none;width:clamp(104px,min(24vw,36vh),240px);aspect-ratio:1;border:3px dashed #b98a52;outline:6px solid #fff3d6;outline-offset:-3px;border-radius:30px;background:#fff3d6 url(../felt/paper.webp);background-blend-mode:multiply;box-shadow:0 10px 0 #c9b583,0 18px 26px #0006;padding:0;animation:rise .4s steps(5) backwards}
.choices button img{width:76%;height:76%;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 4px 4px #0005)}
.choices button:nth-child(2){animation-delay:.1s}.choices button:nth-child(3){animation-delay:.2s}
@keyframes rise{from{transform:translateY(-40px);opacity:0}}
.choices button.no{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.choices button.yes{background-color:#fff3a8;transform:scale(1.12);box-shadow:0 0 0 6px #f6c343,0 0 40px #f6c343aa}
@media (max-width:700px){.choices{gap:8px;padding-inline:8px}.choices button{width:21.5vw;border-radius:22px;outline-width:4px}}
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:#2a1a0a66}
.big{--fh:64px;--felt:var(--felt-red);position:relative;isolation:isolate;height:var(--fh);border:0;background:none;padding:0 44px;font-weight:700;font-size:clamp(24px,5vw,34px);color:#fff;text-shadow:0 1px 0 #6a120f}
.big::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border:solid transparent;border-width:calc(var(--fh)*.5);border-image:var(--felt) 157 fill/calc(var(--fh)*.58)/calc(var(--fh)*.0926) round;filter:drop-shadow(0 4px 3px #0007)}
.big:active{transform:translateY(3px) scale(.985)}
.cheer{text-align:center;font-weight:700;font-size:clamp(36px,10vw,64px);display:grid;gap:18px;justify-items:center;color:#fff8e6;text-shadow:0 3px 0 #b8401f,0 6px 14px #0006}
.conf{position:absolute;top:-20px;font-size:28px;z-index:8;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:4}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff3d6 url(../felt/paper.webp);background-blend-mode:multiply;border:3px dashed #b98a52;box-shadow:0 3px 0 #c9b583}
.dots i.on{background-color:#f6c343;border-color:#fff8}
@media (prefers-reduced-motion:reduce){.puff,.conf{display:none}}
</style>
<div class="app">
  <div class="top"><h1>Word Train</h1>
    <select class="langsel" id="langsel"></select>
    <div class="ctl" id="pick"></div>
  </div>
  <div class="scene" id="scene">
    <div class="dio" id="dio-bg"></div><div class="dio" id="dio-hills"></div>
    <div class="layer clouds" id="clouds"></div>
    <div class="layer hills" id="l1"><div class="hillback" id="l1b"></div><div class="hillfront" id="l1f"></div></div>
    <div class="layer trees" id="l2"></div>
    <div class="ground" id="l3"></div>
    <div class="station" id="station"><img src="../felt/train-station.webp" alt="" draggable="false">
      <div class="sign"><span id="signtxt">?</span><button class="say" id="again" aria-label="hear again">🔊</button></div></div>
    <div class="tunback" id="tunback"></div><img class="tunfront" id="tunfront" src="../felt/train-tunnel.webp" alt="" draggable="false">
    <div class="tsign" id="tsign"><span id="signtxt2">?</span><button class="say" id="again2" aria-label="hear again">🔊</button></div>
    <div class="train" id="train"></div>
    <div class="choices" id="choices"></div>
    <div class="dots" id="dots"></div>
    <div class="overlay" id="overlay"><button class="big" id="start">▶ All aboard!</button></div>
  </div>
</div>
<div class="bigcursor" id="cursor"></div>
<script>
addEventListener("DOMContentLoaded",()=>{if(window.LPClouds)LPClouds.add(document.getElementById("scene"),{count:4,top:"0",height:"38%"})});
const EM="🐶 🐱 🍎 🚗 ⚽ 🐟 🌞 🌙 🍌 🐮 🦆 🌳 🏠 🐻 🍪 🌸 🐘 🥛 🚌 ⭐ 👟 🐑 🎈 🐸".split(" ");
// Master language list (project doc). Article languages store the article with the word.
// Fields: name, speech tag, 24 words (same order as EM), question template, yes, last stop, all aboard, new trip, tier
const RAW=[
["en","English","en-US","the dog|the cat|the apple|the car|the ball|the fish|the sun|the moon|the banana|the cow|the duck|the tree|the house|the bear|the cookie|the flower|the elephant|the milk|the bus|the star|the shoe|the sheep|the balloon|the frog","Where is {w}?","Yes!","Hooray! Last stop!","All aboard!","New trip",1],
["de","Deutsch","de-DE","der Hund|die Katze|der Apfel|das Auto|der Ball|der Fisch|die Sonne|der Mond|die Banane|die Kuh|die Ente|der Baum|das Haus|der Bär|der Keks|die Blume|der Elefant|die Milch|der Bus|der Stern|der Schuh|das Schaf|der Luftballon|der Frosch","Wo ist {w}?","Ja! Super!","Hurra! Endstation!","Alle einsteigen!","Neue Fahrt",1],
["es","Español","es-ES","el perro|el gato|la manzana|el coche|la pelota|el pez|el sol|la luna|el plátano|la vaca|el pato|el árbol|la casa|el oso|la galleta|la flor|el elefante|la leche|el autobús|la estrella|el zapato|la oveja|el globo|la rana","¿Dónde está {w}?","¡Sí! ¡Muy bien!","¡Hurra! ¡Última parada!","¡Todos a bordo!","Nuevo viaje",1],
["fr","Français","fr-FR","le chien|le chat|la pomme|la voiture|la balle|le poisson|le soleil|la lune|la banane|la vache|le canard|l'arbre|la maison|l'ours|le biscuit|la fleur|l'éléphant|le lait|le bus|l'étoile|la chaussure|le mouton|le ballon|la grenouille","Où est {w} ?","Oui ! Bravo !","Hourra ! Terminus !","En voiture !","Nouveau voyage",1],
["it","Italiano","it-IT","il cane|il gatto|la mela|la macchina|la palla|il pesce|il sole|la luna|la banana|la mucca|l'anatra|l'albero|la casa|l'orso|il biscotto|il fiore|l'elefante|il latte|l'autobus|la stella|la scarpa|la pecora|il palloncino|la rana","Dov'è {w}?","Sì! Bravo!","Evviva! Capolinea!","Tutti a bordo!","Nuovo viaggio",1],
["pt","Português","pt-BR","o cachorro|o gato|a maçã|o carro|a bola|o peixe|o sol|a lua|a banana|a vaca|o pato|a árvore|a casa|o urso|o biscoito|a flor|o elefante|o leite|o ônibus|a estrela|o sapato|a ovelha|o balão|o sapo","Onde está {w}?","Sim! Muito bem!","Viva! Última parada!","Todos a bordo!","Nova viagem",2],
["nl","Nederlands","nl-NL","de hond|de kat|de appel|de auto|de bal|de vis|de zon|de maan|de banaan|de koe|de eend|de boom|het huis|de beer|het koekje|de bloem|de olifant|de melk|de bus|de ster|de schoen|het schaap|de ballon|de kikker","Waar is {w}?","Ja! Goed zo!","Hoera! Eindstation!","Instappen!","Nieuwe rit",2],
["pl","Polski","pl-PL","pies|kot|jabłko|samochód|piłka|ryba|słońce|księżyc|banan|krowa|kaczka|drzewo|dom|miś|ciastko|kwiatek|słoń|mleko|autobus|gwiazdka|but|owca|balon|żaba","Gdzie jest {w}?","Tak! Brawo!","Hura! Stacja końcowa!","Wsiadamy!","Nowa podróż",2],
["sv","Svenska","sv-SE","hunden|katten|äpplet|bilen|bollen|fisken|solen|månen|bananen|kon|ankan|trädet|huset|björnen|kakan|blomman|elefanten|mjölken|bussen|stjärnan|skon|fåret|ballongen|grodan","Var är {w}?","Ja! Bra!","Hurra! Slutstation!","Alla ombord!","Ny resa",2],
["el","Ελληνικά","el-GR","ο σκύλος|η γάτα|το μήλο|το αυτοκίνητο|η μπάλα|το ψάρι|ο ήλιος|το φεγγάρι|η μπανάνα|η αγελάδα|η πάπια|το δέντρο|το σπίτι|η αρκούδα|το μπισκότο|το λουλούδι|ο ελέφαντας|το γάλα|το λεωφορείο|το αστέρι|το παπούτσι|το πρόβατο|το μπαλόνι|ο βάτραχος","Πού είναι {w};","Ναι! Μπράβο!","Ζήτω! Τέρμα!","Όλοι στο τρένο!","Νέο ταξίδι",2],
["zh","中文","zh-CN","狗|猫|苹果|汽车|球|鱼|太阳|月亮|香蕉|奶牛|鸭子|树|房子|熊|饼干|花|大象|牛奶|公交车|星星|鞋子|羊|气球|青蛙","{w}在哪里？","对！真棒！","好耶！终点站！","上车啦！","再坐一次",3],
["ar","العربية","ar-SA","الكلب|القطة|التفاحة|السيارة|الكرة|السمكة|الشمس|القمر|الموزة|البقرة|البطة|الشجرة|البيت|الدب|البسكويت|الوردة|الفيل|الحليب|الحافلة|النجمة|الحذاء|الخروف|البالون|الضفدع","أين {w}؟","نعم! أحسنت!","هيا! المحطة الأخيرة!","الجميع إلى القطار!","رحلة جديدة",3],
["ja","日本語","ja-JP","いぬ|ねこ|りんご|くるま|ボール|さかな|たいよう|おつきさま|バナナ|うし|あひる|木|おうち|くま|クッキー|おはな|ぞう|ぎゅうにゅう|バス|ほし|くつ|ひつじ|ふうせん|かえる","{w}はどこ？","そう！すごい！","やったー！しゅうてん！","しゅっぱつしんこう！","もういちど",4],
["ko","한국어","ko-KR","강아지|고양이|사과|자동차|공|물고기|해|달|바나나|소|오리|나무|집|곰|쿠키|꽃|코끼리|우유|버스|별|신발|양|풍선|개구리","{w} 어디 있어?","맞아! 잘했어!","야호! 종점이야!","모두 타세요!","다시 출발",4],
["ru","Русский","ru-RU","собака|кошка|яблоко|машина|мяч|рыба|солнце|луна|банан|корова|утка|дерево|дом|мишка|печенье|цветок|слон|молоко|автобус|звезда|ботинок|овца|шарик|лягушка","Где {w}?","Да! Молодец!","Ура! Конечная!","Все по вагонам!","Новая поездка",4],
["tr","Türkçe","tr-TR","köpek|kedi|elma|araba|top|balık|güneş|ay|muz|inek|ördek|ağaç|ev|ayı|kurabiye|çiçek|fil|süt|otobüs|yıldız|ayakkabı|koyun|balon|kurbağa","{w} nerede?","Evet! Aferin!","Yaşasın! Son durak!","Herkes trene!","Yeni yolculuk",4],
["hi","हिन्दी","hi-IN","कुत्ता|बिल्ली|सेब|गाड़ी|गेंद|मछली|सूरज|चाँद|केला|गाय|बतख|पेड़|घर|भालू|बिस्कुट|फूल|हाथी|दूध|बस|तारा|जूता|भेड़|गुब्बारा|मेंढक","{w} कहाँ है?","हाँ! शाबाश!","हुर्रे! आख़िरी स्टेशन!","सब सवार हो जाओ!","नई यात्रा",4]];
const L={};RAW.forEach(r=>{L[r[0]]={name:r[1],tag:r[2],words:r[3].split("|"),find:w=>r[4].replace("{w}",w),yes:r[5],end:r[6],go:r[7],again:r[8],tier:r[9]}});
const W=EM.map((e,i)=>({e,i}));
const word=(x)=>L[lang].words[x.i];
function hasVoice(){try{const p=L[lang].tag.slice(0,2);const v=speechSynthesis.getVoices();return !v.length||v.some(x=>x.lang.replace("_","-").toLowerCase().startsWith(p))}catch(e){return false}}
const RTL={ar:1};
const TR=[{e:"🚂",s:"steam",img:"train-steam",ew:1.2},{e:"🚄",s:"fast",img:"train-fast",ew:1.55},{e:"🚋",s:"tram",img:"train-tram",ew:1.05}];
const C=["yellow","blue","purple","green"];
const $=id=>document.getElementById(id);
const FELT={"🐶":"peek-dog","🐱":"peek-cat","🍎":"food-apple","🚗":"street-car","⚽":"sky-ball","🐟":"sky-fish","🌞":"sky-sun","🌙":"sky-moon","🍌":"food-banana","🐮":"peek-cow","🦆":"peek-duck","🌳":"street-tree","🏠":"sky-house","🐻":"peek-teddy","🍪":"train-cookie","🌸":"train-flower","🐘":"sky-elephant","🥛":"food-milk","🚌":"street-bus","⭐":"sky-star","👟":"train-shoe","🐑":"peek-sheep","🎈":"train-balloon","🐸":"peek-frog"};
const PIC=e=>FELT[e]?'<img src="../felt/'+FELT[e]+'.webp" alt="" draggable="false">':e;
let lang="en",cur=0,trip=[],stop=0,target=null;

/* ---------- sound (synthesized with Web Audio) ---------- */
let ac,noiseBuf;
function A(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}ac.resume();return ac}catch(e){return null}}
function env(g,t,a,v,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function tone(f,at,d,type,v,f2){const a=A();if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.02,v,d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(at,d,v,type,freq,q){const a=A();if(!a)return;const t=a.currentTime+at,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q||1;env(g,t,.01,v,d);s.connect(f).connect(g).connect(a.destination);s.start(t,Math.random()*.5);s.stop(t+d+.05)}
let chugN=0;
function chug(){const s=TR[cur].s;chugN++;
 if(s=="steam"){noise(0,.16,chugN%2?.35:.55,"lowpass",700);if(chugN%4==0)noise(0,.25,.12,"highpass",3000)}
 else{ if(chugN%2==0){tone(90,0,.08,"triangle",.35);tone(90,.07,.08,"triangle",.3)} noise(0,.05,.08,"bandpass",2500,4)}}
function whistle(){const s=TR[cur].s;
 if(window.LPS&&LPS.play(A(),{steam:"whistle",fast:"horn",tram:"tram"}[s],2))return;
 if(s=="steam"){[523,622,784].forEach(f=>{tone(f,0,1.1,"triangle",.09,f*.98);tone(f*2,0,1.1,"sine",.02)});noise(0,1.1,.06,"bandpass",1500,2)}
 else if(s=="fast"){tone(440,0,.4,"sawtooth",.06);tone(554,0,.4,"sawtooth",.05);tone(349,.45,.6,"sawtooth",.06);tone(440,.45,.6,"sawtooth",.05)}
 else if(s=="tram"){for(let k=0;k<3;k++){tone(1318,k*.2,.5,"sine",.2);tone(2637,k*.2,.25,"sine",.05)}}
 else{tone(784,0,.25,"sine",.18);tone(659,.25,.25,"sine",.18);tone(523,.5,.25,"sine",.18);tone(392,.75,.5,"sine",.18)}}
function brakes(){tone(2600,0,1,"sawtooth",.02,2100);noise(0,1,.08,"bandpass",4000,6);noise(.9,.8,.18,"highpass",2000)}
function dingdong(){tone(659,0,1.2,"sine",.25);tone(1318,0,.5,"sine",.04);tone(523,.55,1.6,"sine",.25);tone(1046,.55,.6,"sine",.04)}
function doors(){noise(0,.9,.2,"highpass",1500);tone(880,.1,.12,"square",.03);tone(880,.3,.12,"square",.03)}
function yay(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.1,.4,"triangle",.18));for(let k=0;k<14;k++)noise(.5+k*.07+Math.random()*.03,.05,.25,"bandpass",1800,1.5)}
function boing(){tone(330,0,.4,"sine",.3,110)}
function fanfare(){[523,523,523,659,784,659,784,1046].forEach((f,i)=>tone(f,i*.16,.3,"square",.06));for(let k=0;k<30;k++)noise(1.3+k*.05+Math.random()*.04,.05,.25,"bandpass",1800,1.5)}
function say(t,delay){if(!hasVoice()&&!(window.LP_CLIPS&&LP_CLIPS[lang]))return;setTimeout(()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=L[lang].tag;u.rate=.8;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}},delay||0)}

/* ---------- controls ---------- */
function drawCtl(){const sel=$("langsel");if(!sel.options.length){RAW.forEach(r=>{const o=document.createElement("option");o.value=r[0];o.textContent=r[1];sel.appendChild(o)});sel.onchange=()=>{lang=sel.value;document.documentElement.dir=RTL[lang]?"rtl":"ltr";drawCtl();if(target)ask()}}
 sel.value=lang;document.documentElement.dir=RTL[lang]?"rtl":"ltr";
 $("pick").innerHTML="";TR.forEach((t,i)=>{const b=document.createElement("button");b.className="t fpill";b.innerHTML='<img src="../felt/'+t.img+'.webp" alt="">';b.setAttribute("aria-pressed",i==cur);b.setAttribute("aria-label","train "+(i+1));b.onclick=()=>{cur=i;drawCtl();drawTrain();A();whistle()};$("pick").appendChild(b)});
 $("start").textContent="▶ "+L[lang].go}
function drawTrain(){const tr=$("train");const kept=[...tr.querySelectorAll(".win")].map(w=>w.querySelector("span")?w.querySelector("span").innerHTML:"");tr.innerHTML="";
 for(let i=0;i<4;i++){const c=document.createElement("div");c.className="car";c.innerHTML='<div class="win"><span>'+(kept[i]||"")+'</span></div><img class="body" src="../felt/train-wagon-'+C[i]+'.webp" alt="" draggable="false"><img class="front" src="../felt/train-wagon-'+C[i]+'.webp" alt="" draggable="false">';tr.appendChild(c)}
 const e=document.createElement("div");e.className="car engine";e.style.setProperty("--ew",TR[cur].ew);e.innerHTML='<img class="body" src="../felt/'+TR[cur].img+'.webp" alt="" draggable="false">';tr.appendChild(e)}
function drawDots(){$("dots").innerHTML=trip.map((_,i)=>'<i class="'+(i<stop?"on":"")+'"></i>').join("")}

/* ---------- clouds (project convention: puff clusters, drift independently) ---------- */
const cloudBox=$("clouds"),clouds=[];
function makeCloud(x){
 const w=90+Math.random()*130,h=w*.5,top=10+Math.random()*68;
 const el=document.createElement("div");el.className="cloud";el.style.width=w+"px";el.style.height=h+"px";el.style.top=top+"%";
 const puffs=[[0,.55,.46,.6],[.22,.15,.42,.7],[.46,0,.46,.8],[.78,.28,.32,.55],[.16,.62,.7,.5]];
 puffs.forEach(([px,py,pw,ph])=>{const i=document.createElement("i");i.style.left=(px*w)+"px";i.style.top=(py*h)+"px";i.style.width=(pw*w)+"px";i.style.height=(ph*h)+"px";el.appendChild(i)});
 el.style.opacity=.75+Math.random()*.2;
 el.dataset.speed=4+Math.random()*10;
 el.dataset.w=w;
 el.style.left=x+"px";
 cloudBox.appendChild(el);clouds.push(el);
}
function initClouds(){const n=5;for(let i=0;i<n;i++)makeCloud(Math.random()*(scene.clientWidth||400));}
function stepClouds(dt){clouds.forEach(el=>{let x=parseFloat(el.style.left)-el.dataset.speed*dt;
 if(x<-parseFloat(el.dataset.w))x=(scene.clientWidth||400)+Math.random()*100;
 el.style.left=x+"px"})}

/* ---------- motion ---------- */
const MAX=240;let v=0,mode="idle",driveT=0,sx=null,off=[0,0,0,0],chugAcc=0,smokeAcc=0,rot=0,last=0;
const st=$("station"),scene=$("scene");
/* scenes + tunnel */
const SCN=["hills","sea","snow","desert"];let scn=0,tn=false,tunSwap=true,nextSc=0,tunnelAt=1;
const T={w:1100,h:522,hx:291.35,hy:340.62,hw:523.24,hh:132.51},tf=$("tunfront"),tb=$("tunback");let tunS=1,tunW=0;
function setScene(k,fade){const go=()=>{scn=k;if(k)scene.dataset.sc=SCN[k];else delete scene.dataset.sc};
 if(!fade){go();return}
 scene.classList.add("swap");setTimeout(()=>{go();setTimeout(()=>scene.classList.remove("swap"),60)},290)}
function otherScene(){const o=SCN.map((_,i)=>i).filter(i=>i!=scn);return o[Math.floor(Math.random()*o.length)]}
function tunnelFit(){const tr=$("train").getBoundingClientRect(),sc=scene.getBoundingClientRect();
 let s=1.32*tr.height/T.hh;s=Math.min(s,(sc.height-16)/T.h);tunS=s;tunW=T.w*s;
 const lip=T.h-(T.hy+T.hh),bot=sc.bottom-tr.bottom-lip*s+4;
 tf.style.width=tunW+"px";tf.style.bottom=bot+"px";
 tb.style.width=(T.hw*s+8)+"px";tb.style.height=(T.hh*s+8)+"px";tb.style.bottom=(bot+lip*s-4)+"px"}
function tunStopX(){const w=$("train").children[Math.min(stop,3)].getBoundingClientRect(),sc=scene.getBoundingClientRect();
 return (w.left+w.right)/2-sc.left-(T.hx+T.hw/2)*tunS}
function hideStops(){st.style.display="none";tf.style.display=tb.style.display="none";$("tsign").style.display="none";tn=false}
function setSign(t){$("signtxt").textContent=t;$("signtxt2").textContent=t}
setTimeout(()=>{SCN.slice(1).forEach(k=>["hills","trees","ground","sky"].forEach(p=>{new Image().src="../felt/train-"+k+"-"+p+".webp"}));new Image().src="../felt/train-tunnel.webp"},2500);
initClouds();
function stopX(){const tr=$("train").getBoundingClientRect(),sc=scene.getBoundingClientRect(),sw=Math.max(240,Math.min(420,innerWidth*.34));return Math.max(tr.left-sc.left+tr.width/2-sw/2,20)}
function frame(t){const dt=Math.min(.05,(t-(last||t))/1000);last=t;
 if(mode=="drive"){v=Math.min(MAX,v+160*dt);driveT+=dt;
  if(sx===null&&driveT>2.5){sx=scene.clientWidth+40;tn=(stop===tunnelAt);if(tn){tunnelFit();tf.style.display=tb.style.display="block";tunSwap=false;nextSc=otherScene()}else{st.style.display="block";setSign("?")}}
  if(sx!==null){const target=tn?tunStopX():stopX(),dist=sx-target;if(dist<420)v=Math.max(22,MAX*dist/420);if(dist<170&&!st.braked){st.braked=1;brakes()}
   sx-=v*dt;if(sx<=target){sx=target;v=0;mode="stopped";arrive()}}}
 else if(mode=="leave"){v=Math.min(MAX,v+120*dt);sx-=v*dt;
  if(tn&&!tunSwap&&sx+tunW*.5<scene.clientWidth*.5){tunSwap=true;setScene(nextSc,true)}
  if(sx<-(tn?tunW:0)-260){sx=null;hideStops();mode="drive";driveT=0;st.braked=0}}
 else if(mode=="end"){v=Math.max(0,v-200*dt)}
 stepClouds(dt);
 off.b-=v*dt*.16;off.f-=v*dt*.32;off[2]-=v*dt*.6;off[3]-=v*dt;
 $("l1b").style.backgroundPositionX=off.b+"px";$("l1f").style.backgroundPositionX=off.f+"px";
 $("l2").style.backgroundPositionX=off[2]+"px, "+(off[2]+37)+"px";
 $("l3").style.backgroundPositionX=off[3]+"px, "+off[3]+"px";
 if(sx!==null){if(tn){tf.style.left=sx+"px";tb.style.left=(sx+T.hx*tunS-4)+"px"}else st.style.left=sx+"px"}
 rot+=v*dt*4;
 $("train").style.transform=v>5?"translateY("+(Math.round(Math.sin(t/90))*1.5)+"px)":"none";
 chugAcc+=v*dt;if(chugAcc>55){chugAcc=0;chug()}
 if(TR[cur].s=="steam"){smokeAcc+=dt*(v>5?(2+v/MAX*4):.6);if(smokeAcc>1){smokeAcc=0;puff()}}
 requestAnimationFrame(frame)}
function puff(){const e=$("train").lastChild.getBoundingClientRect(),sc=scene.getBoundingClientRect(),p=document.createElement("div");p.className="puff";p.style.left=(e.left-sc.left+e.width*.17)+"px";p.style.top=(e.top-sc.top+e.height*.02)+"px";scene.appendChild(p);setTimeout(()=>p.remove(),1700)}

/* ---------- game ---------- */
function newTrip(){hideStops();setScene(otherScene(),false);tunnelAt=1+Math.floor(Math.random()*3);trip=[...W].sort(()=>Math.random()-.5).slice(0,4);stop=0;target=null;drawTrain();$("train").querySelectorAll(".win").forEach(w=>w.textContent="");drawDots();
 $("overlay").hidden=true;A();whistle();say(L[lang].go,1200);mode="drive";driveT=0;v=0}
function arrive(){target=trip[stop];if(tn)whistle();else dingdong();setTimeout(doors,900);
 setTimeout(()=>{setSign(word(target));if(tn)$("tsign").style.display="flex";const opts=[target,...W.filter(w=>w!=target).sort(()=>Math.random()-.5).slice(0,((window.LP_SETTINGS||{}).age||0)<1?1:((window.LP_SETTINGS||{}).age||0)>=2?3:2)].sort(()=>Math.random()-.5);
  const ch=$("choices");ch.innerHTML="";ch.classList.toggle("dark",tn);opts.forEach(o=>{const b=document.createElement("button");b.innerHTML=PIC(o.e);b.setAttribute("aria-label",word(o));b.onclick=()=>guess(o,b);ch.appendChild(b)});ask()},1500)}
function ask(){setSign(word(target));say(L[lang].find(word(target)))}
let busy=false,lastWrong=0;
function guess(o,b){if(busy||!target)return;
 if(o!==target){const now=performance.now();if(now-lastWrong<120)return;lastWrong=now;
  boing();b.classList.remove("no");void b.offsetWidth;b.classList.add("no");say(word(target),300);return}
 busy=true;b.classList.add("yes");yay();say(L[lang].yes+" "+word(target),200);
 const win=$("train").querySelectorAll(".win")[stop];win.innerHTML="<span>"+PIC(target.e)+"</span>";stop++;drawDots();
 setTimeout(()=>{$("choices").innerHTML="";$("tsign").style.display="none";target=null;busy=false;
  if(stop>=trip.length){finish();return}
  doors();setTimeout(()=>{whistle();mode="leave"},900)},1800)}
function finish(){fanfare();say(L[lang].end,300);mode="end";
 for(let i=0;i<40;i++){const c=document.createElement("div");c.className="conf";c.textContent=["🎉","⭐","🎈","✨"][i%4];c.style.left=Math.random()*100+"%";c.style.animationDelay=Math.random()*1.5+"s";scene.appendChild(c);setTimeout(()=>c.remove(),4200)}
 setTimeout(()=>{const o=$("overlay");o.innerHTML='<div class="cheer">'+L[lang].end+'<button class="big" id="start">▶ '+L[lang].again+'</button></div>';o.hidden=false;
  $("start").onclick=()=>{hideStops();sx=null;st.braked=0;newTrip()}},2200)}
$("again").onclick=$("again2").onclick=()=>{if(target)ask()};
$("start").onclick=newTrip;

/* ---------- smash-friendly input ----------
   A toddler mashes the keyboard, taps everywhere, or bangs several
   choice buttons at once. Any key on the keyboard picks a choice (or
   starts/restarts the ride), pointer taps anywhere near a choice still
   count via the buttons themselves, and nothing here can get "stuck"
   waiting for a precise click. */
let smashN=-1;
function smashPick(){
 const opts=[...document.querySelectorAll(".choices button")];
 if(opts.length){smashN=(smashN+1)%opts.length;opts[smashN].click();return true}
 return false;
}
// While the train is rolling, any key sounds the horn (whistle, horn or tram bell for the chosen train).
// A short cooldown stops a held or mashed key from stacking dozens of horns on top of each other.
let lastHonk=0;
function honk(){const now=performance.now();if(now-lastHonk<900)return;lastHonk=now;whistle()}
window.addEventListener("keydown",e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(mode=="drive"||mode=="leave"){if(!e.repeat)honk();return}
 if(smashPick())return;
 const startBtn=document.getElementById("start");
 if(startBtn&&!$("overlay").hidden)startBtn.click();
});
// Tapping or clicking ANYWHERE in the scene while choices are up counts as a
// smash too, not just a precise hit on a picture button — a toddler's palm
// landing between the pictures should still do something fun.
scene.addEventListener("pointerdown",e=>{
 if(e.target.closest(".choices button,.langsel,.ctl,.big,.say"))return;
 smashPick();
});

/* ---------- big pointing-finger cursor ---------- */
const cursor=$("cursor");let cursorSeen=false;
window.addEventListener("pointermove",e=>{
 if(e.pointerType==="touch")return;
 cursorSeen=true;cursor.style.transform="translate("+e.clientX+"px,"+e.clientY+"px)";
 const t=e.target,tap=t.closest("button,select,.choices button");
 cursor.classList.toggle("hover",!!tap);
});
window.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")cursor.classList.add("down")});
window.addEventListener("pointerup",()=>cursor.classList.remove("down"));
window.addEventListener("pointerleave",()=>{if(cursorSeen)cursor.style.opacity="0"});
window.addEventListener("pointerenter",()=>{cursor.style.opacity="1"});
cursor.style.transform="translate(-100px,-100px)";

drawCtl();drawTrain();trip=[0,0,0,0];drawDots();requestAnimationFrame(frame);
</script>

</body></html>
