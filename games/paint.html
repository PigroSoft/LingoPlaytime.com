<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paint the World</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:dark;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#58b0a6 url(../felt/paint-felt.webp) center/1100px;background-blend-mode:multiply;background-attachment:fixed;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#ffffff06 0,#ffffff00 60%),linear-gradient(180deg,#ffffff00 0,#ffffff03 100%);pointer-events:none;z-index:0}
.app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:10px}
.top{display:flex;align-items:center;justify-content:center;min-height:60px;width:100%}
@media (max-width:700px){.top{padding-top:44px}}
#bubble{display:flex;align-items:baseline;gap:14px;font-size:clamp(26px,5vw,48px);min-height:1.2em;transition:transform .15s}
#bubble.bump{transform:scale(1.08)}
#bubble .also{font-size:.45em;font-weight:500;opacity:.8}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,#0000 55%,#0a2a2844 100%);mix-blend-mode:multiply}
.frame{flex:1;min-height:0;width:100%;display:grid;place-items:center;container-type:size;position:relative;z-index:1}
#board{position:relative;width:min(100cqw,100cqh*1.333);aspect-ratio:4/3;max-width:100%;container-type:inline-size;transform:rotate(-.4deg);background:#cdbf9f;
 box-shadow:0 2px 0 #fff3,0 18px 34px #0a2a288c,0 4px 8px #0a2a2866;border-radius:3px}
#world{position:absolute;inset:0;overflow:hidden;border-radius:3px}
#world .bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
/* backdrop pieces: big felt shapes (sky, hills, sea) clipped to a wavy edge, tinted like everything else */
.obj.bg{inset:0;left:0;top:0;width:100%;height:100%;translate:none;transform-origin:50% 50%;pointer-events:none;filter:drop-shadow(0 -.3cqw .4cqw #0005)}
.obj.bg .fill{position:absolute;inset:0;pointer-events:auto;background:url(../felt/paint-felt.webp) center/80% auto;background-attachment:fixed;isolation:isolate;opacity:.96}
.obj.bg i{-webkit-mask:none;mask:none}
.obj.bg .st{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.obj.bg .st path{fill:none;stroke:#fffbe8cc;stroke-width:1.6;stroke-dasharray:6 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.obj.bg.wig{animation:wigbg .5s}
@keyframes wigbg{40%{filter:brightness(1.14) drop-shadow(0 -.3cqw .4cqw #0005)}}
#sticks,#sticks img{pointer-events:none}
#sticks{position:absolute;inset:0}
#sticks img{position:absolute;filter:drop-shadow(0 .5cqw .6cqw #0a2a2888);transform-origin:center}
#sticks img.tape{filter:drop-shadow(0 .2cqw .3cqw #0a2a2866);opacity:.94}
#bubble.k-bubble{border-radius:6px 16px 8px 14px;border:0;background:#fbf6ea;color:#2d2255;transform:rotate(-.8deg);box-shadow:0 2px 0 #fff8 inset,0 6px 14px #0a2a2877;position:relative}
#bubble.k-bubble.bump{transform:rotate(-.8deg) scale(1.08)}
/* every paintable thing is a pale felt cutout; a multiply layer in the paint colour tints it and the felt shows through */
.obj{position:absolute;translate:-50% -100%;cursor:pointer;isolation:isolate;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
.obj.c{translate:-50% -50%;transform-origin:50% 50%}
.obj img{display:block;width:100%;height:auto;filter:drop-shadow(0 .45cqw .5cqw #1a14088a);pointer-events:none}
.obj i{position:absolute;inset:0;background:var(--paint,#e3d5b8);mix-blend-mode:multiply;transition:background .45s ease;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;pointer-events:none}
.obj.wig{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.05)}}
.pots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:26px;position:relative;z-index:1}
.pot{width:26px;height:24px;border-radius:52% 48% 55% 45%/50% 56% 44% 50%;background:#d9bf94;box-shadow:inset 0 0 0 2px #fff6,0 3px 5px #0a2a2877;transition:background .4s,transform .3s}
.pot.done{transform:scale(1.15) rotate(-6deg);box-shadow:inset 0 -3px 0 #0002,0 3px 6px #0a2a2899}
.splat{position:fixed;pointer-events:none;z-index:20;width:190px;height:190px;margin:-95px 0 0 -95px;animation:splat .9s ease-out forwards}
@keyframes splat{0%{transform:scale(.1) rotate(0)}30%{transform:scale(1.1) rotate(20deg);opacity:1}100%{transform:scale(1.3) rotate(30deg);opacity:0}}
.drop{position:fixed;pointer-events:none;z-index:21;border-radius:50%;animation:drop .8s ease-out forwards}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.obj.wig,.splat,.drop{animation:none}.obj i{transition:none}}
</style>
</head>
<body>
<script>window.LP_GAME="paint"</script><script src="voice.js"></script><script src="learn.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="look.js"></script>
<div class="app" id="app">
  <div class="top"><div id="bubble" class="k-bubble" aria-live="polite"></div></div>
  <div class="frame"><div id="board"><div id="world"></div><div id="sticks"></div></div></div>
  <div class="pots" id="pots" aria-hidden="true"></div>
</div>
<script>
/* Every word and line this game can say. tools/phrases.js reads DATA to record them. */
const DATA={
 words:[
  {id:"red",en:"red",nl:"rood",pl:"czerwony",cs:"červená",sv:"röd",el:"κόκκινο",zh:"红色",ar:"أحمر",ja:"あか",ko:"빨강",ru:"красный",tr:"kırmızı",hi:"लाल",de:"rot",es:"rojo",fr:"rouge",it:"rosso",pt:"vermelho"},
  {id:"orange",en:"orange",nl:"oranje",pl:"pomarańczowy",cs:"oranžová",sv:"orange",el:"πορτοκαλί",zh:"橙色",ar:"برتقالي",ja:"オレンジ",ko:"주황",ru:"оранжевый",tr:"turuncu",hi:"नारंगी",de:"orange",es:"naranja",fr:"orange",it:"arancione",pt:"laranja"},
  {id:"yellow",en:"yellow",nl:"geel",pl:"żółty",cs:"žlutá",sv:"gul",el:"κίτρινο",zh:"黄色",ar:"أصفر",ja:"きいろ",ko:"노랑",ru:"жёлтый",tr:"sarı",hi:"पीला",de:"gelb",es:"amarillo",fr:"jaune",it:"giallo",pt:"amarelo"},
  {id:"green",en:"green",nl:"groen",pl:"zielony",cs:"zelená",sv:"grön",el:"πράσινο",zh:"绿色",ar:"أخضر",ja:"みどり",ko:"초록",ru:"зелёный",tr:"yeşil",hi:"हरा",de:"grün",es:"verde",fr:"vert",it:"verde",pt:"verde"},
  {id:"blue",en:"blue",nl:"blauw",pl:"niebieski",cs:"modrá",sv:"blå",el:"μπλε",zh:"蓝色",ar:"أزرق",ja:"あお",ko:"파랑",ru:"синий",tr:"mavi",hi:"नीला",de:"blau",es:"azul",fr:"bleu",it:"blu",pt:"azul"},
  {id:"purple",en:"purple",nl:"paars",pl:"fioletowy",cs:"fialová",sv:"lila",el:"μωβ",zh:"紫色",ar:"بنفسجي",ja:"むらさき",ko:"보라",ru:"фиолетовый",tr:"mor",hi:"बैंगनी",de:"lila",es:"morado",fr:"violet",it:"viola",pt:"roxo"},
  {id:"pink",en:"pink",nl:"roze",pl:"różowy",cs:"růžová",sv:"rosa",el:"ροζ",zh:"粉色",ar:"وردي",ja:"ピンク",ko:"분홍",ru:"розовый",tr:"pembe",hi:"गुलाबी",de:"rosa",es:"rosa",fr:"rose",it:"rosa",pt:"cor-de-rosa"},
  {id:"brown",en:"brown",nl:"bruin",pl:"brązowy",cs:"hnědá",sv:"brun",el:"καφέ",zh:"棕色",ar:"بني",ja:"ちゃいろ",ko:"갈색",ru:"коричневый",tr:"kahverengi",hi:"भूरा",de:"braun",es:"marrón",fr:"marron",it:"marrone",pt:"castanho"},
  {id:"white",en:"white",nl:"wit",pl:"biały",cs:"bílá",sv:"vit",el:"λευκό",zh:"白色",ar:"أبيض",ja:"しろ",ko:"하양",ru:"белый",tr:"beyaz",hi:"सफ़ेद",de:"weiß",es:"blanco",fr:"blanc",it:"bianco",pt:"branco"},
  {id:"black",en:"black",nl:"zwart",pl:"czarny",cs:"černá",sv:"svart",el:"μαύρο",zh:"黑色",ar:"أسود",ja:"くろ",ko:"검정",ru:"чёрный",tr:"siyah",hi:"काला",de:"schwarz",es:"negro",fr:"noir",it:"nero",pt:"preto"},
  {id:"raccoon",en:"raccoon",nl:"wasbeer",pl:"szop",cs:"mýval",sv:"tvättbjörn",el:"ρακούν",zh:"浣熊",ar:"راكون",ja:"アライグマ",ko:"라쿤",ru:"енот",tr:"rakun",hi:"रैकून",de:"Waschbär",es:"mapache",fr:"raton laveur",it:"procione",pt:"guaxinim"}
 ],
 lines:{
  en:{title:"Paint the World",tap:"Tap to paint!",bravo:"Well done!",again:"A new picture!"},nl:{title:"Kleur de wereld",tap:"Tik om te kleuren!",bravo:"Goed gedaan!",again:"Een nieuw plaatje!"},pl:{title:"Pomaluj świat",tap:"Dotknij, by malować!",bravo:"Brawo!",again:"Nowy obrazek!"},cs:{title:"Namaluj svět",tap:"Klepni a maluj!",bravo:"Výborně!",again:"Nový obrázek!"},sv:{title:"Måla världen",tap:"Tryck för att måla!",bravo:"Bra gjort!",again:"En ny bild!"},el:{title:"Ζωγράφισε τον κόσμο",tap:"Άγγιξε για να ζωγραφίσεις!",bravo:"Μπράβο!",again:"Μια νέα εικόνα!"},zh:{title:"给世界涂颜色",tap:"点一点来涂色！",bravo:"做得好！",again:"新图画！"},ar:{title:"لوّن العالم",tap:"المس للتلوين!",bravo:"أحسنت!",again:"صورة جديدة!"},ja:{title:"せかいを ぬろう",tap:"タップして ぬってね！",bravo:"よくできました！",again:"あたらしい え！"},ko:{title:"세상을 칠해요",tap:"눌러서 칠해요!",bravo:"잘했어요!",again:"새 그림!"},ru:{title:"Раскрась мир",tap:"Нажимай и раскрашивай!",bravo:"Молодец!",again:"Новая картинка!"},tr:{title:"Dünyayı boya",tap:"Boyamak için dokun!",bravo:"Aferin!",again:"Yeni bir resim!"},hi:{title:"दुनिया को रंग दो",tap:"रंगने के लिए छुओ!",bravo:"शाबाश!",again:"नई तस्वीर!"},
  de:{title:"Mal die Welt an",tap:"Tipp zum Malen!",bravo:"Super gemacht!",again:"Ein neues Bild!"},
  es:{title:"Pinta el mundo",tap:"¡Toca para pintar!",bravo:"¡Muy bien!",again:"¡Un dibujo nuevo!"},
  fr:{title:"Colorie le monde",tap:"Touche pour colorier !",bravo:"Bravo !",again:"Un nouveau dessin !"},
  it:{title:"Colora il mondo",tap:"Tocca per colorare!",bravo:"Bravissimo!",again:"Un disegno nuovo!"},
  pt:{title:"Pinta o mundo",tap:"Toca para pintar!",bravo:"Muito bem!",again:"Um desenho novo!"}
 }
};
const HEX={red:"#f0384c",orange:"#ff8a3d",yellow:"#ffd23f",green:"#58d26b",blue:"#3aa0ff",purple:"#8b5cf6",pink:"#ff6fa6",brown:"#b96a3c",white:"#fdfcf8",black:"#2a2350"};
const PAPER=["#e6d9bd","#decfae","#e9dfc9","#dccaa4","#e2d6bf"]; // raw kraft and cardboard tones, waiting for paint
const NOTE={red:330,orange:370,yellow:440,green:349,blue:392,purple:262,pink:587,brown:294,white:523,black:220};

/* ---- scenes: a felt backdrop plus pale felt cutouts. n = cutout file, c = paint colour, x/y = % of the board,
   w = % of the board width, a = "b" stands on y, "c" is centred on y. Raccoons carry l:"raccoon" (their own word). ---- */
const SCENES=[
 {id:"meadow",bg:[{c:"blue"},{c:"green",y:63,a:5,f:1.3,p:.5},{c:"yellow",y:88,a:2.5,f:2,p:2}],o:[
  {n:"sun",c:"yellow",x:80,y:20,w:18,a:"c"},
  {n:"tree",c:"green",x:19,y:73,w:22},
  {n:"butterfly",c:"orange",x:42,y:30,w:14,a:"c"},
  {n:"blanket",c:"blue",x:56,y:93,w:28},
  {n:"raccoon",c:"purple",x:56,y:88,w:20,l:"raccoon"},
  {n:"apple",c:"red",x:83,y:92,w:12}]},
 {id:"sea",bg:[{c:"yellow"},{c:"blue",y:50,a:2.2,f:3,p:1},{c:"orange",y:86,a:3,f:1.4,p:0}],o:[
  {n:"boat",c:"red",x:72,y:58,w:22},
  {n:"fish",c:"yellow",x:25,y:50,w:16,a:"c"},
  {n:"crab",c:"orange",x:22,y:90,w:17},
  {n:"raccoon",c:"purple",x:52,y:90,w:21,l:"raccoon"},
  {n:"starfish",c:"pink",x:88,y:84,w:12},
  {n:"bucket",c:"green",x:86,y:93,w:11}]},
 {id:"space",bg:[{c:"black"},{c:"white",y:89,a:2.5,f:2.2,p:.4}],o:[
  {n:"moon",c:"white",x:19,y:24,w:16,a:"c"},
  {n:"planet",c:"purple",x:72,y:22,w:21,a:"c"},
  {n:"star",c:"yellow",x:40,y:46,w:12,a:"c"},
  {n:"ufo",c:"black",x:80,y:55,w:17,a:"c"},
  {n:"rocket",c:"red",x:52,y:92,w:16},
  {n:"raccoon",c:"green",x:20,y:93,w:18,l:"raccoon"}]},
 {id:"play",bg:[{c:"yellow"},{c:"brown",y:74,a:.8,f:2,p:0}],o:[
  {n:"ball",c:"red",x:14,y:92,w:15},
  {n:"blocks",c:"green",x:30,y:80,w:14},
  {n:"teddy",c:"brown",x:62,y:79,w:17},
  {n:"duck",c:"yellow",x:89,y:80,w:12},
  {n:"car",c:"blue",x:80,y:93,w:21},
  {n:"raccoon",c:"pink",x:45,y:92,w:22,l:"raccoon"}]},
 {id:"garden",bg:[{c:"blue"},{c:"green",y:60,a:5,f:1.5,p:1.2},{c:"brown",y:85,a:2.5,f:2.5,p:.3}],o:[
  {n:"tulip",c:"pink",x:12,y:86,w:13},
  {n:"sunflower",c:"yellow",x:30,y:88,w:17},
  {n:"can",c:"blue",x:88,y:92,w:17},
  {n:"ladybug",c:"red",x:64,y:91,w:10},
  {n:"snail",c:"brown",x:76,y:88,w:15},
  {n:"raccoons",c:"orange",x:48,y:93,w:30,l:"raccoon"}]}
];
const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const word=(c,l)=>W[c][l||LP.lang]||W[c].en;
let scene=Math.floor(Math.random()*SCENES.length),objs=[],busy=false,last=0;

function bubble(main,also){const b=$("bubble");b.innerHTML=`<span></span>${also?`<span class="also"></span>`:""}`;b.firstChild.textContent=main;if(also)b.lastChild.textContent=also;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function drawScene(){
 const S=SCENES[scene];
 const edge=b=>{if(b.y==null)return null;const p=[];for(let x=0;x<=100;x+=2.5)p.push([x,+(b.y+b.a*Math.sin(x/100*Math.PI*2*b.f+b.p)).toFixed(2)]);return p};
 const bgHtml=S.bg.map((b,i)=>{
  const e=edge(b),poly=e?[...e,[100,100],[0,100]].map(q=>q[0]+"% "+q[1]+"%").join(","):"0 0,100% 0,100% 100%,0 100%";
  const st=e?`<svg class="st" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${e.map((q,j)=>(j?"L":"M")+q[0]+" "+(q[1]+1.6)).join("")}"/></svg>`:"";
  return `<div class="obj bg" data-c="${b.c}" style="--paint:${PAPER[(i*2+scene)%PAPER.length]}"><div class="fill" style="clip-path:polygon(${poly})"><i></i></div>${st}</div>`}).join("");
 $("world").innerHTML=bgHtml+S.o.map((o,i)=>{
  const u=`url(../felt/paint-${S.id}-${o.n}.webp)`;
  return `<div class="obj${o.a==="c"?" c":""}" data-c="${o.c}"${o.l?` data-l="${o.l}"`:""} style="left:${o.x}%;top:${o.y}%;width:${o.w}%;--paint:${PAPER[(i*3+scene)%PAPER.length]};--m:${u}"><img src="../felt/paint-${S.id}-${o.n}.webp" alt=""><i></i></div>`}).join("");
 objs=[...$("world").querySelectorAll(".obj")];
 const cols=[...new Set(objs.map(g=>g.dataset.c))];
 $("pots").innerHTML=cols.map(c=>`<span class="pot" data-pot="${c}"></span>`).join("");
 (SCENES[(scene+1)%SCENES.length].o).forEach(o=>{const im=new Image();im.src=`../felt/paint-${SCENES[(scene+1)%SCENES.length].id}-${o.n}.webp`});
}
function splash(x,y,hex){
 const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","-50 -50 100 100");s.classList.add("splat");
 let p="";for(let i=0;i<14;i++){const a=i/14*Math.PI*2,r=i%2?22+Math.random()*8:34+Math.random()*12;p+=(i?"L":"M")+(Math.cos(a)*r).toFixed(1)+" "+(Math.sin(a)*r).toFixed(1)}
 s.innerHTML=`<path d="${p}Z" fill="${hex}"/>`;s.style.left=x+"px";s.style.top=y+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),950);
 for(let i=0;i<9;i++){const d=document.createElement("div");d.className="drop";const z=8+Math.random()*16;d.style.cssText=`left:${x-z/2}px;top:${y-z/2}px;width:${z}px;height:${z}px;background:${hex};--dx:${(Math.random()-.5)*300}px;--dy:${(Math.random()-.5)*300}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),850)}
}
function splatSound(f){LP.noise(.25,.3,"lowpass",2400,1,0,200);LP.tone(f*2,.2,"triangle",.14,.05,f)}
function others(c){return [LP.home,...(LP.learn||[])].filter((l,i,a)=>l&&l!==LP.lang&&a.indexOf(l)===i&&W[c][l]).map(l=>W[c][l]).join(" · ")}
function splatSound(f){LP.noise(.25,.3,"lowpass",2400,1,0,200);LP.tone(f*2,.2,"triangle",.14,.05,f)}
function others(c){return [LP.home,...(LP.learn||[])].filter((l,i,a)=>l&&l!==LP.lang&&a.indexOf(l)===i&&W[c][l]).map(l=>W[c][l]).join(" · ")}
const wig=g=>{g.classList.remove("wig");void g.offsetWidth;g.classList.add("wig")};
/* a raccoon says its own word after its colour */
function sayThing(g,c){
 const t=g.dataset.l;if(!t)return;
 setTimeout(()=>{if(!g.isConnected)return;bubble(word(t),others(t));LP.say(word(t),true);LPLearn.heard(t,LP.lang)},1100);
}
function paint(g,x,y){
 const c=g.dataset.c,hex=HEX[c];
 if(x==null){const r=g.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
 splash(x,y,hex);splatSound(NOTE[c]);
 g.style.setProperty("--paint",hex);wig(g);
 g.dataset.done="1";
 const pot=document.querySelector(`[data-pot="${c}"]`);if(pot&&objs.filter(o=>o.dataset.c===c).every(o=>o.dataset.done)){pot.classList.add("done");pot.style.background=hex}
 bubble(word(c),others(c));LP.say(word(c));LPLearn.heard(c,LP.lang);sayThing(g,c);
 if(objs.every(o=>o.dataset.done))finish();
}
function finish(){
 busy=true;setTimeout(()=>{LP.celebrate();const t=L().bravo;bubble(t);LP.say(t);
  for(let i=0;i<14;i++)setTimeout(()=>LP.burst(Math.random()*innerWidth,Math.random()*innerHeight*.7,10),i*140)},1800);
 setTimeout(()=>{scene=(scene+1)%SCENES.length;drawScene();busy=false;bubble(L().again);LP.say(L().again)},6200);
}
function next(){const left=objs.filter(g=>!g.dataset.done);return left.length?left[Math.floor(Math.random()*left.length)]:null}

LP.init({langs:ALLLANGS,onLang:()=>{document.title=L().title;bubble(L().tap)}});
document.title=L().title;
/* a frame of glued popsicle sticks with a few bits of washi tape, laid out in cqw so it scales with the board */
function frame(){
 const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
 const SK=["natural","natural","yellow","teal","red"],TP=["pink","mint","mustard","blue"];
 let h="";const stick=(cx,cy,rot)=>{const c=pick(SK),w=R(25.5,28);h+=`<img src="../felt/paint-stick-${c}.webp" alt="" style="left:${(cx-w/2).toFixed(2)}cqw;top:${(cy-1.6).toFixed(2)}cqw;width:${w.toFixed(2)}cqw;transform:rotate(${rot.toFixed(2)}deg)">`};
 for(let i=0;i<3;i++){stick(1.7+R(-.3,.3),12.5+i*25+R(-1,1),90+R(-.7,.7));stick(98.3+R(-.3,.3),12.5+i*25+R(-1,1),90+R(-.7,.7))}
 for(let i=0;i<4;i++){stick(12.5+i*25+R(-1,1),1.7+R(-.3,.3),R(-.8,.8));stick(12.5+i*25+R(-1,1),73.3+R(-.3,.3),R(-.8,.8))}
 const tp=[...TP].sort(()=>Math.random()-.5);
 [[3,3,-38],[97,3,36],[3,72,34],[97,72,-36]].forEach(([x,y,r],i)=>{if(i>1&&Math.random()<.4)return;h+=`<img class="tape" src="../felt/paint-tape-${tp[i]}.webp" alt="" style="left:${(x-6.5+R(-.8,.8)).toFixed(2)}cqw;top:${(y-1.6+R(-.5,.5)).toFixed(2)}cqw;width:13cqw;transform:rotate(${r+R(-5,5)}deg)">`});
 $("sticks").innerHTML=h;
}
frame();
drawScene();bubble(L().tap);
LP.start(L().title,()=>{bubble(L().tap);LP.say(L().tap)});
LP.mash((e,x,y)=>{
 if(busy)return;const now=Date.now();if(now-last<280)return;last=now;
 const g=e.target.closest&&e.target.closest(".obj");
 if(g&&g.dataset.done){const c=g.dataset.c;wig(g);splatSound(NOTE[c]);bubble(word(c),others(c));LP.say(word(c));sayThing(g,c);return}
 // a tap anywhere paints the next plain thing, so the smallest hands always get colour
 if(!g&&LP.age>=2){const n=next();if(n)wig(n);return} // big kids have to aim; a stray tap only wiggles a plain thing
 const t=g&&!g.dataset.done?g:next();if(t)paint(t,g?x:null,g?y:null);
});
