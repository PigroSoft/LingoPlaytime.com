<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paint the World</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:dark;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#140f3a;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:10px}
.top{display:flex;align-items:center;justify-content:center;min-height:60px;width:100%}
#bubble{display:flex;align-items:baseline;gap:14px;font-size:clamp(26px,5vw,48px);min-height:1.2em;transition:transform .15s}
#bubble.bump{transform:scale(1.08)}
#bubble .also{font-size:.45em;font-weight:500;opacity:.8}
.frame{flex:1;min-height:0;width:100%;display:grid;place-items:center;container-type:size}
#world{width:min(100cqw,100cqh*1.333);aspect-ratio:4/3;max-width:100%;border-radius:28px;overflow:hidden;box-shadow:0 0 0 6px #ffffff1f,0 30px 60px #0008;background:#c9c6d8}
#world svg{width:100%;height:100%;display:block}
.obj{cursor:pointer;transition:fill .6s ease,color .6s ease}
.obj *{transition:fill .6s ease}
.obj.wig{animation:wig .5s;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:rotate(-3deg) scale(1.04)}75%{transform:rotate(3deg) scale(1.04)}}
.hl{fill:#fff;opacity:.28;pointer-events:none}
.sd{fill:#1a1440;opacity:.16;pointer-events:none}
.ink{fill:#1a1440}
.pots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:26px}
.pot{width:24px;height:24px;border-radius:50%;background:#ffffff22;box-shadow:inset 0 0 0 2px #ffffff33;transition:background .4s,transform .3s}
.pot.done{transform:scale(1.15);box-shadow:0 0 12px currentColor}
.splat{position:fixed;pointer-events:none;z-index:20;width:190px;height:190px;margin:-95px 0 0 -95px;animation:splat .9s ease-out forwards}
@keyframes splat{0%{transform:scale(.1) rotate(0)}30%{transform:scale(1.1) rotate(20deg);opacity:1}100%{transform:scale(1.3) rotate(30deg);opacity:0}}
.drop{position:fixed;pointer-events:none;z-index:21;border-radius:50%;animation:drop .8s ease-out forwards}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.obj.wig,.splat,.drop{animation:none}.obj,.obj *{transition:none}}
</style>
</head>

  O("green",`<rect x="330" y="350" width="70" height="70" rx="8"/><rect x="400" y="350" width="70" height="70" rx="8"/><rect x="365" y="280" width="70" height="70" rx="8"/><g fill="#fff" font-family="Fredoka,sans-serif" font-weight="700" font-size="44" text-anchor="middle"><text x="365" y="402">A</text><text x="435" y="402">B</text><text x="400" y="332">C</text></g>`,"blocks")+
  O("pink",`<g transform="translate(660 320)"><circle cx="-34" cy="-46" r="20"/><circle cx="34" cy="-46" r="20"/><circle r="52"/><ellipse cy="70" rx="46" ry="40"/><ellipse cy="14" rx="20" ry="14" fill="#fff2d8"/><circle cy="8" r="6" class="ink"/>${eyes(0,-14,16,5)}</g>`,"teddy")+
  O("white",`<g transform="translate(130 200)"><rect x="-70" y="-60" width="140" height="120" rx="10"/><path d="M-60 40l40-50 30 34 20-20 40 36Z" fill="#58d26b"/><circle cx="34" cy="-26" r="14" fill="#ffd23f"/></g>`,"picture"),
 /* 8 city */
 ()=>O("blue",`<rect width="800" height="450"/>`,"sky")+
  O("orange",`<rect x="40" y="150" width="150" height="300"/><g fill="#ffe58a">${[0,1,2,3].map(r=>[0,1].map(c=>`<rect x="${70+c*60}" y="${180+r*64}" width="30" height="38" rx="4"/>`).join("")).join("")}</g>`,"house")+
  O("purple",`<rect x="210" y="90" width="130" height="360"/><g fill="#ffe58a">${[0,1,2,3,4].map(r=>`<rect x="236" y="${120+r*64}" width="30" height="38" rx="4"/><rect x="286" y="${120+r*64}" width="30" height="38" rx="4"/>`).join("")}</g>`,"house")+
  O("green",`<rect x="436" y="300" width="20" height="150" rx="6" fill="#8a4724"/><circle cx="446" cy="270" r="60"/><circle cx="410" cy="300" r="36"/><circle cx="484" cy="302" r="34"/>`,"tree")+
  O("black",`<path d="M0 450h800v150H0Z"/><path d="M40 530h80M200 530h80M360 530h80M520 530h80M680 530h80" stroke="#fff" stroke-width="8" opacity=".6"/>`,"road")+
  O("red",`<g transform="translate(560 410)"><rect x="-120" y="-80" width="240" height="110" rx="16"/><g fill="#bfe6fb">${[0,1,2,3].map(i=>`<rect x="${-104+i*52}" y="-64" width="40" height="34" rx="5"/>`).join("")}</g><circle cx="-70" cy="34" r="22" class="ink"/><circle cx="70" cy="34" r="22" class="ink"/></g>`,"bus")+
  O("yellow",`<g transform="translate(160 520)"><path d="M-90 20v-36l24-6 20-28h80l24 28 32 6v36Z"/><rect x="-14" y="-62" width="40" height="14" rx="4" class="ink"/><circle cx="-50" cy="24" r="18" class="ink"/><circle cx="56" cy="24" r="18" class="ink"/></g>`,"taxi")+
  O("white",cloud(560,80,1)+cloud(80,40,.7),"clouds"),

 ()=>O("blue",`<rect width="800" height="600"/>`,"sky")+
  O("brown",`<path d="M0 440c200-20 600-20 800 0V600H0Z"/><path class="sd" d="M0 520h800v80H0Z"/>`,"soil")+
  O("green",`<path d="M140 450V300M300 460V260M460 450V320M620 460V240" stroke="#33a24f" stroke-width="10" stroke-linecap="round"/><path d="M140 380c-30-20-50-10-56 4 20 6 40 6 56-4ZM300 380c30-20 50-10 56 4-20 6-40 6-56-4ZM460 400c-30-20-50-10-56 4 20 6 40 6 56-4ZM620 360c30-20 50-10 56 4-20 6-40 6-56-4Z"/>`,"leaves")+
  O("red",`<path d="M110 300c0-40 14-60 30-60s30 20 30 60c-10 14-50 14-60 0Z M118 250l22 20 22-20"/>`,"tulip")+

  O("yellow",`<g transform="translate(620 230)">${(()=>{let s="";for(let i=0;i<12;i++){const a=i/12*Math.PI*2;s+=`<ellipse cx="${(Math.cos(a)*40).toFixed(1)}" cy="${(Math.sin(a)*40).toFixed(1)}" rx="20" ry="11" transform="rotate(${i*30} ${(Math.cos(a)*40).toFixed(1)} ${(Math.sin(a)*40).toFixed(1)})"/>`}return s})()}<circle r="28" fill="#8a4724"/>${eyes(0,-4,9,4)}</g>`,"sunflower")+
  O("pink",`<g transform="translate(300 240)">${flower(0,0,24)}<circle r="14" fill="#ffd23f"/></g>`,"flower")+

 /* 10 rainbow */
 ()=>O("blue",`<rect width="800" height="600"/>`,"sky")+
  O("red",`<path d="M80 500a320 320 0 0 1 640 0h-44a276 276 0 0 0-552 0Z"/>`)+
  O("orange",`<path d="M124 500a276 276 0 0 1 552 0h-44a232 232 0 0 0-464 0Z"/>`)+
  O("yellow",`<path d="M168 500a232 232 0 0 1 464 0h-44a188 188 0 0 0-376 0Z"/>`)+
  O("green",`<path d="M212 500a188 188 0 0 1 376 0h-44a144 144 0 0 0-288 0Z"/>`)+

const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const word=(c,l)=>W[c][l||LP.lang]||W[c].en;
let scene=Math.floor(Math.random()*SCENES.length),objs=[],busy=false,last=0;

function bubble(main,also){const b=$("bubble");b.innerHTML=`<span></span>${also?`<span class="also"></span>`:""}`;b.firstChild.textContent=main;if(also)b.lastChild.textContent=also;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function drawScene(){
 $("world").innerHTML=`<svg viewBox="0 0 800 600" role="img" aria-label="${L().title}">${SCENES[scene]()}</svg>`;
 objs=[...$("world").querySelectorAll(".obj")];
 objs.forEach(g=>{g.setAttribute("fill",GREY[g.dataset.c]);g.dataset.done="";g.querySelectorAll(".tent").forEach(t=>t.setAttribute("stroke",GREY[g.dataset.c]))});
 const cols=[...new Set(objs.map(g=>g.dataset.c))];
 $("pots").innerHTML=cols.map(c=>`<span class="pot" data-pot="${c}"></span>`).join("");
}
function splash(x,y,hex){
 const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","-50 -50 100 100");s.classList.add("splat");
 let p="";for(let i=0;i<14;i++){const a=i/14*Math.PI*2,r=i%2?22+Math.random()*8:34+Math.random()*12;p+=(i?"L":"M")+(Math.cos(a)*r).toFixed(1)+" "+(Math.sin(a)*r).toFixed(1)}
 s.innerHTML=`<path d="${p}Z" fill="${hex}"/>`;s.style.left=x+"px";s.style.top=y+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),950);
 for(let i=0;i<9;i++){const d=document.createElement("div");d.className="drop";const z=8+Math.random()*16;d.style.cssText=`left:${x-z/2}px;top:${y-z/2}px;width:${z}px;height:${z}px;background:${hex};--dx:${(Math.random()-.5)*300}px;--dy:${(Math.random()-.5)*300}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),850)}
}
function splatSound(f){LP.noise(.25,.3,"lowpass",2400,1,0,200);LP.tone(f*2,.2,"triangle",.14,.05,f)}
function others(c){return [LP.home,...(LP.learn||[])].filter((l,i,a)=>l&&l!==LP.lang&&a.indexOf(l)===i&&W[c][l]).map(l=>W[c][l]).join(" · ")}
function paint(g,x,y){
 const c=g.dataset.c,hex=HEX[c];
 if(x==null){const r=g.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
 splash(x,y,hex);splatSound(NOTE[c]);
 g.setAttribute("fill",hex);g.querySelectorAll(".tent").forEach(t=>t.setAttribute("stroke",hex));
 g.classList.remove("wig");void g.getBBox();g.classList.add("wig");
 g.dataset.done="1";
 const pot=document.querySelector(`[data-pot="${c}"]`);if(pot&&objs.filter(o=>o.dataset.c===c).every(o=>o.dataset.done)){pot.classList.add("done");pot.style.background=hex;pot.style.color=hex}
 bubble(word(c),others(c));LP.say(word(c));LPLearn.heard(c,LP.lang);
 if(objs.every(o=>o.dataset.done))finish();
}
function finish(){
 busy=true;setTimeout(()=>{LP.sfx.chime();const t=L().bravo;bubble(t);LP.say(t);
  for(let i=0;i<14;i++)setTimeout(()=>LP.burst(Math.random()*innerWidth,Math.random()*innerHeight*.7,10),i*140)},900);
 setTimeout(()=>{scene=(scene+1)%SCENES.length;drawScene();busy=false;bubble(L().again);LP.say(L().again)},5200);
}
function next(){const left=objs.filter(g=>!g.dataset.done);return left.length?left[Math.floor(Math.random()*left.length)]:null}

LP.init({langs:ALLLANGS,onLang:()=>{document.title=L().title;bubble(L().tap)}});
document.title=L().title;
LPLook.sky($("app"),{moon:false,hills:false});
drawScene();bubble(L().tap);
LP.start(L().title,()=>{bubble(L().tap);LP.say(L().tap)});
LP.mash((e,x,y)=>{
 if(busy)return;const now=Date.now();if(now-last<280)return;last=now;
 const g=e.target.closest&&e.target.closest(".obj");
 if(g&&g.dataset.done){const c=g.dataset.c;g.classList.remove("wig");void g.getBBox();g.classList.add("wig");splatSound(NOTE[c]);bubble(word(c),others(c));LP.say(word(c));return}
 // a tap anywhere paints the next grey thing, so the smallest hands always get colour
 if(!g&&LP.age>=2){const n=next();if(n){n.classList.remove("wig");void n.getBBox();n.classList.add("wig")}return} // big kids have to aim; a stray tap only wiggles a grey thing
 const t=g&&!g.dataset.done?g:next();if(t)paint(t,g?x:null,g?y:null);
});
</script>
