<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pairs</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:dark;--bg:#FDF1CC;--ink:#18264A;--paper:#FFFDF8;--sun:#F6C033;--tomato:#E5553B;--teal:#1E9A8F;--lilac:#7A68D9;--sky:#3B8BD4;
  --display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#140f3a;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;position:relative;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;align-items:center;gap:14px;min-height:60px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s}
#bubble.bump{transform:scale(1.08)}
.board{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.grid{display:grid;gap:clamp(8px,2vw,18px);grid-template-columns:repeat(var(--c),1fr);width:min(100%,calc(100cqh * var(--c) / var(--r) * .78))}
.card{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;perspective:700px}
.card:focus-visible{outline:4px solid var(--sky);outline-offset:4px;border-radius:18px}
.face{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.3,1.3,.5,1);box-shadow:0 10px 20px #0005}
.back{background:radial-gradient(circle at 30% 25%,#ffffff33 0 14%,transparent 15%),radial-gradient(circle,#ffffff22 2px,transparent 2.5px) 0 0/16px 16px,linear-gradient(160deg,#8b5cf6,#5b3ad1);border:3px solid #ffffff33;box-shadow:0 10px 20px #0005,inset 0 2px 0 #ffffff44}
.front{background:linear-gradient(160deg,#fffdf6,#f1e8ff);color:#1a1440;transform:rotateY(180deg);border:3px solid #ffffff;padding:6%;box-sizing:border-box;text-align:center}
.card.up .back{transform:rotateY(-180deg)}.card.up .front{transform:rotateY(0)}
.front .pic{font-size:calc(var(--cw,90px)*.55);line-height:1}
.front .pic.draw{width:86%;display:block}.front .pic.draw svg{width:100%;display:block}
.front .word{font-family:var(--display);font-weight:600;font-size:calc(var(--cw,90px)*.17);line-height:1.1;overflow-wrap:anywhere}
.front .code{position:absolute;top:6px;left:8px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#4D5B7A;background:var(--bg);border-radius:999px;padding:2px 7px}
.card.done .front{border-color:#ffd23f;box-shadow:0 0 0 4px #ffd23f,0 0 30px #ffd23f88}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
</style>
</head>
<body>
<script>window.LP_GAME="pairs"</script><script src="voice.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="look.js"></script>
<div class="app" id="app">
  <div class="top"><div id="bubble" class="k-bubble" aria-live="polite"></div></div>
  <div class="board"><div class="grid" id="grid"></div></div>
</div>
<script>
/* Every word and line this game can say. tools/phrases.js reads DATA to record them. */
const DATA={
 words:[
  {id:"apple",e:"🍎",en:"the apple",nl:"de appel",pl:"jabłko",sv:"äpplet",el:"το μήλο",zh:"苹果",ar:"التفاحة",ja:"りんご",ko:"사과",ru:"яблоко",tr:"elma",hi:"सेब",de:"der Apfel",es:"la manzana",fr:"la pomme",it:"la mela",pt:"a maçã"},
  {id:"banana",e:"🍌",en:"the banana",nl:"de banaan",pl:"banan",sv:"bananen",el:"η μπανάνα",zh:"香蕉",ar:"الموزة",ja:"バナナ",ko:"바나나",ru:"банан",tr:"muz",hi:"केला",de:"die Banane",es:"el plátano",fr:"la banane",it:"la banana",pt:"a banana"},
  {id:"dog",e:"🐶",en:"the dog",nl:"de hond",pl:"pies",sv:"hunden",el:"ο σκύλος",zh:"狗",ar:"الكلب",ja:"いぬ",ko:"강아지",ru:"собака",tr:"köpek",hi:"कुत्ता",de:"der Hund",es:"el perro",fr:"le chien",it:"il cane",pt:"o cão"},
  {id:"cat",e:"🐱",en:"the cat",nl:"de kat",pl:"kot",sv:"katten",el:"η γάτα",zh:"猫",ar:"القطة",ja:"ねこ",ko:"고양이",ru:"кошка",tr:"kedi",hi:"बिल्ली",de:"die Katze",es:"el gato",fr:"le chat",it:"il gatto",pt:"o gato"},
  {id:"ball",e:"⚽",en:"the ball",nl:"de bal",pl:"piłka",sv:"bollen",el:"η μπάλα",zh:"球",ar:"الكرة",ja:"ボール",ko:"공",ru:"мяч",tr:"top",hi:"गेंद",de:"der Ball",es:"la pelota",fr:"le ballon",it:"la palla",pt:"a bola"},
  {id:"car",e:"🚗",en:"the car",nl:"de auto",pl:"samochód",sv:"bilen",el:"το αυτοκίνητο",zh:"汽车",ar:"السيارة",ja:"くるま",ko:"자동차",ru:"машина",tr:"araba",hi:"गाड़ी",de:"das Auto",es:"el coche",fr:"la voiture",it:"la macchina",pt:"o carro"},
  {id:"house",e:"🏠",en:"the house",nl:"het huis",pl:"dom",sv:"huset",el:"το σπίτι",zh:"房子",ar:"البيت",ja:"いえ",ko:"집",ru:"дом",tr:"ev",hi:"घर",de:"das Haus",es:"la casa",fr:"la maison",it:"la casa",pt:"a casa"},
  {id:"tree",e:"🌳",en:"the tree",nl:"de boom",pl:"drzewo",sv:"trädet",el:"το δέντρο",zh:"树",ar:"الشجرة",ja:"き",ko:"나무",ru:"дерево",tr:"ağaç",hi:"पेड़",de:"der Baum",es:"el árbol",fr:"l'arbre",it:"l'albero",pt:"a árvore"},
  {id:"sun",e:"☀️",en:"the sun",nl:"de zon",pl:"słońce",sv:"solen",el:"ο ήλιος",zh:"太阳",ar:"الشمس",ja:"おひさま",ko:"해",ru:"солнце",tr:"güneş",hi:"सूरज",de:"die Sonne",es:"el sol",fr:"le soleil",it:"il sole",pt:"o sol"},
  {id:"moon",e:"🌙",en:"the moon",nl:"de maan",pl:"księżyc",sv:"månen",el:"το φεγγάρι",zh:"月亮",ar:"القمر",ja:"おつきさま",ko:"달",ru:"луна",tr:"ay",hi:"चाँद",de:"der Mond",es:"la luna",fr:"la lune",it:"la luna",pt:"a lua"},
  {id:"fish",e:"🐟",en:"the fish",nl:"de vis",pl:"ryba",sv:"fisken",el:"το ψάρι",zh:"鱼",ar:"السمكة",ja:"さかな",ko:"물고기",ru:"рыба",tr:"balık",hi:"मछली",de:"der Fisch",es:"el pez",fr:"le poisson",it:"il pesce",pt:"o peixe"},
  {id:"star",e:"⭐",en:"the star",nl:"de ster",pl:"gwiazda",sv:"stjärnan",el:"το αστέρι",zh:"星星",ar:"النجمة",ja:"ほし",ko:"별",ru:"звезда",tr:"yıldız",hi:"तारा",de:"der Stern",es:"la estrella",fr:"l'étoile",it:"la stella",pt:"a estrela"},
  {id:"flower",e:"🌸",en:"the flower",nl:"de bloem",pl:"kwiatek",sv:"blomman",el:"το λουλούδι",zh:"花",ar:"الزهرة",ja:"はな",ko:"꽃",ru:"цветок",tr:"çiçek",hi:"फूल",de:"die Blume",es:"la flor",fr:"la fleur",it:"il fiore",pt:"a flor"},
  {id:"book",e:"📖",en:"the book",nl:"het boek",pl:"książka",sv:"boken",el:"το βιβλίο",zh:"书",ar:"الكتاب",ja:"ほん",ko:"책",ru:"книга",tr:"kitap",hi:"किताब",de:"das Buch",es:"el libro",fr:"le livre",it:"il libro",pt:"o livro"},
  {id:"shoe",e:"👟",en:"the shoe",nl:"de schoen",pl:"but",sv:"skon",el:"το παπούτσι",zh:"鞋子",ar:"الحذاء",ja:"くつ",ko:"신발",ru:"ботинок",tr:"ayakkabı",hi:"जूता",de:"der Schuh",es:"el zapato",fr:"la chaussure",it:"la scarpa",pt:"o sapato"},
  {id:"cake",e:"🎂",en:"the cake",nl:"de taart",pl:"ciasto",sv:"tårtan",el:"η τούρτα",zh:"蛋糕",ar:"الكعكة",ja:"ケーキ",ko:"케이크",ru:"торт",tr:"pasta",hi:"केक",de:"der Kuchen",es:"la tarta",fr:"le gâteau",it:"la torta",pt:"o bolo"}
 ],
 lines:{
  en:{title:"Pairs",match:"A pair!",win:"You found them all!"},nl:{title:"Memory",match:"Een paar!",win:"Je hebt ze allemaal gevonden!"},pl:{title:"Pary",match:"Para!",win:"Znalazłeś wszystkie!"},sv:{title:"Par",match:"Ett par!",win:"Du hittade alla!"},el:{title:"Ζευγάρια",match:"Ζευγάρι!",win:"Τα βρήκες όλα!"},zh:{title:"配对",match:"一对！",win:"你全找到了！"},ar:{title:"الأزواج",match:"زوج!",win:"وجدتها كلها!"},ja:{title:"ペアあわせ",match:"ペアだ！",win:"ぜんぶ みつけたね！"},ko:{title:"짝 맞추기",match:"짝이야!",win:"다 찾았어요!"},ru:{title:"Пары",match:"Пара!",win:"Ты нашёл все!"},tr:{title:"Eşleştirme",match:"Bir çift!",win:"Hepsini buldun!"},hi:{title:"जोड़ियाँ",match:"जोड़ी!",win:"तुमने सब ढूँढ लिए!"},
  de:{title:"Paare finden",match:"Ein Paar!",win:"Du hast alle gefunden!"},
  es:{title:"Parejas",match:"¡Una pareja!",win:"¡Las encontraste todas!"},
  fr:{title:"Paires",match:"Une paire !",win:"Tu les as toutes trouvées !"},
  it:{title:"Coppie",match:"Una coppia!",win:"Le hai trovate tutte!"},
  pt:{title:"Pares",match:"Um par!",win:"Encontraste todos!"}
 }
};
const LANGS=ALLLANGS;
const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
let cards=[],up=[],lock=false,found=0,pairs=0;

/* picture cards speak the language being learned; word cards show and speak a second one */
function second(){
 const opts=[LP.home,...(LP.learn||[]),"en"].filter(c=>LANGS.includes(c)&&c!==LP.lang);
 return opts[0]||LP.lang;
}
function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}

function deal(){
 pairs=[3,4,6][LP.age]||6;
 const pick=[...DATA.words].sort(()=>Math.random()-.5).slice(0,pairs),two=second();
 cards=[];pick.forEach(w=>{cards.push({id:w.id,kind:"pic"});cards.push({id:w.id,kind:"word",lang:two})});
 cards.sort(()=>Math.random()-.5);
 const n=cards.length,c=n<=6?3:4,r=Math.ceil(n/c);
 const g=$("grid");g.style.setProperty("--c",c);g.style.setProperty("--r",r);
 g.innerHTML=cards.map((k,i)=>`<button type="button" class="card" data-i="${i}" aria-label="?"><div class="face back"></div><div class="face front">${k.kind==="pic"?(LPLook.has(k.id)?`<span class="pic draw">${LPLook.animal(k.id)}</span>`:`<span class="pic">${W[k.id].e}</span>`):`<span class="code">${k.lang.toUpperCase()}</span><span class="word" lang="${k.lang}">${W[k.id][k.lang]}</span>`}</div></button>`).join("");
 up=[];lock=false;found=0;size();
 bubble(L().title);
}
function size(){const c=document.querySelector(".card");if(c)$("grid").style.setProperty("--cw",c.getBoundingClientRect().width+"px")}
addEventListener("resize",size);

function flip(i){
 const el=document.querySelector(`[data-i="${i}"]`),k=cards[i];
 if(lock||!el||el.classList.contains("up"))return;
 el.classList.add("up");LP.sfx.pop();
 const text=k.kind==="pic"?W[k.id][LP.lang]:W[k.id][k.lang];
 el.setAttribute("aria-label",text);
 LP.say(text,false,k.kind==="pic"?LP.lang:k.lang);
 up.push(i);
 if(up.length<2)return;
 const [a,b]=up;up=[];
 if(cards[a].id===cards[b].id&&cards[a].kind!==cards[b].kind){
  found++;
  setTimeout(()=>{[a,b].forEach(j=>document.querySelector(`[data-i="${j}"]`).classList.add("done"));LP.sfx.chime();
   const r=el.getBoundingClientRect();LP.burst(r.left+r.width/2,r.top+r.height/2,16);
   bubble(L().match+" "+W[cards[a].id].e);LP.say(L().match);LP.say(W[cards[a].id][LP.lang],true);
   if(found===pairs)setTimeout(()=>{bubble(L().win);LP.say(L().win);LP.burst(innerWidth/2,innerHeight/2,40);setTimeout(deal,4500)},1800)},700);
 }else{
  lock=true;setTimeout(()=>{[a,b].forEach(j=>{const e=document.querySelector(`[data-i="${j}"]`);e.classList.remove("up");e.setAttribute("aria-label","?")});lock=false},1700);
 }
}

LP.init({langs:LANGS,onLang:()=>{document.title=L().title;deal()},onAge:deal});
LPLook.sky(document.getElementById("app"),{moon:false,hills:false});
document.title=L().title;deal();
LP.start(L().title,()=>{});
LP.mash((e)=>{
 const c=e.target.closest&&e.target.closest("[data-i]");
 if(c){flip(+c.dataset.i);return}
 if(e.type==="keydown"){const free=[...document.querySelectorAll(".card:not(.up)")];if(free.length)flip(+LP.next("pairs",free).dataset.i)}
});
</script>
</body>
</html>
