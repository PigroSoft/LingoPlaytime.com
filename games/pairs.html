html,body{height:100%;margin:0}
body{background:#14595f url(../felt/pairs-bg.webp) center/cover no-repeat;color:#4a3213;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;position:relative;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;align-items:center;gap:14px;min-height:60px}

#bubble.bump{transform:scale(1.08)}
.board{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.grid{display:grid;gap:clamp(8px,2vw,18px);grid-template-columns:repeat(var(--c),1fr);width:min(100%,calc(100cqh * var(--c) / var(--r) * .66))}
.card{position:relative;aspect-ratio:217/307;border:0;padding:0;background:none;cursor:pointer;perspective:700px}
.card:focus-visible{outline:4px dashed #fff3d6;outline-offset:4px;border-radius:18px}
.face{position:absolute;inset:0;border-radius:0;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.3,1.3,.5,1);filter:drop-shadow(0 8px 6px #0006)}
.back{background:url(../felt/pairs-back.webp) center/100% 100% no-repeat}
.front{background:url(../felt/pairs-front.webp) center/100% 100% no-repeat;color:#4a3213;transform:rotateY(180deg);padding:12% 10% 8%;box-sizing:border-box;text-align:center;grid-template-rows:1fr auto;gap:2%}
.front .pic img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 3px #0003)}
.front .pic.fp{width:100%;height:100%;min-height:0;display:block}
.card.up .back{transform:rotateY(-180deg)}.card.up .front{transform:rotateY(0)}
.front .pic{font-size:calc(var(--cw,90px)*.5);line-height:1}
.front .pic.draw{width:86%;display:block}.front .pic.draw svg{width:100%;display:block}
.front .word{font-family:var(--display);font-weight:600;font-size:calc(var(--cw,90px)*.17);line-height:1.1;overflow-wrap:anywhere}
.front .code{position:absolute;top:8%;left:12%;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff8ec;background:#b8401f;border-radius:999px;padding:2px 7px}
.card.done .front{filter:drop-shadow(0 0 6px #ffd84a) drop-shadow(0 0 16px #ffd84a)}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
</style>
</head>

 ],
 lines:{
  en:{title:"Pairs",match:"A pair!",win:"You found them all!"},nl:{title:"Memory",match:"Een paar!",win:"Je hebt ze allemaal gevonden!"},pl:{title:"Pary",match:"Para!",win:"Znalazłeś wszystkie!"},sv:{title:"Par",match:"Ett par!",win:"Du hittade alla!"},el:{title:"Ζευγάρια",match:"Ζευγάρι!",win:"Τα βρήκες όλα!"},zh:{title:"配对",match:"一对！",win:"你全找到了！"},ar:{title:"الأزواج",match:"زوج!",win:"وجدتها كلها!"},ja:{title:"ペアあわせ",match:"ペアだ！",win:"ぜんぶ みつけたね！"},ko:{title:"짝 맞추기",match:"짝이야!",win:"다 찾았어요!"},ru:{title:"Пары",match:"Пара!",win:"Ты нашёл все!"},tr:{title:"Eşleştirme",match:"Bir çift!",win:"Hepsini buldun!"},hi:{title:"जोड़ियाँ",match:"जोड़ी!",win:"तुमने सब ढूँढ लिए!"},

const LANGS=ALLLANGS;
const PIC={apple:"food-apple",banana:"food-banana",dog:"peek-dog",cat:"sky-cat",ball:"sky-ball",car:"night-car",house:"sky-house",tree:"pairs-tree",sun:"sky-sun",moon:"sky-moon",fish:"sky-fish",star:"sky-star",flower:"train-flower",book:"sky-book",shoe:"train-shoe",cake:"pairs-cake"};
const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
let cards=[],up=[],lock=false,found=0,pairs=0;

/* picture cards speak the language being learned; word cards show and speak a second one */
function second(){
 const opts=[LP.home,...(LP.learn||[]),"en"].filter(c=>LANGS.includes(c)&&c!==LP.lang);
 return opts[0]||LP.lang;
}
function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}

function deal(){
 pairs=[3,4,6][LP.age]||6;
 const two=second(),pick=LPLearn.pick(DATA.words,w=>w.id,pairs,LP.lang);
 cards=[];pick.forEach(w=>{cards.push({id:w.id,kind:"pic"});cards.push({id:w.id,kind:"word",lang:two})});
 cards.sort(()=>Math.random()-.5);
 const n=cards.length,c=n<=6?3:4,r=Math.ceil(n/c);
 const g=$("grid");g.style.setProperty("--c",c);g.style.setProperty("--r",r);
 g.innerHTML=cards.map((k,i)=>`<button type="button" class="card" data-i="${i}" aria-label="?"><div class="face back"></div><div class="face front">${k.kind==="pic"?(PIC[k.id]?`<span class="pic fp"><img src="../felt/${PIC[k.id]}.webp" alt="" draggable="false"></span>`:LPLook.has(k.id)?`<span class="pic draw">${LPLook.animal(k.id)}</span>`:`<span class="pic">${W[k.id].e}</span>`):`<span class="code">${k.lang.toUpperCase()}</span><span class="word" lang="${k.lang}">${W[k.id][k.lang]}</span>`}</div></button>`).join("");
 up=[];lock=false;found=0;size();
 bubble(L().title);
}
function size(){const c=document.querySelector(".card");if(c)$("grid").style.setProperty("--cw",c.getBoundingClientRect().width+"px")}
addEventListener("resize",size);

function flip(i){
 const el=document.querySelector(`[data-i="${i}"]`),k=cards[i];
 if(lock||!el||el.classList.contains("up"))return;
 el.classList.add("up");LP.sfx.pop();
 const text=k.kind==="pic"?W[k.id][LP.lang]:W[k.id][k.lang];
 el.setAttribute("aria-label",text);
 LP.say(text,false,k.kind==="pic"?LP.lang:k.lang);LPLearn.heard(k.id,k.kind==="pic"?LP.lang:k.lang);
 up.push(i);
 if(up.length<2)return;
 const [a,b]=up;up=[];
 if(cards[a].id===cards[b].id&&cards[a].kind!==cards[b].kind){
  found++;LPLearn.asked(cards[a].id,LP.lang,true);
  setTimeout(()=>{[a,b].forEach(j=>document.querySelector(`[data-i="${j}"]`).classList.add("done"));LP.sfx.chime();
   const r=el.getBoundingClientRect();LP.burst(r.left+r.width/2,r.top+r.height/2,16);
   bubble(L().match);LP.say(L().match);LP.say(W[cards[a].id][LP.lang],true);
   if(found===pairs)setTimeout(()=>{LP.celebrate();bubble(L().win);LP.say(L().win);setTimeout(deal,4500)},1800)},700);
 }else{
  LPLearn.asked(cards[a].id,LP.lang,false);LPLearn.asked(cards[b].id,LP.lang,false);
  lock=true;setTimeout(()=>{[a,b].forEach(j=>{const e=document.querySelector(`[data-i="${j}"]`);e.classList.remove("up");e.setAttribute("aria-label","?")});lock=false},1700);
 }
}

LP.init({langs:LANGS,onLang:()=>{document.title=L().title;deal()},onAge:deal});

document.title=L().title;deal();
LP.start(L().title,()=>{});
LP.mash((e)=>{
 const c=e.target.closest&&e.target.closest("[data-i]");
 if(c){flip(+c.dataset.i);return}
 if(e.type==="keydown"){
   // age 0=1–2yrs, 1=3–4yrs, 2=5–7yrs
   // age 2: keyboard disabled, mouse-only
   if(LP.age===2) return;

   const free=[...document.querySelectorAll(".card:not(.up)")];
   if(!free.length) return;

   // age 0: every keypress finds the matching pair
   if(LP.age===0){
     if(up.length===0){
       // First card in pair: pick any free card
       flip(+LP.next("pairs",free).dataset.i);
     } else {
       // Second card: find the match
       const firstCardId=cards[up[0]].id;
       const matched=cards.findIndex((c,i)=>{
         const el=document.querySelector(`[data-i="${i}"]`);
         return el&&free.includes(el)&&c.id===firstCardId&&c.kind!==cards[up[0]].kind;
       });
       if(matched>=0) flip(matched);
     }
   } else {
     // age 1: random/rotate through free cards
     flip(+LP.next("pairs",free).dataset.i);
   }
 }
});
