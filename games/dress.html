<style>
:root{color-scheme:dark;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;--it:64px}
html,body{height:100%;margin:0}
body{background:#2a2010;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;overflow:hidden}
/* three photographed felt and cardboard sets: the hallway, and the weather outside */
.bg{position:absolute;max-width:none;display:block;pointer-events:none}
.outbg{opacity:0;transition:opacity .9s}
body.out #room{opacity:0}
#room{transition:opacity .9s}
body.out .outbg.on{opacity:1}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,#0000 58%,#2a15088c 100%)}
.top{position:absolute;left:0;right:0;top:max(10px,env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:800;pointer-events:none;padding:0 12px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s;text-align:center;max-width:94vw;text-shadow:0 2px 0 #0008,0 0 10px #000a}
#bubble.bump{transform:scale(1.08)}
/* the weather seen through the hallway window */
#win{position:absolute;overflow:hidden;z-index:2;transition:opacity .6s}
#win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#win.badge{border:6px solid #c9a06a;border-radius:18px;box-shadow:0 0 0 3px #f6ead0,0 8px 16px #0007}
body.out #win{opacity:0}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.drop{position:absolute;top:-30px;width:5px;height:20px;border-radius:3px;background:#6fb7e8;box-shadow:0 0 0 1px #fff6;animation:fall linear infinite}
.flake{position:absolute;top:-20px;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #ffffff55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
.mini .drop{width:3px;height:12px}.mini .flake{width:7px;height:7px}
#kid{position:absolute;z-index:10}
#rock,#idle{position:absolute;inset:0}
#rock{transform-origin:50% 100%}
#rock.shiver{animation:shiver .3s steps(1) 3}
@keyframes shiver{0%{transform:translateX(-2%)}50%{transform:translateX(2%)}}
#rock.jump{animation:jump .5s steps(1)}
@keyframes jump{0%{transform:translateY(0)}20%{transform:translateY(-9%) scale(1.02,.98)}50%{transform:translateY(-13%)}80%{transform:translateY(-4%)}}
#rock.walk{animation:walk .6s steps(1) infinite}
@keyframes walk{0%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-1%)}}
#idle{transform-origin:50% 100%;animation:idle 1.8s steps(1) infinite}
@keyframes idle{0%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
#shadow{position:absolute;left:6%;right:6%;bottom:-2%;height:6%;background:radial-gradient(ellipse at center,#0009 0,#0000 70%);pointer-events:none}
#kidimg,.worn{position:absolute;display:block;pointer-events:none}
#kidimg{inset:0;width:100%;height:100%;filter:drop-shadow(0 5px 7px #0006)}
.worn{visibility:hidden;filter:drop-shadow(0 2px 3px #0005)}
.worn.on{visibility:visible}
.worn.hide{visibility:hidden!important}
.worn.pop{animation:wpop .4s steps(4)}
@keyframes wpop{0%{transform:scale(1.18)}60%{transform:scale(.96)}}
.fly{position:fixed;left:0;top:0;z-index:900;pointer-events:none;transform-origin:0 0;filter:drop-shadow(0 6px 6px #0007)}
/* the cardboard shelf the clothes sit on */
#rail{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:800;display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--it)*.12);padding:calc(var(--it)*.14) calc(var(--it)*.2);max-width:min(96vw,980px);background:url(../felt/cardboard-strip.webp) center/cover,#c9a06a;border:2px dashed #7a4a2a99;border-radius:calc(var(--it)*.4);box-shadow:0 4px 0 #8b6a43,0 8px 16px #0007;transition:opacity .5s,transform .6s}
body.out #rail{opacity:0;pointer-events:none;transform:translate(-50%,40px)}
.item{width:var(--it);height:var(--it);border:0;padding:calc(var(--it)*.06);margin:0;background:#fff5;border-radius:calc(var(--it)*.22);cursor:pointer;-webkit-appearance:none;appearance:none;transition:opacity .3s,transform .15s}
.item img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 3px 3px #0006)}
.item:focus-visible{outline:4px solid #3B8BD4;outline-offset:2px}
.item.no{animation:nope .4s steps(4)}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.item.hint{background:#ffd23fbb;box-shadow:0 0 0 4px #ffd23f,0 0 22px #ffd23f;animation:hint .7s steps(2) infinite}
@keyframes hint{50%{transform:translateY(-6px)}}
.item.used{opacity:.22;pointer-events:none;transform:scale(.82)}
@media (prefers-reduced-motion:reduce){#idle,#rock.shiver,#rock.jump,#rock.walk,.drop,.flake,.item.hint,.worn.pop{animation:none}.outbg,#room,#rail{transition:none}}
</style>
</head>

const ROUNDS={rain:["socks","trousers","jumper","raincoat","wellies","umbrella"],sun:["tshirt","shorts","sandals","sunhat","sunglasses"],snow:["trousers","jumper","coat","boots","hat","scarf","gloves"]};

/* picture sizes, and how each garment sits on the kid (in the kid's own pixels). a: where it hangs from */
const AR={socks:[253,194],trousers:[215,277],shorts:[226,174],tshirt:[289,215],jumper:[307,215],coat:[318,252],raincoat:[320,302],wellies:[274,166],boots:[286,205],sandals:[248,213],sunhat:[293,187],sunglasses:[273,109],hat:[237,251],scarf:[210,309],gloves:[291,177],"gloves-l":[140,176],"gloves-r":[141,177],umbrella:[286,293]};
const SP={
 socks:[{i:"socks",w:150,a:"feet",dy:0}],trousers:[{i:"trousers",w:168,a:"hip",dy:-8}],shorts:[{i:"shorts",w:158,a:"hip",dy:-8}],
 tshirt:[{i:"tshirt",w:218,a:"neck",dy:-6}],jumper:[{i:"jumper",w:262,a:"neck",dy:-8}],coat:[{i:"coat",w:272,a:"neck",dy:-10}],raincoat:[{i:"raincoat",w:272,a:"neck",dy:-4}],
 wellies:[{i:"wellies",w:178,a:"feet",dy:4}],boots:[{i:"boots",w:182,a:"feet",dy:4}],sandals:[{i:"sandals",w:142,a:"feet",dy:4}],

function box(k,p){
 const w=p.w,h=w*AR[p.i][1]/AR[p.i][0],dy=p.dy||0;let l=k.cx-w/2,t=0;
 if(p.a==="neck")t=k.neck+dy;else if(p.a==="hip")t=k.hip+dy;else if(p.a==="feet")t=k.feet+dy-h;
 else if(p.a==="brim")t=k.eye+dy-h;else if(p.a==="eye")t=k.eye+dy-h/2;
 else if(p.a==="hl"){l=k.hl[0]-w/2;t=k.hl[1]-h/2}else if(p.a==="hr"){l=k.hr[0]-w/2;t=k.hr[1]-h/2}

 return {left:l,top:t,w:w,h:h};
}

function layout(){
 const W_=innerWidth,H=innerHeight,wide=W_/H>=1.15;
 const s=Math.max(W_/1376,H/768),bw=1376*s,bh=768*s,bias=wide?.78:.5;

 place($("room"),bias);document.querySelectorAll(".outbg").forEach(e=>place(e,.5));
 const it=clampN(Math.min(W_*.095,H*.11),44,92);document.documentElement.style.setProperty("--it",it+"px");
 const topH=clampN(W_*.042,22,40)*1.5+14,railH=$("rail").offsetHeight+18,avail=Math.max(160,H-topH-railH-8),HEAD=95;
 S=Math.min(avail/(kid.h+HEAD),(W_*.6)/kid.w);
 const kw=kid.w*S,kh=kid.h*S,el=$("kid");
 el.style.left=(W_-kw)/2+"px";el.style.top=topH+(avail-(kid.h+HEAD)*S)/2+HEAD*S+"px";el.style.width=kw+"px";el.style.height=kh+"px";
 document.querySelectorAll(".worn").forEach(g=>{const p=SP[g.dataset.cl][+g.dataset.n],b=box(kid,p);g.style.left=b.left*S+"px";g.style.top=b.top*S+"px";g.style.width=b.w*S+"px";g.style.height=b.h*S+"px"});
 const win=$("win");
 if(wide){win.className="";win.style.left=(W_-bw)*bias+1048*s+"px";win.style.top=(H-bh)+146*s+"px";win.style.width=150*s+"px";win.style.height=312*s+"px"}

}

/* ---------- the kid ---------- */
function setKid(){

}

}
// 5 to 7 year olds get a few clothes that do not belong to the weather mixed in, and have to choose
function railItems(){
 const own=ROUNDS[weather];if(LP.age<2)return own;
 const decoy=[...new Set(Object.values(ROUNDS).flat())].filter(i=>!own.includes(i)).sort(()=>Math.random()-.5).slice(0,3);
 return [...own,...decoy].sort(()=>Math.random()-.5);
}
function buildRail(){
 $("rail").innerHTML=railItems().map(id=>`<button type="button" class="item" data-item="${id}" aria-label="${word(id)}">${icon(id)}</button>`).join("");
}
function setWindow(){
 const im=$("winimg");im.src="../felt/dress-"+weather+".webp";im.style.objectPosition=weather==="sun"?"68% 30%":weather==="rain"?"50% 30%":"50% 70%";
 weatherFx($("winfx"),weather,12,"mini");$("winfx").style.cssText="position:absolute;inset:0;overflow:hidden";
}
function startRound(){
 weather=ORDER[round%ORDER.length];worn=new Set();busy=false;out=false;streak=0;
 document.body.classList.remove("out");document.querySelectorAll(".outbg").forEach(e=>e.classList.remove("on"));
 $("fx").innerHTML="";$("rock").classList.remove("walk","jump");
 setKid();buildRail();setWindow();layout();
 bubble(L()[weather]);LP.say(L()[weather]);
}

/* ---------- putting clothes on ---------- */
function flyKeys(id,btn,mode){
 const img=btn.querySelector("img"),r=img.getBoundingClientRect(),kr=$("kid").getBoundingClientRect(),ar=AR[id][0]/AR[id][1];
 let fw=r.width,fh=r.width/ar;if(fh>r.height){fh=r.height;fw=r.height*ar}
 const sx=r.left+(r.width-fw)/2,sy=r.top+(r.height-fh)/2;
 const bs=SP[id].map(p=>box(kid,p)),x0=Math.min(...bs.map(b=>b.left)),y0=Math.min(...bs.map(b=>b.top)),x1=Math.max(...bs.map(b=>b.left+b.w));
 const tw=(x1-x0)*S,sc=clampN(tw/fw,.2,2.2);
 let tx=kr.left+x0*S,ty=kr.top+y0*S;
 if(mode==="try"){const cx=kr.left+kid.cx*S,cy=kr.top+(kid.neck+60)*S;tx=cx-fw*.25;ty=cy-fh*.25}
 const mx=(sx+tx)/2,my=Math.min(sy,ty)-70;
 return {fw,fh,sx,sy,tx,ty,mx,my,sc:mode==="try"?.5:sc,img};
}
function flyer(id,k){
 const f=document.createElement("img");f.className="fly";f.src=k.img.src;f.draggable=false;f.style.width=k.fw+"px";f.style.height=k.fh+"px";document.body.appendChild(f);return f;
}
function wear(id){
 if(busy||worn.has(id)||out)return;
 const btn=document.querySelector(`[data-item="${id}"]`);if(!btn)return;
 if(!ROUNDS[weather].includes(id)){tryOn(id,btn);return}
 worn.add(id);btn.classList.add("used");streak++;
 LP.sfx.whoosh();bubble(word(id));LP.say(word(id));LPLearn.heard(id,LP.lang);
 const k=flyKeys(id,btn,"wear"),f=flyer(id,k);
 const tf=(x,y,s)=>`translate(${x}px,${y}px) scale(${s})`;
 A(f,[{transform:tf(k.sx,k.sy,1)},{transform:tf(k.mx,k.my,(1+k.sc)/2*1.12)},{transform:tf(k.tx,k.ty,k.sc)}],{duration:560,easing:"steps(4)"}).finished.then(()=>{
  f.remove();
  document.querySelectorAll(`.worn[data-cl="${id}"]`).forEach(g=>{g.classList.add("on","pop")});tidy();
  LP.tone(180,.12,"sine",.22,0,90);LP.noise(.1,.12,"lowpass",900,1);
  const kr=$("kid").getBoundingClientRect();LP.burst(kr.left+kr.width/2,kr.top+kr.height*.45,6);
 });
 if(worn.size===ROUNDS[weather].length){busy=true;setTimeout(goOut,1500)}
}
// a piece that does not belong to this weather: it hops on, the kid shivers or sweats, it hops back
function tryOn(id,btn){
 btn.classList.remove("no");void btn.offsetWidth;btn.classList.add("no");
 streak=Math.max(0,streak-1);
 bubble(word(id));LP.say(word(id));LP.sfx.boing();
 const k=flyKeys(id,btn,"try"),f=flyer(id,k);
 const tf=(x,y,s)=>`translate(${x}px,${y}px) scale(${s})`;
 A(f,[{transform:tf(k.sx,k.sy,1)},{transform:tf(k.tx,k.ty,k.sc),offset:.45},{transform:tf(k.tx,k.ty,k.sc),offset:.7},{transform:tf(k.sx,k.sy,1)}],{duration:1100,easing:"steps(4)"}).finished.then(()=>f.remove());
 setTimeout(()=>{const r=$("rock");r.classList.remove("shiver");void r.offsetWidth;r.classList.add("shiver");LP.tone(300,.15,"triangle",.2,0,200)},520);
}
// a coat hides the jumper or T-shirt under it, so its sleeves do not poke out
function tidy(){const outer=worn.has("coat")||worn.has("raincoat");document.querySelectorAll('.worn[data-cl="jumper"],.worn[data-cl="tshirt"]').forEach(g=>g.classList.toggle("hide",outer))}
function nextItem(){const id=ROUNDS[weather].find(i=>!worn.has(i));if(id)wear(id)}

/* ---------- going outside ---------- */
function goOut(){
 out=true;busy=false;
 weatherFx($("fx"),weather,weather==="rain"?70:50);if(weather==="sun")$("fx").innerHTML="";
 $("o-"+weather).classList.add("on");document.body.classList.add("out");
 LP.sfx.chime();bubble(L().done);LP.say(L().done);
 const kr=$("kid").getBoundingClientRect();setTimeout(()=>LP.burst(kr.left+kr.width/2,kr.top+kr.height/3,24),500);
 $("rock").classList.add("walk");
 if(LP.sample(weather==="rain"?"rain":weather==="sun"?"birds":"wind",4.5)){}
 else if(weather==="rain"){for(let i=0;i<6;i++)LP.noise(1,.05,"lowpass",3000,1,i*.8)}
 else if(weather==="sun"){for(let i=0;i<5;i++){LP.tone(2400+Math.random()*800,.12,"sine",.05,i*.5,3200);LP.tone(2800,.08,"sine",.04,i*.5+.15,2200)}}
 else {LP.noise(4,.04,"bandpass",500,.6,0,300)}
 leaveAt=Date.now()+9000;clearInterval(leaveT);
 leaveT=setInterval(()=>{if(Date.now()>=leaveAt){clearInterval(leaveT);round++;startRound()}},400);
}
// outside, every tap or key makes the kid jump and the weather answer
function playOut(){
 const r=$("rock");r.classList.remove("jump");void r.offsetWidth;r.classList.add("jump");
 if(weather==="rain"){LP.noise(.25,.28,"bandpass",1800,1,0,600);LP.tone(500,.12,"sine",.08,0,250)}
 else if(weather==="sun"){LP.tone(2600+Math.random()*700,.1,"sine",.08,0,3500);LP.tone(3000,.08,"sine",.06,.12,2400)}
 else{LP.noise(.08,.35,"highpass",2500,1);LP.noise(.08,.35,"highpass",2000,1,.1)}
 leaveAt=Math.max(leaveAt,Date.now()+5000);
}

LP.init({langs:ALLLANGS,
 onLang:()=>{document.title=L().title;document.querySelectorAll("[data-item]").forEach(b=>b.setAttribute("aria-label",word(b.dataset.item)));bubble(out?L().done:L()[weather])}});
document.title=L().title;
weather=ORDER[0];setKid();buildRail();setWindow();layout();
bubble(L().title);
addEventListener("resize",layout);
LP.start(L().title,startRound);
LP.mash((e)=>{
 if(out){playOut();return}
 if(busy)return;
 const b=e.target.closest&&e.target.closest("[data-item]");
 if(b){wear(b.dataset.item);return}
 if(LP.age>=2){const n=ROUNDS[weather].find(i=>!worn.has(i)),nb=n&&document.querySelector(`[data-item="${n}"]`);if(nb){nb.classList.add("hint");setTimeout(()=>nb.classList.remove("hint"),1400)}return}
 nextItem(); // a tap anywhere else dresses the next layer
});
</script>
</body>
</html>
