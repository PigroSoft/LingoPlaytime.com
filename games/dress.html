<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get dressed</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:dark;--wall:#E6E1FA;--wall2:#D8D0F5;--floor:#C9B48F;--ink:#18264A;--paper:#FFFDF8;--sun:#F6C033;--tomato:#E5553B;--teal:#1E9A8F;--lilac:#7A68D9;--sky:#3B8BD4;
  --display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--wall)}
.room{position:fixed;inset:0;background:radial-gradient(circle,#ffffff14 2px,transparent 2.5px) 0 0/30px 30px,linear-gradient(#3a2a86,#241c63 80%,#4b37a3 80%,#2c2275);transition:opacity .8s}
.outside{position:fixed;inset:0;opacity:0;transition:opacity .8s;overflow:hidden}
body.out .room{opacity:0}body.out .outside{opacity:1}
.outside.rain{background:linear-gradient(#3b4b8f,#6c7fc2 70%,#2f8a63 70%,#22704f)}
.outside.sun{background:linear-gradient(#2f6fe8,#7fc8ff 70%,#4fc777 70%,#3fae6a)}
.outside.snow{background:linear-gradient(#5b6fc4,#a9b8ee 70%,#f4f6ff 70%,#d7dcf5)}
.drop{position:absolute;top:-20px;width:3px;height:18px;border-radius:2px;background:#e8f2ffcc;animation:fall linear infinite}
.flake{position:absolute;top:-20px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 4px #fff;animation:fall linear infinite}
.bigsun{position:absolute;right:10%;top:10%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fffbe6,#ffe066 50%,#ffb000);box-shadow:0 0 50px 20px #ffe06688,0 0 140px 60px #ffd23f33}
@keyframes fall{to{transform:translateY(110vh)}}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:center;gap:16px;min-height:60px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s}
#bubble.bump{transform:scale(1.08)}
.scene{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:4%;position:relative}
.window{position:absolute;right:4%;top:6%;width:min(26vw,190px);aspect-ratio:1;border:8px solid #fff2d8;border-radius:16px;box-shadow:0 10px 30px #0006;overflow:hidden;background:linear-gradient(#2f6fe8,#9fdcff)}
.window::after{content:"";position:absolute;inset:0;background:linear-gradient(#fff 0 0) 50% 0/6px 100% no-repeat,linear-gradient(#fff 0 0) 0 50%/100% 6px no-repeat}
.window .w{position:absolute;inset:0;overflow:hidden}
#kidwrap{height:100%;display:grid;place-items:end center;transition:transform 1.4s ease-in-out}
body.out #kidwrap{transform:translateX(-4%)}
.window{transition:opacity .6s}body.out .window{opacity:0}
svg#kid{height:100%;width:auto;max-width:100%;overflow:visible}
.cl{opacity:0;transform:translateY(-14px);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.cl.on{opacity:1;transform:none}
.rail{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px;margin-top:8px;background:#ffffff1a;border:2px solid #ffffff2a;border-radius:24px;transition:opacity .4s}
body.out .rail{opacity:0;pointer-events:none}
.item{width:clamp(64px,11vw,96px);aspect-ratio:1;border:2px solid #ffffff55;border-radius:20px;background:linear-gradient(160deg,#ffffff,#e6defc);box-shadow:0 8px 18px #0005;cursor:pointer;padding:6px;transition:transform .15s,opacity .3s}
.item svg{width:100%;height:100%}
.item:hover{transform:translateY(-3px)}
.item:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.item.used{opacity:.25;pointer-events:none;transform:scale(.85)}
@media (prefers-reduced-motion:reduce){.drop,.flake{animation:none}.cl,#kidwrap{transition:none}}
</style>
</head>
<body>
<script>window.LP_GAME="dress"</script><script src="voice.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="look.js"></script><script src="audio/sfx.dress.js"></script>
<div class="room"></div>
<div class="outside" id="outside"></div>
<div class="app" id="app">
  <div class="top"><div id="bubble" class="k-bubble" aria-live="polite"></div></div>
  <div class="scene">
    <div class="window" aria-hidden="true"><div class="w" id="win"></div></div>
    <div id="kidwrap"><svg id="kid" viewBox="0 -40 240 400" role="img" aria-label="A child getting dressed"></svg></div>
  </div>
  <div class="rail" id="rail"></div>
</div>
<script>
/* Every word and line this game can say. tools/phrases.js reads DATA to record them. */
const DATA={
 words:[
  {id:"socks",en:"socks",de:"die Socken",es:"los calcetines",fr:"les chaussettes",it:"i calzini",pt:"as meias"},
  {id:"trousers",en:"trousers",de:"die Hose",es:"los pantalones",fr:"le pantalon",it:"i pantaloni",pt:"as calças"},
  {id:"shorts",en:"shorts",de:"die kurze Hose",es:"los pantalones cortos",fr:"le short",it:"i pantaloncini",pt:"os calções"},
  {id:"tshirt",en:"T-shirt",de:"das T-Shirt",es:"la camiseta",fr:"le tee-shirt",it:"la maglietta",pt:"a t-shirt"},
  {id:"jumper",en:"jumper",de:"der Pullover",es:"el jersey",fr:"le pull",it:"il maglione",pt:"a camisola"},
  {id:"coat",en:"winter coat",de:"die Winterjacke",es:"el abrigo",fr:"le manteau",it:"il cappotto",pt:"o casaco"},
  {id:"raincoat",en:"raincoat",de:"die Regenjacke",es:"el chubasquero",fr:"l'imperméable",it:"l'impermeabile",pt:"o impermeável"},
  {id:"wellies",en:"wellies",de:"die Gummistiefel",es:"las botas de agua",fr:"les bottes de pluie",it:"gli stivali di gomma",pt:"as galochas"},
  {id:"boots",en:"boots",de:"die Stiefel",es:"las botas",fr:"les bottes",it:"gli stivali",pt:"as botas"},
  {id:"sandals",en:"sandals",de:"die Sandalen",es:"las sandalias",fr:"les sandales",it:"i sandali",pt:"as sandálias"},
  {id:"sunhat",en:"sun hat",de:"der Sonnenhut",es:"el sombrero",fr:"le chapeau",it:"il cappello",pt:"o chapéu"},
  {id:"sunglasses",en:"sunglasses",de:"die Sonnenbrille",es:"las gafas de sol",fr:"les lunettes de soleil",it:"gli occhiali da sole",pt:"os óculos de sol"},
  {id:"hat",en:"woolly hat",de:"die Mütze",es:"el gorro",fr:"le bonnet",it:"il berretto",pt:"o gorro"},
  {id:"scarf",en:"scarf",de:"der Schal",es:"la bufanda",fr:"l'écharpe",it:"la sciarpa",pt:"o cachecol"},
  {id:"gloves",en:"gloves",de:"die Handschuhe",es:"los guantes",fr:"les gants",it:"i guanti",pt:"as luvas"},
  {id:"umbrella",en:"umbrella",de:"der Regenschirm",es:"el paraguas",fr:"le parapluie",it:"l'ombrello",pt:"o guarda-chuva"}
 ],
 lines:{
  en:{title:"Get dressed",rain:"It's raining!",sun:"The sun is shining!",snow:"It's snowing!",done:"All dressed! Let's go!"},
  de:{title:"Anziehen!",rain:"Es regnet!",sun:"Die Sonne scheint!",snow:"Es schneit!",done:"Fertig! Los geht's!"},
  es:{title:"¡A vestirse!",rain:"¡Está lloviendo!",sun:"¡Hace sol!",snow:"¡Está nevando!",done:"¡Listo! ¡Vamos!"},
  fr:{title:"On s'habille !",rain:"Il pleut !",sun:"Il fait soleil !",snow:"Il neige !",done:"C'est prêt ! On y va !"},
  it:{title:"Vestiamoci!",rain:"Piove!",sun:"C'è il sole!",snow:"Nevica!",done:"Pronti! Andiamo!"},
  pt:{title:"Vamos vestir!",rain:"Está a chover!",sun:"Está sol!",snow:"Está a nevar!",done:"Pronto! Vamos!"}
 }
};
const ROUNDS={rain:["socks","trousers","jumper","raincoat","wellies","umbrella"],sun:["tshirt","shorts","sandals","sunhat","sunglasses"],snow:["trousers","jumper","coat","boots","hat","scarf","gloves"]};
const ORDER=["rain","sun","snow"];
/* clothes, drawn on the child in this layer order (later = on top). box = crop for the rail icon */
const CL={
 socks:{box:[78,310,84,40],svg:`<rect x="84" y="314" width="26" height="30" rx="8" fill="url(#k-violet)"/><rect x="130" y="314" width="26" height="30" rx="8" fill="url(#k-violet)"/><path d="M86 322h22M132 322h22" stroke="#fff" stroke-width="3"/>`},
 trousers:{box:[76,232,88,108],svg:`<path d="M80 236h80v20l-6 80h-22l-12-70-12 70H86l-6-80Z" fill="url(#k-blue)"/><path d="M120 246v14" stroke="#24508f" stroke-width="3"/>`},
 shorts:{box:[76,232,88,58],svg:`<path d="M80 236h80l4 48h-34l-10-28-10 28H76Z" fill="url(#k-teal)"/>`},
 tshirt:{box:[40,140,160,108],svg:`<path d="M68 166c0-16 20-26 52-26s52 10 52 26v82H68Z" fill="url(#k-red)"/><path d="M70 160l-26 22 14 18 16-12M170 160l26 22-14 18-16-12" fill="url(#k-red)"/><path d="M106 146c4 8 24 8 28 0" stroke="#c2412b" stroke-width="3" fill="none"/>`},
 jumper:{box:[24,140,192,116],svg:`<path d="M68 166c0-16 20-26 52-26s52 10 52 26v84H68Z" fill="url(#k-green)"/><path d="M74 168c-22 10-32 30-36 50M166 168c22 10 32 30 36 50" stroke="#4f9a3a" stroke-width="22" stroke-linecap="round" fill="none"/><path d="M68 242h104" stroke="#3f8a2d" stroke-width="8"/><path d="M92 190l10 10 10-10 10 10 10-10 10 10 10-10" stroke="#F6C033" stroke-width="4" fill="none"/>`},
 coat:{box:[20,136,200,128],svg:`<path d="M64 166c0-18 22-30 56-30s56 12 56 30v94H64Z" fill="url(#k-dark)"/><path d="M70 168c-24 10-34 32-38 52M170 168c24 10 34 32 38 52" stroke="#27406e" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M120 146v114" stroke="#F6C033" stroke-width="4"/><circle cx="104" cy="190" r="4" fill="url(#k-yellow)"/><circle cx="104" cy="220" r="4" fill="url(#k-yellow)"/><path d="M64 254h112" stroke="#d6e2f2" stroke-width="8"/>`},
 raincoat:{box:[20,92,200,192],svg:`<path d="M60 166c0-18 24-30 60-30s60 12 60 30l6 112H54Z" fill="url(#k-yellow)"/><path d="M70 168c-24 10-34 32-38 52M170 168c24 10 34 32 38 52" stroke="#F6C033" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M72 120c0-30 22-44 48-44s48 14 48 44c-8-6-14-8-14-8-6-14-20-20-34-20s-28 6-34 20c0 0-6 2-14 8Z" fill="url(#k-yellow)"/><path d="M120 146v130" stroke="#d99a13" stroke-width="3"/><circle cx="110" cy="196" r="4" fill="#d99a13"/><circle cx="110" cy="230" r="4" fill="#d99a13"/>`},
 wellies:{box:[78,290,90,62],svg:`<path d="M82 296h30v40h6v14H80v-14h2Z" fill="url(#k-red)"/><path d="M128 296h30v40h6v14h-38v-14h2Z" fill="url(#k-red)"/><path d="M82 302h30M128 302h30" stroke="#fff6" stroke-width="4"/>`},
 boots:{box:[78,296,90,56],svg:`<path d="M82 302h30v34h6v14H80v-14h2Z" fill="url(#k-brown)"/><path d="M128 302h30v34h6v14h-38v-14h2Z" fill="url(#k-brown)"/><path d="M80 304h34M126 304h34" stroke="#f1e6d6" stroke-width="7"/>`},
 sandals:{box:[70,330,100,24],svg:`<path d="M76 346h40M124 346h40" stroke="#8A5A33" stroke-width="6" stroke-linecap="round"/><path d="M86 334l8 12M100 334l-6 12M134 334l8 12M148 334l-6 12" stroke="#8A5A33" stroke-width="4" stroke-linecap="round"/>`},
 sunhat:{box:[40,8,160,64],svg:`<ellipse cx="120" cy="52" rx="78" ry="16" fill="url(#k-gold)"/><path d="M78 52c0-30 18-44 42-44s42 14 42 44Z" fill="url(#k-gold)"/><path d="M80 44h80" stroke="#E5553B" stroke-width="7"/>`},
 sunglasses:{box:[78,68,84,30],svg:`<rect x="82" y="72" width="34" height="22" rx="9" fill="#1a1440"/><rect x="124" y="72" width="34" height="22" rx="9" fill="#18264A"/><path d="M116 80h8" stroke="#18264A" stroke-width="4"/><path d="M88 78l8 0" stroke="#fff6" stroke-width="3"/>`},
 hat:{box:[60,-34,120,96],svg:`<path d="M64 62c0-40 24-60 56-60s56 20 56 60Z" fill="url(#k-red)"/><path d="M62 56h116v14H62Z" fill="#c2412b"/><circle cx="120" cy="-6" r="16" fill="#fff"/><path d="M84 30h72M78 44h84" stroke="#fff5" stroke-width="5"/>`},
 scarf:{box:[70,128,100,90],svg:`<path d="M80 134c10 10 70 10 80 0l2 18c-14 10-70 10-84 0Z" fill="url(#k-violet)"/><path d="M140 146l8 60h-20l-2-56Z" fill="url(#k-violet)"/><path d="M128 200h20M128 192h20" stroke="#F6C033" stroke-width="3"/>`},
 gloves:{box:[14,208,212,44],svg:`<circle cx="34" cy="230" r="17" fill="url(#k-red)"/><circle cx="206" cy="230" r="17" fill="url(#k-red)"/><circle cx="20" cy="222" r="7" fill="url(#k-red)"/><circle cx="220" cy="222" r="7" fill="url(#k-red)"/>`},
 umbrella:{box:[150,70,90,170],svg:`<path d="M206 230V104" stroke="#18264A" stroke-width="5"/><path d="M206 236c0 8-10 8-10 0" stroke="#18264A" stroke-width="5" fill="none"/><path d="M152 106c0-30 24-46 54-46s54 16 54 46c-9-8-18-8-27 0-9-8-18-8-27 0-9-8-18-8-27 0-9-8-18-8-27 0Z" fill="url(#k-blue)"/><path d="M206 60v-8" stroke="#18264A" stroke-width="4"/>`}
};
const LAYERS=["socks","trousers","shorts","tshirt","jumper","coat","raincoat","wellies","boots","sandals","scarf","gloves","sunglasses","sunhat","hat","umbrella"];
const BASE=`<ellipse cx="120" cy="352" rx="80" ry="9" fill="#000" opacity=".28"/><g id="body">
 <ellipse cx="96" cy="342" rx="20" ry="10" class="skin"/><ellipse cx="144" cy="342" rx="20" ry="10" class="skin"/>
 <rect x="86" y="246" width="22" height="96" rx="10" class="skin"/><rect x="132" y="246" width="22" height="96" rx="10" class="skin"/>
 <path d="M72 168c-22 10-32 30-36 52M168 168c22 10 32 30 36 52" class="skinS" stroke-width="16" stroke-linecap="round" fill="none"/>
 <circle cx="34" cy="230" r="13" class="skin"/><circle cx="206" cy="230" r="13" class="skin"/>
 <path d="M70 172c0-18 18-28 50-28s50 10 50 28v80H70Z" fill="url(#k-white)"/><path d="M82 236h76v20H82Z" fill="url(#k-white)"/>
 <rect x="108" y="128" width="24" height="22" class="skin"/>
 <circle cx="66" cy="86" r="14" class="skin"/><circle cx="174" cy="86" r="14" class="skin"/>
 <circle cx="120" cy="84" r="54" class="skin"/><ellipse cx="96" cy="58" rx="16" ry="9" fill="#fff" opacity=".22" transform="rotate(-28 96 58)"/>
 <path class="hairc" d="M64 78c-4-40 30-60 60-58 36 2 60 26 54 60-12-14-26-22-40-22-6 10-22 16-34 14 4-6 4-10 2-14-16 4-28 10-42 20Z"/>
 <ellipse cx="100" cy="82" rx="7" ry="9" fill="#1a1440"/><ellipse cx="140" cy="82" rx="7" ry="9" fill="#1a1440"/><circle cx="102" cy="78" r="2.8" fill="#fff"/><circle cx="142" cy="78" r="2.8" fill="#fff"/>
 <circle cx="88" cy="104" r="8" fill="#E5553B33"/><circle cx="152" cy="104" r="8" fill="#E5553B33"/>
 <path d="M104 114c8 12 24 12 32 0" stroke="#18264A" stroke-width="4" fill="url(#k-red)" stroke-linecap="round"/>
</g>`;
const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const word=id=>W[id][LP.lang]||W[id].en;
let round=0,weather="rain",worn=new Set(),busy=false;

const SKIN=["#F5D0B0","#E2AE84","#C68A5E","#8D5A3B","#5E3A26"],HAIR=["#2B1D14","#5A3A22","#B5651D","#E8C15A","#1A1A1A"];
function drawKid(){
 $("kid").innerHTML=BASE+LAYERS.map(id=>`<g class="cl" data-cl="${id}">${CL[id].svg}</g>`).join("");
 const s=SKIN[Math.floor(Math.random()*SKIN.length)];
 document.querySelectorAll(".skin").forEach(e=>e.setAttribute("fill",s));document.querySelectorAll(".skinS").forEach(e=>e.setAttribute("stroke",s));
 document.querySelector(".hairc").setAttribute("fill",HAIR[Math.floor(Math.random()*HAIR.length)]);
}
function icon(id){const b=CL[id].box,p=8;return `<svg viewBox="${b[0]-p} ${b[1]-p} ${b[2]+p*2} ${b[3]+p*2}" aria-hidden="true">${CL[id].svg}</svg>`}
function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}

function weatherFx(el,kind,n){
 el.innerHTML="";
 if(kind==="sun"){el.innerHTML=`<div class="bigsun" style="${n<20?"width:46%;height:46%;right:12%;top:12%":""}"></div>`;return}
 for(let i=0;i<n;i++){const d=document.createElement("div");d.className=kind==="rain"?"drop":"flake";d.style.left=Math.random()*100+"%";d.style.animationDuration=(kind==="rain"?.6+Math.random()*.5:3+Math.random()*3)+"s";d.style.animationDelay=-Math.random()*4+"s";el.appendChild(d)}
}
function startRound(){
 weather=ORDER[round%ORDER.length];worn=new Set();busy=false;
 document.body.classList.remove("out");
 document.querySelectorAll(".cl").forEach(g=>g.classList.remove("on"));
 weatherFx($("win"),weather,14);
 $("outside").className="outside "+weather;
 $("rail").innerHTML=ROUNDS[weather].map(id=>`<button type="button" class="item" data-item="${id}" aria-label="${word(id)}" data-tap>${icon(id)}</button>`).join("");
 bubble(L()[weather]);LP.say(L()[weather]);
}
function wear(id){
 if(busy||worn.has(id)||!ROUNDS[weather].includes(id))return;
 worn.add(id);
 document.querySelector(`[data-cl="${id}"]`).classList.add("on");
 const b=document.querySelector(`[data-item="${id}"]`);if(b){b.classList.add("used");const r=b.getBoundingClientRect();LP.burst(r.left+r.width/2,r.top,6)}
 LP.sfx.whoosh();bubble(word(id));LP.say(word(id));
 if(worn.size===ROUNDS[weather].length){busy=true;setTimeout(goOut,1500)}
}
function goOut(){
 weatherFx($("outside"),weather,weather==="rain"?70:50);
 document.body.classList.add("out");
 LP.sfx.chime();bubble(L().done);LP.say(L().done);
 const r=$("kid").getBoundingClientRect();setTimeout(()=>LP.burst(r.left+r.width/2,r.top+r.height/3,24),500);
 if(LP.sample(weather==="rain"?"rain":weather==="sun"?"birds":"wind",4.5)){}
 else if(weather==="rain"){for(let i=0;i<6;i++)LP.noise(1,.05,"lowpass",3000,1,i*.8)}
 else if(weather==="sun"){for(let i=0;i<5;i++){LP.tone(2400+Math.random()*800,.12,"sine",.05,i*.5,3200);LP.tone(2800,.08,"sine",.04,i*.5+.15,2200)}}
 else {LP.noise(4,.04,"bandpass",500,.6,0,300)}
 setTimeout(()=>{round++;startRound()},6000);
}
function nextItem(){const id=ROUNDS[weather].find(i=>!worn.has(i));if(id)wear(id)}

LP.init({langs:["en","de","es","fr","it","pt"],
 onLang:()=>{document.title=L().title;document.querySelectorAll("[data-item]").forEach(b=>b.setAttribute("aria-label",word(b.dataset.item)));bubble(L()[weather])}});
document.title=L().title;
drawKid();
weather=ORDER[0];weatherFx($("win"),weather,14);
$("rail").innerHTML=ROUNDS[weather].map(id=>`<button type="button" class="item" data-item="${id}" aria-label="${word(id)}" data-tap>${icon(id)}</button>`).join("");
bubble(L().title);
LP.start(L().title,startRound);
LP.mash((e)=>{
 if(busy)return;
 const b=e.target.closest&&e.target.closest("[data-item]");
 if(b){wear(b.dataset.item);return}
 nextItem(); // a tap anywhere else dresses the next layer
});
</script>
</body>
</html>
