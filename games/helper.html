<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Helper truck</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:light;--ink:#18264A;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#3a8bf0;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;min-height:60px;position:relative;z-index:2}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;transition:transform .15s;text-align:center}
#bubble.bump{transform:scale(1.08)}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end;position:relative;z-index:1}
svg#scene{width:100%;height:100%}
.veh,.truck{transition:transform .95s cubic-bezier(.4,.1,.3,1)}
.veh .art,.truck .art{transform-box:fill-box;transform-origin:center bottom}
.veh.hop .art{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
.veh.no .art{animation:nope .4s}
.veh.glow .hit{stroke:#F6C033;stroke-width:6;fill:#F6C03333}
.veh .hit{fill:#0000;cursor:pointer}
.truck.jig .art{animation:jig .18s 4}
.veh.jig .art{animation:jig .18s 4}
.alert{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hop{40%{transform:translateY(-26px) scale(1.06)}}
@keyframes nope{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes jig{50%{transform:translateX(5px)}}
@keyframes pulse{50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.veh,.truck{transition:none}.alert,.veh .art,.truck .art{animation:none!important}}
</style>
</head>
<body>
<script>window.LP_GAME="helper"</script><script src="voice.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="look.js"></script><script src="sounds.js"></script>
<div class="app" id="app">
  <div class="top"><div id="bubble" class="k-bubble" aria-live="polite"></div></div>
  <div class="stage">
    <svg id="scene" viewBox="0 0 900 560" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A small truck helping other vehicles on the road">
      <g><rect x="0" y="250" width="900" height="130" fill="url(#k-green)" opacity=".0"/>
        <path d="M0 330c120-60 260-70 380-30s300 30 520-20V420H0Z" fill="#4fc777"/><path d="M0 380c200-40 480-40 900 0V430H0Z" fill="#68dc87"/></g>
      <g><rect x="120" y="240" width="14" height="90" rx="5" fill="url(#k-brown)"/><circle cx="127" cy="226" r="46" fill="url(#k-green)"/><circle cx="104" cy="248" r="28" fill="#33a24f"/><circle cx="152" cy="250" r="26" fill="#33a24f"/></g>
      <g><rect x="780" y="270" width="12" height="70" rx="5" fill="url(#k-brown)"/><circle cx="786" cy="256" r="36" fill="url(#k-green)"/></g>
      <rect y="400" width="900" height="160" fill="#3a3263"/>
      <path d="M0 400h900" stroke="#c9c2e8" stroke-width="10"/>
      <path d="M0 480h900" stroke="#fff" stroke-width="5" stroke-dasharray="40 30"/>
      <g id="vehs"></g>
      <g class="truck" id="truck" style="transform:translate(20px,0)"><g transform="translate(0 413) scale(.8)"><g class="art">
        <rect x="6" y="52" width="102" height="44" rx="7" fill="url(#k-orange)"/><rect x="14" y="60" width="86" height="8" rx="3" fill="#ffffff55"/>
        <path d="M108 96V58c0-6 4-10 10-10h34c6 0 10 3 13 8l12 18c2 3 3 6 3 10v12Z" fill="url(#k-orange)"/>
        <path d="M124 56h26l12 20h-38Z" fill="#bfe6fb"/>
        <circle cx="30" cy="100" r="15" fill="#18264A"/><circle cx="30" cy="100" r="6" fill="#ddd"/><circle cx="142" cy="100" r="15" fill="#18264A"/><circle cx="142" cy="100" r="6" fill="#ddd"/>
        <circle cx="178" cy="84" r="5" fill="#fff6a8"/><rect x="154" y="88" width="14" height="4" rx="2" fill="#18264A"/>
        <path d="M70 52V40h28v12" fill="none" stroke="#18264A" stroke-width="4"/><circle cx="84" cy="36" r="6" fill="url(#k-yellow)"/>
      </g></g></g>
      <path id="rope" d="" stroke="#18264A" stroke-width="6" stroke-linecap="round" fill="none" opacity="0"/>
    </svg>
  </div>
</div>
<script>
/* Every word and line this game can say. tools/phrases.js reads DATA to record them. */
const DATA={
 words:[
  {id:"bus",en:{w:"the bus",s:"Brum brum!"},de:{w:"der Bus",s:"Brumm brumm!"},es:{w:"el autobús",s:"¡Brum brum!"},fr:{w:"le bus",s:"Vroum vroum !"},it:{w:"l'autobus",s:"Brum brum!"},pt:{w:"o autocarro",s:"Vrum vrum!"}},
  {id:"car",en:{w:"the car",s:"Beep beep!"},de:{w:"das Auto",s:"Tut tut!"},es:{w:"el coche",s:"¡Pi pi!"},fr:{w:"la voiture",s:"Pouet pouet !"},it:{w:"la macchina",s:"Bip bip!"},pt:{w:"o carro",s:"Pi pi!"}},
  {id:"bike",en:{w:"the bike",s:"Ring ring!"},de:{w:"das Fahrrad",s:"Kling kling!"},es:{w:"la bicicleta",s:"¡Ring ring!"},fr:{w:"le vélo",s:"Dring dring !"},it:{w:"la bicicletta",s:"Drin drin!"},pt:{w:"a bicicleta",s:"Trim trim!"}},
  {id:"fire",en:{w:"the fire engine",s:"Nee naw!"},de:{w:"das Feuerwehrauto",s:"Tatütata!"},es:{w:"el camión de bomberos",s:"¡Nino nino!"},fr:{w:"le camion de pompiers",s:"Pin pon !"},it:{w:"il camion dei pompieri",s:"Nino nino!"},pt:{w:"o carro dos bombeiros",s:"Ninó ninó!"}},
  {id:"police",en:{w:"the police car",s:"Nee naw!"},de:{w:"das Polizeiauto",s:"Tatütata!"},es:{w:"el coche de policía",s:"¡Nino nino!"},fr:{w:"la voiture de police",s:"Pin pon !"},it:{w:"la macchina della polizia",s:"Nino nino!"},pt:{w:"o carro da polícia",s:"Ninó ninó!"}},
  {id:"tram",en:{w:"the tram",s:"Ding ding!"},de:{w:"die Straßenbahn",s:"Bimm bimm!"},es:{w:"el tranvía",s:"¡Din don!"},fr:{w:"le tramway",s:"Ding ding !"},it:{w:"il tram",s:"Din don!"},pt:{w:"o elétrico",s:"Tlim tlim!"}}
 ],
 lines:{
  en:{title:"Helper truck",need:"{w} needs help!",coming:"Beep beep! Here I come!",thanks:"Thank you!",where:"Where is {w}?"},
  de:{title:"Der Helfer-Laster",need:"{w} braucht Hilfe!",coming:"Tut tut! Ich komme!",thanks:"Danke schön!",where:"Wo ist {w}?"},
  es:{title:"El camión ayudante",need:"¡{w} necesita ayuda!",coming:"¡Pi pi! ¡Ya voy!",thanks:"¡Gracias!",where:"¿Dónde está {w}?"},
  fr:{title:"Le petit camion",need:"{w} a besoin d'aide !",coming:"Tut tut ! J'arrive !",thanks:"Merci !",where:"Où est {w} ?"},
  it:{title:"Il camioncino",need:"{w} ha bisogno di aiuto!",coming:"Beep beep! Arrivo!",thanks:"Grazie!",where:"Dov'è {w}?"},
  pt:{title:"O camião ajudante",need:"{w} precisa de ajuda!",coming:"Pi pi! Já vou!",thanks:"Obrigado!",where:"Onde está {w}?"}
 }
};
const T=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const w=id=>{const x=T[id][LP.lang]||T[id].en;return x.w||x};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fill=(tpl,id)=>cap(tpl.replace("{w}",w(id)));
const NS="http://www.w3.org/2000/svg";

/* the vehicles in need, drawn in a 200 x 110 box with the wheels on y 100 */
const wheel=x=>`<circle cx="${x}" cy="98" r="13" fill="#18264A"/><circle cx="${x}" cy="98" r="5" fill="#ddd"/>`;
const ART={
 bus:`<rect x="6" y="22" width="188" height="68" rx="14" fill="url(#k-yellow)"/><g fill="#bfe6fb"><rect x="18" y="32" width="34" height="26" rx="4"/><rect x="58" y="32" width="34" height="26" rx="4"/><rect x="98" y="32" width="34" height="26" rx="4"/><rect x="140" y="32" width="46" height="34" rx="5"/></g><rect x="6" y="72" width="188" height="8" fill="#e3ab1f"/>${wheel(44)}${wheel(152)}`,
 car:`<path d="M10 92V66c0-6 4-10 10-12l30-8 18-18h50l22 20 38 8c6 2 10 6 10 12v24Z" fill="url(#k-violet)"/><path d="M62 48l12-14h42l16 16Z" fill="#bfe6fb"/>${wheel(54)}${wheel(150)}<circle cx="190" cy="74" r="5" fill="#fff6a8"/>`,
 bike:`<circle cx="46" cy="76" r="26" fill="none" stroke="#18264A" stroke-width="6"/><circle cx="154" cy="76" r="26" fill="none" stroke="#18264A" stroke-width="6"/><path d="M46 76l36-34h46l26 34M82 42l-10-14h-14M128 42l-6-16h18M82 42l24 34h-60" fill="none" stroke="url(#k-green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`,
 fire:`<rect x="8" y="30" width="112" height="62" rx="8" fill="url(#k-red)"/><path d="M120 92V50c0-8 5-14 12-14h30c6 0 10 3 13 8l14 22c2 3 3 6 3 10v16Z" fill="url(#k-red)"/><path d="M140 46h22l14 22h-36Z" fill="#bfe6fb"/><rect x="16" y="22" width="96" height="8" rx="3" fill="#c9cdd6"/><path d="M20 22l80-14" stroke="#c9cdd6" stroke-width="5"/>${wheel(44)}${wheel(158)}`,
 police:`<path d="M10 92V66c0-6 4-10 10-12l30-8 18-18h50l22 20 38 8c6 2 10 6 10 12v24Z" fill="url(#k-white)"/><rect x="10" y="68" width="180" height="10" fill="#1E9A8F"/><path d="M62 48l12-14h42l16 16Z" fill="#bfe6fb"/><rect x="82" y="22" width="30" height="12" rx="4" fill="url(#k-blue)"/>${wheel(54)}${wheel(150)}`,
 tram:`<path d="M8 92V40c0-8 6-14 14-14h156c8 0 14 6 14 14v52Z" fill="url(#k-green)"/><g fill="#bfe6fb"><rect x="20" y="36" width="34" height="28" rx="4"/><rect x="62" y="36" width="34" height="28" rx="4"/><rect x="104" y="36" width="34" height="28" rx="4"/><rect x="146" y="36" width="40" height="28" rx="4"/></g><rect x="8" y="72" width="184" height="6" fill="#ffffff66"/><path d="M80 26l24-18h34" stroke="#18264A" stroke-width="4" fill="none"/>${wheel(44)}${wheel(156)}`
};
const SLOTS=[250,455,660],SC=.8;
let set=[],want=null,misses=0,busy=false,last=[];

function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function mk(id,i){
 const g=document.createElementNS(NS,"g");g.setAttribute("class","veh");g.dataset.veh=id;g.setAttribute("role","button");g.setAttribute("tabindex","0");g.setAttribute("aria-label",w(id));
 g.innerHTML=`<g transform="translate(0 ${505-110*SC}) scale(${SC})"><g class="art">${ART[id]}<rect class="hit" x="0" y="0" width="200" height="112" rx="14"/></g></g><g class="alert" transform="translate(${SC*100} ${505-110*SC-26})"><circle r="17" fill="#fff"/><text y="8" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="24" fill="#E5553B">!</text></g>`;
 g.style.transform=`translate(${-260-i*60}px,0)`;$("vehs").appendChild(g);
 return {id,el:g,slot:i,done:false};
}
function spawn(){
 $("vehs").innerHTML="";
 const ids=Object.keys(T).sort(()=>Math.random()-.5);
 const pick=ids.filter(i=>!last.includes(i)).slice(0,3);last=pick;
 set=pick.map(mk);
 requestAnimationFrame(()=>requestAnimationFrame(()=>set.forEach(v=>v.el.style.transform=`translate(${SLOTS[v.slot]}px,0)`)));
 LP.sfx.whoosh();
 setTimeout(()=>{busy=false;if(LP.age>=2)ask();else{const n=set.find(v=>!v.done);if(n){const t=fill(L().need,n.id);bubble(t);LP.say(t)}}},1200);
}
function ask(){const open=set.filter(v=>!v.done);if(!open.length)return;want=LP.next("helper-ask",open.map(v=>v.id));misses=0;const t=fill(L().where,want);bubble(t);LP.say(t)}
function horn(){LP.tone(392,.16,"square",.09);LP.tone(523,.2,"square",.09,.2)}
function help(id){
 const v=set.find(x=>x.id===id);if(!v||v.done||busy)return;busy=true;want=null;
 document.querySelectorAll(".glow").forEach(x=>x.classList.remove("glow"));
 const tr=$("truck"),tx=SLOTS[v.slot]-190;
 tr.style.transform=`translate(${tx}px,0)`;horn();LP.say(L().coming);bubble(cap(L().coming));
 setTimeout(()=>{ // hitch up and pull
  const rope=$("rope");rope.setAttribute("d",`M${tx+150} 478 Q${(tx+150+SLOTS[v.slot])/2} 498 ${SLOTS[v.slot]+8} 478`);rope.setAttribute("opacity","1");
  tr.classList.add("jig");v.el.classList.add("jig");LP.noise(.5,.12,"lowpass",500,1,0,200);
 },1000);
 setTimeout(()=>{
  rope_off();tr.classList.remove("jig");v.el.classList.remove("jig");
  v.el.classList.add("hop");v.el.querySelector(".alert").remove();
  LP.sfx.chime();const r=v.el.getBoundingClientRect();LP.burst(r.left+r.width/2,r.top,16);
  if(!LP.sample(id,2.4)){LP.tone(440,.2,"triangle",.1);LP.tone(660,.3,"triangle",.1,.2)}
  bubble(cap(w(id))+"  "+T[id][LP.lang].s);
  setTimeout(()=>{LP.say(w(id));LP.say(T[id][LP.lang].s,true);LP.say(L().thanks,true)},900);
 },1750);
 setTimeout(()=>{ // off they go, and the truck rolls home
  v.el.style.transform=`translate(1100px,0)`;tr.style.transform=`translate(20px,0)`;v.done=true;
 },3300);
 setTimeout(()=>{
  busy=false;
  if(set.every(x=>x.done)){busy=true;setTimeout(spawn,400)}
  else if(LP.age>=2)ask();
 },4300);
}
function rope_off(){$("rope").setAttribute("opacity","0")}
function wrong(v){
 v.el.classList.remove("no");void v.el.getBoundingClientRect();v.el.classList.add("no");
 bubble(cap(w(v.id))+"  "+T[v.id][LP.lang].s);LP.say(w(v.id));LP.say(T[v.id][LP.lang].s,true);
 misses++;if(misses>=2){const t=set.find(x=>x.id===want);if(t)t.el.classList.add("glow")}
 setTimeout(()=>{if(want){const t=fill(L().where,want);bubble(t);LP.say(t,true)}},2300);
}

LP.init({langs:["en","de","es","fr","it","pt"],onLang:()=>{document.title=L().title;set.forEach(v=>v.el.setAttribute("aria-label",w(v.id)));bubble(want?fill(L().where,want):L().title)},onAge:()=>{want=null;if(!busy&&set.length&&LP.age>=2)ask()}});
LPLook.sky($("app"),{mode:"day",hills:false});
document.title=L().title;bubble(L().title);
LP.start(L().title,()=>{spawn()});
LP.mash((e)=>{
 if(busy||!set.length)return;
 const g=e.target.closest&&e.target.closest("[data-veh]");
 const open=set.filter(v=>!v.done);if(!open.length)return;
 if(LP.age>=2){ // big kids: help the one that was asked for
  if(!want){ask();return}
  if(g){const v=set.find(x=>x.id===g.dataset.veh);if(v&&!v.done){v.id===want?help(want):wrong(v)}}
  else{misses++;if(misses>=2){const t=set.find(x=>x.id===want);if(t)t.el.classList.add("glow")}const t=fill(L().where,want);bubble(t);LP.say(t)}
  return;
 }
 // little ones: a tap on a waiting vehicle helps it, any other tap or key helps the next one
 const v=g&&open.find(x=>x.id===g.dataset.veh);
 help(v?v.id:open[0].id);
});
</script>
</body>
</html>
