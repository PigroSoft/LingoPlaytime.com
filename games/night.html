<style>
:root{color-scheme:dark;--ink:#F1F5FC;--paper:#26315a;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#1c2547;color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:center;min-height:60px;position:relative;z-index:3}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;text-align:center;transition:transform .2s,opacity 1.2s}
#bubble.bump{transform:scale(1.06)}
.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
svg#room{width:100%;height:100%}
.item{cursor:pointer}
.item .hit{fill:#0000}
.item:focus{outline:none}.item:focus-visible .hit{stroke:#F6C033;stroke-width:4;fill:#F6C03322}
.item .shape{transition:filter 1.2s}
.item.asleep .shape{filter:brightness(.55) saturate(.55)}
.eyes-open,.eyes-shut{transition:opacity .4s}
.eyes-shut{opacity:0}.asleep .eyes-shut{opacity:1}.asleep .eyes-open{opacity:0}
.glow{transition:opacity 1.2s}
.lamp.asleep .glow{opacity:0}
#dark{fill:#07051c;opacity:0;transition:opacity 1.6s;pointer-events:none}
.z{font-family:var(--display);font-weight:700;fill:#c9d3ff;animation:zz 2.4s ease-out forwards;pointer-events:none}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(24px,-70px) scale(1.4)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
#again{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;z-index:4;font:inherit;font-size:14px;font-weight:700;color:#c9d3ff;background:#ffffff14;border:0;border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;opacity:0;transition:opacity 1s;pointer-events:none}
body.done #again{opacity:.7;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.z,.tw{animation:none}}
</style>
</head>

const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const w=id=>W[id][LP.lang]||W[id].en;
let asleep=new Set(),done=false,lastTap=0;

function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function label(){document.querySelectorAll("[data-item]").forEach(g=>g.setAttribute("aria-label",w(g.dataset.item).w));$("again").textContent=L().again}

function zzz(g){const b=g.querySelector(".hit").getBBox();const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",b.x+b.width*.7);t.setAttribute("y",b.y+10);t.setAttribute("font-size","34");t.setAttribute("class","z");t.textContent="z";$("zs").appendChild(t);setTimeout(()=>t.remove(),2500)}

function sleep(id){
 if(done||asleep.has(id))return;
 const now=Date.now();if(now-lastTap<700)return;lastTap=now; // one goodnight at a time, even when mashing
 asleep.add(id);
 const g=document.querySelector(`[data-item="${id}"]`);g.classList.add("asleep");zzz(g);
 LP.tone(523,.6,"sine",.08);LP.tone(392,.8,"sine",.06,.25);
 bubble(w(id).g);LP.say(w(id).g);
 $("dark").style.opacity=(asleep.size/DATA.words.length*.35).toFixed(2);
 if(asleep.size===DATA.words.length)setTimeout(finish,2200);
}
function finish(){
 done=true;$("dark").style.opacity=".62";
 lullaby();bubble(L().end);setTimeout(()=>LP.say(L().end),400);
 setTimeout(()=>{$("bubble").style.opacity=".35";document.body.classList.add("done")},5000);
}
// a short original music-box tune
function lullaby(){const n=[659,587,523,587,659,659,659,0,587,587,587,0,659,784,784,0,659,587,523,587,659,659,659,659,587,587,659,587,523];let t=.6;n.forEach(f=>{if(f)LP.tone(f,1.1,"sine",.06,t),LP.tone(f*2,.6,"sine",.015,t);t+=.42})}
function reset(){asleep.clear();done=false;document.querySelectorAll(".asleep").forEach(g=>g.classList.remove("asleep"));$("dark").style.opacity="0";$("bubble").style.opacity="1";document.body.classList.remove("done");bubble(L().title);LP.say(L().title)}

LP.init({langs:ALLLANGS,onLang:()=>{label();document.title=L().title;if(!done)bubble(L().title)}});
label();document.title=L().title;bubble(L().title);
LP.start(L().title,()=>LP.say(L().title));
$("again").addEventListener("click",reset);
LP.mash((e)=>{
 if(e.target.closest&&e.target.closest("#again"))return;
 if(done){LP.sfx.twinkle();return} // after bedtime, taps only twinkle
 const g=e.target.closest&&e.target.closest("[data-item]");
 const id=g&&!asleep.has(g.dataset.item)?g.dataset.item:DATA.words.map(x=>x.id).find(i=>!asleep.has(i));
 if(id)sleep(id);
});
</script>
