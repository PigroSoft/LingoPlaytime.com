<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goodnight room</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:dark;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#0c1a3d;color:#F1F5FC;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;max-width:none;display:block;pointer-events:none}
#dark{position:absolute;inset:0;background:#050a24;opacity:0;transition:opacity 1.6s;pointer-events:none;z-index:1}
#shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(#0000,#0a143a99);pointer-events:none;z-index:1;display:none}
body.tall #shade{display:block}
.top{position:absolute;left:0;right:0;top:max(10px,env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:800;pointer-events:none;padding:0 12px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;text-align:center;max-width:94vw;transition:transform .15s,opacity 1.2s;text-shadow:0 2px 0 #000a,0 0 12px #000c}
#bubble.bump{transform:scale(1.08)}
.it{position:absolute;z-index:5;transform:translate(-50%,-100%);border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;display:block}
.it::after{content:"";position:absolute;inset:-10px}
.it:focus{outline:none}.it:focus-visible{outline:4px solid #F6C033;outline-offset:6px;border-radius:14px}
.it .bob{position:relative;height:100%;transform-origin:50% 100%;animation:bob 1.6s steps(1) infinite}
.it img{position:absolute;left:0;bottom:0;height:100%;width:auto;display:block;pointer-events:none;filter:drop-shadow(0 4px 4px #0008)}
.it img.z{opacity:0}
.it.asleep img.a{opacity:0}.it.asleep img.z{opacity:1}
.it.asleep img{filter:drop-shadow(0 4px 4px #0008) brightness(.8) saturate(.8)}
.it.asleep .bob{animation:breathe 3.2s steps(1) infinite}
.it.pop .bob{animation:pop .5s steps(5) 1}
@keyframes bob{0%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) translateY(-1%)}}
@keyframes breathe{0%{transform:scale(1)}50%{transform:scale(1.025,.985)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.14,.9)}60%{transform:scale(.95,1.07)}}
.glow{position:absolute;z-index:3;border-radius:50%;pointer-events:none;transition:opacity 1.4s;background:radial-gradient(circle,#ffe79a99 0,#ffe79a33 45%,#0000 70%)}
.glow.off{opacity:0}
.tw{position:absolute;z-index:6;pointer-events:none;color:#ffe9a3;font-size:28px;animation:tws 1.2s steps(6) forwards;text-shadow:0 0 10px #ffd23f}
@keyframes tws{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(1.5) rotate(40deg)}}
.zz{position:absolute;z-index:7;pointer-events:none;font-family:var(--display);font-weight:700;color:#dfe6ff;text-shadow:0 0 8px #3355ff;animation:zz 2.4s steps(12) forwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-80px) scale(1.4)}}
#again{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:900;font:inherit;font-family:var(--display);font-size:clamp(20px,3.2vw,28px);font-weight:600;letter-spacing:.01em;color:#fff;min-height:64px;padding:12px 34px;cursor:pointer;opacity:0;transition:opacity 1s,transform .1s;pointer-events:none;border-radius:999px;
 /* blue felt with a stitched edge, same as the Settings button */
 border:2px dashed #ffffffb0;outline:3px solid #137aa6;outline-offset:-1px;text-shadow:0 1px 0 #0a4766;background-color:#137aa6;background-image:url(../felt/paper.webp),radial-gradient(120% 90% at 50% 0%,#ffffff40,transparent 60%);background-blend-mode:multiply,normal;box-shadow:inset 0 3px 2px #ffffff66,inset 0 -4px 3px #00000033,0 5px 0 #0b5a7d,0 12px 20px -8px #000a}
#again:active{transform:translateY(3px);box-shadow:inset 0 3px 6px #00000044,0 2px 0 #0b5a7d}
body.done #again{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.it .bob,.it.asleep .bob,.it.pop .bob,.tw,.zz{animation:none}#dark,.glow{transition:none}}
#rooms{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:900;display:flex;gap:8px}
#rooms button{width:44px;height:44px;border-radius:50%;border:3px solid #fff8;padding:0;cursor:pointer;background-size:cover;background-position:center;box-shadow:0 2px 6px #0008;opacity:.75}
#rooms button.on{border-color:#F6C033;opacity:1}
</style>
</head>

const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const w=id=>W[id][LP.lang]||W[id].en;
let asleep=new Set(),done=false,lastTap=0;

/* Four photographed rooms. Each lists where every toy sits in the 1376x768 photo: centre x, bottom y, height (glow = centre x, y, size). fx is the x the phone view centres on. */
const ROOMS=[
 {id:"night",img:"night-room.webp",fx:690,spots:{
  moon:{x:700,y:335,h:210,glow:[700,230,360]},stars:{x:400,y:300,h:170},lamp:{x:1090,y:274,h:118,glow:[1090,215,330]},

 {id:"pink",img:"night-room-pink.webp",fx:832,spots:{
  moon:{x:832,y:386,h:200,glow:[832,286,360]},stars:{x:470,y:335,h:150},lamp:{x:1150,y:312,h:115,glow:[1150,255,320]},
  teddy:{x:310,y:590,h:195},book:{x:560,y:748,h:100},fish:{x:700,y:498,h:90},ball:{x:800,y:752,h:100},car:{x:1180,y:752,h:92}}},
 {id:"forest",img:"night-room-forest.webp",fx:699,spots:{
  moon:{x:699,y:367,h:185,glow:[699,274,340]},stars:{x:400,y:330,h:150},lamp:{x:1010,y:312,h:100,glow:[1010,262,300]},

 {id:"lilac",img:"night-room-lilac.webp",fx:953,spots:{

];
// a surprise every time: never the room seen last time, and never the same twice in a row
function otherRoom(cur){const pool=ROOMS.filter(r=>r!==cur);return pool[Math.floor(Math.random()*pool.length)]}
let last=null;try{last=ROOMS.find(r=>r.id===localStorage.getItem("lp-night-room"))||null}catch(e){}
let room=last?otherRoom(last):ROOMS[Math.floor(Math.random()*ROOMS.length)];
try{const q=new URLSearchParams(location.search).get("room");const f=ROOMS.find(r=>r.id===q);if(f)room=f}catch(e){}
let SPOT=room.spots;
const ORDER=["moon","stars","lamp","teddy","book","fish","ball","car"];
const NOTE={moon:523,stars:659,lamp:587,teddy:392,book:698,fish:784,ball:440,car:494};
const IW=1376,IH=768;
const els={},glows={};
const stage=$("stage");
ORDER.forEach(id=>{
 const b=document.createElement("button");b.type="button";b.className="it";b.dataset.item=id;
 b.innerHTML='<div class="bob" style="animation-delay:-'+(Math.random()*1.6).toFixed(2)+'s"><img class="z" alt="" src="../felt/night-'+id+'-z.webp"><img class="a" alt="" src="../felt/night-'+id+'.webp"></div>';
 stage.appendChild(b);els[id]=b;
 if(SPOT[id].glow){const g=document.createElement("div");g.className="glow";stage.insertBefore(g,stage.firstChild);glows[id]=g}
});
let geo={s:1,l:0,t:0,tall:false};
function layout(){
 const Wd=innerWidth,Hd=innerHeight,tall=Wd/Hd<1.15;
 document.body.classList.toggle("tall",tall);
 const s=Math.max(Wd/IW,Hd/IH);
 const l=tall?Math.min(0,Math.max(Wd-IW*s,Wd/2-room.fx*s)):(Wd-IW*s)*.55,t=Hd-IH*s;geo={s,l,t,tall};
 const bg=$("bg");bg.style.width=IW*s+"px";bg.style.height=IH*s+"px";bg.style.left=l+"px";bg.style.top=t+"px";
 const grid=ORDER.filter(i=>tall?i!=="moon":false);
 ORDER.forEach(id=>{
  const sp=SPOT[id],e=els[id];let x,y,h;
  if(tall&&id!=="moon"){
   const k=grid.indexOf(id),row=k<3?0:1,n=row?4:3,col=row?k-3:k,cw=Wd/n;
   x=cw*(col+.5);y=Hd*(row?.89:.75);const im=e.firstChild.firstChild,ar=(im.naturalWidth||1)/(im.naturalHeight||1);h=Math.min(cw*.85,Hd*.16,cw*.86/ar);
  }else{x=sp.x*s+l;y=sp.y*s+t;h=sp.h*s}
  e.style.left=x+"px";e.style.top=y+"px";e.style.height=h+"px";e.style.width=(h*(e.firstChild.firstChild.naturalWidth||1)/(e.firstChild.firstChild.naturalHeight||1))+"px";
  e.style.zIndex=5+Math.round(y/10);
  if(glows[id]){const g=glows[id],c=sp.glow,r=c[2]*s;g.style.width=g.style.height=r+"px";g.style.left=(c[0]*s+l-r/2)+"px";g.style.top=(c[1]*s+t-r/2)+"px"}
 });
}
ORDER.forEach(id=>{const im=els[id].querySelector("img.a");im.addEventListener("load",layout)});
addEventListener("resize",layout);
const rp=document.createElement("div");rp.id="rooms";
ROOMS.forEach(r=>{const b=document.createElement("button");b.type="button";b.dataset.room=r.id;b.setAttribute("aria-label","Room "+r.id);b.style.backgroundImage="url(../felt/"+r.img+")";b.addEventListener("click",()=>{if(r!==room)setRoom(r)});rp.appendChild(b)});
$("app").appendChild(rp);
setRoom(room);

function setRoom(r){room=r;try{localStorage.setItem("lp-night-room",r.id)}catch(e){}SPOT=r.spots;$("bg").src="../felt/"+r.img;layout();document.querySelectorAll("#rooms button").forEach(b=>b.classList.toggle("on",b.dataset.room===r.id))}
function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function label(){ORDER.forEach(id=>els[id].setAttribute("aria-label",w(id).w));$("again").textContent=L().again}
function zzz(e){
 const r=e.getBoundingClientRect();
 const t=document.createElement("div");t.className="zz";t.textContent="z";
 t.style.left=(r.left+r.width*.7)+"px";t.style.top=(r.top+r.height*.1)+"px";t.style.fontSize=Math.max(26,r.height*.22)+"px";
 $("app").appendChild(t);setTimeout(()=>t.remove(),2500);
}
function twinkleAt(x,y){
 const t=document.createElement("div");t.className="tw";t.textContent="✦";t.style.left=x+"px";t.style.top=y+"px";
 $("app").appendChild(t);setTimeout(()=>t.remove(),1300);
}
function sleep(id){
 if(done||asleep.has(id))return;
 const now=Date.now();if(now-lastTap<700)return;lastTap=now; // one goodnight at a time, even when mashing
 asleep.add(id);
 const e=els[id];e.classList.add("asleep","pop");setTimeout(()=>e.classList.remove("pop"),520);zzz(e);
 if(glows[id])glows[id].classList.add("off");
 LP.tone(NOTE[id],.6,"sine",.08);LP.tone(NOTE[id]*.75,.8,"sine",.06,.25);
 bubble(w(id).g);LP.say(w(id).g);
 $("dark").style.opacity=(asleep.size/DATA.words.length*.35).toFixed(2);
 if(asleep.size===DATA.words.length)setTimeout(finish,2200);
}
function finish(){
 done=true;$("dark").style.opacity=".55";
 lullaby();bubble(L().end);setTimeout(()=>LP.say(L().end),400);
 setTimeout(()=>{$("bubble").style.opacity=".35";document.body.classList.add("done")},5000);
}
/* Sleepy music-box lullabies, played on soft sine bells with a warm drone. The first three are old folk tunes (public domain); the last two are originals. Notes are name:beats. */
const TUNES=[
 {n:"Brahms",bpm:58,t:"E4:1 E4:1 G4:2 E4:1 E4:1 G4:2 E4:1 G4:1 C5:1 B4:1 A4:2 A4:1 G4:1 D4:1 E4:1 F4:2 D4:1 D4:1 E4:1 F4:2 D4:1 F4:1 B4:1 A4:1 G4:2 E4:1 E4:1 G4:1 C5:2 B4:1 A4:2 G4:2 G4:1 A4:1 B4:1 C5:4"},
 {n:"Twinkle",bpm:60,t:"C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2 G4:1 G4:1 F4:1 F4:1 E4:1 E4:1 D4:2 G4:1 G4:1 F4:1 F4:1 E4:1 E4:1 D4:2 C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:4"},
 {n:"Clair",bpm:56,t:"C4:1 C4:1 C4:1 D4:1 E4:2 D4:2 C4:1 E4:1 D4:1 D4:1 C4:4 C4:1 C4:1 C4:1 D4:1 E4:2 D4:2 C4:1 E4:1 D4:1 D4:1 C4:4 D4:1 D4:1 D4:1 D4:1 A3:2 A3:2 D4:1 C4:1 B3:1 A3:1 G3:4 C4:1 C4:1 C4:1 D4:1 E4:2 D4:2 C4:1 E4:1 D4:1 D4:1 C4:4"},
 {n:"Moon",bpm:52,t:"G4:2 E4:1 D4:1 E4:2 G4:2 A4:2 G4:1 E4:1 D4:4 E4:2 D4:1 C4:1 D4:2 E4:2 G4:2 E4:2 C4:4 G4:2 A4:1 C5:1 A4:2 G4:2 E4:2 D4:1 E4:1 G4:4 A4:2 G4:1 E4:1 D4:2 C4:2 C4:6"},
 {n:"Cradle",bpm:50,t:"E4:3 D4:1 C4:2 D4:2 E4:2 G4:2 E4:4 A4:3 G4:1 E4:2 D4:2 C4:2 D4:2 E4:4 G4:2 A4:2 C5:2 A4:2 G4:2 E4:2 D4:2 C4:2 D4:2 E4:2 D4:2 C4:2 A3:2 C4:2 C4:6"}
];
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function freq(nm){const m=/^([A-G])(\d)$/.exec(nm);return 440*Math.pow(2,(SEMI[m[1]]+12*(+m[2]-4)-9)/12)}
let tuneIx=Math.floor(Math.random()*TUNES.length);
let lull=[];
function lullaby(){
 const T=TUNES[tuneIx];tuneIx=(tuneIx+1)%TUNES.length;
 const spb=60/T.bpm,notes=T.t.split(" ").map(x=>x.split(":"));
 const total=notes.reduce((a,x)=>a+ +x[1],0);
 let t=.8,beat=0;
 // warm drone on the low C, renewed every four beats and fading with the tune
 for(let b=0;b<total;b+=4){const v=.034*(1-b/total*.7);lull.push(LP.tone(130.8,spb*4.6,"sine",v,.8+b*spb),LP.tone(196,spb*4.6,"sine",v*.5,.8+b*spb))}
 notes.forEach((x,i)=>{
  const f=freq(x[0]);let b=+x[1];
  const left=notes.length-i,slow=left<=3?1+(4-left)*.12:1; // slow down a little at the very end
  const fade=1-beat/total*.55,len=b*spb*slow;
  lull.push(LP.tone(f,Math.max(1.6,len*1.7),"sine",.062*fade,t),LP.tone(f*1.004,Math.max(1.6,len*1.7),"sine",.03*fade,t),LP.tone(f*2,.7,"sine",.012*fade,t));
  t+=len;beat+=b;
 });
}
function reset(){lull.forEach(o=>{try{o&&o.stop()}catch(e){}});lull=[];setRoom(otherRoom(room));asleep.clear();done=false;ORDER.forEach(id=>els[id].classList.remove("asleep"));Object.values(glows).forEach(g=>g.classList.remove("off"));$("dark").style.opacity="0";$("bubble").style.opacity="1";document.body.classList.remove("done");bubble(L().title);LP.say(L().title)}

LP.init({langs:ALLLANGS,onLang:()=>{label();document.title=L().title;if(!done)bubble(L().title)}});
label();document.title=L().title;bubble(L().title);
LP.start(L().title,()=>LP.say(L().title));
$("again").addEventListener("click",reset);
LP.mash((e)=>{
 if(e.target.closest&&e.target.closest("#again,#rooms"))return;
 if(done){LP.sfx.twinkle();if(e.clientX!=null)twinkleAt(e.clientX,e.clientY);return} // after bedtime, taps only twinkle
 const g=e.target.closest&&e.target.closest("[data-item]");
 const id=g&&!asleep.has(g.dataset.item)?g.dataset.item:ORDER.find(i=>!asleep.has(i));
 if(id)sleep(id);
});
</script>
