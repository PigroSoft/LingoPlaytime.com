<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goodnight room</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{color-scheme:dark;--display:"Fredoka","Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#0c1a3d;color:#F1F5FC;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;max-width:none;display:block;pointer-events:none}
#dark{position:absolute;inset:0;background:#050a24;opacity:0;transition:opacity 1.6s;pointer-events:none;z-index:1}
#shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(#0000,#0a143a99);pointer-events:none;z-index:1;display:none}
body.tall #shade{display:block}
.top{position:absolute;left:0;right:0;top:max(10px,env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:800;pointer-events:none;padding:0 12px}
#bubble{font-size:clamp(22px,4.2vw,40px);min-height:1.2em;text-align:center;max-width:94vw;transition:transform .15s,opacity 1.2s;text-shadow:0 2px 0 #000a,0 0 12px #000c}
#bubble.bump{transform:scale(1.08)}
.it{position:absolute;z-index:5;transform:translate(-50%,-100%);border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;display:block}
.it::after{content:"";position:absolute;inset:-10px}
.it:focus{outline:none}.it:focus-visible{outline:4px solid #F6C033;outline-offset:6px;border-radius:14px}
.it .bob{position:relative;height:100%;transform-origin:50% 100%;animation:bob 1.6s steps(1) infinite}
.it img{position:absolute;left:0;bottom:0;height:100%;width:auto;display:block;pointer-events:none;filter:drop-shadow(0 4px 4px #0008)}
.it img.z{opacity:0}
.it.asleep img.a{opacity:0}.it.asleep img.z{opacity:1}
.it.asleep img{filter:drop-shadow(0 4px 4px #0008) brightness(.8) saturate(.8)}
.it.asleep .bob{animation:breathe 3.2s steps(1) infinite}
.it.pop .bob{animation:pop .5s steps(5) 1}
@keyframes bob{0%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) translateY(-1%)}}
@keyframes breathe{0%{transform:scale(1)}50%{transform:scale(1.025,.985)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.14,.9)}60%{transform:scale(.95,1.07)}}
.glow{position:absolute;z-index:3;border-radius:50%;pointer-events:none;transition:opacity 1.4s;background:radial-gradient(circle,#ffe79a99 0,#ffe79a33 45%,#0000 70%)}
.glow.off{opacity:0}
.tw{position:absolute;z-index:6;pointer-events:none;color:#ffe9a3;font-size:28px;animation:tws 1.2s steps(6) forwards;text-shadow:0 0 10px #ffd23f}
@keyframes tws{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(1.5) rotate(40deg)}}
.zz{position:absolute;z-index:7;pointer-events:none;font-family:var(--display);font-weight:700;color:#dfe6ff;text-shadow:0 0 8px #3355ff;animation:zz 2.4s steps(12) forwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-80px) scale(1.4)}}
#again{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:900;font:inherit;font-size:14px;font-weight:700;color:#dfe6ff;background:#ffffff1f;border:0;border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;opacity:0;transition:opacity 1s;pointer-events:none}
body.done #again{opacity:.75;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.it .bob,.it.asleep .bob,.it.pop .bob,.tw,.zz{animation:none}#dark,.glow{transition:none}}
</style>
</head>
<body>
<script>window.LP_GAME="night"</script><script src="voice.js"></script><script src="learn.js"></script><script src="bridge.js"></script><script src="kit.js"></script><script src="look.js"></script>
<div class="app" id="app">
  <img id="bg" src="../felt/night-room.webp" alt="">
  <div id="dark"></div><div id="shade"></div>
  <div id="stage"></div>
  <div class="top"><div id="bubble" class="k-bubble" aria-live="polite"></div></div>
  <button type="button" id="again"></button>
</div>
<script>
/* Every word and line this game can say. tools/phrases.js reads DATA to record them. */
const DATA={
 words:[
  {id:"moon",en:{w:"the moon",g:"Goodnight, moon!"},nl:{w:"de maan",g:"Welterusten, maan!"},pl:{w:"księżyc",g:"Dobranoc, księżycu!"},sv:{w:"månen",g:"God natt, månen!"},el:{w:"το φεγγάρι",g:"Καληνύχτα, φεγγάρι!"},zh:{w:"月亮",g:"晚安，月亮！"},ar:{w:"القمر",g:"تصبحين على خير يا قمر!"},ja:{w:"おつきさま",g:"おやすみ、おつきさま！"},ko:{w:"달",g:"잘 자, 달님!"},ru:{w:"луна",g:"Спокойной ночи, луна!"},tr:{w:"ay",g:"İyi geceler, ay!"},hi:{w:"चाँद",g:"शुभ रात्रि, चाँद!"},de:{w:"der Mond",g:"Gute Nacht, Mond!"},es:{w:"la luna",g:"¡Buenas noches, luna!"},fr:{w:"la lune",g:"Bonne nuit, la lune !"},it:{w:"la luna",g:"Buonanotte, luna!"},pt:{w:"a lua",g:"Boa noite, lua!"}},
  {id:"stars",en:{w:"the stars",g:"Goodnight, stars!"},nl:{w:"de sterren",g:"Welterusten, sterren!"},pl:{w:"gwiazdy",g:"Dobranoc, gwiazdy!"},sv:{w:"stjärnorna",g:"God natt, stjärnorna!"},el:{w:"τα αστέρια",g:"Καληνύχτα, αστέρια!"},zh:{w:"星星",g:"晚安，星星！"},ar:{w:"النجوم",g:"تصبحون على خير يا نجوم!"},ja:{w:"おほしさま",g:"おやすみ、おほしさま！"},ko:{w:"별들",g:"잘 자, 별들아!"},ru:{w:"звёзды",g:"Спокойной ночи, звёзды!"},tr:{w:"yıldızlar",g:"İyi geceler, yıldızlar!"},hi:{w:"तारे",g:"शुभ रात्रि, तारे!"},de:{w:"die Sterne",g:"Gute Nacht, Sterne!"},es:{w:"las estrellas",g:"¡Buenas noches, estrellas!"},fr:{w:"les étoiles",g:"Bonne nuit, les étoiles !"},it:{w:"le stelle",g:"Buonanotte, stelle!"},pt:{w:"as estrelas",g:"Boa noite, estrelas!"}},
  {id:"lamp",en:{w:"the lamp",g:"Goodnight, lamp!"},nl:{w:"de lamp",g:"Welterusten, lamp!"},pl:{w:"lampa",g:"Dobranoc, lampo!"},sv:{w:"lampan",g:"God natt, lampan!"},el:{w:"η λάμπα",g:"Καληνύχτα, λάμπα!"},zh:{w:"灯",g:"晚安，灯！"},ar:{w:"المصباح",g:"تصبح على خير يا مصباح!"},ja:{w:"ランプ",g:"おやすみ、ランプ！"},ko:{w:"전등",g:"잘 자, 전등아!"},ru:{w:"лампа",g:"Спокойной ночи, лампа!"},tr:{w:"lamba",g:"İyi geceler, lamba!"},hi:{w:"लैंप",g:"शुभ रात्रि, लैंप!"},de:{w:"die Lampe",g:"Gute Nacht, Lampe!"},es:{w:"la lámpara",g:"¡Buenas noches, lámpara!"},fr:{w:"la lampe",g:"Bonne nuit, la lampe !"},it:{w:"la lampada",g:"Buonanotte, lampada!"},pt:{w:"o candeeiro",g:"Boa noite, candeeiro!"}},
  {id:"teddy",en:{w:"the teddy",g:"Goodnight, teddy!"},nl:{w:"de teddybeer",g:"Welterusten, teddybeer!"},pl:{w:"miś",g:"Dobranoc, misiu!"},sv:{w:"nallen",g:"God natt, nallen!"},el:{w:"το αρκουδάκι",g:"Καληνύχτα, αρκουδάκι!"},zh:{w:"泰迪熊",g:"晚安，泰迪熊！"},ar:{w:"الدبدوب",g:"تصبح على خير يا دبدوب!"},ja:{w:"くまのぬいぐるみ",g:"おやすみ、くまさん！"},ko:{w:"곰인형",g:"잘 자, 곰인형아!"},ru:{w:"мишка",g:"Спокойной ночи, мишка!"},tr:{w:"oyuncak ayı",g:"İyi geceler, oyuncak ayı!"},hi:{w:"टेडी",g:"शुभ रात्रि, टेडी!"},de:{w:"der Teddy",g:"Gute Nacht, Teddy!"},es:{w:"el osito",g:"¡Buenas noches, osito!"},fr:{w:"le nounours",g:"Bonne nuit, nounours !"},it:{w:"l'orsacchiotto",g:"Buonanotte, orsacchiotto!"},pt:{w:"o ursinho",g:"Boa noite, ursinho!"}},
  {id:"book",en:{w:"the book",g:"Goodnight, book!"},nl:{w:"het boek",g:"Welterusten, boek!"},pl:{w:"książka",g:"Dobranoc, książko!"},sv:{w:"boken",g:"God natt, boken!"},el:{w:"το βιβλίο",g:"Καληνύχτα, βιβλίο!"},zh:{w:"书",g:"晚安，书！"},ar:{w:"الكتاب",g:"تصبح على خير يا كتاب!"},ja:{w:"ほん",g:"おやすみ、ほん！"},ko:{w:"책",g:"잘 자, 책아!"},ru:{w:"книга",g:"Спокойной ночи, книга!"},tr:{w:"kitap",g:"İyi geceler, kitap!"},hi:{w:"किताब",g:"शुभ रात्रि, किताब!"},de:{w:"das Buch",g:"Gute Nacht, Buch!"},es:{w:"el libro",g:"¡Buenas noches, libro!"},fr:{w:"le livre",g:"Bonne nuit, le livre !"},it:{w:"il libro",g:"Buonanotte, libro!"},pt:{w:"o livro",g:"Boa noite, livro!"}},
  {id:"fish",en:{w:"the fish",g:"Goodnight, fish!"},nl:{w:"de vis",g:"Welterusten, vis!"},pl:{w:"ryba",g:"Dobranoc, rybko!"},sv:{w:"fisken",g:"God natt, fisken!"},el:{w:"το ψάρι",g:"Καληνύχτα, ψάρι!"},zh:{w:"鱼",g:"晚安，小鱼！"},ar:{w:"السمكة",g:"تصبح على خير يا سمكة!"},ja:{w:"さかな",g:"おやすみ、さかな！"},ko:{w:"물고기",g:"잘 자, 물고기야!"},ru:{w:"рыба",g:"Спокойной ночи, рыбка!"},tr:{w:"balık",g:"İyi geceler, balık!"},hi:{w:"मछली",g:"शुभ रात्रि, मछली!"},de:{w:"der Fisch",g:"Gute Nacht, Fisch!"},es:{w:"el pez",g:"¡Buenas noches, pez!"},fr:{w:"le poisson",g:"Bonne nuit, le poisson !"},it:{w:"il pesce",g:"Buonanotte, pesce!"},pt:{w:"o peixe",g:"Boa noite, peixe!"}},
  {id:"ball",en:{w:"the ball",g:"Goodnight, ball!"},nl:{w:"de bal",g:"Welterusten, bal!"},pl:{w:"piłka",g:"Dobranoc, piłko!"},sv:{w:"bollen",g:"God natt, bollen!"},el:{w:"η μπάλα",g:"Καληνύχτα, μπάλα!"},zh:{w:"球",g:"晚安，球！"},ar:{w:"الكرة",g:"تصبح على خير يا كرة!"},ja:{w:"ボール",g:"おやすみ、ボール！"},ko:{w:"공",g:"잘 자, 공아!"},ru:{w:"мяч",g:"Спокойной ночи, мяч!"},tr:{w:"top",g:"İyi geceler, top!"},hi:{w:"गेंद",g:"शुभ रात्रि, गेंद!"},de:{w:"der Ball",g:"Gute Nacht, Ball!"},es:{w:"la pelota",g:"¡Buenas noches, pelota!"},fr:{w:"le ballon",g:"Bonne nuit, le ballon !"},it:{w:"la palla",g:"Buonanotte, palla!"},pt:{w:"a bola",g:"Boa noite, bola!"}},
  {id:"car",en:{w:"the car",g:"Goodnight, car!"},nl:{w:"de auto",g:"Welterusten, auto!"},pl:{w:"samochód",g:"Dobranoc, samochodziku!"},sv:{w:"bilen",g:"God natt, bilen!"},el:{w:"το αυτοκίνητο",g:"Καληνύχτα, αυτοκίνητο!"},zh:{w:"汽车",g:"晚安，小汽车！"},ar:{w:"السيارة",g:"تصبح على خير يا سيارة!"},ja:{w:"くるま",g:"おやすみ、くるま！"},ko:{w:"자동차",g:"잘 자, 자동차야!"},ru:{w:"машина",g:"Спокойной ночи, машина!"},tr:{w:"araba",g:"İyi geceler, araba!"},hi:{w:"गाड़ी",g:"शुभ रात्रि, गाड़ी!"},de:{w:"das Auto",g:"Gute Nacht, Auto!"},es:{w:"el coche",g:"¡Buenas noches, coche!"},fr:{w:"la voiture",g:"Bonne nuit, la voiture !"},it:{w:"la macchina",g:"Buonanotte, macchina!"},pt:{w:"o carro",g:"Boa noite, carro!"}}
 ],
 lines:{
  en:{title:"Goodnight",end:"Sleep well!",again:"Again"},nl:{title:"Welterusten",end:"Slaap lekker!",again:"Nog een keer"},pl:{title:"Dobranoc",end:"Śpij dobrze!",again:"Jeszcze raz"},sv:{title:"God natt",end:"Sov gott!",again:"Igen"},el:{title:"Καληνύχτα",end:"Κοιμήσου καλά!",again:"Ξανά"},zh:{title:"晚安",end:"睡个好觉！",again:"再来一次"},ar:{title:"تصبح على خير",end:"نم جيدا!",again:"مرة أخرى"},ja:{title:"おやすみ",end:"ぐっすり ねんね！",again:"もういちど"},ko:{title:"잘 자요",end:"잘 자요!",again:"다시"},ru:{title:"Спокойной ночи",end:"Сладких снов!",again:"Ещё раз"},tr:{title:"İyi geceler",end:"İyi uykular!",again:"Tekrar"},hi:{title:"शुभ रात्रि",end:"अच्छी नींद लो!",again:"फिर से"},
  de:{title:"Gute Nacht",end:"Schlaf gut!",again:"Nochmal"},
  es:{title:"Buenas noches",end:"¡Que duermas bien!",again:"Otra vez"},
  fr:{title:"Bonne nuit",end:"Dors bien !",again:"Encore"},
  it:{title:"Buonanotte",end:"Sogni d'oro!",again:"Ancora"},
  pt:{title:"Boa noite",end:"Dorme bem!",again:"Outra vez"}
 }
};
const W=Object.fromEntries(DATA.words.map(w=>[w.id,w]));
const $=id=>document.getElementById(id);
const L=()=>LP.t(DATA.lines);
const w=id=>W[id][LP.lang]||W[id].en;
let asleep=new Set(),done=false,lastTap=0;

/* Where each toy lives in the 1376x768 photo: centre x, bottom y, height. */
const SPOT={
 moon:{x:700,y:335,h:210,glow:[700,230,360]},
 stars:{x:400,y:300,h:170},
 lamp:{x:1090,y:274,h:118,glow:[1090,215,330]},
 teddy:{x:560,y:535,h:215},
 book:{x:330,y:735,h:112},
 fish:{x:1095,y:428,h:118},
 ball:{x:830,y:722,h:112},
 car:{x:1010,y:742,h:98}
};
const ORDER=["moon","stars","lamp","teddy","book","fish","ball","car"];
const NOTE={moon:523,stars:659,lamp:587,teddy:392,book:698,fish:784,ball:440,car:494};
const IW=1376,IH=768;
const els={},glows={};
const stage=$("stage");
ORDER.forEach(id=>{
 const b=document.createElement("button");b.type="button";b.className="it";b.dataset.item=id;
 b.innerHTML='<div class="bob" style="animation-delay:-'+(Math.random()*1.6).toFixed(2)+'s"><img class="z" alt="" src="../felt/night-'+id+'-z.webp"><img class="a" alt="" src="../felt/night-'+id+'.webp"></div>';
 stage.appendChild(b);els[id]=b;
 if(SPOT[id].glow){const g=document.createElement("div");g.className="glow";stage.insertBefore(g,stage.firstChild);glows[id]=g}
});
let geo={s:1,l:0,t:0,tall:false};
function layout(){
 const Wd=innerWidth,Hd=innerHeight,tall=Wd/Hd<1.15;
 document.body.classList.toggle("tall",tall);
 const s=Math.max(Wd/IW,Hd/IH),bias=tall?.5:.55;
 const l=(Wd-IW*s)*bias,t=Hd-IH*s;geo={s,l,t,tall};
 const bg=$("bg");bg.style.width=IW*s+"px";bg.style.height=IH*s+"px";bg.style.left=l+"px";bg.style.top=t+"px";
 const grid=ORDER.filter(i=>tall?i!=="moon":false);
 ORDER.forEach(id=>{
  const sp=SPOT[id],e=els[id];let x,y,h;
  if(tall&&id!=="moon"){
   const k=grid.indexOf(id),row=k<3?0:1,n=row?4:3,col=row?k-3:k,cw=Wd/n;
   x=cw*(col+.5);y=Hd*(row?.93:.76);const im=e.firstChild.firstChild,ar=(im.naturalWidth||1)/(im.naturalHeight||1);h=Math.min(cw*.85,Hd*.16,cw*.86/ar);
  }else{x=sp.x*s+l;y=sp.y*s+t;h=sp.h*s}
  e.style.left=x+"px";e.style.top=y+"px";e.style.height=h+"px";e.style.width=(h*(e.firstChild.firstChild.naturalWidth||1)/(e.firstChild.firstChild.naturalHeight||1))+"px";
  e.style.zIndex=5+Math.round(y/10);
  if(glows[id]){const g=glows[id],c=sp.glow,r=c[2]*s;g.style.width=g.style.height=r+"px";g.style.left=(c[0]*s+l-r/2)+"px";g.style.top=(c[1]*s+t-r/2)+"px"}
 });
}
ORDER.forEach(id=>{const im=els[id].querySelector("img.a");im.addEventListener("load",layout)});
addEventListener("resize",layout);layout();

function bubble(t){const b=$("bubble");b.textContent=t;b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function label(){ORDER.forEach(id=>els[id].setAttribute("aria-label",w(id).w));$("again").textContent=L().again}
function zzz(e){
 const r=e.getBoundingClientRect();
 const t=document.createElement("div");t.className="zz";t.textContent="z";
 t.style.left=(r.left+r.width*.7)+"px";t.style.top=(r.top+r.height*.1)+"px";t.style.fontSize=Math.max(26,r.height*.22)+"px";
 $("app").appendChild(t);setTimeout(()=>t.remove(),2500);
}
function twinkleAt(x,y){
 const t=document.createElement("div");t.className="tw";t.textContent="✦";t.style.left=x+"px";t.style.top=y+"px";
 $("app").appendChild(t);setTimeout(()=>t.remove(),1300);
}
function sleep(id){
 if(done||asleep.has(id))return;
 const now=Date.now();if(now-lastTap<700)return;lastTap=now; // one goodnight at a time, even when mashing
 asleep.add(id);
 const e=els[id];e.classList.add("asleep","pop");setTimeout(()=>e.classList.remove("pop"),520);zzz(e);
 if(glows[id])glows[id].classList.add("off");
 LP.tone(NOTE[id],.6,"sine",.08);LP.tone(NOTE[id]*.75,.8,"sine",.06,.25);
 bubble(w(id).g);LP.say(w(id).g);
 $("dark").style.opacity=(asleep.size/DATA.words.length*.35).toFixed(2);
 if(asleep.size===DATA.words.length)setTimeout(finish,2200);
}
function finish(){
 done=true;$("dark").style.opacity=".55";
 lullaby();bubble(L().end);setTimeout(()=>LP.say(L().end),400);
 setTimeout(()=>{$("bubble").style.opacity=".35";document.body.classList.add("done")},5000);
}
// a short original music-box tune
function lullaby(){const n=[659,587,523,587,659,659,659,0,587,587,587,0,659,784,784,0,659,587,523,587,659,659,659,659,587,587,659,587,523];let t=.6;n.forEach(f=>{if(f)LP.tone(f,1.1,"sine",.06,t),LP.tone(f*2,.6,"sine",.015,t);t+=.42})}
function reset(){asleep.clear();done=false;ORDER.forEach(id=>els[id].classList.remove("asleep"));Object.values(glows).forEach(g=>g.classList.remove("off"));$("dark").style.opacity="0";$("bubble").style.opacity="1";document.body.classList.remove("done");bubble(L().title);LP.say(L().title)}

LP.init({langs:ALLLANGS,onLang:()=>{label();document.title=L().title;if(!done)bubble(L().title)}});
label();document.title=L().title;bubble(L().title);
LP.start(L().title,()=>LP.say(L().title));
$("again").addEventListener("click",reset);
LP.mash((e)=>{
 if(e.target.closest&&e.target.closest("#again"))return;
 if(done){LP.sfx.twinkle();if(e.clientX!=null)twinkleAt(e.clientX,e.clientY);return} // after bedtime, taps only twinkle
 const g=e.target.closest&&e.target.closest("[data-item]");
 const id=g&&!asleep.has(g.dataset.item)?g.dataset.item:ORDER.find(i=>!asleep.has(i));
 if(id)sleep(id);
});
</script>
</body>
</html>
