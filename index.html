<style>
/* Layout: one calm sky-blue room; one big card per view, games as a toy shelf of tiles */
:root{
  --bg:#EAF3FA; --paper:#FFFFFF; --ink:#18264A; --muted:#4D5B7A; --line:#C9DAEA;
  --tomato:#E5553B; --sun:#F6C033; --teal:#1E9A8F; --lilac:#7A68D9; --sky:#3B8BD4;
  --tomato-soft:#FCE3DD; --sun-soft:#FDF1CC; --teal-soft:#D5F0EC; --lilac-soft:#E6E1FA;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A30; --paper:#1A2645; --ink:#F1F5FC; --muted:#AEBBD6; --line:#2E3C63;
  --tomato:#FF7A61; --sun:#F8CD55; --teal:#3CC2B5; --lilac:#A396F2; --sky:#6AAEEB;
  --tomato-soft:#3A2230; --sun-soft:#3A3322; --teal-soft:#173A3E; --lilac-soft:#2A2752; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A30; --paper:#1A2645; --ink:#F1F5FC; --muted:#AEBBD6; --line:#2E3C63;
  --tomato:#FF7A61; --sun:#F8CD55; --teal:#3CC2B5; --lilac:#A396F2; --sky:#6AAEEB;
  --tomato-soft:#3A2230; --sun-soft:#3A3322; --teal-soft:#173A3E; --lilac-soft:#2A2752; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:20px 16px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.logo svg{flex:none}
.logo b{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.01em}
.logo b span{color:var(--tomato)}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav a{text-decoration:none;display:inline-flex;align-items:center}
nav a,nav button{background:none;border:0;border-radius:999px;padding:8px 14px;font-weight:700;color:var(--muted);cursor:pointer;min-height:44px}
nav a:hover,nav button:hover{color:var(--ink);background:var(--paper)}
nav button[aria-current="page"]{color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}


/* card */
.card{background:var(--paper);border-radius:var(--r);padding:clamp(20px,4vw,40px);box-shadow:0 2px 0 var(--line),0 18px 40px -28px #18264a55}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.lede{color:var(--muted);max-width:60ch;margin:10px 0 0}

.sample{margin:10px 0 0;padding:10px 14px;border-radius:14px;background:#fff5d6;color:var(--ink);font-size:15px;line-height:1.5;max-width:60ch}
/* setup */
.setup h1{font-size:clamp(32px,5vw,48px);margin-top:6px}
.field{display:grid;gap:10px;margin-top:30px}
.field>label,.field>.lbl{font-family:var(--display);font-weight:600;font-size:21px}
.hint{font-size:15px;color:var(--muted);margin-top:-6px}
#name{width:100%;max-width:420px;font-size:26px;font-family:var(--display);padding:12px 18px;border-radius:16px;border:2px solid var(--line);background:var(--bg)}
#name:focus{border-color:var(--sky);outline:none}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:6px 16px 6px 6px;border-radius:999px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700}
.pill .code{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;letter-spacing:.04em;background:var(--bg);color:var(--muted)}
.pill:hover{border-color:var(--sky)}
.pill[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.pill[aria-pressed="true"] .code{background:var(--sun);color:#18264A}
.pill:disabled{opacity:.4;cursor:not-allowed}
.pill.age{padding:6px 18px}
.pill.age small{font-weight:400;opacity:.8}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:34px}
.go{background:var(--tomato);color:#fff;border:0;border-radius:999px;padding:14px 30px;font-family:var(--display);font-size:22px;font-weight:600;cursor:pointer;min-height:56px;box-shadow:0 4px 0 #a8341f}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #a8341f}
.go:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.quiet{color:var(--muted);font-size:15px}
.err{color:var(--tomato);font-weight:700;font-size:15px}

/* games */
.hello{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hello span{font-family:var(--display);font-size:clamp(14px,1.8vw,17px);padding:4px 12px;border-radius:999px}
.hello span:nth-child(4n+1){background:var(--tomato-soft)}
.hello span:nth-child(4n+2){background:var(--teal-soft)}
.hello span:nth-child(4n+3){background:var(--lilac-soft)}
.hello span:nth-child(4n+4){background:var(--sun-soft)}
.games h1{font-size:clamp(24px,3.4vw,34px)}
.games>.card{padding:16px 24px;position:relative}
.mascot{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.setup{position:relative}
.setup .mascot{position:absolute;right:clamp(8px,3vw,32px);top:-2px;width:clamp(96px,14vw,150px);cursor:default}
.setup h1{padding-right:clamp(90px,15vw,160px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:28px}
.game{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--paper);border-radius:var(--r);padding:16px;border:2px solid var(--line);transition:transform .15s,border-color .15s}
.game:hover{transform:translateY(-3px) rotate(-.6deg);border-color:var(--ink)}
.game .art{aspect-ratio:4/3;max-width:100%;border-radius:14px;display:grid;place-items:center}
.game .art.day{background:radial-gradient(circle at 82% 18%,#ffe066 0 7%,#ffe06655 10%,transparent 22%),linear-gradient(#2f6fe8,#7fc8ff 70%,#58d26b 70%,#3fae6a)}
.game .art.night{background:radial-gradient(circle,#ffffff66 1px,transparent 1.5px) 0 0/22px 22px,radial-gradient(120% 90% at 20% 0%,#3a2a86,#241c63 50%,#140f3a)}
.game .art.felt{background:none;display:block;overflow:hidden;box-shadow:0 3px 0 #0002,0 8px 14px -6px #0005}
.game .art.felt img{width:100%;height:100%;display:block;object-fit:cover}
.game .art svg{width:58%;height:auto;max-height:86%;filter:drop-shadow(0 8px 12px #0006)}
.game h3{font-size:23px}
.game p{margin:0;font-size:15px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.sound{background:var(--teal-soft);color:var(--ink)}
.dim{opacity:.45}
.filter{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}

/* prose pages */
.prose h1{font-size:clamp(32px,5vw,46px);margin-top:6px}
.prose h2{font-size:24px;margin-top:30px}
.prose p,.prose li{max-width:64ch}
.prose ul{padding-left:22px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}
.tile{border-radius:18px;padding:20px;min-width:0}
.tile h3{font-size:21px;margin-bottom:6px}
.tile p{margin:0;font-size:16px}
.t1{background:var(--tomato-soft)}.t2{background:var(--teal-soft)}.t3{background:var(--lilac-soft)}.t4{background:var(--sun-soft)}
.prose .facts,.facts{padding-left:0}
.facts{display:grid;gap:16px;margin-top:20px;padding:0;list-style:none}
.facts li{display:block}
.facts .k{display:block;margin-bottom:2px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.facts .k.no{color:var(--tomato)}
.danger{background:none;border:2px solid var(--tomato);color:var(--tomato);border-radius:999px;padding:10px 22px;font-weight:700;cursor:pointer;min-height:46px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;padding:14px 18px;border-radius:14px;background:var(--tomato-soft)}
.confirm button{border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;min-height:44px;border:2px solid var(--ink);background:var(--paper)}
.confirm .yes{background:var(--tomato);border-color:var(--tomato);color:#fff}
.soon span{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:999px;background:var(--sun-soft);font-family:var(--display);font-weight:600;font-size:20px}
.price{font-family:var(--display);font-size:40px;font-weight:600}

/* parent gate */
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#0c1428b3;z-index:20}
.gate .card{max-width:420px;text-align:center}
.hold{position:relative;overflow:hidden;margin-top:20px;width:100%;border:0;border-radius:999px;padding:16px;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:20px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;min-height:56px}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:var(--teal);opacity:.6}
.hold span{position:relative}
.close{margin-top:12px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:44px}
/* settings bar: the one place settings live, above every game */
.lpbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:18px;padding:8px 8px 8px 18px;border-radius:32px;background:var(--paper);box-shadow:0 0 0 2px var(--line),0 10px 24px -18px #18264a66}
.lpbar .who{display:flex;align-items:baseline;gap:8px;min-width:0}
.lpbar .who b{font-family:var(--display);font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12ch}
.lpbar .who small{color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.lpbar .play{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.lpbar .langs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
#barPlayLbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.lpbar{user-select:none;-webkit-user-select:none}
.lpbar .who{cursor:default}
.lpbar .chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:4px 14px 4px 5px;border-radius:999px;border:2px solid var(--line);font:inherit;font-weight:700;font-size:16px;white-space:nowrap;color:var(--ink);background:var(--paper);cursor:pointer;transition:transform .12s}
.lpbar .chip:hover{border-color:var(--sky)}
.lpbar .chip:active{transform:scale(.95)}
.lpbar .chip .code{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:11px;letter-spacing:.04em;background:var(--paper);color:var(--muted)}
.lpbar .chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lpbar .chip.on .code{background:var(--sun);color:#18264A}
.lpbar .who .lock{flex:none;width:16px;height:16px;color:var(--muted);align-self:center}
.lpbar .note{flex-basis:100%;font-size:14px;color:var(--muted);padding-left:2px}
.setbtn{display:inline-flex;align-items:center;gap:8px;margin-left:auto;min-height:48px;padding:8px 20px 8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;box-shadow:0 3px 0 var(--line);cursor:pointer}
.setbtn{position:relative;overflow:hidden;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none}
.setbtn .fill{position:absolute;inset:0 auto 0 0;width:0;z-index:-1;background:linear-gradient(90deg,var(--tomato),var(--sun))}
.setbtn.holding{background:var(--ink)}
.setbtn.nudge{animation:nudge .45s}
@keyframes nudge{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.setbtn svg{width:18px;height:18px}
.setbtn:hover{border-color:var(--tomato)}
.setbtn small{display:block;font-weight:400;font-size:12px;opacity:.85;line-height:1.1}
.setbtn span{display:grid;text-align:start;line-height:1.15}
.vrows{display:grid;gap:10px}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.vrow .lname{display:inline-flex;align-items:center;gap:8px;min-width:150px;font-weight:700}
.vrow .lname .code{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:12px;background:var(--bg);color:var(--muted)}
.vrow select{flex:1;min-width:0;max-width:360px;min-height:44px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font:inherit}
.hear{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);cursor:pointer;font-size:15px}
.hear:hover{background:var(--ink);color:var(--paper)}
.vrow .none{color:var(--tomato);font-size:15px;font-weight:700}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
@media (max-width:1000px){#barPlayLbl{display:none}}
@media (max-width:640px){.lpbar{border-radius:24px}.setbtn{margin-left:0}}

/* game stage */
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
.stagebar h2{font-size:28px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:999px;border:0;background:var(--paper);font-weight:700;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.back:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.frame{display:block;width:100%;height:min(76vh,760px);min-height:440px;border:0;border-radius:var(--r);background:var(--paper);box-shadow:0 0 0 2px var(--line)}
button.game{font:inherit;text-align:start;cursor:pointer}


/* play mode: the page never scrolls, the game fills the window, chrome is one thin row each */
html.playing,html.playing body{height:100dvh;overflow:hidden;overscroll-behavior:none}
html.playing body{display:flex;flex-direction:column;padding:0;margin:0}
html.playing .wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;max-width:none;width:100%}
html.playing header,html.playing .stagebar h2,html.playing #barPlayLbl,html.playing .lpbar .who small,html.playing .lpbar .who .lock,html.playing body::before{display:none}
html.playing main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
html.playing #v-play{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
html.playing .stagebar{display:none}
html.playing .frame{flex:1 1 auto;height:auto;min-height:0;border-radius:0;box-shadow:none}
html.playing .lpbar{position:static;margin:0;gap:4px 10px;padding:3px 6px 3px 8px;border-radius:0;box-shadow:0 1px 0 var(--line)}
html.playing .lpbar .who b{font-size:16px}
html.playing .lpbar .chip{min-height:34px;padding:2px 12px 2px 3px;font-size:14px;gap:5px}
html.playing .lpbar .chip .code{width:26px;height:26px;font-size:10px}
html.playing .setbtn{min-height:34px;padding:2px 14px 2px 10px;box-shadow:none}
html.playing .setbtn small{display:none}
html.playing .back{min-height:34px;padding:2px 12px;font-size:14px}
html.playing .lpbar .note{font-size:12px;flex-basis:auto;margin-left:auto}
html.playing footer{margin:0;padding:1px 8px;font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 -1px 0 var(--line)}
html.playing footer .eu{font-size:inherit;padding:0}
html.playing footer .eu svg{width:10px;height:10px}
html.playing .lpbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}html.playing .barR{justify-self:end;margin-left:0}html.playing .play{justify-self:center}html.playing .setbtn{margin-left:0}
html.playing .lpbar .play{overflow-x:auto;scrollbar-width:none}html.playing .lpbar .langs{flex-wrap:nowrap}
html.playing .lpbar .who{display:none}
@media (max-width:640px){html.playing .lpbar .chip .own,html.playing .setbtn span{display:none}html.playing .lpbar .chip{padding:2px 3px 2px 3px}html.playing .setbtn{padding:2px 10px}html.playing .back span{display:none}html.playing .back{padding:2px 8px}html.playing .lpbar .note{display:none}html.playing footer{font-size:9.5px}}
.fsbtn{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;padding:0}
.fsbtn:hover{border-color:var(--sky)}
.barL,.barR{display:flex;align-items:center;gap:8px;flex:none}.barR{margin-left:auto}
.shufbtn{width:auto;display:inline-flex;align-items:center;gap:6px;padding:0 14px 0 10px;font-weight:700;font-size:14px;white-space:nowrap}
html:not(.playing) .shufbtn{display:none}
@media (max-width:640px){.shufbtn span{display:none}.shufbtn{padding:0;width:34px;justify-content:center}}
.fsbtn svg{width:16px;height:16px}

/* settings sheet */
.sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;background:#0c1428b3;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet>.card{max-width:860px;margin:0 auto}
.sheethead{display:flex;justify-content:flex-end;margin-bottom:-8px}
footer a{color:var(--ink);font-weight:700}footer a.tiny{font-size:11px;font-weight:400;color:var(--muted);margin-left:8px}.eu{display:inline-flex;align-items:center;gap:5px;margin:0 2px;padding:0;font-size:12px;font-weight:600;line-height:1.6;vertical-align:middle;opacity:.85}.eu svg{flex:none}
footer{line-height:1.3;margin-top:24px;text-align:center;font-size:12px;color:var(--muted)}footer .eu{padding:0;font-size:inherit;line-height:inherit}

@media (max-width:640px){nav{margin-left:0;width:100%}nav button{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>

en verstecken sich Tiere. Jedes Tippen öffnet eins."], "face": ["Wo ist deine Nase?", "Tippe auf Nase, Augen oder Zehen, hör das Wort und zeig dann auf deine eigenen."], "street": ["Auf der Straße", "Busse, Fahrräder, ein Flugzeug, ein Hubschrauber und ein Hund. Tippe auf alles und hör, wie es klingt und heißt."], "dress": ["Anziehen!", "Regen, Sonne oder Schnee? Zieh die passenden Sachen an, ein Wort nach dem anderen, und dann ab nach draußen."], "night": ["Gute Nacht", "Sag dem Mond, der Lampe und dem Teddy gute Nacht. Das letzte Spiel vor dem Schlafen; es endet von selbst."], "sky": ["Himmelswörter", "Flugzeuge fliegen mit Bildern vorbei. Tippe auf das, das du hörst."], "farm": ["Old MacDonalds Bauernhof", "Tippe auf ein Tier, hör sein echtes Geräusch und seinen Namen und sing dann das Lied."], "drum": ["Trommelparade", "Hau auf die Trommeln oder auf jede Taste. Jeder Schlag ist ein Takt, ein Wort oder eine Zahl."], "train": ["Wörterzug", "Fahr von Bahnhof zu Bahnhof und finde an jeder Haltestelle das Wort."], "paint": ["Mal die Welt an", "Alles ist erst grau. Jedes Tippen kleckst eine Farbe hin und sagt ihren Namen."], "soup": ["Kleiner Suppentopf", "Ein hungriger Freund will Suppe. Zutaten rein, umrühren, servieren."], "flappy": ["Flatterwörter", "Tippe, um durch die Lücken zu fliegen, fang Bilder und hör jedes Wort auf zwei Arten."], "ark": ["Die Arche Noah", "Tippe auf ein Tier, und zwei hüpfen an Bord, immer zu zweit. Hör jeden Namen und die Zahl zwei."], "pairs": ["Paare finden", "Ein Memo-Spiel, bei dem jedes Paar aus einem Bild und seinem Wort in einer anderen Sprache besteht."], "market": ["Auf dem Markt", "Obst, Brot und Käse in Kisten. Ein Waschbär bittet um etwas, und du tippst es in den Korb."], "munch": ["Mampf mampf", "Eine hungrige Raupe frisst Obst, zählt die Bissen und wird zum Schmetterling."]}, "app": ["LingoPlaytime für iPad", "Bald für iPad", "Wir bauen eine iPad-App, die den Bildschirm auf das Spiel sperrt. So kann ein Kleinkind überall draufhauen, ohne die App zu verlassen, ein Menü zu öffnen oder deiner Chefin zu schreiben.", "Sie merkt sich außerdem, welche Wörter dein Kind schon gehört hat (nur auf dem iPad), funktioniert offline und bringt zusätzliche Spiele mit. iPhone und Mac folgen später. Die Website bleibt kostenlos und werbefrei.", "Bald verfügbar"], "priv": ["Datenschutz", "Wir kennen den Namen deines Kindes nicht. Nur dein Gerät kennt ihn."], "facts": [["Gespeichert", "Name, Altersgruppe und Hauptsprache deines Kindes sowie die Sprachen, die es lernt, dazu welche Wörter es gehört und beantwortet hat."], ["Wo", "In diesem Browser auf diesem Gerät. Bei uns kommt nichts an."], ["Nicht gespeichert", "Alles andere. Keine Konten, keine Logins, keine E-Mail, keine Fotos."], ["Keine", "Werbung, Tracking-Cookies oder Social-Buttons. Deshalb gibt es auch kein Cookie-Banner."], ["Töne", "Kommen aus Dateien auf unserer eigenen Seite. Der Name deines Kindes wird nie an einen Sprachdienst geschickt."], ["Zählen", "Höchstens ein Besuchszähler ohne Cookies, damit wir ungefähr wissen, wie viele vorbeischauen."], ["Hosting", "Die Seite liegt bei GitHub Pages. Wie jeder Webserver speichert GitHub die IP-Adressen der Besucher kurz, um die Seite auszuliefern und zu schützen. Dafür gilt GitHubs eigene Datenschutzerklärung."], ["Verantwortlich", "{pigro}, Berlin, ist für diese Seite verantwortlich. Du kannst Auskunft, Berichtigung oder Löschung verlangen, widersprechen oder dich bei einer Datenschutzbehörde beschweren. Die Kontaktdaten stehen im {imp}."], ["Bezahlen", "Wenn du später die App kaufst, sieht der Zahlungsanbieter deine E-Mail-Adresse. Das bleibt getrennt von allem, was dein Kind betrifft."]], "forget": ["Alles vergessen", "Damit werden Name, Sprachen und gelernte Wörter von diesem Gerät gelöscht, und es gilt wieder die Beispiel-Einstellung.", "Alles vergessen", "Die Einstellungen auf diesem Gerät löschen?", "Ja, löschen", "Behalten", "Erledigt. Auf diesem Gerät ist jetzt nichts mehr über dein Kind gespeichert."], "foot": ["Kleine Spiele, viele Sprachen", "Keine Werbung, keine Konten", "Von einem Vater und Pädagogen", "Made in the EU", "Fragen oder Probleme?", "Hilfe von Pigrosoft"], "sample": "Das ist eine Beispiel-Einstellung. Um den Namen deines Kindes und eure Sprachen einzutragen, halte <b>{settings}</b> 3 Sekunden lang gedrückt."}, "es": {"games": {"peek": ["Cucú", "¡Cucú! Cortinas, cajas y arbustos esconden animales. Cada toque abre uno."], "face": ["¿Dónde está tu nariz?", "Toca la nariz, los ojos o los dedos de los pies, escucha la palabra y luego señala los tuyos."], "street": ["En la calle", "Autobuses, bicis, un avión, un helicóptero y un perro. Toca cualquier cosa para oír cómo suena y cómo se llama."], "dress": ["¡A vestirse!", "¿Lluvia, sol o nieve? Ponte la ropa adecuada, palabra a palabra, y sal a la calle."], "night": ["Buenas noches", "Dale las buenas noches a la luna, la lámpara y el osito. El último juego antes de dormir; termina solo."], "sky": ["Palabras en el cielo", "Pasan aviones con dibujos. Toca el que oyes."], "farm": ["La granja del viejo MacDonald", "Toca un animal, escucha su sonido real y su nombre, y luego canta la canción."], "drum": ["Desfile de tambores", "Golpea los tambores o cualquier tecla. Cada golpe es un ritmo, una palabra o un número."], "train": ["El tren de las palabras", "Viaja de estación en estación y encuentra la palabra en cada parada."], "paint": ["Pinta el mundo", "Todo empieza gris. Cada toque salpica un color y dice su nombre."], "soup": ["La ollita de sopa", "Un amigo con hambre quiere sopa. Añade comida, remueve y sirve."], "flappy": ["Palabras voladoras", "Toca para volar entre los huecos, atrapa dibujos y oye cada palabra de dos maneras."], "ark": ["El arca de Noé", "Toca un animal y suben dos a bordo, de dos en dos. Oye cada nombre y el número dos."], "pairs": ["Parejas", "Un juego de memoria en el que cada pareja es un dibujo y su palabra en otro idioma."], "market": ["En el mercado", "Fruta, pan y queso en cajas. Un mapache pide algo y tú lo tocas para meterlo en la cesta."], "munch": ["Ñam ñam", "Una oruga hambrienta come fruta, cuenta los bocados y se convierte en mariposa."]}, "app": ["LingoPlaytime para iPad", "Muy pronto en iPad", "Estamos creando una app para iPad que bloquea la pantalla en el juego, para que un niño pequeño pueda aporrear donde quiera sin salir de la app, abrir un menú ni escribirle a tu jefe.", "Además recordará qué palabras ha oído tu hijo (solo en el iPad), funcionará sin conexión y traerá juegos extra. Las versiones para iPhone y Mac llegarán después. La web sigue siendo gratis y sin anuncios.", "Muy pronto"], "priv": ["Privacidad", "No sabemos el nombre de tu hijo. Solo lo sabe tu dispositivo."], "facts": [["Se guarda", "El nombre de tu hijo, su grupo de edad, su idioma principal y los idiomas que está aprendiendo, además de las palabras que ha oído y respondido."], ["Dónde", "En este navegador, en este dispositivo. Nunca nos llega."], ["No se guarda", "Todo lo demás. Sin cuentas, sin inicio de sesión, sin correo, sin fotos."], ["Sin", "Anuncios, cookies de seguimiento ni botones sociales. Por eso tampoco hay aviso de cookies."], ["Sonidos", "Se reproducen desde archivos de nuestra propia web. El nombre de tu hijo nunca se envía a un servicio de voz."], ["Recuento", "Como mucho, un contador de visitas sin cookies, para saber más o menos cuánta gente pasa."], ["Alojamiento", "La web está alojada en GitHub Pages. Como cualquier servidor, GitHub registra las direcciones IP de los visitantes durante poco tiempo para servir y proteger la web. Para eso rige la política de privacidad de GitHub."], ["Responsable", "{pigro}, Berlín, es el responsable de esta web. Puedes pedir qué datos tenemos, corregirlos o borrarlos, oponerte o reclamar ante una autoridad de protección de datos. Los datos de contacto están en el {imp}."], ["Pagos", "Si más adelante compras la app, la empresa de pagos verá tu correo. Eso se guarda aparte de todo lo relacionado con tu hijo."]], "forget": ["Olvidarlo todo", "Esto borra el nombre, los idiomas y las palabras aprendidas de este dispositivo y vuelve a la configuración de ejemplo.", "Olvidarlo todo", "¿Borrar la configuración de este dispositivo?", "Sí, borrarla", "Conservarla", "Listo. Ya no hay nada sobre tu hijo guardado en este dispositivo."], "foot": ["Juegos pequeños, muchos idiomas", "Sin anuncios, sin cuentas", "Hecho por un padre y educador", "Made in the EU", "¿Preguntas o problemas?", "Ayuda de Pigrosoft"], "sample": "Esta es una configuración de ejemplo. Para poner el nombre de tu hijo y los idiomas de tu familia, mantén pulsado <b>{settings}</b> 3 segundos."}, "fr": {"games": {"peek": ["Coucou", "Coucou ! Rideaux, boîtes et buissons cachent des animaux. Chaque toucher en ouvre un."], "face": ["Où est ton nez ?", "Touche le nez, les yeux ou les orteils, écoute le mot, puis montre les tiens."], "street": ["Dans la rue", "Des bus, des vélos, un avion, un hélicoptère et un chien. Touche tout pour entendre son bruit et son nom."], "dress": ["On s'habille !", "Pluie, soleil ou neige ? Mets les bons vêtements, un mot à la fois, puis sors dehors."], "night": ["Bonne nuit", "Dis bonne nuit à la lune, à la lampe et au nounours. Le dernier jeu avant le dodo ; il se termine tout seul."], "sky": ["Les mots du ciel", "Des avions passent avec des images. Touche celle que tu entends."], "farm": ["La ferme du vieux MacDonald", "Touche un animal, écoute son vrai cri et son nom, puis chante la chanson."], "drum": ["La parade des tambours", "Tape sur les tambours, ou sur n'importe quelle touche. Chaque coup est un rythme, un mot ou un chiffre."], "train": ["Le train des mots", "Va de gare en gare et trouve le mot à chaque arrêt."], "paint": ["Colorie le monde", "Tout commence en gris. Chaque toucher éclabousse une couleur et dit son nom."], "soup": ["La petite marmite", "Un ami affamé veut de la soupe. Ajoute les ingrédients, remue et sers."], "flappy": ["Les mots volants", "Touche pour voler entre les trous, attrape des images et entends chaque mot de deux façons."], "ark": ["L'arche de Noé", "Touche un animal et deux montent à bord, deux par deux. Entends chaque nom, et le chiffre deux."], "pairs": ["Paires", "Un jeu de mémoire où chaque paire est une image et son mot dans une autre langue."], "market": ["Au marché", "Des fruits, du pain et du fromage dans des caisses. Un raton laveur demande quelque chose, et tu le touches pour le mettre dans le panier."], "munch": ["Miam miam", "Une chenille affamée mange des fruits, compte les bouchées et devient papillon."]}, "app": ["LingoPlaytime pour iPad", "Bientôt sur iPad", "Nous préparons une app iPad qui verrouille l'écran sur le jeu : un tout-petit peut taper partout sans quitter l'app, ouvrir de menu ni écrire à votre patron.", "Elle retiendra aussi les mots que votre enfant a entendus (sur l'iPad uniquement), fonctionnera hors ligne et proposera des jeux en plus. Les versions iPhone et Mac suivront. Le site reste gratuit et sans publicité.", "Bientôt disponible"], "priv": ["Confidentialité", "Nous ne connaissons pas le prénom de votre enfant. Seul votre appareil le connaît."], "facts": [["Enregistré", "Le prénom de votre enfant, sa tranche d'âge, sa langue principale et les langues qu'il apprend, ainsi que les mots entendus et les réponses données."], ["Où", "Dans ce navigateur, sur cet appareil. Rien ne nous parvient."], ["Non enregistré", "Tout le reste. Pas de compte, pas de connexion, pas d'e-mail, pas de photos."], ["Pas de", "Publicité, cookies de suivi ou boutons de réseaux sociaux. Donc pas de bandeau cookies non plus."], ["Sons", "Joués à partir de fichiers hébergés sur notre propre site. Le prénom de votre enfant n'est jamais envoyé à un service vocal."], ["Comptage", "Au plus un compteur de visites sans cookies, pour savoir à peu près combien de personnes passent."], ["Hébergement", "Le site est hébergé sur GitHub Pages. Comme tout serveur web, GitHub conserve brièvement les adresses IP des visiteurs pour servir et protéger le site. La politique de confidentialité de GitHub s'applique à cela."], ["Responsable", "{pigro}, Berlin, est responsable de ce site. Vous pouvez demander quelles données nous détenons, les faire corriger ou effacer, vous opposer ou porter plainte auprès d'une autorité de protection des données. Les coordonnées figurent dans l'{imp}."], ["Paiement", "Si vous achetez l'app plus tard, le prestataire de paiement verra votre e-mail. Cela reste séparé de tout ce qui concerne votre enfant."]], "forget": ["Tout oublier", "Cela efface le prénom, les langues et les mots appris de cet appareil et revient à la configuration d'exemple.", "Tout oublier", "Effacer la configuration de cet appareil ?", "Oui, effacer", "La garder", "C'est fait. Plus rien sur votre enfant n'est enregistré sur cet appareil."], "foot": ["Petits jeux, plein de langues", "Sans pub, sans compte", "Par un parent et éducateur", "Made in the EU", "Des questions ou un problème ?", "Aide de Pigrosoft"], "sample": "Ceci est une configuration d'exemple. Pour ajouter le prénom de votre enfant et les langues de votre famille, maintenez <b>{settings}</b> appuyé 3 secondes."}, "it": {"games": {"peek": ["Cucù", "Cucù! Tende, scatole e cespugli nascondono animali. Ogni tocco ne apre uno."], "face": ["Dov'è il tuo naso?", "Tocca il naso, gli occhi o le dita dei piedi, ascolta la parola e poi indica i tuoi."], "street": ["Per strada", "Autobus, bici, un aereo, un elicottero e un cane. Tocca qualsiasi cosa per sentire il suo suono e il suo nome."], "dress": ["Vestiamoci!", "Pioggia, sole o neve? Metti i vestiti giusti, una parola alla volta, e poi fuori."], "night": ["Buonanotte", "Di' buonanotte alla luna, alla lampada e all'orsetto. L'ultimo gioco prima di dormire; finisce da solo."], "sky": ["Parole nel cielo", "Passano aerei con delle immagini. Tocca quella che senti."], "farm": ["La fattoria del vecchio MacDonald", "Tocca un animale, senti il suo verso vero e il suo nome, poi canta la canzone."], "drum": ["La parata dei tamburi", "Batti sui tamburi, o su un tasto qualsiasi. Ogni colpo è un ritmo, una parola o un numero."], "train": ["Il treno delle parole", "Viaggia di stazione in stazione e trova la parola a ogni fermata."], "paint": ["Colora il mondo", "All'inizio è tutto grigio. Ogni tocco schizza un colore e dice il suo nome."], "soup": ["La pentolina", "Un amico affamato vuole la minestra. Aggiungi il cibo, mescola e servi."], "flappy": ["Parole volanti", "Tocca per volare tra i varchi, prendi le immagini e senti ogni parola in due modi."], "ark": ["L'Arca di Noè", "Tocca un animale e ne salgono due a bordo, a due a due. Senti ogni nome e il numero due."], "pairs": ["Coppie", "Un memory in cui ogni coppia è un'immagine e la sua parola in un'altra lingua."], "market": ["Al mercato", "Frutta, pane e formaggio nelle cassette. Un procione chiede qualcosa e tu lo tocchi per metterlo nel cestino."], "munch": ["Gnam gnam", "Un bruco affamato mangia frutta, conta i morsi e diventa farfalla."]}, "app": ["LingoPlaytime per iPad", "In arrivo su iPad", "Stiamo costruendo un'app per iPad che blocca lo schermo sul gioco, così un bimbo piccolo può picchiare dove vuole senza uscire dall'app, aprire un menu o scrivere al tuo capo.", "Ricorderà anche quali parole tuo figlio ha già sentito (solo sull'iPad), funzionerà offline e avrà giochi in più. Seguiranno le versioni per iPhone e Mac. Il sito resta gratuito e senza pubblicità.", "In arrivo"], "priv": ["Privacy", "Non conosciamo il nome di tuo figlio. Lo conosce solo il tuo dispositivo."], "facts": [["Salvato", "Il nome di tuo figlio, la fascia d'età, la lingua principale e le lingue che sta imparando, più le parole ascoltate e le risposte date."], ["Dove", "In questo browser, su questo dispositivo. Non arriva mai a noi."], ["Non salvato", "Tutto il resto. Niente account, niente login, niente email, niente foto."], ["Niente", "Pubblicità, cookie di tracciamento o pulsanti social. Quindi niente banner dei cookie."], ["Suoni", "Riprodotti da file sul nostro sito. Il nome di tuo figlio non viene mai inviato a un servizio vocale."], ["Conteggio", "Al massimo un contatore di visite senza cookie, per sapere più o meno quante persone passano."], ["Hosting", "Il sito è ospitato su GitHub Pages. Come ogni server web, GitHub registra per poco tempo gli indirizzi IP dei visitatori per servire e proteggere il sito. Per questo vale l'informativa privacy di GitHub."], ["Titolare", "{pigro}, Berlino, è responsabile di questo sito. Puoi chiedere quali dati abbiamo, farli correggere o cancellare, opporti o presentare reclamo a un'autorità per la protezione dei dati. I contatti sono nell'{imp}."], ["Pagamenti", "Se in futuro compri l'app, la società di pagamento vedrà la tua email. Questo resta separato da tutto ciò che riguarda tuo figlio."]], "forget": ["Dimentica tutto", "Cancella il nome, le lingue e le parole imparate da questo dispositivo e torna alla configurazione di esempio.", "Dimentica tutto", "Cancellare la configurazione su questo dispositivo?", "Sì, cancella", "Tienila", "Fatto. Su questo dispositivo non c'è più nulla su tuo figlio."], "foot": ["Piccoli giochi, tante lingue", "Niente pubblicità, niente account", "Da un genitore ed educatore", "Made in the EU", "Domande o problemi?", "Assistenza da Pigrosoft"], "sample": "Questa è una configurazione di esempio. Per aggiungere il nome di tuo figlio e le lingue della tua famiglia, tieni premuto <b>{settings}</b> per 3 secondi."}, "pt": {"games": {"peek": ["Cucu", "Cucu! Cortinas, caixas e arbustos escondem animais. Cada toque abre um."], "face": ["Onde está o teu nariz?", "Toca no nariz, nos olhos ou nos dedos dos pés, ouve a palavra e depois aponta para os teus."], "street": ["Na rua", "Autocarros, bicicletas, um avião, um helicóptero e um cão. Toca em tudo para ouvir o som e o nome."], "dress": ["Vamos vestir!", "Chuva, sol ou neve? Veste a roupa certa, uma palavra de cada vez, e depois vai lá para fora."], "night": ["Boa noite", "Diz boa noite à lua, ao candeeiro e ao ursinho. O último jogo antes de dormir; acaba sozinho."], "sky": ["Palavras no céu", "Passam aviões com imagens. Toca na que ouves."], "farm": ["A quinta do velho MacDonald", "Toca num animal, ouve o som verdadeiro e o nome dele, e depois canta a canção."], "drum": ["Desfile de tambores", "Bate nos tambores, ou em qualquer tecla. Cada pancada é um ritmo, uma palavra ou um número."], "train": ["O comboio das palavras", "Viaja de estação em estação e encontra a palavra em cada paragem."], "paint": ["Pinta o mundo", "Tudo começa cinzento. Cada toque salpica uma cor e diz o nome dela."], "soup": ["A panelinha de sopa", "Um amigo com fome quer sopa. Junta comida, mexe e serve."], "flappy": ["Palavras voadoras", "Toca para voar pelos buracos, apanha imagens e ouve cada palavra de duas maneiras."], "ark": ["A arca de Noé", "Toca num animal e sobem dois a bordo, dois a dois. Ouve cada nome e o número dois."], "pairs": ["Pares", "Um jogo de memória em que cada par é uma imagem e a sua palavra noutra língua."], "market": ["No mercado", "Fruta, pão e queijo em caixas. Um guaxinim pede uma coisa e tu tocas para a pôr no cesto."], "munch": ["Nham nham", "Uma lagarta com fome come fruta, conta as dentadas e vira borboleta."]}, "app": ["LingoPlaytime para iPad", "Em breve no iPad", "Estamos a criar uma app para iPad que prende o ecrã ao jogo, para que uma criança pequena possa bater onde quiser sem sair da app, abrir um menu ou mandar um e-mail ao teu chefe.", "Vai também lembrar-se das palavras que o teu filho já ouviu (só no iPad), funcionar offline e trazer jogos extra. As versões para iPhone e Mac virão depois. O site continua gratuito e sem anúncios.", "Em breve"], "priv": ["Privacidade", "Não sabemos o nome do teu filho. Só o teu dispositivo sabe."], "facts": [["Guardado", "O nome do teu filho, a faixa etária, a língua principal e as línguas que está a aprender, e as palavras que ouviu e respondeu."], ["Onde", "Neste navegador, neste dispositivo. Nunca chega até nós."], ["Não guardado", "Tudo o resto. Sem contas, sem login, sem e-mail, sem fotografias."], ["Sem", "Anúncios, cookies de rastreio ou botões de redes sociais. Por isso também não há aviso de cookies."], ["Sons", "Tocados a partir de ficheiros do nosso próprio site. O nome do teu filho nunca é enviado para um serviço de voz."], ["Contagem", "No máximo um contador de visitas sem cookies, para sabermos mais ou menos quantas pessoas passam por cá."], ["Alojamento", "O site está alojado no GitHub Pages. Como qualquer servidor web, o GitHub regista durante pouco tempo os endereços IP dos visitantes para entregar e proteger o site. Para isso aplica-se a política de privacidade do GitHub."], ["Responsável", "{pigro}, Berlim, é o responsável por este site. Podes pedir que dados temos, corrigi-los ou apagá-los, opor-te ou apresentar queixa a uma autoridade de proteção de dados. Os contactos estão no {imp}."], ["Pagamento", "Se mais tarde comprares a app, a empresa de pagamentos verá o teu e-mail. Isso fica separado de tudo o que diz respeito ao teu filho."]], "forget": ["Esquecer tudo", "Isto apaga o nome, as línguas e as palavras aprendidas deste dispositivo e volta à configuração de exemplo.", "Esquecer tudo", "Apagar a configuração deste dispositivo?", "Sim, apagar", "Manter", "Feito. Já não há nada sobre o teu filho guardado neste dispositivo."], "foot": ["Pequenos jogos, muitas línguas", "Sem anúncios, sem contas", "Feito por um pai e educador", "Made in the EU", "Dúvidas ou problemas?", "Ajuda da Pigrosoft"], "sample": "Esta é uma configuração de exemplo. Para pôr o nome do teu filho e as línguas da tua família, mantém <b>{settings}</b> premido durante 3 segundos."}};

    $("s-age").textContent=s.age;$("s-home").textContent=s.home;$("s-home-hint").textContent=s.homeHint||"";$("s-learn").textContent=s.learn;
    $("s-learn-hint").textContent=s.learnHint+` (${draft.learn.length}/${MAX_LEARN})`;
    $("s-go").textContent=editing?x.save:s.go;
    $("s-cancel").hidden=!editing;$("s-cancel").textContent=x.cancel;
    $("s-privacy").textContent=s.privacyNote;
    $("ages").innerHTML=s.ages.map((a,i)=>`<button type="button" class="pill age" data-group="age" data-i="${i}" aria-pressed="${draft.age===i}">${esc(a)} <small>${s.ageSub[i]}</small></button>`).join("");
    $("homeLangs").innerHTML=LANGS.map(l=>langPill(l.c,draft.home===l.c,false,"home")).join("");
    const full=draft.learn.length>=MAX_LEARN;
    $("learnLangs").innerHTML=LANGS.filter(l=>l.c!==draft.home).map(l=>{const on=draft.learn.includes(l.c);return langPill(l.c,on,full&&!on,"learn")}).join("");
    $("f-active").hidden=true;$("f-voices").hidden=!editing;
    if(!editing)return;
    if(!playable(draft).includes(draft.active))draft.active=draft.learn[0]||draft.home;
    $("s-active").textContent=x.active;
    $("activeLangs").innerHTML=playable(draft).map(c=>langPill(c,draft.active===c,false,"active")).join("");
    $("s-voices").textContent=x.voices;$("s-voices-hint").textContent=x.voicesHint;
    LPVoice.ready(renderVoices);
  }

  function renderVoices(){
    const x=B[draft.home]||B.en;
    $("voiceRows").innerHTML=playable(draft).map(c=>{
      const vs=LPVoice.list(LPVoice.tag(c)),pick=(draft.voices||{})[c]||"";
      const head=`<span class="lname" lang="${c}"><span class="code">${c.toUpperCase()}</span>${esc(L[c].own)}</span>`;
      if(!vs.length)return `<div class="vrow">${head}<span class="none">${esc(x.none)}</span></div>`;
      const rec=REC.includes(c),opts=`<option value="">${rec?esc(x.recorded||B.en.recorded):esc(x.auto)+" ("+esc(vs[0].name)+")"}</option>`+vs.map(v=>`<option value="${esc(v.name)}"${v.name===pick?" selected":""}>${esc(v.name)}</option>`).join("");
      return `<div class="vrow">${head}<select id="v-${c}" data-voice="${c}" aria-label="${esc(x.voices)}: ${esc(L[c].own)}">${opts}</select><button type="button" class="hear" data-hear="${c}" aria-label="${esc(x.hear)}: ${esc(L[c].own)}">▶</button></div>`;
    }).join("");
  }
  const REC=["de","en","es","fr","it","pt","nl","pl","sv","el","zh","ru"];
  // the default voice is the recorded one: play a clip from a game's bank, the same voice the games use
  function hearRecorded(c){
    const play=()=>{const bank=(window.LP_CLIPS||{})[c];const k=bank&&Object.keys(bank)[0];if(!k)return;try{new Audio("data:audio/mpeg;base64,"+bank[k]).play()}catch(e){}};
    if((window.LP_CLIPS||{})[c])return play();
    const s=document.createElement("script");s.src="/games/audio/"+(["de","en","es","fr","it","pt"].includes(c)?"ark":"sky")+"."+c+".js";s.onload=play;document.head.appendChild(s);
  }
  function hear(c){
    try{
      speechSynthesis.cancel();
      if(REC.includes(c)&&!(draft.voices||{})[c]){hearRecorded(c);return}
      const v=LPVoice.best(LPVoice.tag(c),(draft.voices||{})[c]);if(!v)return;
      const u=new SpeechSynthesisUtterance(SAMPLE[c]||L[c].hi);u.voice=v;u.lang=v.lang;u.rate=.9;u.pitch=1;speechSynthesis.speak(u);
    }catch(e){}
  }

  function renderGames(){
    const s=t(),p=profile;
    mascotGames(p.age);
    $("g-eyebrow").textContent=s.gEyebrow;
    $("g-title").textContent=s.gTitle(p.name);
    $("g-cta").textContent=s.gCta+" →";
    // the child's name, greeted in every language they play in
    $("hello").innerHTML=[p.home,...p.learn].map(c=>`<span lang="${c}" dir="${L[c].rtl?"rtl":"ltr"}">${esc(L[c].hi)}, ${esc(p.name)}!</span>`).join("");
    const names=p.learn.map(c=>L[c].own).join(", ");
    $("g-filter").textContent=s.filter(s.ages[p.age].toLowerCase()+" ("+s.ageSub[p.age]+")",names);
    $("g-sample").hidden=!p.demo;
    const sorted=[...GAMES];
    $("gameGrid").innerHTML=sorted.map(g=>{
      const tooBig=false;
      return `<button type="button" class="game${tooBig?" dim":""}" data-game="${g.id}">
        <div class="art felt"><img src="/felt/thumb-${g.id}.webp" alt="" width="600" height="448" loading="lazy" draggable="false"></div>
        <h3>${esc(gname(g))}</h3><p>${esc(gblurb(g))}</p>
        <span class="playnow">${esc(T[profile.home]?T[profile.home].gCta:T.en.gCta)}</span>
</button>`;
    }).join("");
  }

  /* ---------- fullscreen ---------- */
  const FSK="lp-fullscreen", FSL={en:"Fullscreen",de:"Vollbild",es:"Pantalla completa",fr:"Plein écran",it:"Schermo intero",pt:"Ecrã inteiro"};
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const fsCan=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
  function fsEnter(){const e=document.documentElement;try{const r=(e.requestFullscreen||e.webkitRequestFullscreen).call(e,{navigationUI:"hide"});if(r&&r.catch)r.catch(()=>{})}catch(x){}}
  function fsExit(){try{const r=(document.exitFullscreen||document.webkitExitFullscreen).call(document);if(r&&r.catch)r.catch(()=>{})}catch(x){}}
  function fsPref(v){try{if(v===undefined)return localStorage.getItem(FSK)==="1";localStorage.setItem(FSK,v?"1":"0")}catch(e){return false}}
  const SHL={en:"New game",de:"Neues Spiel",es:"Juego nuevo",fr:"Nouveau jeu",it:"Nuovo gioco",pt:"Novo jogo"};
  function shufLabel(){const l=SHL[profile&&profile.home]||SHL.en;$("shufLbl").textContent=l;$("shufBtn").title=l;$("shufBtn").setAttribute("aria-label",l)}
  $("shufBtn").addEventListener("click",()=>{const ids=GAMES.map(g=>g.id).filter(i=>i!==current&&SLUG[i]);if(ids.length)openGame(ids[Math.floor(Math.random()*ids.length)])});
  function fsLabel(){const l=FSL[profile&&profile.home]||FSL.en;$("fsBtn").title=l;$("fsBtn").setAttribute("aria-label",l)}
  const SNL={en:["Sound on","Sound off"],de:["Ton an","Ton aus"],es:["Sonido activado","Sonido desactivado"],fr:["Son activé","Son coupé"],it:["Audio attivo","Audio disattivato"],pt:["Som ligado","Som desligado"]};
  const MKEY="lingoplaytime.muted";
  function mutedNow(){try{return localStorage.getItem(MKEY)==="1"}catch(e){return false}}
  function sndPaint(){const m=mutedNow(),l=SNL[profile&&profile.home]||SNL.en,b=$("sndBtn");b.setAttribute("aria-pressed",String(m));b.classList.toggle("muted",m);b.title=l[m?1:0];b.setAttribute("aria-label",l[m?1:0])}
  $("sndBtn").addEventListener("click",()=>{const m=!mutedNow();try{localStorage.setItem(MKEY,m?"1":"0")}catch(e){}sndPaint();try{$("frame").contentWindow.postMessage({type:"lp-mute",muted:m},"*")}catch(e){}});
  sndPaint();
  $("fsBtn").hidden=!fsCan();
  $("fsBtn").addEventListener("click",()=>{if(fsEl()){fsPref(false);fsExit()}else{fsPref(true);fsEnter()}});
  document.addEventListener("fullscreenchange",()=>{if(!fsEl()&&view==="play"){/* left with Esc: respect it */fsPref(false)}});

  /* ---------- the game stage ---------- */
  function openGame(id,replace){
    const g=GAME[id];if(!g||!profile)return;
    current=id;
    const path="/"+SLUG[id]+"/";if(location.pathname!==path)history[replace?"replaceState":"pushState"](null,"",path);
    document.title=gname(g)+" | LingoPlaytime";
    $("playTitle").textContent=gname(g);
    $("backLbl").textContent=b().back;
    const q=new URLSearchParams({lp:JSON.stringify(settings()),name:profile.name});
    $("frame").title=gname(g);
    frameTo(`/games/${id}.html?${q}`);
    show("play");
    fsLabel();shufLabel();sndPaint();
    if(fsCan()&&fsPref()&&!fsEl())fsEnter();
    setTimeout(()=>{try{$("frame").focus()}catch(e){}},300);
  }
  function tellGame(){
    if(view!=="play")return;
    try{$("frame").contentWindow.postMessage({type:"lp-settings",settings:settings()},"*")}catch(e){}
  }

  /* ---------- settings sheet ---------- */
  function openSettings(){
    editing=true;draft=fresh();
    const sec=$("v-setup");$("sheet").appendChild(sec);sec.hidden=false;
    $("sheet").hidden=false;renderSetup();
    setTimeout(()=>$("name").focus(),50);
  }
  function closeSettings(){
    editing=false;
    const sec=$("v-setup");sec.hidden=true;$("main").appendChild(sec);
    $("sheet").hidden=true;
    applyLang();
    if(view==="games")renderGames();
    $("nav-settings").focus();
  }

  /* ---------- events ---------- */
  $("name").addEventListener("input",e=>{draft.name=e.target.value.trimStart()});
  $("setupForm").addEventListener("click",e=>{
    const btn=e.target.closest("[data-group]");if(!btn)return;
    const g=btn.dataset.group;
    if(g==="age")draft.age=+btn.dataset.i;
    if(g==="active")draft.active=btn.dataset.code;
    if(g==="home"){draft.home=btn.dataset.code;draft.learn=draft.learn.filter(c=>c!==draft.home)}
    if(g==="learn"){const c=btn.dataset.code;draft.learn=draft.learn.includes(c)?draft.learn.filter(x=>x!==c):[...draft.learn,c].slice(0,MAX_LEARN)}
    $("s-err").textContent="";
    renderSetup();
    const again=document.querySelector(`#setupForm [data-group="${g}"][data-${g==="age"?"i":"code"}="${g==="age"?draft.age:btn.dataset.code}"]`);
    if(again)again.focus();
  });
  $("setupForm").addEventListener("submit",e=>{
    e.preventDefault();
    const s=T[draft.home]||T.en;
    draft.name=$("name").value.trim();
    if(!draft.name){$("s-err").textContent=s.errName;$("name").focus();return}
    if(!draft.learn.length){$("s-err").textContent=s.errLearn;return}
    const want=draft.active||(profile&&profile.active);const keep=playable(draft).includes(want)?want:draft.learn[0];
    profile={...draft,learn:[...draft.learn],active:keep,voices:{...(draft.voices||{})}};
    save(profile);
    if(editing){closeSettings();tellGame();renderBar();}
    else if(routeGame())openGame(routeGame(),true);
    else show("games");
  });
  $("s-cancel").addEventListener("click",closeSettings);
  $("sheet").addEventListener("keydown",e=>{if(e.key==="Escape")closeSettings()});

  // the bar's language buttons switch the game live; only the child's profile is locked
  $("barLangs").addEventListener("click",e=>{
    const btn=e.target.closest("[data-code]");if(!btn||!profile)return;
    if(profile.active===btn.dataset.code)return;
    profile.active=btn.dataset.code;save(profile);
    renderBar();tellGame();
    const again=$("barLangs").querySelector(`[data-code="${profile.active}"]`);if(again)again.focus();
  });
  // voice choices in the settings sheet
  $("voiceRows").addEventListener("change",e=>{const sel=e.target.closest("[data-voice]");if(!sel)return;draft.voices=draft.voices||{};if(sel.value)draft.voices[sel.dataset.voice]=sel.value;else delete draft.voices[sel.dataset.voice];hear(sel.dataset.voice)});
  $("voiceRows").addEventListener("click",e=>{const b=e.target.closest("[data-hear]");if(b)hear(b.dataset.hear)});
  $("g-cta").addEventListener("click",()=>{const g=document.querySelector("#gameGrid [data-game]");if(g)openGame(g.dataset.game)});
  $("gameGrid").addEventListener("click",e=>{const g=e.target.closest("[data-game]");if(g)openGame(g.dataset.game)});
  $("backBtn").addEventListener("click",()=>show("games"));
  document.querySelectorAll("nav [data-view]").forEach(btn=>btn.addEventListener("click",()=>show(btn.dataset.view)));
  $("logo").addEventListener("click",()=>show(profile?"games":"setup"));

  // parent gate: hold for 3 seconds, then the settings sheet opens over whatever is playing
  let holdTimer=null,holdStart=0,raf=0;
  const HOLD=3000;
  function tick(){const p=Math.min(1,(performance.now()-holdStart)/HOLD);$("setFill").style.width=(p*100)+"%";if(p<1)raf=requestAnimationFrame(tick)}
  function startHold(e){e.preventDefault();if(holdTimer)return;holdStart=performance.now();$("nav-settings").classList.add("holding");raf=requestAnimationFrame(tick);
    holdTimer=setTimeout(()=>{holdTimer=null;cancelAnimationFrame(raf);$("setFill").style.width="0";$("nav-settings").classList.remove("holding");openSettings()},HOLD)}
  function cancelHold(){if(!holdTimer)return;const short=performance.now()-holdStart<600;clearTimeout(holdTimer);holdTimer=null;cancelAnimationFrame(raf);$("setFill").style.width="0";$("nav-settings").classList.remove("holding");
    if(short){const b=$("nav-settings");b.classList.remove("nudge");void b.offsetWidth;b.classList.add("nudge")}}
  function closeGate(){}
  const sb=$("nav-settings");
  sb.addEventListener("pointerdown",startHold);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>sb.addEventListener(ev,cancelHold));
  sb.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")){e.preventDefault();if(!e.repeat)startHold(e)}});
  sb.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")cancelHold()});
  sb.addEventListener("contextmenu",e=>e.preventDefault());

  // forget everything
  $("forget").addEventListener("click",()=>{$("forgetConfirm").hidden=false;$("forgetDone").textContent=""});
  $("forgetNo").addEventListener("click",()=>{$("forgetConfirm").hidden=true});
  $("forgetYes").addEventListener("click",()=>{
    wipe();profile={...SAMPLE_PROFILE,learn:[...SAMPLE_PROFILE.learn]};draft=fresh();
    $("forgetConfirm").hidden=true;$("forgetDone").textContent=ST().forget[6];
    applyLang();
  });

  applyLang();
  const hv=(location.hash||"").slice(1),r0=routeGame();
  if(r0&&profile&&!hv)openGame(r0,true);
  else show(["games","app","privacy"].includes(hv)?hv:view);
  // links like /#play or /#play/farm jump straight into a game
  if(hv==="play"||hv.startsWith("play/")){const id=hv.slice(5),el=document.querySelector("#gameGrid [data-game]");const t=GAME[id]?id:(el&&el.dataset.game);if(t)openGame(t,true)}
  addEventListener("popstate",()=>{const r=routeGame();if(r){if(r!==current)openGame(r,true)}else if(view==="play")show("games")});
})();
</script>
